    # Functions in XPath


    +   - **IDREFs can be referenced using function `id()`**

    +     - **`id()`** can also be applied to sets of references such as IDREFS and
    even to strings containing multiple references separated by blanks

    +     - **E.g.** `/bank-2/account/id(@owner)`

    +       - returns all customers referred to from the owners attribute of account
    elements.'
  - "[PAGE 624]\n\n# # More XPath Features\n\n+   - Operator \"|\" used to implement\
    \ union\n+   \n+     - E.g. /bank-2/account/id(@owner) | /bank-2\n+       /loan/id(@borrower)\n\
    +   \n+       - Gives customers with either accounts or loans\n+       - However,\
    \ \"|\" cannot be nested inside other operators.\n+   \n+   - \"//\" can be used\
    \ to skip multiple levels of nodes\n+   \n+     - E.g. /bank-2//customer_name\n\
    +   \n+       - finds any customer_name element _anywhere_\n+         under the\
    \ /bank-2 element, regardless of the\n+         element in which it is contained."
  md: "\n\n## XML Schema Version of Bank DTD\n\n- Choice of “xs:” was ours - any other\
    \ namespace prefix could be chosen\n- Element “bank” has type “BankType”, which\
    \ is defined separately\n- xs:complexType is used later to create the named complex\
    \ type “BankType”\n- Element “account” has its type defined in-line\n\n## More\
    \ features of XML Schema\n\n- **Attributes specified by xs:attribute tag:**\n\
    \  - `<xs:attribute name = “account_number”/>`\n  - adding the attribute `use\
    \ = “required”` means value must be specified\n\n- **Key constraint:** “account\
    \ numbers form a key for account elements under the root bank element:\n  ```xml\n\
    \  <xs:key name = “accountKey”>\n      <xs:selector xpath = “]bank/account”/>\n\
    \      <xs:field xpath = “account_number”/>\n  <xs:key>\n  ```\n\n- **Foreign\
    \ key constraint from depositor to account:**\n  ```xml\n  <xs:keyref name = “depositorAccountKey”\
    \ refer=“accountKey”>\n      <xs:selector xpath = “]bank/depositor”/>\n      <xs:field\
    \ xpath = “account_number”/>\n  <xs:keyref>\n  ```\n\n## Tree Model of XML Data\n\
    \n- Query and transformation languages are based on a tree model of XML data\n\
    - An XML document is modeled as a tree, with nodes corresponding to elements and\
    \ attributes\n- Element nodes have child nodes, which can be attributes or subelements\n\
    - Text in an element is modeled as a text node child of the element\n- Children\
    \ of a node are ordered according to their order in the XML document\n- Element\
    \ and attribute nodes (except for the root node) have a single parent, which is\
    \ an element node\n- The root node has a single child, which is the root element\
    \ of the document\n\n## (1) XPath\n\n- XPath is used to address (select) parts\
    \ of documents using **path expressions**\n- A path expression is a sequence of\
    \ steps separated by “/”\n  - Think of file names in a directory hierarchy\n-\
    \ Result of path expression: set of values that **along with** their containing\
    \ elements/attributes match the specified path\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_618_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_618_1.png)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_618_2.png)\n\
    \n## (1) XPath (Cont.)\n\n- E.g. /bank-2/customer/customer_name evaluated on the\
    \ bank-2 data we saw earlier returns:\n\n<customer_name> Joe </customer_name>\n\
    <customer_name> Mary </customer_name>\n\n- E.g. /bank-2/customer/customer_name/text()\
    \ returns the same names, but without the enclosing tags\n\nJoe\nMary\n\n## (1)\
    \ XPath (Cont.)\n\n- The initial “/” denotes root of the document (above the top-level\
    \ tag)\n- Path expressions are evaluated left to right\n  - Each step operates\
    \ on the set of instances produced by the previous step\n- Selection predicates\
    \ may follow any step in a path, in [ ]\n  - `/bank-2/account[balance > 400]`\
    \ returns account elements with a balance value greater than 400\n  - `/bank-2/account[balance]`\
    \ returns account elements containing a balance sub-element\n\n## (1) XPath (Cont.)\n\
    \n- Attributes are accessed using “@”\n  - E.g:\n    `/bank-2/account[balance\
    \ >400] /@account_number`\n      - returns the account numbers of accounts with\
    \ balance > 400\n- IDREF attributes are not dereferenced automatically (more on\
    \ this later)\n\n## Functions in XPath\n\n- **IDREFs can be referenced using function\
    \ `id()`**\n  - **`id()`** can also be applied to sets of references such as IDREFS\
    \ and even to strings containing multiple references separated by blanks\n  -\
    \ **E.g.** `/bank-2/account/id(@owner)`\n    - returns all customers referred\
    \ to from the owners attribute of account elements.\n\n## More XPath Features\n\
    \n- Operator \"|\" used to implement union\n  - E.g. /bank-2/account/id(@owner)\
    \ | /bank-2\n    /loan/id(@borrower)\n      - Gives customers with either accounts\
    \ or loans\n      - However, \"|\" cannot be nested inside other operators.\n\
    - \"//\" can be used to skip multiple levels of nodes\n  - E.g. /bank-2//customer_name\n\
    \    - finds any customer_name element _anywhere_\n      under the /bank-2 element,\
    \ regardless of the\n      element in which it is contained.\n\n"
