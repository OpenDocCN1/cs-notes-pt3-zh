  - "[PAGE 538]\n\n# # User Generated Identifiers\n\n+   - The type of the object-identifier\
    \ must be specified as part of the type definition of the referenced table, and\n\
    +   - The table definition must specify that the reference is user generated\n\
    \n```\ncreate type Person\n    (name varchar(20)\n     address varchar(20))\n\
    \     ref using varchar(20)\ncreate table people of Person\n     ref is person_id\
    \ user generated\n```\n\n+   - When creating a tuple, we must provide a unique\
    \ value for the identifier:\n\n```\ninsert into people (person_id, name, address)\
    \ values\n    ('01284567', 'John', '23 Coyote Run')\n```\n\n+   - We can then\
    \ use the identifier value when inserting a tuple into *departments*\n+     -\
    \ Avoids need for a separate query to retrieve the identifier:\n\n```\ninsert\
    \ into departments\n    values ('CS', '01284567')\n```"
  md: "\n## Querying Collection-Valued Attributes\n\n- To find all books that have\
    \ the word “database” as a keyword,\n\n  ```sql\n  select title\n  from books\n\
    \  where 'database' in (unnest(keyword_set))\n  ```\n\n- We can access individual\
    \ elements of an array by using indices\n  E.g.: If we know that a particular\
    \ book has three authors, we could write:\n\n  ```sql\n  select author_array[1],\
    \ author_array[2], author_array[3]\n  from books\n  where title = 'Database System\
    \ Concepts'\n  ```\n\n- To get a relation containing pairs of the form “title,\
    \ author-name”\n  for each book and each author of the book\n\n  ```sql\n  select\
    \ B.title, A.author\n  from books as B, unnest(B.author_array) as A(author)\n\
    \  ```\n\n- To retain ordering information we add a with ordinality clause\n\n\
    \  ```sql\n  select B.title, A.author, A.position\n  from books as B, unnest(B.author_array)\
    \ with ordinality\n  as A(author, position)\n  ```\n\n## Unnesting\n\nThe transformation\
    \ of a nested relation into a form with fewer (or no) relation-valued attributes\
    \ is called **unnesting**.\n\n- E.g.\n\n  ```sql\n  select title, A as author,\
    \ publisher.name as pub_name, publisher.branch as pub_branch, K.keyword\n  from\
    \ books as B, unnest(B.author_array) as A(author),\n  unnest(B.keyword_set) as\
    \ K(keyword)\n  ```\n\n## Nesting\n\n- Nesting is the opposite of unnesting, creating\
    \ a collection-valued attribute\n\n- NOTE: SQL:1999 does not support nesting\n\
    \n- Nesting can be done in a manner similar to aggregation, but using the function\
    \ collect() in place of an aggregation operation, to create a multiset\n\n- To\
    \ nest the flat-books relation on the attribute keyword:\n\n  ```sql\n  select\
    \ title, author, Publisher(pub_name, pub_branch) as publisher, collect(keyword)\
    \ as keyword_set\n  from flat-books\n  group by title, author, publisher\n  ```\n\
    \n- To nest on both authors and keywords:\n\n  ```sql\n  select title, collect(author)\
    \ as author_set, Publisher(pub_name, pub_branch) as publisher, collect(keyword)\
    \ as keyword_set\n  from flat-books\n  group by title, publisher\n  ```\n\n##\
    \ 1NF Version of Nested Relation\n\n1NF version of books\n\n| title | author |\
    \ pub_name | pub_branch | keyword |\n|---|---|---|---|---|\n| Compilers | Smith\
    \ | McGraw-Hill | New York | parsing |\n| Compilers | Jones | McGraw-Hill | New\
    \ York | parsing |\n| Compilers | Smith | McGraw-Hill | New York | analysis |\n\
    | Compilers | Jones | McGraw-Hill | New York | analysis |\n| Networks | Jones\
    \ | Oxford | London | Internet |\n| Networks | Frick | Oxford | London | Internet\
    \ |\n| Networks | Jones | Oxford | London | Web |\n| Networks | Frick | Oxford\
    \ | London | Web |\n\nflat-books\n\n## Nesting (Cont.)\n\nAnother approach to\
    \ creating nested relations is to use subqueries in the **select** clause.\n\n\
    ```sql\nselect title,\n       array(select author\n             from authors as\
    \ A\n             where A.title = B.title\n             order by A.position) as\
    \ author_array,\n       Publisher(pub_name, pub_branch) as publisher,\n      \
    \ multiset(select keyword\n                from keywords as K\n              \
    \  where K.title = B.title) as keyword_set\nfrom books as B\n```\n\n## Object-Identity\
    \ and Reference Types\n\nDefine a type _Department_ with a field _name_ and a\
    \ field _head_ which is a reference to the type _Person_, with table _people_\
    \ as scope:\n\n```sql\ncreate type Department (\n    name varchar(20),\n    head\
    \ ref(Person) scope people)\n```\n\nWe can then create a table _departments_ as\
    \ follows\n\n```sql\ncreate table departments of Department\n```\n\nWe can omit\
    \ the declaration **scope** _people_ from the type declaration and instead make\
    \ an addition to the **create table** statement:\n\n```sql\ncreate table departments\
    \ of Department\n    (head with options scope people)\n```\n\n## User Generated\
    \ Identifiers\n\n- The type of the object-identifier must be specified as part\
    \ of the type definition of the referenced table, and\n- The table definition\
    \ must specify that the reference is user generated\n\n```sql\ncreate type Person\n\
    \    (name varchar(20),\n     address varchar(20))\n     ref using varchar(20)\n\
    create table people of Person\n     ref is person_id user generated\n```\n\n-\
    \ When creating a tuple, we must provide a unique value for the identifier:\n\n\
    \  ```sql\n  insert into people (person_id, name, address) values\n      ('01284567',\
    \ 'John', '23 Coyote Run')\n  ```\n\n- We can then use the identifier value when\
    \ inserting a tuple into *departments*\n  - Avoids need for a separate query to\
    \ retrieve the identifier:\n\n    ```sql\n    insert into departments\n      \
    \  values ('CS', '01284567')\n    ```\n"
