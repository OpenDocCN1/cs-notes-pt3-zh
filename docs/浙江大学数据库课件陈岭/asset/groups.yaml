  - '[PAGE 512]


    # # Correctness of 3NF Decomposition (Contd.)


    # ## Case 1: If B in β:


    +   - If γ is a superkey, the 2nd condition of 3NF is satisfied

    +   - Otherwise α must contain some attribute not in γ

    +   - Since γ → B is in F+ it must be derivable from Fc, by using attribute closure
    on γ.

    +   - Attribute closure not have used α →β - if it had been used, α must be contained
    in the attribute closure of γ, which is not possible, since we assumed γ is not
    a superkey.

    +   - Now, using α→ (β- {B}) and γ → B, we can derive α →B (since γ ⊆ α β, and
    B ∉ γ since γ → B is non-trivial)

    +   - Then, B is extraneous in the right-hand side of α →β; which is not possible
    since α →β is in Fc.

    +   - Thus, if B is in β then γ must be a superkey, and the second condition of
    3NF must be satisfied.'
  - '[PAGE 513]


    # # Correctness of 3NF Decomposition (Contd.)


    # ## Case 2: B is in α.


    +   - Since α is a candidate key, the third alternative in the definition of 3NF
    is trivially satisfied.


    +   - In fact, we cannot show that γ is a superkey.


    +   - This shows exactly why the third alternative is present in the definition
    of 3NF.


