    # # Canonical Cover(cont.)


    +   - To compute a canonical cover for **F**:

    +     repeat

    +       Use the union rule to replace any dependencies

    +       in **F** like \(\alpha_1 \rightarrow \beta_1\) and \(\alpha_1 \rightarrow
    \beta_2\) with \(\alpha_1 \rightarrow \beta_1 \beta_2\)

    +       Find a functional dependency \(\alpha \rightarrow \beta\) with an

    +       extraneous attribute either in \(\alpha\) or in \(\beta\)

    +       If an extraneous attribute is found, delete it

    +       from \(\alpha \rightarrow \beta\)

    +     until **F** does not change

    +   - Note: Union rule may become applicable after

    +     some extraneous attributes have been deleted, so

    +     it has to be re-applied


