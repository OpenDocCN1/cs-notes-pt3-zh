  - '[PAGE 375]


    # Weak Entity Sets (cont.)


    +   - The existence of a weak entity set **depends on the existence of a _identifying
    entity set_ or _owner entity set_**（标识实体集或属主实体集）。

    +     - *E.g.* `loan(loan-num, amount)` is an **identifying entity set**.

    +     - It must relate to the identifying entity set via a **total, one-to-many
    relationship set** from the identifying to the weak entity set.


    +   - The related relationship is called **identifying relationship**（标识性联系）

    +     - e.g. `loan-payment`'
  - '[PAGE 376]


