  - '[PAGE 358]


    # 6.3 Keys（码，键）

    *keys for entity sets*


    +   - A **super key（超码）** of an entity set is a set of one or more attributes
    whose values **uniquely determine each entity**.


    +   - A **candidate key（候选码）** of an entity set is a **minimal super key**.


    +     - *Customer-id* is candidate key of customer

    +     - *loan-number* is candidate key of *loan*


    +   - Although several candidate keys may exist, one of the candidate keys is
    selected to be the **primary key（主码或主键）**.


    +   - **Example:** *customer(cus-num, cus-name, cus-street, cus-city),*

    +     - **candidate key:** *cus-num*

    +     - **super key:** {cus-num}, {cus-num, cus-name}, {cus-num, ...}


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_358_0.png)'
  - "[PAGE 359]\n\n# \U0001F53A Keys for Relationship Sets\n\n+   - **The combination\
    \ of primary keys of the participating entity sets forms a super key of a relationship\
    \ set.**\n+   \n+     （参与一个联系集的各实体集的码的组合，构成该联系集的超码）\n+   \n+     - **(customer-id,\
    \ loan-number)** is the **super key** of **borrower**\n+     - **(s-id, c-id)**\
    \ is the **super key** of **enrolled**\n+     - **NOTE:** this means a pair of\
    \ entity can have at most one relationship in a particular relationship set.\n\
    \n+   - **Must consider the mapping cardinality of the relationship set when deciding\
    \ what are the candidate keys.** (1:1, 1:n, m:n)\n\n+   - **Need to consider semantics\
    \ of relationship set in selecting the primary key in case of more than one candidate\
    \ key.**\n+   \n+     *e.g.*, 作为码的属性不能为空，值不应常变"
