  md: "\n## ODBC Conformance Levels\n\n**ODBC Conformance Levels** specify subsets\
    \ of the functionality defined by the standard. (不同版本ODBC提供不同等级的标准)\n\n- Core\
    \ level\n- Level 1 requires support for metadata querying\n- Level 2 requires\
    \ ability to send and retrieve arrays of parameter values and more detailed catalog\
    \ information.\n\n**SQL Call Level Interface (CLI)** standard is similar to ODBC\
    \ interface, but with some minor differences. E.g. Oracle call interface (OCI)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_335_0.png)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_335_1.png)\n\
    \n参考书：《Visual C++6.0数据库开发技术与工程实践》，求是科技，人民邮电出版社，2003.1\n\n## 3.13 JDBC\n\n- JDBC\
    \ is a Java API for communicating with database systems supporting SQL\n- JDBC\
    \ supports a variety of features for querying and updating data, and for retrieving\
    \ query results\n- JDBC also supports **metadata retrieval**, such as querying\
    \ about relations present in the database and the names and types of relation\
    \ attributes\n- Model for communicating with the database:\n  - Open a connection\n\
    \  - Create a “statement” object\n  - Execute queries using the Statement object\
    \ to send queries and fetch results\n  - Exception mechanism to handle errors\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_337_0.png)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_337_1.png)\n\
    \n### JDBC Code\n\n```java\npublic static void JDBCexample(String dbid, String\
    \ userid, String passwd)\n{\n    try {\n        Class.forName(\"oracle.jdbc.driver.OracleDriver\"\
    );\n        Connection conn = DriverManager.getConnection(\n            \"jdbc:oracle:thin:@aura.bell-labs.com:2000:bankdb\"\
    ,\n            userid, passwd);\n        Statement stmt = conn.createStatement();\n\
    \        ... Do Actual Work ....\n        stmt.close();\n        conn.close();\n\
    \    }\n    catch (SQLException sqle) {\n        System.out.println(\"SQLException\
    \ : \" + sqle);\n    }\n}\n```\n\n### JDBC Code (Cont.)\n\n- Update to database\n\
    \n  ```java\n  try {\n      stmt.executeUpdate(\"insert into account values ('A-9732',\
    \ 'Perryridge', 1200)\");\n  } catch (SQLException sqle) {\n      System.out.println(\"\
    Could not insert tuple. \" + sqle);\n  }\n  ```\n\n- Execute query and fetch and\
    \ print results\n\n  ```java\n  ResultSet rset = stmt.executeQuery(\"select branch_name,\
    \ avg(balance) from account group by branch_name\");\n  while (rset.next()) {\n\
    \      System.out.println(rset.getString(\"branch_name\") + \" \" + rset.getFloat(2));\n\
    \  }\n  ```\n\n### JDBC Code Details\n\n**Getting result fields:**\n\n- `rs.getString(\"\
    branchname\")` and `rs.getString(1)` equivalent if branchname is the first argument\
    \ of select result.\n\n**Dealing with Null values**\n\n```java\nint a = rs.getInt(\"\
    a\");\nif (rs.wasNull()) System.out.println(\"Got null value\");\n```\n\n### Prepared\
    \ Statement\n\n- Prepared statement allows queries to be compiled and executed\
    \ multiple times with different arguments\n\n```java\nPreparedStatement pStmt\
    \ = conn.prepareStatement(\n    \"insert into account values(?,?,?)\");\npStmt.setString(1,\
    \ \"A-9732\");\npStmt.setString(2, \"Perryridge\");\npStmt.setInt(3, 1200);\n\
    pStmt.executeUpdate();\n\npStmt.setString(1, \"A-9733\");\npStmt.executeUpdate();\n\
    ```\n\n- Beware: If value to be stored in database contains a **single quote**\
    \ or **other special character**, prepared statements work fine, but creating\
    \ a query string and executing it directly would result in a syntax error!\n\n\
    ## End of Chapter\n\n- 5th Edition: Ex.4.2, 4.5, 4.7, 8.4\n- 4th Edition: Ex.6.2,\
    \ 6.6, 6.3, 6.8\n\n## Steps of Database Design\n\n1. **Requirement analysis**\n\
