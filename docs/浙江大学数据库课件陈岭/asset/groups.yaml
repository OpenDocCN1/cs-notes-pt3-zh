    ## (7) Rename Operation


    - Allows us to name, and therefore to refer to, the results of relational-algebra
    expressions. (procedural)

    - Allows us to refer to a relation by more than one name.


    Example: \( \rho_x(E) \), \( \rho \) is pronounced as rho

    returns the expression **E** under the name **X**


    If a relational-algebra expression **E** has arity **n**, then


    \( \rho_x(A1, A2, ..., An)(E) \)


    (对relation **E**及其attributes都重命名)


    returns the result of expression **E** under the name **X**, and with

    the attributes renamed to **A1, A2, ..., An**.


    # Banking Example


    **branch** (*branch-name*, *branch-city*, assets)


    **customer** (*customer-name*, *customer-street*, *customer-city*)


    **account** (*account-number*, *branch-name*, balance)


    **loan** (*loan-number*, *branch-name*, amount)


    **depositor** (*customer-name*, *account-number*)


    **borrower** (*customer-name*, *loan-number*)


    ## Example Queries


    ### Example 1: Find all loans of over $1200


    σ_amount > 1200 (loan)


    ### Example 2: Find the loan number for each loan of an amount greater than $1200


    Π_loan-number (σ_amount > 1200 (loan))


    loan (loan-number, branch-name, amount)


    ## Example Queries


    - **Example 3:** Find the names of all customers who have a loan, **or** an account,
    or both, from the bank


    $\Pi_{customer-name}(borrower) \cup \Pi_{customer-name}(depositor)$


    - **Example 4:** Find the names of all customers who at least have a loan **and**
    an account at bank.


    $\Pi_{customer-name}(borrower) \cap \Pi_{customer-name}(depositor)$


    | Relation | Attributes |

    |---|---|

    | depositor | customer-name, account-number |

    | borrower | customer-name, loan-number |


