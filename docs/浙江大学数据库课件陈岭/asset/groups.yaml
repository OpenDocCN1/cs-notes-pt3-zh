    \ due to redundancy in 3NF\n\n◉ **R** = (J, K, L)  \n**F** = {JK → L, L → K}\n\
    \n| J | L | K |\n|---|---|---|\n| J₁ | l₁ | k₁ |\n| J₂ | l₁ | k₁ |\n| J₃ | l₁\
    \ | k₁ |\n| null | l₂ | k₂ |\n\n> J---student, K---course,  \n> L---teacher（一门有多个教师，一个教师上一门课，一个学生选多门课，一门课有多个学生选）\n\
    \nA schema that is in **3NF** but not in **BCNF** has the problems of **repetition\
    \ of information** (e.g., the relationship l₁, k₁), and may need to **use null\
    \ values** (e.g., to represent the relationship l₂, k₂ where there is no corresponding\
    \ value for J)."
