  - "[PAGE 549]\n\n# DECLARE\n\n# Syntax\n\n```\nidentifier [CONSTANT] datatype [NOT\
    \ NULL]\n          [:= | DEFAULT expr];\n```\n\n# Examples\n\n> > Notice that\
    \ PL/SQL includes\n> > all SQL types, and more...\n\n```\nDeclare\n    birthday\
    \     DATE;\n    age          NUMBER(2)  NOT NULL := 27;\n    name         VARCHAR2(13)\
    \ := 'Levi';\n    magic        CONSTANT NUMBER := 77;\n    valid        BOOLEAN\
    \ NOT NULL := TRUE;\n```"
  - "[PAGE 550]\n\n# Declaring Variables with the `%TYPE` Attribute\n\nExamples\n\n\
    ```\nDECLARE\n  sname       Sailors.sname%TYPE;\n  fav_boat    VARCHAR2(30);\n\
