  - '[PAGE 438]


    # (2) Closure of a Set of Functional Dependencies（函数依赖集的闭包）


    Given a set of functional dependencies $F$, there are certain other functional
    dependencies that are logically implied by $F$.


    E.g. If $A \to B$ and $B \to C$, then we can infer that $A \to C$.


    Definition: The set of all functional dependencies logically implied by $F$ is
    the closure of $F$, denoted by $F^+$.


    E.g. $F = \{A \to B, B \to C\}$, $F^+ = \{A \to B, B \to C, A \to C, A \to A,
    AB \to A, AB \to B, AC \to C, A \to BC, \ldots\}$


    # How to find $F^+$?


    E.g. $R = (A, B, C, G, H, I)$


    ```

    $F = \{\begin{aligned} A &\to B\\ A &\to C\\ CG &\to H\\ CG &\to I\\ B &\to H
    \end{aligned}\}$

    ```


    $F^+ = ?$'
  - '[PAGE 439]


    # (2) Closure of a Set of Functional Dependencies (cont.) — Armstrong’s Axioms
    (公理)


    +   - **Armstrong’s Axioms** provide inference rules to find F⁺

    +   - We can find all of F⁺ by applying **Armstrong’s Axioms**:

    +     - if β ⊆ α, then α → β (**reflexivity**, 白反律) -- trivial

    +     - if α → β, then γα → γβ (**augmentation**, 增补律)

    +     - if α → β, and β → γ, then α → γ (**transitivity**, 传递律)

    +   - These rules are

    +     - **sound** (保真的, generate only functional dependencies that actually hold)

    +     - **complete** (完备的, generate all functional dependencies that hold).'
