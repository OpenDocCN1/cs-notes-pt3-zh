  - "[PAGE 502]\n\n# # Universal Relation Approach\n\n+   - **Dangling (无归属) tuples**\
    \ – Tuples that “disappear” in computing a join.\n+     - Let \\( r_1 (R_1), r_2\
    \ (R_2), \\dots, r_n (R_n) \\) be a set of relations\n+     - A tuple r of the\
    \ relation \\( r_i \\) is a dangling tuple if r is not in the relation:\n+   \
    \    \n+       $$\\Pi_{Ri} (r_1 \\bowtie r_2 \\bowtie \\dots \\bowtie r_n)$$\n\
    \n+   - The relation \\( r_1 \\bowtie r_2 \\bowtie \\dots \\bowtie r_n \\) is\
    \ called a **universal relation** since it involves all the attributes in the\
    \ “universe” defined by \\( R_1 \\cup R_2 \\cup \\dots \\cup R_n \\)\n\n+   -\
    \ If dangling tuples are allowed in the database, instead of decomposing a universal\
    \ relation, we may prefer to synthesize a collection of normal form schemas from\
    \ a given set of attributes."
