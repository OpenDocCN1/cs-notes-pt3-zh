  - '[PAGE 321]


    # ## 3.12 ODBC


    +   - Open DataBase Connectivity (ODBC)


    +   - A standard for application program to communicate with a database server.


    +   - application program interface (API) to


    +     (1) open a connection with a database,


    +     (2) send queries and updates,


    +     (3) get back results.


    +   - Applications such as GUI, spreadsheets, etc. can use ODBC


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_321_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_321_1.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_321_2.png)'
  - '[PAGE 322]


    # 3.12 ODBC (cont.)


    # Embedded SQL vs. ODBC


    +   Embedded SQL: The pre_compiler is DBMS_specific.


    +   ODBC provides a standardized way for connection of database to the application
    programmers through API (Application programming Interface).


    +   NOT DBMS_specific.


    +   Need NOT precompiling.'
  - '[PAGE 323]


    # # ODBC提供了一个公共的、与具体数据库无关的应用程序设计接口API (Application Programming Interface)。所谓公共的接口API就是为开发者提供单一的编程接口，这样同一个应用程序就可以访问不同的数据库服务器。


    # ## 使用ODBC访问数据库的方法：


    +   - ODBC API访问数据库


    +   - Visual C++的MFC提供了丰富的ODBC类，它们封装了大量的函数用以完成数据库的大部分应用


    # ## 访问数据库的其他方法


    +   - OLE DB(Object Link and Embedding DataBase)，是一套通过COM (Component Object Model，组件对象模型)接口访问数据库的ActiveX底层接口技术，速度快，支持关系型和非关系型数据库，编程量大。


    +   - ADO (ActiveX Data Objects)，基于COM，建立在OLE DB 之上，更易于使用。


    +   - DAO (Data Access Objects)，基于Microsoft Jet引擎，访问Access数据库(即*.MDB文件)时具有很好的性能，DAO类与ODBC类相比具有很多相似之处。'
  md: "\n## Embedded SQL (Cont.)\n\nStep2: The open statement causes the query to\
    \ be evaluated:\n\n```sql\nEXEC SQL OPEN c END_EXEC\n```\n\nStep3: The fetch statement\
    \ causes the values of one tuple in the result of the query to be placed on host\
    \ language variables.\n\n```sql\nEXEC SQL FETCH c INTO :cn, :ccity END_EXEC\n\
    ```\n\nRepeated calls to fetch of successive tuples in the query result.\n\nA\
    \ variable called SQLSTATE in the SQLCA (SQL communication area) gets set to '02000'\
    \ to indicate no more data is available.\n\nStep4: The close statement causes\
    \ the database system to delete the temporary relation that holds the result of\
    \ the query.\n\n```sql\nEXEC SQL CLOSE c END_EXEC\n```\n\nNote: above details\
    \ vary with language. E.g. the Java embedding defines Java iterators (迭代器) to\
    \ step through result tuples.\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_315_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_315_1.png)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_315_2.png)\n\
    \n### Example for embedded SQL (For Oracle Pro*C)\n\n```c\nExec SQL include SQLCA;\n\
    //SQL通讯区，是存放语句的执行状态的数据结构，其中\n// 有一个变量sqlcode指示每次执行SQL语句的返回代码（success, not_success）\n\
    Exec SQL BEGIN DECLARE SECTION;\nchar bn[20], bc[30];\nExec SQL END DECLARE SECTION;\n\
    Exec SQL DECLARE branch_cur CURSOR FOR\nselect branch_name, branch_city from branch;\n\
    ......\nExec SQL OPEN branch_cur;\nwhile (1) { Exec SQL FETCH branch_cur INTO\
    \ :bn, :bc ;\nif (sqlca.sqlcode<> SUCCESS) BREAK;\n...... // 由宿主语句对bn, bc中的数据进行相关处理\n\
    }\nExec SQL CLOSE branch_cur;\n......\n```\n\n( Pro*C程序→预编译pcc →compiler cc →\
    \ linker →.exe)\n\n### (2) Updates\n\n#### （1）单行的修改\n\n```c\nExec SQL BEGIN DECLARE\
    \ SECTION;\nchar an[20];\nfloat bal;\nExec SQL END DECLARE SECTION;\n......\n\
    scanf(\"%s,%f\", an, &bal); //读入账号及要增加的存款额\nEXEC SQL update account set balance=balance\
    \ + :bal\nwhere account_number = :an;\n......\n```\n\n### (2) Updates (cont.)\n\
    \n(2) 多行的修改: Can update tuples fetched by cursor by declaring that the cursor\
    \ is for update.\n\n```sql\nExec SQL BEGIN DECLARE SECTION;\n    char an[20];\n\
    \    float bal;\nExec SQL END DECLARE SECTION;\nEXEC SQL DECLARE csr CURSOR FOR\n\
    \    SELECT *\n    FROM account\n    WHERE branch_name = 'Perryridge'\n    FOR\
    \ UPDATE OF balance;\n.......\n```\n\n#### To update tuple at the current location\
    \ of cursor\n\n```sql\nEXEC SQL OPEN csr ;\n\nwhile(1) {\n    EXEC SQL FETCH csr\
    \ INTO :an, :bn, :bal ;\n    if (sqlca.sqlcode<> SUCCESS) BREAK;\n    ...... //\
    \ 由宿主语句对an, bn, bal中的数据进行相关处理(如打印)\n    EXEC SQL update account\n    set balance\
    \ = balance + 100\n    where CURRENT OF csr ;\n}\n......\nEXEC SQL CLOSE csr;\n\
    ......\n```\n\nOr:\n\n```sql\nEXEC SQL delete from account\nwhere current of csr\
    \ ;\n```\n\n## 3.12 ODBC\n\n- Open Database Connectivity (ODBC)\n- A standard\
    \ for application program to communicate with a database server.\n- application\
    \ program interface (API) to\n  - (1) open a connection with a database,\n  -\
    \ (2) send queries and updates,\n  - (3) get back results.\n- Applications such\
    \ as GUI, spreadsheets, etc. can use ODBC\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_321_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_321_1.png)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_321_2.png)\n\
    \n## 3.12 ODBC (cont.)\n\n### Embedded SQL vs. ODBC\n\n- Embedded SQL: The precompiler\
    \ is DBMS-specific.\n- ODBC provides a standardized way for connection of database\
    \ to the application programmers through API (Application Programming Interface).\n\
    - Not DBMS-specific.\n- Need not precompiling.\n\nODBC提供了一个公共的、与具体数据库无关的应用程序设计接口API\
    \ (Application Programming Interface)。所谓公共的接口API就是为开发者提供单一的编程接口，这样同一个应用程序就可以访问不同的数据库服务器。\n\
    \n### 使用ODBC访问数据库的方法：\n\n- ODBC API访问数据库\n- Visual C++的MFC提供了丰富的ODBC类，它们封装了大量的函数用以完成数据库的大部分应用\n\
    \n### 访问数据库的其他方法\n\n- OLE DB (Object Linking and Embedding Database)，是一套通过COM\
    \ (Component Object Model，组件对象模型)接口访问数据库的ActiveX底层接口技术，速度快，支持关系型和非关系型数据库，编程量大。\n\
    - ADO (ActiveX Data Objects)，基于COM，建立在OLE DB 之上，更易于使用。\n- DAO (Data Access Objects)，基于Microsoft\
    \ Jet引擎，访问Access数据库(即*.MDB文件)时具有很好的性能，DAO类与ODBC类相比具有很多相似之处。\n"
