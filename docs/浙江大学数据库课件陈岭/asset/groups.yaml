    \ set has two attributes: name.first-name and name.last-name, or first-name and\
    \ last-name.\n\n### (1.b) Entity Set with Multivalued Attributes\n\nA multivalued\
    \ attribute M of an entity E is represented by a separate table EM:\n\nE.g. Multivalued\
    \ attribute dependent-names of employee is represented by a separate table employee-dependent-names(employee-id,\
    \ dependent-name).\n\nemployee(employee-id, ename, sex, age), employee-dependent-names(employee-id,\
    \ dependent-name)\n\nEach value of the multivalued attribute maps to a separate\
    \ row of the table EM.\n\nE.g., an employee entity with primary key John and dependents\
