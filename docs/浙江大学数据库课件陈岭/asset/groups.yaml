    \ (查询分析器)\n  - Oracle: SQL*Plus Worksheet\n  - MySQL: mysql command line client\n\
    - Use it by host language through ODBC (Open DataBase Connectivity), JDBC\n- Use\
    \ it by host language with embedded-SQL\n\n## (4) How to use a database\n\n```\n\
    Developed by C,\nC++, Fortran,\nCobol, Java\n\nDelphi, VB,\nPowerBuilder,\n\n\
    User\nUser\n…\nUser\nAdvanced\nUser\n\nApplication programs\n(Embedding SQL)\n\
    \nSQL\n\nTools\n\nDBMS\n\nDBA\n\nOS\n\nDB\n```\n\n## 1.7 Database Users\n\n- Users\
    \ are differentiated by the way they expect to interact with the system\n- **Naïve\
    \ users** - invoke one of the permanent application programs that have been written\
    \ previously by a high level language. (普通用户)\n  - E.g. people accessing database\
    \ over the web, bank tellers, clerical staff\n- **Application programmers** -\
    \ interact with system through SQL calls.\n- **Sophisticated users** - form requests\
    \ in a database query language. E.g. online analytical processing (OLAP), Data\
    \ mining. (富有经验的用户)\n- **Specialized users** - write specialized database applications\
    \ that do not fit into the traditional data processing framework. E.g. CAD, KDB,\
    \ ES. (专门用户，特殊用户)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_45_0.png)\n\n##\
    \ 1.8 Database Administrator (cont.)\n\n### Database administrator's duties include:\n\
    \n- Schema definition\n- Storage structure and access method definition\n- Schema\
    \ and physical organization modification\n- Granting of authorization for data\
    \ access\n- Routine maintenance\n- Monitoring performance and responding to changes\
    \ in requirements\n- Security for the database (e.g. periodically backup database,\
    \ recovery when failure)\n\n## 1.9 Transaction Management（事务管理）\n\n- **Concurrent\
    \ use** is important. But cause problems.\n- **A transaction** is a collection\
    \ of operations that performs a single logical function in a database application\
    \ - Jim Gray\n- **Transaction requirement:** atomicity（原子性）, consistency（一致性）,\
    \ isolation（隔离性）, durability（持久性）/ **ACID**\n- **Transaction-management component**\
    \ ensures that the database remains in a **consistent** (correct) **state** despite\
    \ system failures (e.g., power failures and operating system crashes) and transaction\
    \ failures. - By backup and recovery subsystem\n- **Concurrency-control manager**（并发控制管理器）controls\
    \ the interaction among the concurrent transactions.\n"
