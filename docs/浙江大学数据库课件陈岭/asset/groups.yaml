  - '[PAGE 250]


    # The difference between create type and domain


    +   - Domains can have constrains, such as not null, specified on them, and can
    have default value defined for variables of the domain type.

    +   - Domains are NOT strongly typed, and the values of one domain type can be
    assigned to values of another domain type as long as the underlying types are
    compatible.


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_250_0.png)


