    \ may have an associated manager\n\n"
  mdcn: "\n\n## Weak Entity Sets (cont.)\n\n- The existence of a weak entity set **depends\
    \ on the existence of a _identifying entity set_ or _owner entity set_**（标识实体集或属主实体集）。\n\
    \  - *E.g.* `loan(loan-num, amount)` is an **identifying entity set**.\n  - It\
    \ must relate to the identifying entity set via a **total, one-to-many relationship\
    \ set** from the identifying to the weak entity set.\n\n- The related relationship\
    \ is called **identifying relationship**（标识性联系）\n  - e.g. `loan-payment`\n\n##\
    \ Weak Entity Sets (Cont.)\n\n**Primary key for _payment_:**\n\n{**loan-number,\
    \ payment-number**}\n\n**payment-number** is **discriminator** of the **payment**\
    \ entity set\n\nOwner entity set\n\nidentifying relationship\n\nWeak entity set\n\
    \n## Weak Entity Sets (Cont.)\n\n- Note: the primary key of the strong entity\
    \ set is **NOT explicitly stored with the weak entity set**, since it is implicit\
    \ in the identifying relationship.\n\n- If _loan-number_ were explicitly stored,\
    \ _payment_ could be made a strong entity, but then the relationship between _payment_\
    \ and _loan_ would be **duplicated** by an implicit relationship defined by the\
    \ attribute _loan-number_ common to _payment_ and _loan_\n\n## 6.6 Extended E-R\
    \ features\n\n### (1) **Stratum** (层) of the entity set\n\n\U0001F534 **Specialization**(特殊化、具体化)\n\
    \n- Top-down design process; we designate subgroupings within an entity set that\
    \ are distinctive from other entities in the set.\n- These subgroupings become\
    \ lower-level entity sets that have attributes or participate in relationships\
    \ that do NOT apply to the higher-level entity set.\n- **Attribute inheritance**\
    \ — a lower-level entity set inherits all the attributes and relationship participation\
    \ of the higher-level entity set to which it is linked.\n\n## Specialization Example\n\
    \n## Generalization （泛化、普遍化）\n\n- A **bottom-up design process** – combine a number\
    \ of entity sets that share the same features into a higher-level entity set.\n\
    \n- Specialization and generalization are simple inversions of each other; they\
    \ are represented in an E-R diagram in the same way.\n\n- The terms specialization\
    \ and generalization are used interchangeably.\n\n## Design Constraints on a Specialization/Generalization\n\
    \nConstraint on which entities can be members of a given lower-level entity set.\n\
    \n- condition-defined （条件定义的）\n  - E.g. all customers over 65 years are members\
    \ of senior-citizen entity set; senior-citizen ISA person.\n\n- user-defined （用户定义的）\n\
    \  - e.g. employee to different teams\n\nConstraint on whether or not entities\
    \ may belong to more than one lower-level entity set within a single generalization.\n\
    \n- Disjoint （不相交）\n  - an entity can belong to only one lower-level entity set\n\
    \  - Noted in E-R diagram by writing disjoint next to the ISA triangle\n\n- Overlapping\
    \ （可重叠）\n  - an entity can belong to more than one lower-level entity set.\n\n\
    ## Design Constraints on a Specialization/Generalization (Cont.)\n\nCompleteness\
    \ constraint （完全性约束） - specifies whether or not an entity in the higher-level\
    \ entity set must belong to at least one of the lower-level entity sets within\
    \ a generalization.\n\n- total : an entity must belong to one of the lower-level\
    \ entity sets （完全泛化）\n\n- partial: an entity need not belong to one of the lower-level\
    \ entity sets （部分泛化）\n\n## Aggregation (Cont.)\n\n### Relationship sets works-on\
    \ and manages represent overlapping information\n\n- Every *manages* relationship\
    \ corresponds to a *works-on* relationship\n- However, some *works-on* relationships\
    \ may not correspond to any *manages* relationships\n  - So we can’t discard the\
    \ *works-on* relationship\n\n### Eliminate this redundancy via aggregation\n\n\
    - **Treat relationship as an abstract entity**\n- Allows relationships between\
    \ relationships\n- Abstraction of relationship into new entity\n\n### Without\
    \ introducing redundancy, the following diagram represents:\n\n- An employee works\
    \ on a particular job at a particular branch\n- An employee, branch, job combination\
    \ may have an associated manager\n\n"
