    +   multiset [ ''parsing'', ''analysis'' ])


    +   To insert the preceding tuple into the relation books

    +   insert into books

    +   values

    +   (''Compilers'', array[''Smith'', ''Jones''],

    +   Publisher( ''McGraw-Hill'', ''New York''),

    +   multiset [ ''parsing'', ''analysis'' ])'
