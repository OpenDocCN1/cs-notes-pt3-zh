- pgno: 643
  md: '# # String Representation


    +   - Store each top level element as a string field of a tuple in a relational
    database

    +     - Use a single relation to store all elements, or

    +     - Use a separate relation for each top-level element type

    +       - E.g. account, customer, depositor relations

    +         - Each with a string-valued attribute to store the element


    +   - Indexing:

    +     - Store values of subelements/attributes to be indexed as extra fields of
    the relation, and build indices on these fields

    +       - E.g. customer_name or account_number

    +     - Some database systems support function indices, which use the result of
    a function as the key value.

    +       - The function should return the value of the required subelement/attribute'
  merge: -1
  img_proc: true
- pgno: 644
  md: '# String Representation (Cont.)


    +   - **Benefits:**

    +     - Can store any XML data even without DTD

    +     - As long as there are many top-level elements in a document, strings are
    small compared to full document

    +       - Allows fast access to individual elements.


    +   - **Drawback:** Need to parse strings to access values inside the elements

    +     - Parsing is slow.'
  merge: -1
  img_proc: true
- pgno: 645
  md: "# # Tree Representation\n\n+   - Tree representation: model XML data as tree\
    \ and store using relations  \n+     nodes(id, type, label, value)  \n+     child\
    \ (child_id, parent_id)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_645_0.png)\n\
    \n+   - Each element/attribute is given a unique identifier  \n+   - Type indicates\
    \ element/attribute  \n+   - Label specifies the name of the element/attribute\
    \  \n+   - Value is the text value of the element/attribute  \n+   - The relation\
    \ child notes the parent-child relationships in the tree  \n+     - Can add an\
    \ extra attribute to child to record ordering of children"
  merge: -1
  img_proc: true
