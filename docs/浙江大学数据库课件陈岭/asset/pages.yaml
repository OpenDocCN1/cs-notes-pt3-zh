- pgno: 119
  md: '# (4) Null values


    +   - It is possible for tuples to have a null value, denoted by *null*, for some
    of their attributes

    +   - *null* signifies **an unknown** value or that a value does **NOT exist**.

    +   - The result of **any arithmetic expression involving *null* is *null*.**

    +   - **Aggregate functions simply ignore null values**

    +     - Is an arbitrary decision. Could have returned null as result instead.

    +     - We follow the semantics of SQL in its handling of null values

    +   - For duplicate elimination and grouping, null is treated like any other value,
    and two nulls are assumed to be the same

    +     - Alternative: assume each null is different from each other

    +     - Both are arbitrary decisions, so we simply follow SQL'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# # Null Values


    # ## Comparisons with null values return the special truth value unknown


    +   - If false was used instead of unknown, then would not be equivalent to not
    (A < 5) A >= 5


    # ## Three-valued logic using the truth value unknown:


    +   - OR: (unknown or true) = true, (unknown or false) = unknown (unknown or unknown)
    = unknown


    +   - AND: (true and unknown) = unknown, (false and unknown) = false, (unknown
    and unknown) = unknown


    +   - NOT: (not unknown) = unknown


    +   - In SQL “P is unknown” evaluates to true if predicate P evaluates to unknown


    # ## Result of select predicate is treated as false if it evaluates to unknown'
  merge: -1
  img_proc: true
