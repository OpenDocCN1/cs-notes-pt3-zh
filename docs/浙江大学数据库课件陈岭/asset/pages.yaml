- pgno: 365
  md: '# ## (4) Express the Cardinality Constraints (基数约束)


    We express cardinality constraints by drawing either a directed line (→), signifying
    “one,” or an undirected line (—), signifying “many,” between the relationship
    set and the entity set.


    # ### (a) One-to-one relationship:


    +   - E.g. A customer is associated with at most one loan via the relationship
    _borrower_. A loan is associated with at most one customer via _borrower_. (一个客户最多只能借一笔贷款，一笔贷款只能由一个客户借)


    +   - 注：一个联系集的类型取决于被表达对象的语义约束及设计者的意图


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_365_0.png)'
  merge: -1
  img_proc: true
- pgno: 366
  md: '# # (b) One-To-Many Relationship


    In the one-to-many relationship, a loan is associated with at most one customer
    via borrower, a customer is associated with several (including 0) loans via borrower

    （一个客户可借多笔贷款，一笔贷款只能由一个客户借）


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_366_0.png)'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# # (c) Many-To-One Relationships


    In a many-to-one relationship a loan is associated with several (including 0)
    customers via borrower, a customer is associated with at most one loan via borrower.


    (一个客户最多只能借一笔贷款，一笔贷款可由多个客户共借)


