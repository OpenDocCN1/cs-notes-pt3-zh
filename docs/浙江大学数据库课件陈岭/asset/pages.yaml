- pgno: 449
  md: '# (4) Canonical Cover (cont.)


    +   - **How to get F_c ⇒ delete extraneous attributes**（多余属性）


    +   - **There are 3 cases for the extra. attri.：**


    +   - **1)** Sets of FD may have **redundant dependencies that can be inferred
    from the others**


    ❖ Eg: A → C is redundant in:


    F = {A → C, A → B, B → C}


    ⇒ F_c = {A → B, B → C}


