- pgno: 483
  md: '# *Testing for FDs Across Relations (materialized view )


    +   If decomposition is not dependency preserving, we can have an extra materialized
    view (物化/实体化视图) for **each** dependency \(\alpha \rightarrow \beta\) in \(F_c\)
    that is not preserved in the decomposition


    +   The materialized view is defined as a projection on \(\alpha \beta\) of the
    join of the relations in the decomposition


    +   Many newer database systems support materialized views and database system
    maintains the view when the relations are updated.


    +   No extra coding effort for programmer.'
