- pgno: 430
  md: '# # Goal — Devise a Theory for the Following


    +   1) Decide whether a particular relation R is in “good” form. -No redundant


    +   2) In the case that a relation R is not in “good” form, decompose it into
    a set of relations {R1, R2, ..., Rn} such that

    +      - each relation is in good form

    +      - the decomposition is a lossless-join decomposition


    +   Our theory is based on:

    +      - functional dependencies (函数依赖)

    +      - multivalued dependencies (多值依赖)'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# 7.3 Functional Dependencies


    # (1) Definition


    Let *R* be a relation schema, α and β be attributes


    α ⊆ *R* **and** β ⊆ *R*


    # ■ The functional dependency


    α → β


    holds on *R* if and only if **for any legal relations r(R)**, whenever any two
    tuples *t₁* and *t₂* of *r* agree on the attributes α, they also agree on the
    attributes β. That is:


    *t₁*[α] = *t₂*[α]  ⇒  *t₁*[β] = *t₂*[β]


    β is functionally dependent on α, α functionally determines β


    | α | β | γ |

    |---|---|---|

