- pgno: 38
  md: "# # 1.6 Database Language\n\n# ## Database Language:\n\n+   - Data Definition\
    \ Language (DDL, 数据定义语言)\n+   - Data Manipulation Language (DML, 数据操纵语言)\n+  \
    \ - Data Control Language (DCL, 数据控制语言)\n\n# ## (1) Data Definition Language\n\
    \n+   - Specifies a **database schema** as a set of definitions of **relational\
    \ schema**.\n+   - Also specifies **storage structure**, **access methods** and\
    \ **consistency constraints**.\n+   - DDL statements are compiled, resulting in\
    \ a set of tables stored in a special file: **data dictionary** (数据字典), which\
    \ contains metadata (元数据).\n\n+   - E.g.\n\n```\n```sql\nCREATE TABLE account\
    \ (\n    account_number char(10),\n    balance integer);\n```\n```\n\n该SQL语句创建了表account"
  merge: -1
  img_proc: true
- pgno: 39
  md: '# # (1) Data Definition Language (cont.)


    **Data dictionary** (数据字典) contains metadata (i.e., the data about data) about:


    +   - Database schema

    +   - Data storage structure

    +   - Access methods and constraints

    +   - Statistical information

    +   - Authorization'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# # Data Manipulation Language(DML)


    +   - Retrieve data from the database

    +   - Insert / delete / update data in the database

    +   - DML also known as query language


    # ## Two classes of languages


    +   - Procedural – user specifies what data is required and how to get those data
    (C, Pascal, Java, ...)

    +   - Nonprocedural – user specifies what data is required without specifying
    how to get those data (SQL, Prolog)'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# # (3) SQL


    SQL= DDL+ DML+DCL


    SQL has been widely used.


    +   SQL (Structured Query Language, 结构化查询语言), 1975. IBM. System R. Called “SEQUEL”
    (Structured English QUEr y Language).


    +   E.g. find the name of the customer with customer-id 192-83-7465


    ```

    SELECT customer-name

    FROM customer

    WHERE customer-id = ''192-83-7465''

    ```


    +   E.g. find the balances of all accounts held by the customer with customer-id
    192-83-7465


    ```

    SELECT account.balance

    FROM depositor, account

    WHERE depositor.customer-id = ''192-83-7465'' and

    depositor.account-number = account.account-number

    ```'
  merge: -1
  img_proc: true
