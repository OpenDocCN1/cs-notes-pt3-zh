- pgno: 421
  md: '# # 7.1 First Normal Form (第一范式)


    Domain is **atomic** if its elements are considered to be indivisible units.


    +   - Examples of **non-atomic domains**:

    +     - Composite attributes - set of names

    +     - Multi-value attribute - a person''s phones

    +     - Complex data type - object-oriented


    A relational schema R is in **first normal form (1NF)** if the domains of all
    attributes of R are **atomic**.


    For relational database, it''s required that all relations are in 1NF.'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# # 7.1 First Normal Form (cont)


    +   - How to deal with Non-atomic values''s =>

    +     - For composite attributes: use a number of attributes.

    +     - For multi-value attribute:

    +       - (1)Use multi fields, as person(pname, ... , phon1, phon2, phon3, ...);

    +       - (2) Use a separate table, as phone(pname, phone);

    +       - (3) Use single field, as person(pname, ..., phones,...)

    +   - Drawbacks of non-atomic strategy: complicate storage; encourage redundant
    storage of data; complicated to query.'
  merge: -1
  img_proc: true
- pgno: 423
  md: '# # First Normal Form (Cont.)


    Atomicity is actually a property of how the elements of the domain are used.


    +   E.g. Strings would normally be considered indivisible


    +   Suppose that students are given roll numbers which are strings of the form
    CS0012 or EE1127


    +   If the first two characters are extracted to find the department, the domain
    of roll numbers is not atomic.


    +   Doing so is a bad idea: leads to encoding of information in application program
    rather than in the database.'
  merge: -1
  img_proc: true
