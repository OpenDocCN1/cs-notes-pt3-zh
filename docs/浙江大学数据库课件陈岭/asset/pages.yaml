- pgno: 265
  md: "# Cascading Actions in SQL\n\n```\ncreate table *account*(\n\n    ...\n\n \
    \   foreign key(*branch-name*) references *branch*\n        [ *on delete cascade*\
    \ ]\n        [ *on update cascade* ]\n    ... );\n```\n\n+   - Due to the on delete\
    \ cascade clauses, if a delete of a tuple in *branch* results in referential-integrity\
    \ constraint violation, the delete “cascades” to the *account* relation, deleting\
    \ the tuple in *account* that refers to the *branch* which was deleted.\n+   -\
    \ Cascading updates are similar."
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Cascading Actions in SQL (Cont.)


    +   - If there is a chain of foreign-key dependencies across multiple relations,
    with on delete cascade specified for each dependency, a deletion or update at
    one end of the chain can propagate across the entire chain.


    +   - But, if a cascading update or delete causes a constraint violation that
    cannot be handled by a further cascading operation, the system aborts the transaction.


    +   - As a result, all the changes caused by the transaction and its cascading
    actions are undone.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# # Cascading Actions in SQL (Cont.)


    # ## Note: Referential integrity is only checked at the end of a transaction !!


    +   - That is: Intermediate steps are allowed to violate referential integrity
    provided later steps remove the violation by the end of the transaction.


    +   - Otherwise it would be impossible to create some database states, e.g. insert
    two tuples whose foreign keys point to each other


    +   - E.g. spouse attribute of relation: marriedperson (name, address, spouse)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_267_0.png)


