- pgno: 596
  md: "# # Attributes\n\n+   - Elements can have attributes\n+   \n+   <account acct-type\
    \ = \"checking\" >\n+   <account_number> A-102 </account_number>\n+   <branch_name>\
    \ Perryridge </branch_name>\n+   <balance> 400 </balance>\n+   </account>\n\n\
    +   - Attributes are specified by _name=value_ pairs inside the starting tag of\
    \ an element\n\n+   - An element may have several attributes, but each attribute\
    \ name can only occur once:\n+   \n+   <account acct-type = \"checking\" monthly-fee=\"\
    5\">"
  merge: -1
  img_proc: true
- pgno: 597
  md: '# Attributes vs. Subelements


    # ■ Distinction between subelement and attribute


    +   - In the context of documents, **attributes are part of markup**, while **subelement
    contents are part of the basic document contents**

    +   - In the context of data representation, the difference is unclear and may
    be confusing. E.g.:

    +     - Same information can be represented in two ways

    +       - `<account account_number="A-101"> ... </account>`

    +       - `<account>`

    +         `<account_number>A-101</account_number> ...`

    +         `</account>`

    +   - Suggestion: **use attributes for identifiers of elements, and use subelements
    for contents**'
  merge: -1
  img_proc: true
- pgno: 598
  md: '# # Namespaces


    +   - XML data has to be exchanged between organizations

    +   - Same tag name may have different meaning in different organizations, causing
    confusion on exchanged documents

    +   - Specifying a unique string as an element name avoids confusion

    +   - Better solution: use unique-name:element-name

    +   - Avoid using long unique names all over document by using XML Namespaces


    ```

    ```xml

    <bank Xmlns:FB=''http://www.FirstBank.com''>

    ...

    <FB:branch>

    <FB:branchname>Downtown</FB:branchname>

    <FB:branchcity> Brooklyn </FB:branchcity>

    </FB:branch>

    ...

    </bank>

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 599
  md: '# # More on XML Syntax


    +   - Elements without subelements or text content can be abbreviated by ending
    the start tag with a />

    +   <account number="A-101" branch="Perryridge" balance=200 />

    +   - <account number="A-101" branch="Perryridge" balance=200 > </account >


    +   - To store string data that may contain tags, without the tags being interpreted
    as subelements, use CDATA as below

    +   - <![CDATA[<account> ... </account>]]>

    +   Here, <account> and </account> are treated as just strings. CDATA stands for
    “character data”'
  merge: -1
  img_proc: true
- pgno: 600
  md: '# 10.3 XML Document Schema


    +   - **Database schemas** constrain what information can be stored, and the data
    types of stored values


    +   - XML documents are not required to have an associated schema


    +   - However, **schemas are very important for XML data exchange**

    +     - Otherwise, a site cannot automatically interpret data received from another
    site


    +   - Two mechanisms for specifying XML schema

    +     - **Document Type Definition (DTD)**

    +       - Widely used

    +     - **XML Schema**

    +       - Newer, increasing use'
  merge: -1
  img_proc: true
- pgno: 601
  md: '# # (1) Document Type Definition (DTD)


    +   - The type of an XML document can be specified using a DTD

    +   - DTD constraints structure of XML data

    +     - What elements can occur

    +     - What attributes can/must an element have

    +     - What subelements can/must occur inside each element, and how many times.

    +   - DTD does not constrain data types

    +     - All values represented as strings in XML

    +   - DTD syntax

    +     - `<!ELEMENT element (subelements-specification) >`

    +     - `<!ATTLIST element (attributes) >`'
  merge: -1
  img_proc: true
- pgno: 602
  md: '# Element Specification in DTD


    +   - **Subelements can be specified as**

    +     - names of elements, or

    +     - #PCDATA (parsed character data), i.e., character strings

    +     - EMPTY (no subelements) or ANY (anything can be a subelement)


    +   - **Example**

    +     - `<!ELEMENT depositor (customer_name account_number)>`

    +     - `<!ELEMENT customer_name (#PCDATA)>`

    +     - `<!ELEMENT account_number (#PCDATA)>`


    +   - **Subelement specification may have regular expressions**

    +     - `<!ELEMENT bank (( account | customer | depositor)+)>`

    +     - Notation:

    +       - `|` - alternatives

    +       - `+` - 1 or more occurrences

    +       - `*` - 0 or more occurrences'
  merge: -1
  img_proc: true
