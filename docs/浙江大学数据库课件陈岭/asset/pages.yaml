- pgno: 69
  md: '# # (4) Keys（码、键）


    +   Let K ⊆ R


    +   K is a superkey（超码）of R if values for K are sufficient to identify a unique
    tuple of each possible relation r(R)


    +   Example: { student-id, student-name } and { student-id } are both superkeys
    of student.


    +   K is a candidate key（候选码）if K is minimal superkey. Example: {student-id} is
    a candidate key for student, since it is a superkey, and no subset of it is a
    superkey.


    +   K is a primary key（主码）, if k is a candidate key and been defined by user explicitly.
    Primary key is usually marked by underline.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# # (5) Foreign key(外键，外码)


    Assume there exists relation **r**and **s**: r(**A**, **B**, C), s(**B**, D),
    we can say that attribute B in relation **r** is foreign key referencing **s**,
    and **r** is a referencing relation (参照关系), and **s** is a referenced relation
    (被参照关系).


    e.g. ◆ 学生(学号,姓名,性别,专业号,年龄) - 参照关系 专业(专业号,专业名称) - 被参照关系 (目标关系) 其中属性 专业号称为关系 学生的外码。


    选修(学号, 课程号, 成绩) 课程(课程号,课程名, 学分, 先修课号)


    ◆ Account(**account-number**, branch-name, balance) --- referenced relation depositor
    (customer-name, **account-number**) --- referencing relation


    参照关系中外码的值必须在被参照关系中实际存在或为**null**'
  merge: -1
  img_proc: true
