- pgno: 28
  md: '# Physical Independence vs. Logical Independence


    +   - Ability to modify a scheme definition at one level w.o. affecting a scheme
    definition at a higher level.

    +   - **Physical Data Independence** - The ability to modify the physical schema
    without changing the logical schema.

    +     - Applications depend on the logical schema.

    +     - Applications insulated from how data is structured and stored.

    +     - **One of the most important benefits of using a DBMS!**

    +   - **Logical Data Independence** - Protect application programs from changes
    in logical structure of data.

    +     - Logical data independence **is harder to achieve** as the application
    programs are heavily dependent on the logical structure of data.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# # 1.5 Data Models


    # ## Data model is a collection of conceptual tools for describing:


    +   - data structure

    +   - data relationships

    +   - data semantics

    +   - data constraints


    # ## Different level of data abstraction needs different data model to describe:


    +   - Entity-Relationship model

    +   - Relational model

    +   - Other models:

    +     - object-oriented model

    +     - semi-structured data models (XML)

    +     - older models: network model and hierarchical model ...


    +   - Requirement analysis

    +   - Conceptual design

    +   - Logical design

    +   - ......


