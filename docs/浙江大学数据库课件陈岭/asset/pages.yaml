- pgno: 454
  md: '# Canonical Cover (cont.)


    +   - 正则覆盖Fc是函数依赖集F的最小化。得到Fc的关键步骤是消去现有函数依赖中的extraneous（无关的、多余的）属性，从而排除相应的函数依赖，使函数依赖集最小化。

    +   - 要消去现有函数依赖α→β中的extraneous（无关的、多余的）属性，无非有2种情况：

    +     1. **extraneous属性在左边**（即α中，α=Aα’，Aα’→β）；

    +     2. **extraneous属性在右边**（即β中，β=Aβ’，α→Aβ’）。


    对于情况(1)，Aα’→β：如果α’→β已经由原来的函数依赖集F所蕴涵（即F中已经包含了α’→β，或F可以推出α’→β），则根据Armstrong公理，α’→β可以推出Aα’→β，因此Aα’→β是多余的（replace
    Aα’→β with α’→β），也即A是多余的属性。也就是说，如果F蕴涵F’，则左属性A可删除，只要保留剩余部分就可以了。'
  merge: -1
  img_proc: true
- pgno: 455
  md: '# # Canonical Cover (cont.)


    对于情况（2），\(\alpha \rightarrow \mathbf{A}\beta''\)，等价于{\(\alpha \rightarrow \beta''\)，\(\alpha
    \rightarrow \mathbf{A}\)}，如果\(\alpha \rightarrow \mathbf{A}\)可以由其余的函数依赖所蕴涵，则说明\(\alpha
    \rightarrow \mathbf{A}\)多余，即\(\alpha \rightarrow \mathbf{A}\beta''\)中的**A**多余，只要保留\(\alpha
    \rightarrow \beta''\)就可以了。换句话说，如果我们把F中去掉\(\alpha \rightarrow \mathbf{A}\)之后余下的部分叫F''，即F''
    = (F - {\(\alpha \rightarrow \beta\)}) U {\(\alpha \rightarrow (\beta - \mathbf{A})\)})，则如果F''可以推出\(\alpha
    \rightarrow \mathbf{A}\)，这说明\(\alpha \rightarrow \mathbf{A}\)多余，只要保留F''就可以了。也就是说，如果F''蕴涵F，则右属性**A**可删除。'
  merge: -1
  img_proc: true
- pgno: 456
  md: '# # Canonical Cover(cont.)


    +   - To compute a canonical cover for **F**:

    +     repeat

    +       Use the union rule to replace any dependencies

    +       in **F** like \(\alpha_1 \rightarrow \beta_1\) and \(\alpha_1 \rightarrow
    \beta_2\) with \(\alpha_1 \rightarrow \beta_1 \beta_2\)

    +       Find a functional dependency \(\alpha \rightarrow \beta\) with an

    +       extraneous attribute either in \(\alpha\) or in \(\beta\)

    +       If an extraneous attribute is found, delete it

    +       from \(\alpha \rightarrow \beta\)

    +     until **F** does not change

    +   - Note: Union rule may become applicable after

    +     some extraneous attributes have been deleted, so

    +     it has to be re-applied


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_456_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_456_1.png)'
