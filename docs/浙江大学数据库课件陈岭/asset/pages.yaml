- pgno: 20
  md: '# # Database system versus File Processing Systems (Cont.)


    # ## Drawbacks of using file systems (cont.)


    +   - **Difficulty** in accessing data

    +     - Need to write a new program to carry out each new task.


    +   - **Data isolation** - multiple files and multiple formats. (Difficult to
    retrieve, difficult to share)


    +   - **Integrity** problems

    +     - Integrity constraints (e.g. account balance > 0) become part of program
    code

    +     - Hard to add new constraints or change existing ones'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Drawbacks of using file systems (cont.)


    +   - **No atomicity of updates (consistent)**

    +     - Failures may leave database in an inconsistent state with partial updates
    carried out.

    +     - E.g. transfer of funds from one account to another should either complete
    or not happen at all – atomicity.

    +   - **Difficult to concurrent access by multiple users**

    +     - Concurrent accessed needed for performance

    +     - Uncontrolled concurrent accesses can lead to inconsistencies

    +       - E.g. two people reading a balance and updating it at the same time

    +   - **Security problems (Right person use right data)**


    Database systems offer solutions to all the above problems!'
  merge: -1
  img_proc: true
