    extra attribute in the relation corresponding to the “many” side could result
    in **null values**。


    如：cust-banker(customer-id, employee-id, type); 但有的customer没有banker, 则合并之后得：

    Customer(customer-id, cust-name, cust-street, cust-city, banker-id, type), 导致Customer中有些元组的banker-id,
    type为null)。


    +   - For *one-to-one relationship sets*, either side can be chosen to act as
    the “many” side


    +   - That is, extra attribute can be added to either of the tables corresponding
    to the two entity sets'
