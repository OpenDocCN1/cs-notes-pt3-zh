- pgno: 452
  md: '# # Extraneous Attributes (无关属性)


    (形式化表示)


    # ## Consider the functional dependency \(\alpha \rightarrow \beta\) in \(F\).


    +   - Attribute A is **extraneous** in \(\alpha\), if \(A \in \alpha\) and \(F\)
    logically implies \(F'' = (F - \{\alpha \rightarrow \beta\}) \cup \{(\alpha -
    A) \rightarrow \beta\}\).


    +   - E.g. \(\alpha = \{A\alpha''\}, \{A\alpha''\} \rightarrow \beta\). 若 \(F\)
    蕴涵 \(\alpha'' \rightarrow \beta\), 则 \(\{A\alpha''\} \rightarrow \beta\) 多余，即
    A 多余。


    +   - Example: Given \(F = \{A \rightarrow C, AB \rightarrow C\}\)


    +   - Because \(F = \{A \rightarrow C, AB \rightarrow C\}\) logically implies
    \(A \rightarrow C\), .: \(B\) is extraneous in \(AB \rightarrow C\),


    +   - \(F'' = \{A \rightarrow C, A \rightarrow C\} = \{A \rightarrow C\}\)


    +   - Attribute A is **extraneous** in \(\beta\), if \(A \in \beta\) and the set
    of functional dependencies \(F'' = (F - \{\alpha \rightarrow \beta\}) \cup \{\alpha
    \rightarrow (\beta - A)\}\) logically implies \(F\).


    +   - E.g. \(\beta = A\beta''\), \(\alpha \rightarrow \{A\beta''\}\), 有 \(\{\alpha
    \rightarrow A, \alpha \rightarrow \beta''\}\). 若 \(F''\) 蕴涵 \(\alpha \rightarrow
    A\), 则 \(\alpha \rightarrow A\) 多余， (即可用 \(F''\) 代替 \(F\))。


    +   - Example: Given \(F = \{A \rightarrow C, AB \rightarrow CD\}\)


    +   - Since \(AB \rightarrow CD \Rightarrow \{AB \rightarrow C, AB \rightarrow
    D\}\). and \(AB \rightarrow C\) can be inferred from \(F'' = \{A \rightarrow C,
    AB \rightarrow D\}\), .: \(C\) is extraneous in \(AB \rightarrow CD\)'
  merge: -1
  img_proc: true
- pgno: 453
  md: '# # Testing if an Attribute is Extraneous


    (实际算法)


    # ## To test if attribute \( A \in \alpha \) is extraneous in \( \alpha \)


    +   1. compute \( (\alpha - A)^+ \) using the dependencies in \( F \)


    +   2. check that \( (\alpha - A)^+ \) contains \( \beta \);


    if it does, \( A \) is extraneous


    # ## To test if attribute \( A \in \beta \) is extraneous in \( \beta \)


    +   1. compute \( \alpha^+ \) using only the dependencies in \( F'' \)


    \( F'' = (F - \{ \alpha \to \beta \}) \cup \{ \alpha \to (\beta - A) \} \)


    +   2. check that \( \alpha^+ \) contains \( A \); if it does, \( A \) is extraneous


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_453_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_453_1.png)


