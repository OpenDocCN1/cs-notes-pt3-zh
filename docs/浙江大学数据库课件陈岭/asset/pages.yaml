- pgno: 626
  md: '# ## (2) XQuery


    +   - XQuery is a general purpose query language for XML data

    +   - Currently being standardized by the World Wide Web Consortium (W3C)


    +   - The textbook description is based on a January 2005 draft of the standard.
    The final version may differ, but major features likely to stay unchanged.


    +   - XQuery is derived from the Quilt query language, which itself borrows from
    SQL, XQL and XML-QL


    +   - XQuery uses a for ... let ... where ... order by ...result ... syntax


    for ⇔ SQL from

    where ⇔ SQL where

    order by ⇔ SQL order by

    result ⇔ SQL select

    let allows temporary variables, and has no equivalent in SQL'
  merge: -1
  img_proc: true
- pgno: 627
  md: '# # FLWOR Syntax in XQuery


    +   - For clause uses XPath expressions, and variable in for clause ranges over
    values in the set returned by XPath


    +   - Simple FLWOR expression in XQuery


    +   - find all accounts with balance > 400, with each result enclosed in an `<account_number>
    .. </account_number>` tag


    ```

    ```

    for $x in /bank-2/account

    let $acctno := $x/@account_number

    where $x/balance > 400

    return <account_number> { $acctno }

    </account_number>

    ```

    ```


    +   - Items in the return clause are XML text unless enclosed in {}, in which
    case they are evaluated


    +   - Let clause not really needed in this query, and selection can be done In
    XPath. Query can be written as:


    ```

    ```

    for $x in /bank-2/account[balance>400]

    return <account_number> { $x/@account_number }

    </account_number>

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 628
  md: "# # Joins\n\n+   - Joins are specified in a manner very similar to SQL\n+ \
    \    for $a in /bank/account,\n+       $c in /bank/customer,\n+       $d in /bank/depositor\n\
    +   \n+     where  $a/account_number = $d/account_number\n+       and $c/customer_name\
    \ = $d/customer_name\n+     return <cust_acct> { $c $a } </cust_acct>\n\n+   -\
    \ The same query can be expressed with the selections specified as XPath selections:\n\
    +     for $a in /bank/account\n+       $c in /bank/customer\n+       $d in /bank/depositor[\n\
    +         account_number = $a/account_number and\n+         customer_name = $c/customer_name]\n\
    +     return <cust_acct> { $c $a } </cust_acct>"
  merge: -1
  img_proc: true
- pgno: 629
  md: '# # Nested Queries


    +   - The following query converts data from the flat structure for bank information
    into the nested structure used in bank-1

    +   <bank-1> {

    +   for $c in /bank/customer

    +   return

    +   <customer>

    +   { $c/* }

    +   { for $d in /bank/depositor[customer_name = $c/customer_name],

    +   $a in

    +   /bank/account[account_number=$d/account_number]

    +   return $a }

    +   </customer>

    +   } </bank-1>


    +   - $c/* denotes all the children of the node to which $c is bound, without
    the enclosing top-level tag


    +   - $c/text() gives text content of an element without any subelements / tags'
  merge: -1
  img_proc: true
- pgno: 630
  md: "# # Sorting in XQuery\n\n+   - The order by clause can be used at the end of\
    \ any expression. E.g. to return customers sorted by name\n+     for $c in /bank/customer\n\
    +     order by $c/customer_name\n+     return <customer> { $c/* } </customer>\n\
    \n+   - Use order by $c/customer_name to sort in descending order\n\n+   - Can\
    \ sort at multiple levels of nesting (sort by customer_name, and by account_number\
    \ within each customer)\n\n```\n```xml\n<bank-1> {\n  for $c in /bank/customer\n\
    \  order by $c/customer_name\n  return\n    <customer>\n      { $c/* }\n     \
    \ { for $d in /bank/depositor[customer_name=$c/customer_name],\n        $a in\
    \ /bank/account[account_number=$d/account_number] }\n        order by $a/account_number\n\
    \        return <account> $a/* </account>\n    </customer>\n} </bank-1>\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 631
  md: "# # Functions and Other XQuery Features\n\n+   - User defined functions with\
    \ the type system of XMLSchema  \n+     function balances(xs:string $c) returns\
    \ list(xs:decimal*) {  \n+       for $d in /bank/depositor[customer_name = $c],\
    \  \n+       $a in /bank/account[account_number = $d/account_number]  \n+    \
    \   return $a/balance  \n+     }\n\n+   - Types are optional for function parameters\
    \ and return values\n\n+   - The * (as in decimal*) indicates a sequence of values\
    \ of that type\n\n+   - Universal and existential quantification in where clause\
    \ predicates\n\n+   - some $e in _path_ satisfies _P_\n\n+   - every $e in _path_\
    \ satisfies _P_\n\n+   - XQuery also supports If-then-else clauses\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_631_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_631_1.png)"
  merge: -1
  img_proc: true
- pgno: 632
  md: '# (3) XSLT


    +   - A **stylesheet** (样式表) stores formatting options for a document, usually
    separately from document

    +     - E.g. an HTML style sheet may specify font colors and sizes for headings,
    etc.


    +   - The **XML Stylesheet Language (XSL)** was originally designed for generating
    HTML from XML


    +   - XSLT is a general-purpose transformation language

    +     - Can translate XML to XML, and XML to HTML


    +   - XSLT transformations are expressed using rules called **templates**

    +     - Templates combine selection using XPath with construction of results'
  merge: -1
  img_proc: true
- pgno: 633
  md: 'XSL is a family of recommendations for defining XML document **transformation**
    and **presentation**. It consists of three parts:


    +   - XSL Transformations (**XSLT**): a language for transforming XML

    +   - the XML Path Language (**XPath**): an expression language used by XSLT to
    access or refer to parts of an XML document. (XPath is also used by the XML Linking
    specification)

    +   - XSL Formatting Objects (**XSL-FO**): an XML vocabulary for specifying formatting
    semantics'
  merge: -1
  img_proc: true
- pgno: 634
  md: "# (3) XSLT Templates\n\n+   - **Example of XSLT template with** `match` **and**\
    \ `select` **part**\n+   \n+     ```xml\n+     <xsl:template match=\"/bank-2/customer\"\
    >\n+         <xsl:value-of select=\"customer_name\"/>\n+     </xsl:template>\n\
    +     <xsl:template match=\"*\"/>\n+     ```\n\n+   - The `match` attribute of\
    \ `xsl:template` specifies a pattern in XPath\n\n+   - Elements in the XML document\
    \ matching the pattern are processed by the actions within the `xsl:template`\
    \ element\n+     - `xsl:value-of` selects (outputs) specified values (here, `customer_name`)\n\
    \n+   - For elements that do not match any template\n+     - Attributes and text\
    \ contents are output as is\n+     - Templates are recursively applied on subelements\n\
    \n+   - The `<xsl:template match=\"*\"/>` template matches all elements that do\
    \ not match any other template\n+     - Used to ensure that their contents do\
    \ not get output.\n\n+   - If an element matches several templates, only one is\
    \ used based on complex priority scheme/user-defined priorities\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_634_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_634_1.png)"
  merge: -1
  img_proc: true
- pgno: 635
  md: "# Creating XML Output\n\n+   - Any text or tag in the XSL stylesheet that is\
    \ not in the xsl namespace is output as is\n+   - E.g. to wrap results in new\
    \ XML elements.\n\n```\n```xml\n<xsl:template match=\"/bank-2/customer\">\n  \
    \  <customer>\n        <xsl:value-of select=\"customer_name\"/>\n    </customer>\n\
    </xsl:template>\n<xsl:template match=\"*\"/>\n```\n```\n\n+   - **Example output:**\n\
    +     ```xml\n+     <customer> Joe   </customer>\n+     <customer> Mary  </customer>\n\
    +     ```"
  merge: -1
  img_proc: true
- pgno: 636
  md: '# # Creating XML Output (Cont.)


    +   - Note: Cannot directly insert a xsl:value-of tag inside another tag

    +     - E.g. cannot create an attribute for <customer> in the previous example
    by directly using xsl:value-of

    +     - XSLT provides a construct xsl:attribute to handle this situation

    +       - xsl:attribute adds attribute to the preceding element

    +       - E.g. <customer>

    +         <xsl:attribute name="customer_id">

    +         <xsl:value-of select = "customer_id"/>

    +         </xsl:attribute>

    +         </customer>

    +       results in output of the form

    +       <customer customer_id="..."> ...


    +   - xsl:element is used to create output elements with computed names'
  merge: -1
  img_proc: true
- pgno: 637
  md: "# # Structural Recursion\n\n+   - Template action can apply templates recursively\
    \ to the contents of a matched element\n\n```\n```xml\n<xsl:template match=\"\
    /bank\">\n  <customers>\n    <xsl:template apply-templates/>\n  </customers>\n\
    </xsl:template>\n<xsl:template match=\"/customer\">\n  <customer>\n    <xsl:value-of\
    \ select=\"customer_name\"/>\n  </customer>\n</xsl:template>\n<xsl:template match=\"\
    *\"/>\n```\n```\n\n+   - **Example output:**\n\n```\n```xml\n<customers>\n  <customer>\
    \ John </customer>\n  <customer> Mary </customer>\n</customers>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 638
  md: '# # Joins in XSLT


    +   - XSLT keys allow elements to be looked up (indexed) by values of subelements
    or attributes


    +   - Keys must be declared (with a name) and, the key() function can then be
    used for lookup. E.g.


    <xsl:key name="acctno" match="account"

    use="account_number"/>


    <xsl:value-of select=key("acctno", "A-101")>


    +   - Keys permit (some) joins to be expressed in XSLT


    <xsl:key name="acctno" match="account" use="account_number"/>

    <xsl:key name="custno" match="customer" use="customer_name"/>

    <xsl:template match="depositor">

    <cust_acct>

    <xsl:value-of select=key("custno", "customer_name")/>

    <xsl:value-of select=key("acctno", "account_number")/>

    </cust_acct>

    </xsl:template>

    <xsl:template match="*"/>'
  merge: -1
