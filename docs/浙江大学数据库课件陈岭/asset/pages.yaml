  md: "# # (4) Canonical Cover (cont.)\n\n+   2) Parts of a functional dependency\
    \ on left side may be redundant - extraneous attributes\n+   \n+   ❖ E.g. F={A\
    \ → B, B → C, AC → D} can be inferred to {A → B, B→C, AC→D, A→D}, ⇒ {A→B, B→C,\
    \ A→D}\n+   \n+   ∴ F is simplified to F’= {A →B, B →C, A→D}, i.e. Attribute C\
