  md: '# (3) Drop and Alter Table (cont.)


    +   - The alter table command is used to add attributes to an existing relation.


    ```

    ALTER TABLE r ADD A D;

    ALTER TABLE r ADD (A₁ D₁, ..., Aₙ Dₙ);

    ```


    where A is the name of the attribute to be added to relation r and D is the domain
    of A.


    +   - E.g. `alter table loan add loan_date date;`


    +     - All tuples in the relation are assigned null as the value for the new
    attribute.'
