  md: '# ### (7) Duplicates


    +   - In traditional relational theory, no duplicates, but we need duplicates
    in practice.

    +   - *Multiset*（多重集）versions of some of the relational algebra operators: $\sigma_{\theta}$,
    $\Pi_A$, $\times$, which support the multiset.'
  merge: -1
