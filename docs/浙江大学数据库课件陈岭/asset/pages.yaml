- pgno: 390
  md: '# # 6.7 Design of an E-R database schema (1) the steps of database design


    # ## a) Requirement analysis


    +   - What data, applications, and operations needed


    # ## b) Conceptual database design:


    +   - A high-level description of data, constraints using E - R model or a similar
    high level data model


    # ## c) Logical database design: (6.9)


    +   - Convert the conceptual design into DB schema --- tables


    +   - **Schema refinement: Normalization of relations**: Check relational schema
    for redundancies and related anomalies.


    # ## d) Physical database design:


    +   - Indexing, clustering and database tuning'
  merge: -1
