- pgno: 547
  md: "# # Anonymous Block Structure:\n\nDECLARE  \t(optional)  \n/* Here you declare\
    \ the variables you will use in this block */\n\nBEGIN  \t(mandatory)  \n/* Here\
    \ you define the executable statements (what the block DOES!)*/\n\nEXCEPTION \
    \ \t(optional)  \n/* Here you define the actions that take place if an exception\
    \ is thrown during the run of this block */\n\nEND;  \t(mandatory)\n\n> Always\
    \ put a new line with only a / at the end of a block! (This tells Oracle to run\
    \ the block)\n\n> A correct completion of a block will generate the following\
    \ message:  \n> PL/SQL procedure successfully completed"
