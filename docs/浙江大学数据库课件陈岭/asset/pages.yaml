- pgno: 275
  md: "# Trigger Example in SQL:1999\n\n```\ncreate trigger **overdraft-trigger**\
    \ **after** update on **account**\n    referencing **new row** as **nrow**\n \
    \   for each row\n    when **nrow**.balance < 0\n        begin **atomic**\n  \
    \          insert into **borrower**\n                (select **customer-name**,\
    \ **account-number**\n                 from **depositor**\n                 where\
    \ **nrow**.account-number =\n                       **depositor**.account-number);\n\
    \            insert into **loan** values\n                (**nrow**.account-number,\
    \ **nrow**.branch-name,\n                 − **nrow**.balance);\n            update\
    \ **account** set **balance** = 0\n                where **account**.account-number\
    \ =\n                      **nrow**.account-number;\n        end;\n```\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_275_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_275_1.png)"
  merge: -1
