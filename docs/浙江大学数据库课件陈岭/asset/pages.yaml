- pgno: 173
  md: '# # 3.3 Set Operations


    +   - In SQL, use the set operations: **union**, **intersect**, and **except**
    operate on relations and correspond to the relational algebra operations \( \cup,
    \cap, - \).


    +   - Each of the operations: **union**, **intersect**, and **except** automatically
    **eliminates duplicates**.


    +   - To retain all **duplicates** use the corresponding multiset versions: **union
    all**, **intersect all** and **except all**.'
