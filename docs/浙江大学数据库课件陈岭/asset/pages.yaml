- pgno: 30
  md: '# # Steps of Database Design


    # ## 1) Requirement analysis


    +   - What data, applications, and operations needed


    # ## 2) Conceptual database design


    +   - A high-level description of data, constraints using E - R model or a similar
    high level data model


    # ## 3) Logical database design:


    +   - Convert the conceptual design into a DB schema


    # ## 4) Schema refinement


    +   - Normalization of relations: Check relational schema for redundancies and
    related anomalies.


    # ## 5) Physical database design :


    +   - Indexing, clustering and database tuning


    # ## 6) Create and initialize the database & Security design


    +   - Load initial data, testing


    +   - Identify different user groups and their roles'
  merge: -1
  img_proc: true
