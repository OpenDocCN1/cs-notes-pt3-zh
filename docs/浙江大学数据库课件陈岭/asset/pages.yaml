    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_267_2.png)'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Referential Integrity in SQL (Cont.)


    +   - **Alternative to cascading:**

    +     - on delete set null

    +     - on delete set default


    +   - **Null values in foreign key attributes complicate SQL referential integrity
    semantics, and are best prevented using not null.**

    +     - if any attribute of a foreign key is null, the tuple is defined to satisfy
    the foreign key constraint!'
