- pgno: 469
  md: '# BCNF and Dependency Preservation


    It is not always possible to get a BCNF decomposition that is dependency preserving.


    # Example:


    $R=(J,K,L)$ — J学生、K课程、L教师


    $F=\{JK\to L,\ L\to K\}$


    +   - Two candidate keys = $JK$ and $JL$

    +   - $R$ is not in BCNF. (∵ for $L\to K$, $L$ is not a key)

    +   - Any decomposition of $R$ will fail to preserve $JK\to L$

    +     - E.g. $R1=(L,K), R2=(J,L)$, ⊆ BCNF, but not dependency preserving


    J---student, K---course,

    L---teacher（一门课有多个教师，一个教师上一门课，一个学生选多门课，一门课有多个学生选）


    # Therefore, we cannot always satisfy all three design goals:


    +   - Lossless join

    +   - BCNF

    +   - Dependency preservation'
  merge: -1
  img_proc: true
- pgno: 470
  md: '# # 7.6 Third Normal Form: Motivation


    +   - There are some situations where

    +     - Decompose into BCNF is not dependency preserving,

    +     - But efficient checking for FD violation on updates is important.


    +   - Solution: define a weaker normal form, called Third Normal Form.

    +     - Allows some redundancy (with resultant problems).

    +     - But FDs can be checked on individual relations without computing a join
    - dependency preserving.

    +     - There is always a lossless-join, dependency preserving decomposition into
    3NF.'
  merge: -1
  img_proc: true
- pgno: 471
  md: "# # Third Normal Form\n\n■ **Definition:** A relation schema *R* is in third\
    \ normal form (3NF) if for all α → β in F⁺ at least one of the following holds:\n\
    \n+   1. α → β is **trivial** (i.e., β ⊆ α)\n+   2. α is a **superkey** for *R*\n\
    +   3. Each attribute *A* in β − α is contained in a **candidate key** for *R*.\n\
    +   \n+   *NOTE: each attribute may be in a different candidate key*\n\n■ If a\
    \ relation is in BCNF, it is in 3NF (since in BCNF one of the first two conditions\
    \ above must hold).\n\n■ Third condition is a minimal relaxation of BCNF to ensure\
    \ dependency preservation.\n\n> 讨论：国内其他教材关于3NF的定义：不存在非主属性对码的部分依赖和传递依赖。\n> 。该定义实际是说，当β为非主属性时，α必须是码；但当β为主属性时，则α无限制。\n\
    > 。二种定义本质上是一致的。"
  merge: -1
  img_proc: true
