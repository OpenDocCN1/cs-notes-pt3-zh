- pgno: 171
  md: "# # (7) Duplicates [Cont.]\n\n+   - **Example**: Suppose multiset relations\
    \ \\( r_1 (A, B) \\) and \\( r_2 (C) \\) are as follows:\n+   \n+     \\( r_1\
    \ = \\{ (1, a), (2, a) \\} \\)\n+   \n+     \\( r_2 = \\{ (2), (3), (3) \\} \\\
    )\n\n+   - Then \\( \\Pi_B(r_1) = \\{ (a), (a) \\} \\), while \\( \\Pi_B(r_1)\
    \ \\times r_2 \\) would be:\n+   \n+     \\( \\{ (a,2), (a,2), (a,3), (a,3), (a,3),\
    \ (a,3) \\} \\)"
  merge: -1
  img_proc: true
- pgno: 172
  md: '# # (7) Duplicates [Cont.]


    +   - Select statement in SQL also supports the multiset operators: \(\sigma_\theta\)
    , \(\pi_A\) , \(\chi\) .


    +   - SQL duplicate semantics:


    SELECT \(A_1, A_2, \dots, A_n\) FROM \(r_1, r_2, \dots, r_m\) WHERE \(P\);


    is equivalent to the multiset version of the expression:


    \(\pi_{A1, A2, \dots, An}(\sigma_P(r_1 \times r_2 \times \dots \times r_m))\)


    ✓ To forbid duplicate - add distinct'
  merge: -1
