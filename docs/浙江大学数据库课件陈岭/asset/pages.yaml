- pgno: 433
  md: '# Functional Dependencies (Cont.)


    # (Functional dependency vs. key)


    +   - A functional dependency is a **generalization of the notion of a key**.

    +   - $K$ is a **superkey** for relation schema $R$ if and only if $K \to R$

    +   - $K$ is a **candidate key** for $R$ if and only if

    +     - $K \to R$, and

    +     - no $\alpha \subset K$, $\alpha \to R$ （不存在K的真子集α，使之满足α → R）'
  merge: -1
  img_proc: true
- pgno: 434
  md: "# Functional Dependencies (Cont.)\n\n(Functional dependency vs. key)\n\n+ \
    \  - Functional dependencies allow us to express constraints that cannot be expressed\
    \ using **keys**. Consider the schema:\n\n**Loan-info-schema** =  \n**(customer-name,\
    \ loan-number, branch-name, amount)**\n\nWe expect this set of functional dependencies\
    \ to hold:\n\n函数依赖集  **F** = {  \n&nbsp;&nbsp;&nbsp;&nbsp;**loan-number → amount**\
    \  \n&nbsp;&nbsp;&nbsp;&nbsp;**loan-number → branch-name**  \n&nbsp;&nbsp;&nbsp;&nbsp;**(customer-name,\
    \ loan-number) → amount**  \n&nbsp;&nbsp;&nbsp;&nbsp;**(customer-name, loan-number)\
    \ → branch-name**  \n}\n\nbut would **NOT** expect the following to hold:\n\n\
    **loan-number → customer-name**"
