- pgno: 502
  md: "# # Universal Relation Approach\n\n+   - **Dangling (无归属) tuples** – Tuples\
    \ that “disappear” in computing a join.\n+     - Let \\( r_1 (R_1), r_2 (R_2),\
    \ \\dots, r_n (R_n) \\) be a set of relations\n+     - A tuple r of the relation\
    \ \\( r_i \\) is a dangling tuple if r is not in the relation:\n+       \n+  \
    \     $$\\Pi_{Ri} (r_1 \\bowtie r_2 \\bowtie \\dots \\bowtie r_n)$$\n\n+   - The\
    \ relation \\( r_1 \\bowtie r_2 \\bowtie \\dots \\bowtie r_n \\) is called a **universal\
    \ relation** since it involves all the attributes in the “universe” defined by\
    \ \\( R_1 \\cup R_2 \\cup \\dots \\cup R_n \\)\n\n+   - If dangling tuples are\
    \ allowed in the database, instead of decomposing a universal relation, we may\
    \ prefer to synthesize a collection of normal form schemas from a given set of\
    \ attributes."
  merge: -1
  img_proc: true
- pgno: 503
  md: '# Universal Relation Approach


    +   - Dangling tuples may occur in practical database applications.

    +   - They represent incomplete information

    +   - E.g. may want to break up information about loans into:

    +     - (branch-name, loan-number)

    +     - (loan-number, amount)

    +     - (loan-number, customer-name)

    +   - These relations would require null values, and have dangling tuples.'
  merge: -1
  img_proc: true
- pgno: 504
  md: '# # Universal Relation Approach (Contd.)


    A particular decomposition defines a **restricted form of incomplete information**
    that is **acceptable** in our database.


    +   - Above decomposition requires **at least** one of customer-name, branch-name
    or amount in order to enter a loan number without using null values


    +   - Rules out storing of customer-name, branch-name, amount without an appropriate
    loan-number (since it is a key, it can’t be null either!)


    Universal relation requires unique attribute names **unique role assumption**


    +   - e.g. _customer-name, branch-name_


    Reuse of attribute names is natural in SQL since relation names can be prefixed
    to disambiguate names.


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_504_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_504_1.png)


    Database System Concepts


    7.85'
  merge: -1
  img_proc: true
- pgno: 505
  md: '# Denormalization for Performance


    +   - Sometimes we may want to use non-normalized schema for performance.


    ( customer-name, account-number, balance )


    +   - E.g. displaying *customer-name* along with *account-number* and *balance*
    requires **join** of *account* with *depositor*


    +   - **Alternative 1:** Use **denormalized** relation containing attributes of
    *account* as well as *depositor* with all above attributes


    +     - faster lookup

    +     - Extra space and extra execution time for updates

    +     - extra coding work for programmer and possibility of error in extra code
    (e.g. updates)


    +   - **Alternative 2:** use a **materialized view** defined as


    account ⋈ depositor


    +     - Benefits and drawbacks same as above, except no extra coding work for
    programmer and avoids possible errors'
  merge: -1
  img_proc: true
