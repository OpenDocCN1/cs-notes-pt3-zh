- pgno: 428
  md: '# # Decomposition(分解)


    Main refinement technique: decomposition

    E.g. replacing (ABCD) with, (AB) and (BCD), or (ACD) and

    (ABD), or (ABC) and (CD), or (AB), (BC) and (CD) or (AD), (BCD)


    E.g.: Decompose the Lending-schema into:

    Branch-schema = (branch-name, branch-city, assets)

    Loan-info-schema = (branch-name, customer-name,

    loan-number, amount)


    All attributes of an original schema (R) must appear in the

    decomposition (R1, R2): R = R1 ∪ R2


    Lossless-join decomposition (无损连接分解).

    For all possible relations r on schema R


    r = ΠR1 (r) ⋈ ΠR2 (r)


    Requirement

    for decomp.'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# # Example of Non Lossless-Join Decomposition


    # ## Decomposition of R = (A, B)


    R₁ = (A), R₂ = (B)


    E.g.:


    r = | A | B |

    |---|---|

    | α | 1 |

    | α | 2 |

    | β | 1 |


    Πₐ(r) = | A |

    |---|

    | α |

    | β |


    Πᵦ(r) = | B |

    |---|

    | 1 |

    | 2 |


    Πₐ (r) ⋈ Πᵦ (r) = | A | B |

    |---|---|

    | α | 1 |

    | α | 2 |

    | β | 1 |

    | β | 2 | ≠ r


    # ## A bad decomposition !


    > It''s not lossless-join decomposition. It''s illegal !'
  merge: -1
