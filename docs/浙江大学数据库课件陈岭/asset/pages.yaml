  md: "# (3) Closure of Attribute Sets (cont)\n\n+   ▪ **Algorithm to compute** α⁺,\
    \ **the closure of** α **under** F\n\n```\nresult := α;\nwhile (changes to result)\
    \ do\n    for each β → γ in F do\n    begin\n        if β ⊆ result then result\
    \ := result ∪ γ\n    end;\nα⁺ := result\n```\n\n避免了找 F⁺（反复使用公理）的麻烦"
