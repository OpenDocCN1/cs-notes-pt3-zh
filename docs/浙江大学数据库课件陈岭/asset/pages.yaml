- pgno: 285
  md: '# # 4.3 Authorization (授权) --- chapter 8 (8.7)


    Security - protection from malicious attempts to **steal** or **modify data**.


    # ## Database system level


    +   - **Authentication (验证)** and **authorization (授权)** mechanisms allow specific
    users access only to **required data**


    +   - We concentrate on authorization in the rest of this chapter


    # ## Operating system level


    +   - Operating system super-users can do anything they want to the database!
    Good operating system level security is required.


    # ## Network level: must use encryption to prevent


    +   - **Eavesdropping** (unauthorized reading of messages)


    +   - **Masquerading** (pretending to be an authorized user or sending messages
    supposedly from authorized users)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_285_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_285_1.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_285_2.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_285_3.png)'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# # Authorization (Cont.)


    # ## Physical level


    +   - Physical access to computers allows destruction of data by intruders; traditional
    lock-and-key security is needed


    +   - Computers must also be protected from floods, fire, etc.


    +   - More in Chapter 17 (Recovery)


    # ## Human level


    +   - Users must be screened to ensure that an authorized users do not give access
    to intruders


    +   - Users should be trained on password selection and secrecy


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_286_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_286_1.png)


    Database System Concepts


    4.40'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# (1) Authorization


    Forms of authorization on parts of the database:


    +   - **Read authorization** - allows reading, but not modification of data.

    +   - **Insert authorization** - allows insertion of new data, but not modification
    of existing data.

    +   - **Update authorization** - allows modification, but not deletion of data.

    +   - **Delete authorization** - allows deletion of data'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# # Authorization (Cont.)


    Forms of authorization to modify the database schema:


    +   - Index authorization - allows creation and deletion of indices.


    +   - Resources authorization - allows creation of new relations.


    +   - Alteration authorization - allows addition or modifying of attributes in
    a relation.


    +   - Drop authorization - allows deletion of relations.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# (2) Authorization and Views


    +   - Users can be given **authorization on views**, without being given any authorization
    on the relations used in the view definition

    +   - Ability of **views** to **hide data** serves both to **simplify usage**
    of the system and to **enhance security** by allowing users access only to data
    they need for their job

    +   - A **combination of relational-level security and view-level security** can
    be used to limit a user’s access to precisely the data that user needs.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# # View Example


    Suppose a bank clerk needs to know the names of the customers of each branch,
    but is not authorized to see specific loan information.


    +   - Approach: Deny direct access to the *loan* relation, but grant access to
    the view *cust-loan*, which consists only of the names of customers and the branches
    at which they have a loan.


    +   - The *cust-loan* view is defined in SQL as follows:


    ```

    ```sql

    create view cust-loan as

    select branchname, customer-name

    from borrower, loan

    where borrower.loan-number = loan.loan-number;

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 291
  md: "# View Example (Cont.)\n\n+   - The clerk is authorized to see the result of\
    \ the query:\n+   \n+     ```sql\n+     select *\n+     from cust-loan\n+    \
    \ ```\n\n+   - When the query processor translates the result into a query on\
    \ the actual relations in the database, we obtain a query on *borrower* and *loan*.\n\
    \n+   - Authorization must be checked on the clerk’s query before query processing\
    \ replaces a view by the definition of the view."
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Authorization on Views


    +   - Creation of view does NOT require resources authorization since no real
    relation is being created.

    +   - The **creator of a view** gets only those privileges that provide no additional
    authorization beyond that he already had.

    +     - E.g. if creator of view *cust-loan* had only read authorization on *borrower*
    and *loan*, he gets only read authorization on *cust-loan*.


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_292_0.png)'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# ### (3) Granting of Privileges


    +   - The passage of authorization from one user to another may be represented
    by an **authorization graph**.

    +   - The nodes of this graph are the users.

    +   - The root of the graph is the database administrator.

    +   - Consider graph for update authorization on loan.

    +   - An edge \(U_i \rightarrow U_j\) indicates that user \(U_i\) has granted
    *update* authorization on *loan* to \(U_j\).


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_293_0.png)'
  merge: -1
  img_proc: true
- pgno: 294
  md: <!-- no content -->
