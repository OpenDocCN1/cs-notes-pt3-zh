- pgno: 462
  md: '# # Testing for Dependency Preservation


    To check if a dependency \(\alpha \rightarrow \beta\) is preserved in a decomposition
    of R into R₁, R₂, ..., Rₙ , we apply the following **simplified test**:


    +   - result = α

    +     while (changes to result) do

    +     for each Rᵢ in the decomposition

    +     t = (result ∩ Rᵢ)⁺ ∩ Rᵢ;

    +     result = result ∪ t

    +   - If result contains all attributes in β,

    +     then the functional dependency \(\alpha \rightarrow \beta\) is preserved.


    Apply the test on all dependencies in F to check if a decomposition is dependency
    preserving


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_462_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_462_1.png)


    | 内容 | 说明 |

    |------|------|

    | 对于F中的某个α→β，投影到各个Rᵢ中，判别是否有某个Rᵢ能保持函数依赖α→β。 | 右侧红色方框内容 |

    | 若对F中的每个α→β都能有一个Rᵢ满足函数依赖，则该分解保持依赖。 | 右侧红色方框内容 |


    ```

    ∴ 必然有(F₁ ∪ F₂ ∪ ... ∪ Fₙ)⁺ = F⁺

    Fᵢ = ( α→β )

    ```'
  merge: -1
  img_proc: true
- pgno: 463
  md: '# # 7.5 Boyce-Codd Normal Form


    # ## (1) Definition


    A relation schema \( R \) is in BCNF, with respect to a set \( F \) of functional
    dependencies, if **for all functional dependencies** in \( F^+ \) of the form
    \( \alpha \rightarrow \beta \), where \( \alpha \subseteq R \) and \( \beta \subseteq
    R \), **at least one of the following holds**:


    +   - \( \alpha \rightarrow \beta \) is trivial (i.e., \( \beta \subseteq \alpha
    \) )

    +   - \( \alpha \) is a superkey for \( R \) (i.e., \( R \subseteq \alpha^+ \)
    , \( \alpha \rightarrow R \))


    > > For **all** \( \alpha \rightarrow \beta \) in \( F^+ \), where \( \alpha \subseteq
    R \) and \( \beta \subseteq R \)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_463_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_463_1.png)'
  merge: -1
  img_proc: true
- pgno: 464
  md: '# Example


    R = (A, B, C)

    F = { A → B, B → C }

    Key = {A}


    Any relation schema with two attributes is in BCNF.


    R is **not in BCNF** (∵ F⁺ = {A → B, B → C, A → C, …}, for B → C, **B is not a
    key**)


    Decomposition R₁ = (A, B), R₂ = (B, C)


    +   - **R₁ and R₂ in BCNF.** (A is the key for R₁, B is the key for R₂)

    +   - **Lossless-join decomposition.** (R₁ ∩ R₂ = B, and B is the key for R₂)

    +   - **Dependency preserving.** (F₁ = {A → B} holds on R₁, F₂ = {B → C} holds
    on R₂)'
  merge: -1
  img_proc: true
- pgno: 465
  md: "# # Testing for BCNF\n\n+   - To check if a non-trivial dependency \\(\\alpha\
    \ \\rightarrow \\beta\\) causes a violation of BCNF\n+   \n+   1. compute \\(\\\
    alpha^+\\) (the attribute closure of \\(\\alpha\\)), and  \n+   2. verify that\
    \ if \\(\\alpha^+\\) includes all attributes of \\(R\\), that is, \\(\\alpha\\\
    ) is a superkey of \\(R\\).\n\n+   - Simplified test: To check if a relation schema\
    \ \\(R\\) is in BCNF, it suffices to check only the dependencies in the given\
    \ set \\(F\\) for violation of BCNF, rather than checking all dependencies in\
    \ \\(F^+\\)\n+   \n+     - If none of the dependencies in \\(F\\) causes a violation\
    \ of BCNF, then none of the dependencies in \\(F^+\\) will cause a violation of\
    \ BCNF either.\n\n\\(\\cdot \\cdot \\cdot F^+\\) 是由 Armstrong 的 3 个公理从 \\(F\\\
    ) 推出的，而任何公理都不会使 \\(FD\\) 左边变小(拆分)，故如果 \\(F\\) 中没有违反 BCNF 的 FD(即左边是 superkey)，则\
    \ \\(F^+\\) 中也不会。\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_465_0.png)\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_465_1.png)"
  merge: -1
  img_proc: true
- pgno: 466
  md: '# # Testing for BCNF(cont.)


    However, using only F to test for BCNF may be incorrect when testing a relation
    in a decomposition of R.


    +   E.g. Consider \( R(A, B, C, D) \), with \( F={A \rightarrow B, B \rightarrow
    C} \)


    +   R is in BCNF ? Which is candidate key?


    +   Decompose \( R \) into \( R_1(A,B) \) and \( R_2(A,C,D) \)


    +   Neither of the functional dependencies in \( F \) contain only attributes
    from \( (A,C,D) \), so no FD violates BCNF, we might be mislead into thinking
    \( R_2 \) satisfies BCNF.


    +   In fact, dependency \( A \rightarrow C \) in \( F^+ \) shows \( R_2 \) is
    not in BCNF.


    (可在F下判别R是否违反BCNF，但须在F+下判别R的分解式是否违反BCNF.)'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# # (2) BCNF Decomposition Algorithm


    result := {R};

    done := false;

    compute F⁺;

    while (not done) do

    if (there is a schema Rᵢ in result that is not in

    BCNF)

    then begin

    let α → β be a nontrivial functional

    dependency that holds on Rᵢ

    such that α → Rᵢ is not in F⁺,

    and α ∩ β ≠ ∅;

    result := (result − Rᵢ) ∪ (α, β) ∪ (Rᵢ − β);

    end

    else done := true;


    Note: at last, every sub-schema is in BCNF, and the

    decomposition is lossless-join.


    > It means there is nontrivial

    > FD α → β in Rᵢ , and α is not a

    > key.


    > 将Rᵢ分解为二个子模式：

    > Rᵢ₁=(α, β )和Rᵢ₂=(Rᵢ − β)

    > ，α是 Rᵢ₁ Rᵢ₂ 的共同属性


