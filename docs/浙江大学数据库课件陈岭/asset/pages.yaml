- pgno: 441
  md: '# # Closure of Functional Dependencies (Cont.)


    # ## Armstrong 公理的补充定律：


    We can further simplify manual computation of **F+** by using the following additional
    rules.


    +   - If \(\alpha \rightarrow \beta\) **and** \(\alpha \rightarrow \gamma\) holds,
    then \(\alpha \rightarrow \beta\gamma\) holds (union, 合并律)


    +   - If \(\alpha \rightarrow \beta\gamma\) holds, then \(\alpha \rightarrow \beta\)
    **and** \(\alpha \rightarrow \gamma\) holds (decomposition, 分解律)


    +   - If \(\alpha \rightarrow \beta\) **and** \(\gamma\beta \rightarrow \delta\)
    holds, then \(\alpha\gamma \rightarrow \delta\) holds (pseudotransitivity, 伪传递律)


    The above rules can be inferred from Armstrong''s axioms.


    > Prov: Rule1: \(\beta\gamma \rightarrow \beta\), \(\beta\gamma \rightarrow \gamma\),
    given \(\alpha \rightarrow \beta\gamma\), by Rule3, then \(\alpha \rightarrow
    \beta\) and \(\alpha \rightarrow \gamma\)


