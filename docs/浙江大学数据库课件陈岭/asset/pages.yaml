- pgno: 63
  md: '# (1) Attribute Types


    +   - Each attribute of a relation has a name.

    +   - The set of allowed values for each attribute is called the **domain (域)**
    of the attribute.

    +   - **Attribute values** are (normally) required to be **atomic**, that is,
    indivisible. (1st NF, 第一范式)

    +     - E.g. **multivalued attribute** values are **not atomic**

    +     - E.g. **composite attribute** values are **not atomic**

    +   - The special value *null* is a member of every domain.

    +   - The *null* value causes complications in the definition of many operations.

    +     - we shall ignore the effect of null values for the moment and consider
    their effect later.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# # (2) Concepts about relation


    +   - A Relation is concerned with two concepts : relation schema and relation
    instance.


    +   - The relation schema describe the structure of the relation.


    E.g. Student-schema= (sid : string, name: string, sex: string, age: int, dept:
    string) or Student-schema= (sid, name, sex, age, dept)


    +   - The relation instance corresponds to the snapshot of the data in the relation
    at a given instant in time.


    +   - C.f.: Database schema and database instance.'
  merge: -1
  img_proc: true
