- pgno: 617
  md: '# # Tree Model of XML Data


    +   - Query and transformation languages are based on a tree model of XML data


    +   - An XML document is modeled as a tree, with nodes corresponding to elements
    and attributes


    +   - Element nodes have child nodes, which can be attributes or subelements


    +   - Text in an element is modeled as a text node child of the element


    +   - Children of a node are ordered according to their order in the XML document


    +   - Element and attribute nodes (except for the root node) have a single parent,
    which is an element node


    +   - The root node has a single child, which is the root element of the document'
  merge: -1
  img_proc: true
- pgno: 618
  md: '# (1) XPath


    +   - XPath is used to address (select) parts of documents using **path expressions**

    +   - A path expression is a sequence of steps separated by “/”

    +     - Think of file names in a directory hierarchy

    +   - Result of path expression: set of values that **along with** their containing
    elements/attributes match the specified path


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_618_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_618_1.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_618_2.png)'
  merge: -1
  img_proc: true
- pgno: 619
  md: '# # (1) XPath (Cont.)


    +   - E.g. /bank-2/customer/customer_name evaluated on the bank-2 data we saw
    earlier returns:


    <customer_name> Joe </customer_name>

    <customer_name> Mary </customer_name>


    +   - E.g. /bank-2/customer/customer_name/text() returns the same names, but without
    the enclosing tags


    Joe

    Mary'
  merge: -1
  img_proc: true
- pgno: 620
  md: '# (1) XPath (Cont.)


    +   - The initial “/” denotes root of the document (above the top-level tag)

    +   - Path expressions are evaluated left to right

    +     - Each step operates on the set of instances produced by the previous step

    +   - Selection predicates may follow any step in a path, in [ ]

    +     - `/bank-2/account[balance > 400]` returns account elements with a balance
    value greater than 400

    +     - `/bank-2/account[balance]` returns account elements containing a balance
    sub-element'
  merge: -1
  img_proc: true
- pgno: 621
  md: '# (1) XPath (Cont.)


    +   - Attributes are accessed using “@”

    +     - E.g:

    +       `/bank-2/account[balance >400] /@account_number`

    +         - returns the account numbers of accounts with balance > 400

    +   - IDREF attributes are not dereferenced automatically (more on this later)'
  merge: -1
  img_proc: true
- pgno: 622
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 623
  md: '# Functions in XPath


    +   - **IDREFs can be referenced using function `id()`**

    +     - **`id()`** can also be applied to sets of references such as IDREFS and
    even to strings containing multiple references separated by blanks

    +     - **E.g.** `/bank-2/account/id(@owner)`

    +       - returns all customers referred to from the owners attribute of account
    elements.'
  merge: -1
  img_proc: true
- pgno: 624
  md: "# # More XPath Features\n\n+   - Operator \"|\" used to implement union\n+\
    \   \n+     - E.g. /bank-2/account/id(@owner) | /bank-2\n+       /loan/id(@borrower)\n\
    +   \n+       - Gives customers with either accounts or loans\n+       - However,\
    \ \"|\" cannot be nested inside other operators.\n+   \n+   - \"//\" can be used\
    \ to skip multiple levels of nodes\n+   \n+     - E.g. /bank-2//customer_name\n\
    +   \n+       - finds any customer_name element _anywhere_\n+         under the\
    \ /bank-2 element, regardless of the\n+         element in which it is contained."
  merge: -1
  img_proc: true
