- pgno: 594
  md: '# # Motivation for Nesting


    # ## Nesting of data is useful in data transfer


    +   - Example: elements representing _customer_id_, _customer_name_, and _address_
    nested within an _order_ element


    # ## Nesting is not supported, or discouraged, in relational databases


    +   - With multiple orders, customer name and address are stored redundantly


    +   - normalization replaces nested structures in each order by foreign key into
    table storing customer name and address information


    +   - Nesting is supported in object-relational databases


    # ## But nesting is appropriate when transferring data


    +   - External application does not have direct access to data referenced by a
    foreign key'
  merge: -1
  img_proc: true
- pgno: 595
  md: "# Structure of XML Data (Cont.)\n\n+   - Mixture of text with sub-elements\
    \ is legal in XML.\n+     - Example:\n+   \n+       ```xml\n+       <account>\n\
    +           This account is seldom used any more.\n+           <account_number>\
    \ A-102 </account_number>\n+           <branch_name> Perry­r idge </branch_name>\n\
    +           <balance>400 </balance>\n+       </account>\n+       ```\n+   \n+\
    \     - Useful for document markup, but discouraged for data representation"
  merge: -1
