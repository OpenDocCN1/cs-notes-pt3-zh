- pgno: 458
  md: '# 7.4 Decomposition（分解）


    # (1) Goals of Normalization（规范化的目标）


    +   - Judge whether a particular relation *R* is in “good” form. *(no redundant,
    insert/delete/update anomalies)*


    +   - In the case that a relation *R* is **not in “good” form**, **decompose it**
    into a set of relations {*R₁, R₂, ..., Rₙ*} such that:


    +     - the decomposition is a lossless-join decomposition.（无损连接分解）


    +     - the decomposition is dependency preservation.（依赖保持）


    +     - each relation *Rᵢ* is in good form

    +       - BCNF or 3NF.'
  merge: -1
  img_proc: true
- pgno: 459
  md: '# # Decomposition(cont.)


    # ## (2) desirable properties of decomp.(分解应有的特性)


    1) All attributes of an original schema (**_R_**) must appear in the decomposition
    (**_R_1**, **_R_2**):

    _R_ = _R_<sub>1</sub> ∪ _R_<sub>2</sub>


    2) Lossless-join decomposition.

    For all possible relations _r_ on schema _R_


    +   - _r_ = Π<sub>_R_1</sub> (_r_) ⋈ Π<sub>_R_2</sub> (_r_)


    +   - A decomposition of R into _R_<sub>1</sub> and _R_<sub>2</sub> is lossless-join
    if and only if at least one of the following dependencies are held in F<sup>+</sup>
    :


    ✦ {_R_<sub>1</sub> ∩ _R_<sub>2</sub> }→ _R_<sub>1</sub>

    or

    ✦ {_R_<sub>1</sub> ∩ _R_<sub>2</sub> }→ _R_<sub>2</sub>


    无损连接分解的条件：

    分解后的二个子模式的共同属性必须是R1或R2的码。（适用于一分为二的分解）


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_459_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_459_1.png)'
  merge: -1
  img_proc: true
- pgno: 460
  md: '# # Decomposition(cont.)


    # ## 3) Dependency preservation （依赖保持）


    +   - To check updates (to ensure not violate any FD) efficiently, allow updates
    validation in sub-relations R<sub>i</sub> respectively, without executing the
    join of them.


    +   - Restriction of F to R<sub>i</sub> is: F<sub>i</sub> ⊆ F<sup>+</sup> , F<sub>i</sub>
    includes only attributes of R<sub>i</sub>


    +   - (F<sub>1</sub> ∪ F<sub>2</sub> ∪ ... ∪ F<sub>n</sub>)<sup>+</sup> = F<sup>+</sup>,
    where F<sub>i</sub> be the set of dependencies in F<sup>+</sup> that include only
    attributes in R<sub>i</sub>.


    # ## 4) No redundancy: The relations R<sub>i</sub> preferably should be in either
    Boyce-Codd Normal Form or Third Normal Form, i.t BCNF or 3NF.


