- pgno: 48
  md: '# 1.9 Transaction Management（事务管理）


    +   - **Concurrent use** is important. But cause problems.

    +   - **A transaction** is a collection of operations that performs a single logical
    function in a database application - Jim Gray

    +   - **Transaction requirement:** atomicity（原子性）, consistency（一致性）, isolation（隔离性）,
    durability（持久性）/ **ACID**

    +   - **Transaction-management component** ensures that the database remains in
    a **consistent** (correct) **state** despite system failures (e.g., power failures
    and operating system crashes) and transaction failures. - By backup and recovery
    subsystem

    +   - **Concurrency-control manager**（并发控制管理器）controls the interaction among the
    concurrent transactions.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 1.10 Database management system structure


    # 1) Storage manager


    +   - Provides interface between the low-level data stored in the database (file
    system) and the application programs and queries submitted to the system.

    +   - Responsible for efficient storing, retrieving, updating data in the database.

    +   - Includes:

    +     - Transaction manager

    +     - Authorization and integrity manager

    +     - File manager (interaction with the file system to process data files,
    data dictionary, index files)

