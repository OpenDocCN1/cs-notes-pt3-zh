  md: '# 6.2 Relationship Sets（联系集）


    A **relationship** is an association among several entities（是一个或多个不同类实体之间的关联）


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_349_0.png)


    A **relationship set** is a set of relationship of the same type.


    example: **borrower ( customer-name, loan-number )**


    +   - 一个联系集包含多个同类联系（或联系实例，relationship instance）

    +   - 一个联系集表示一个或多个实体集之间的关联。'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'Formally, a **relationship set** is a mathematical relation among \(n \ge 2\)
    entities, each taken from entity sets


    \{(e_1, e_2, \ldots, e_n) \mid e_1 \in E_1, e_2 \in E_2, \ldots, e_n \in E_n\}


    where \((e_1, e_2, \ldots, e_n)\) is a relationship, \(E_i\) is entity set.


    +   - **Example:** \((Jones,\ L\text{-}17) \in borrower\), where \(Jones \in customer\),
    \(L\text{-}17 \in loan\)


    \[

    \left\{

    \begin{aligned}

    &(3032111020,\ 1,\ 95)\\

    &(3032111021,\ 1,\ 90)\\

    &(3032111022,\ 2,\ 75)\\

    &\cdots\ \cdots

    \end{aligned}

    \right\}\in student,\ course

    \]


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_350_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_350_1.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_350_2.png)'
