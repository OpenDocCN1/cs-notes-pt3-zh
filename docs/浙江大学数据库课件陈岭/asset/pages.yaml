- pgno: 560
  md: '# Suppose we have the following table:


    ```

    create table mylog(

    who varchar2(30),

    logon_num number

    );

    ```


    | logon_num | who |

    |-----------|-----|

    | 3         | Peter |

    | 4         | John |

    | 2         | Moshe |


    +   Want to keep track of how many times someone logged on to the DB


    +   When running, if user is already in table, increment logon_num. Otherwise,
    insert user into table'
  merge: -1
  img_proc: true
- pgno: 561
  md: '# # Solution


    ```

    ```sql

    DECLARE

    cnt NUMBER;

    BEGIN

    select count(*)

    into cnt

    from mylog

    where who = user;

    if cnt > 0 then

    update mylog

    set logon_num = logon_num + 1

    where who = user;

    else

    insert into mylog values(user, 1);

    end if;

    commit;

    end;

    /

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 562
  md: '# SQL Cursor


    SQL cursor is automatically created after each SQL query. It has 4 useful attributes:


    | Attribute | Description |

    |---|---|

    | **SQL%ROWCOUNT** | Number of rows affected by the most recent SQL statement
    (an integer value). |

    | **SQL%FOUND** | Boolean attribute that evaluates to TRUE if the most recent
    SQL statement affects one or more rows. |

    | **SQL%NOTFOUND** | Boolean attribute that evaluates to TRUE if the most recent
    SQL statement does not affect any rows. |

    | **SQL%ISOPEN** | Always evaluates to FALSE because PL/SQL closes implicit cursors
    immediately after they are executed. |'
  merge: -1
  img_proc: true
