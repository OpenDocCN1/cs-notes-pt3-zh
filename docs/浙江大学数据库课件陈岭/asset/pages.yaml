- pgno: 354
  md: "# # (1) Degree of a Relationship Set\n\n+   - Refers to the number of entity\
    \ sets that participate in a relationship set.\n\n+   - Relationship sets that\
    \ **involve two entity sets** are _binary_ (or degree two). （二元联系，二度联系）\n\n+ \
    \  - Relationship sets may **involve more than two entity sets**.  \n+     E.g.\
    \ Suppose employees of a bank may have jobs (responsibilities) at multiple branches,\
    \ with different jobs at different branches.  \n+     Then there is a **ternary\
    \ relationship set** between entity sets(  \n+     **employee, job , branch**\
    \ ) （三元联系集）\n\n+   - Relationships between more than two entity sets are rare.\
    \ Most relationships are binary. (More on this later.)"
  merge: -1
  img_proc: true
- pgno: 355
  md: "# # (2) Mapping Cardinalities (映射基数)\n\n+   - Express the number of entities\
    \ to which another entity can be associated via a relationship set.\n+   \n+ \
    \  （一个联系集中，一个实体可以与另一类实体相联系的实体数目。其中数目是指最多一个还是多个）\n\n+   - Most useful in describing\
    \ binary relationship sets.\n\n+   - For a binary relationship set the mapping\
    \ cardinality must be one of the following types:\n\n+   - One to one (1 : 1)\
    \ ， 如： 就任总统（总统， 国家）\n\n+   - One to many (1 : n)， 如： 分班情况（班级， 学生）\n\n+   - Many\
    \ to one (n : 1)， 如： 就医（病人， 医生）\n\n+   - Many to many (n : m)， 如： 选课（学生， 课程）"
  merge: -1
  img_proc: true
