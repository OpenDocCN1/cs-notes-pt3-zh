- pgno: 15
  md: '# ## 1.2 What is a database

    ---Definition


    # ### Database:


    +   - A collection of **interrelated data**, relevant to an enterprise.


    +   - A large collection of **integrated and persistent** data (DB). [R. Ramakrishnan,
    J. Gehrke]


    +   - A collection of information that exists over a long period of time, often
    many years. [ Ullman]


    +   - 长期存储在计算机内、有组织的、可共享的数据集合。[萨师煊，王珊]


    # ### Database Management System (DBMS) :


    (**Database**)+ A **set of programs** used to access, update and manage the data
    in database.'
