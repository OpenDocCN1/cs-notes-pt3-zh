- pgno: 226
  md: '# # 【5】Transactions(事务)


    A transaction is a sequence of queries and data update statements executed as
    a single logical unit.


    +   - Transactions are started implicitly and terminated by one of


    +   - **commit work**: makes all updates of the transaction permanent in the database


    +   - **rollback work**: undoes all updates performed by the transaction.'
  merge: -1
  img_proc: true
- pgno: 227
  md: "# (5) Transactions(cont.)\n\n# Motivating example\n\n```\nUpdate account set\
    \ balance=balance − 100\nwhere account_number='A-101';\nUpdate account set balance=balance\
    \ + 100\nwhere account_number='A-201';\n\nCOMMIT WORK;\n```\n\n+   - If one step\
    \ succeeds and the other fails, database is in an inconsistent state\n+   - Therefore,\
    \ either both steps should succeed or neither.\n+   \n+   **Atomicity** (原子性)\n\
    \n+   - If any step of a transaction fails, all work done by the transaction can\
    \ be undone by **rollback work**.\n+   - Rollback of incomplete transactions is\
    \ done automatically, in case of system failures"
  merge: -1
  img_proc: true
