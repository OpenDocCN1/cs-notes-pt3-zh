  md: '# Stylus Studio 2010 XML企业版 - [sample.xquery]


    文件(F) 编辑(E) 浏览(V) 项目(P) 调试(D) XQuery 转换管理(C) 工具(T) 窗口(W) 帮助(H)


    项目

    sample

    sample.xquery

    sample.xml


    ```

    for $x in /bookstore/book

    let $bookprice := $x/price

    where $bookprice > 60

    return <expensive_book> {$x/title} </expensive_book>

    ```


    XQuery源（映射器 | 计划）

