- pgno: 372
  md: '# # (8) Binary Vs. Non-Binary Relationships


    ## (a) Some relationships that appear to be non-binary may be better represented
    using binary relationships


    +   - E.g. A ternary relationship *parents*, relating a child to his/her father
    and mother, is best replaced by two binary relationships, *father* and *mother*.


    parents( he, she, child). => father (he, child), mother( she, child)


    +   - Using two binary relationships allows partial information (e.g. only mother
    being know) .


    +   - But there are **some relationships** that are naturally non-binary


    E.g. **works-on(employee, branch, job)**'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# # *(b) Converting Non-Binary Relationships to Binary Form


    In general, any non-binary relationship can be represented using binary relationships
    by creating an **artificial entity set**.


    +   - Replace non-binary relationship _R_ between entity sets A, B and C by an
    entity set _E_, and three new relationship sets:

    +   - Create a special identifying attribute for _E_

    +   - Add any attributes of _R_ to _E_

    +   - For each relationship (_aᵢ_, _bᵢ_, _cᵢ_) in _R_, create _R<sub>A</sub>_,
    _R<sub>B</sub>_, _R<sub>C</sub>_


    E.g:


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_373_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_373_1.png)'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# 6.5 Weak Entity Sets (弱实体集)


    # An entity set that does not have a primary key is referred to as a weak entity
    set.


    # Vs strong entity set (强实体集)


    E.g: 还贷登记表 payment(pay-num, pay-date, pay-amount) . 假设为了清楚起见， pay-num按对应的每项贷款分别编号(都从1,
    2, 3... 开始)， 这样， pay-num就不是码， 并且该实体集没有码。 故payment 是弱实体集。 pay-num is discriminator
    or partial key (分辨符或部分码)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_374_0.png)'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# Weak Entity Sets (cont.)


    +   - The existence of a weak entity set **depends on the existence of a _identifying
    entity set_ or _owner entity set_**（标识实体集或属主实体集）。

    +     - *E.g.* `loan(loan-num, amount)` is an **identifying entity set**.

    +     - It must relate to the identifying entity set via a **total, one-to-many
    relationship set** from the identifying to the weak entity set.


    +   - The related relationship is called **identifying relationship**（标识性联系）

    +     - e.g. `loan-payment`'
  merge: -1
  img_proc: true
