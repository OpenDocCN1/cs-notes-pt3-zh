- pgno: 256
  md: '# # 4.2.1 Referential Integrity （参照完整性约束）


    +   - In Chapter 3 the concept was mentioned.

    +   - Formal Definition


    +   - Let \( r_1(R_1) \) and \( r_2(R_2) \) be relations with primary keys \(
    K_1 \) and \( K_2 \) respectively.


    +   - The subset \( \alpha \) of \( R_2 \) is a **foreign key** referencing \(
    K_1 \) in relation \( r_1 \), if for every \( t_2 \) in \( r_2 \) there **must**
    be a tuple \( t_1 \) in \( r_1 \) such that \( t_1[K_1] = t_2[\alpha] \).


    +   - Referential integrity constraint also called **subset dependency** since
    its can be written as \( \Pi_\alpha (r_2) \subseteq \Pi_{K_1} (r_1) \).


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_256_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_256_1.png)'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# (Recall from chapter 2 about foreign key)


    Assume there exists relation r and s: r(A, **B**, C), s(**B**, D), we say attribute
    **B** is **foreign key** from relation r, and r is called *referencing relation*
    (参照关系), and s is called *referenced relation* (被参照关系).


    +   - e.g.

    +     - ◆ 学生(学号, 姓名, 性别, **专业号**, 年龄) --参照关系

    +     - 专业(**专业号**, 专业名称) --被参照关系（目标关系）

    +     - 其中属性 **专业号** 称为关系 *学生* 的外码。


    +   - ◆ Account(**account-number**, **branch-name**, balance) --参照关系

    +     - Branch(**branch-name**, branch-city, assets) --被参照关系


    参照关系中外码的值必须在被参照关系中实际存在，或为 null。'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# # Checking Referential Integrity on Database Modification


    The following tests must be made in order to preserve the following referential
    integrity constraint:


    \(\Pi_\alpha (r_2) \subseteq \Pi_K (r_1) \quad \alpha \text{ in } r_2 \text{ is
    FK (Foreign Key)}\)


    **Insert.** If a tuple \(t_2\) is inserted into \(r_2\), the system must ensure
    that there is a tuple \(t_1\) in \(r_1\) such that \(t_1[K] = t_2[\alpha]\). That
    is

    \(t_2[\alpha] \in \Pi_K (r_1)\)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_258_0.png)'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Checking Referential Integrity on Database Modification (cont.)


    **Delete.** If a tuple, $t_1$, is deleted from $r_1$, the system must compute
    the set of tuples in $r_2$ that reference $t_1$:


    $$\sigma_\alpha = \{t[r_2]\}$$


    > 如果r2中存在与r1中被删记录匹配的元组


    If this set is **NOT** empty, then


    +   - either the delete command is rejected as an error, or

    +   - the tuples in $t_2$ that references $t_1$ **must themselves be deleted**
    (*cascading* (多级) deletions are possible).


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_259_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_259_1.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_259_2.png)'
  merge: -1
  img_proc: true
- pgno: 260
  md: "# # Database Modification (Cont.)\n\nUpdate. There are two cases:\n\n+   -\
    \ If a tuple $t_2$ is updated in relation $r_2$ and the update modifies values\
    \ for foreign key \\(\\alpha\\), then a test similar to the insert case is made:\n\
    +     - Let \\(t_2'\\) denote the new value of tuple \\(t_2\\). The system must\
    \ ensure that\n+       \n+       $$t_2'[\\alpha] \\in \\Pi_\\kappa(r_1)$$"
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Referential Integrity in SQL


    Primary and candidate keys and foreign keys can be specified as part of the SQL
    create table statement:


    +   - The **primary key** clause lists attributes that comprise the primary key.

    +   - The **unique key** clause lists attributes that comprise a **candidate key**.

    +   - The **foreign key** clause lists the attributes that comprise the foreign
    key and the name of the relation referenced by the foreign key.


