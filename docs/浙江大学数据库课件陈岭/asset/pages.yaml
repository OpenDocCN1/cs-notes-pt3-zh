- pgno: 610
  md: '# # Limitations of DTDs


    +   - No typing of text elements and attributes

    +     - All values are strings, no integers, reals, etc.

    +   - Difficult to specify unordered sets of subelements

    +     - Order is usually irrelevant in databases (unlike in the document-layout
    environment from which XML evolved)

    +     - `(A | B)*` allows specification of an unordered set, but cannot ensure
    that **each of A and B occurs only once**

    +   - IDs and IDREFs are untyped

    +     - The _owners_ attribute of an account may contain a reference to another
    account, which is meaningless

    +       - owners attribute should ideally be constrained to refer to customer
    elements


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_610_0.png)


    ![](img/5b3fa86b6571b68f1313de4e5d81fe8a_610_1.png)'
  merge: -1
  img_proc: true
- pgno: 611
  md: '# (2) XML Schema


    +   - XML Schema is a more sophisticated schema language which addresses the drawbacks
    of DTDs. Supports

    +     - Typing of values

    +       - E.g. integer, string, etc

    +       - Also, constraints on min/max values

    +     - User-defined, complex types

    +     - Many more features, including

    +       - uniqueness and foreign key constraints, inheritance

    +   - XML Schema is itself specified in XML syntax, unlike DTDs

    +     - More-standard representation, but verbose

    +   - XML Scheme is integrated with namespaces

    +   - BUT: XML Schema is significantly more complicated than DTDs.'
  merge: -1
  img_proc: true
- pgno: 612
  md: "# XML Schema Version of Bank DTD\n\n```\n```xml\n<xs:schema xmlns:xs=http://www.w3.org/2001/XMLSchema>\n\
    <xs:element name=\"bank\" type=\"BankType\"/>\n<xs:element name=\"account\">\n\
    \    <xsi:complexType>\n        <xsi:sequence>\n            <xsi:element name=\"\
    account_number\" type=\"xs:string\"/>\n            <xsi:element name=\"branch_name\"\
    \    type=\"xs:string\"/>\n            <xsi:element name=\"balance\"       type=\"\
    xs:decimal\"/>\n        </xsi:sequence>\n    </xsi:complexType>\n</xs:element>\n\
    ```\n```"
  merge: -1
  img_proc: true
