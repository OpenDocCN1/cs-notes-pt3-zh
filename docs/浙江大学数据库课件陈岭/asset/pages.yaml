- pgno: 492
  md: "# Example\n\n+   - Let **R** be a relation schema with a set of attributes\
    \ that are partitioned into 3 **nonempty subsets**.\n+     \n+     **Y, Z, W**\n\
    \n+   - We say that *Y* →→ *Z* (*Y* multi-determines *Z*) if and only if for all\
    \ possible relations *r(R)*\n+     \n+     ( *y₁, z₁, w₁* ) ∈ *r* and ( *y₁, z₂,\
    \ w₂* ) ∈ *r*\n+     \n+     then\n+     \n+     ( *y₁, z₁, w₂* ) ∈ *r* and (\
    \ *y₁, z₂, w₁* ) ∈ *r*\n\n+   - Note that since the behavior of **Z** and **W**\
    \ are identical, it follows that *Y* →→ *Z* if *Y* →→ *W*"
  merge: -1
  img_proc: true
- pgno: 493
  md: '# Example (Cont.)


    +   - In our example:

    +     - *course* →→ *teacher*

    +     - *course* →→ *book*


    +   - The above formal definition is supposed to formalize the notion that given
    a particular value of *Y* (*course*) it has associated with it a set of values
    of *Z* (*teacher*) and a set of values of *W* (*book*), and these two sets are
    in some sense independent of each other.'
  merge: -1
  img_proc: true
- pgno: 494
  md: '# # Theory of MVDs


    From the definition of multivalued dependency, we can derive the following rule:


    +   - If \(\alpha \rightarrow \beta\), then \(\alpha \rightarrow\rightarrow \beta\)


    That is, every functional dependency is also a multivalued dependency


    The closure D+ of D is the set of all functional and multivalued dependencies
    logically implied by D.


    +   - We can compute D+ from D, using the formal definitions of functional dependencies
    and multivalued dependencies.


    +   - We can manage with such reasoning for very simple multivalued dependencies,
    which seem to be most common in practice.


    +   - For complex dependencies, it is better to reason about sets of dependencies
    using a system of inference rules (see Appendix C).'
  merge: -1
  img_proc: true
- pgno: 495
  md: '# Fourth Normal Form


    +   - A relation schema *R* is in 4NF with respect to a set *D* of functional
    and multivalued dependencies if for **all multivalued dependencies** in *D⁺* of
    the form α →→ β, where α ⊆ *R* and β ⊆ *R*, at least one of the following hold:

    +     - α →→ β is trivial (i.e., β ⊆ α or α ∪ β = *R*)

    +     - α is a superkey for schema *R*

    +   - If a relation is in 4NF, it is in BCNF'
  merge: -1
  img_proc: true
- pgno: 496
  md: '# Requirement for decomposition

    - Restriction of Multivalued Dependencies


    +   - Assume R is decomposed into R₁, R₂, …, Rₙ, each Rᵢ is required to conform
    to 4NF.

    +   - The restriction of D to Rᵢ is the set Dᵢ consisting of

    +     - All functional dependencies in D⁺ that include only attributes of Rᵢ

    +     - All multivalued dependencies of the form α →→ (β ∩ Rᵢ), where α ⊆ Rᵢ and
    α →→ β is in D⁺'
  merge: -1
  img_proc: true
- pgno: 497
  md: "# # 4NF Decomposition Algorithm\n\nresult:= { R };\ndone := false;\ncompute\
    \ D⁺;\nLet Dᵢ denote the restriction of D⁺ to Rᵢ\nwhile (not done)\n  if (there\
    \ is a schema Rᵢ in result that is not in 4NF) then begin\n    let α →→ β be a\
    \ nontrivial multivalued dependency that holds on Rᵢ such that α → Rᵢ is not in\
    \ Dᵢ, and α∩β=φ;\n    result := (result - Rᵢ) ∪ (α, β) ∪ (Rᵢ - β);\n    end\n\
    \  else done:= true;\nNote: each Rᵢ is in 4NF, and decomposition is lossless-join\n\
    \n**The decomposition is NOT dependency preserving!**\n\n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_497_0.png)\n\
    \n![](img/5b3fa86b6571b68f1313de4e5d81fe8a_497_1.png)"
  merge: -1
  img_proc: true
