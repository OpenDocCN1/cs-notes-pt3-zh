- pgno: 447
  md: "# # Uses of Attribute Closure\n\nThere are 3 kind uses of the attribute closure\
    \ algorithm:\n\n+   1) **Testing for superkey** --- (α → R ?)\n+   \n+      To\
    \ test if α is a superkey, we compute α⁺, and check if α⁺ contains all attributes\
    \ of R, i.e. check if R ⊆ α⁺\n\n+   2) **Testing functional dependencies** ---\
    \ (α → β ?)\n+   \n+      To check if a functional dependency α → β holds (or,\
    \ in other words, is in F⁺), just check if β ⊆ α⁺.\n+   \n+      It’s a simple\
    \ and cheap test, and very useful\n\n+   3) **Computing closure of F** --- (F⁺\
    \ = ?)\n+   \n+      For each γ ⊆ R, we find the closure γ⁺, and for each S ⊆\
    \ γ⁺, we output a functional dependency γ → S. All γ → S form F⁺"
