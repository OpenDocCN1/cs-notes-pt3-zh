    \            path[i][j] = -1;\n        }\n\n    for ( k=0; k<Graph->Nv; k++ )\n\
    \        for ( i=0; i<Graph->Nv; i++ )\n            for ( j=0; j<Graph->Nv; j++\
    \ )\n                if ( D[i][k] + D[k][j] < D[i][j] ) {\n                  \
    \  D[i][j] = D[i][k] + D[k][j];\n                    if ( i==j && D[i][j]<0 )\
    \ /* 若发现负值圈 */\n                        return false; /* 不能正确解决，返回错误标记 */\n  \
    \                  path[i][j] = k;\n                }\n\n    return true; /* 算法执行完毕，返回正确标记\
    \ */\n}\n```\n\n## 第八讲 图（下）\n\n浙江大学 陈 越\n\n### 8.1 最小生成树问题\n\n### 什么是最小生成树 (Minimum\
    \ Spanning Tree)\n\n最小生成树存在 ↔ 图连通\n\n- 是一棵树\n  - 无回路\n  - \\|V\\| 个顶点一定有 \\|V\\\
    |-1 条边\n- 是生成树\n  - 包含全部顶点\n  - \\|V\\|-1 条边都在图里\n- 边的权重和最小\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_351_0.png)\n\
    \n> 向生成树中再加一条边都一定构成回路\n\n### Prim算法 — 让一棵小树长大\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_353_0.png)\n\
    \n是不是有点像Dijkstra算法.....\n\n```c\nvoid Dijkstra( Vertex s )\n{\n    while (1) {\n\
    \        V = 未收录顶点中dist最小者;\n        if ( 这样的V不存在 )\n            break;\n    \
    \    collected[V] = true;\n        for ( V 的每个邻接点 W )\n            if ( collected[W]\
    \ == false )\n                if ( dist[V] + E<v, w> < dist[W] ) {\n         \
    \           dist[W] = dist[V] + E<v, w>;\n                    path[W] = V;\n \
    \               }\n    }\n}\n```\n\n```c\nvoid Prim()\n{\n    MST = {s};\n   \
    \ while (1) {\n        V = 未收录顶点中dist最小者;\n        if ( 这样的V不存在 )\n          \
    \  break;\n        将V收录进MST: dist[V] = 0;\n        for ( V 的每个邻接点 W )\n      \
    \      if ( dist[W] != 0 )\n                if ( E<v, w> < dist[W] ) {\n     \
