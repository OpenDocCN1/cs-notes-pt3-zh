  - "[PAGE 468]\n\n```\nint main() {\n    int TableSize = 10000; /* 散列表的估计大小 */\n\
    \    int wordcount = 0, length;\n    HashTable H;\n    ElementType word;\n   \
    \ FILE *fp;\n    char document[30] = \"HarryPotter.txt\"; /* 要被统计词频的文件名 */\n \
    \   H = InitializeTable( TableSize ); /* 建立散列表 */\n    if(( fp = fopen(document,\
    \ \"r\" ))==NULL) FatalError(\"无法打开文件!\\n\");\n    while( !feof( fp ) ){\n   \
    \     length = GetAWord( fp, word ); /* 从文件中读取一个单词 */\n        if(length > 3){\
    \ /* 只考虑适当长度的单词 */\n            wordcount++; /* 统计文件中单词总数 */\n            InsertAndCount(\
    \ word, H );\n        }\n    }\n    fclose( fp );\n    printf(\"该文档共出现 %d 个有效单词，\
    \ \", wordcount);\n    Show( H , 10.0/100 ); /* 显示词频前10%的所有单词 */\n    DestroyTable(\
    \ H ); /* 销毁散列表 */\n    return 0;\n}\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_468_0.png)"
