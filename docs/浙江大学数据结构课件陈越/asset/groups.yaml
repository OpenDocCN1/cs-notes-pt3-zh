    # # 有权图的单源最短路算法


    +   - 方法1：直接扫描所有未收录顶点 - \( O(|V|) \)

    +     - \( T = O(|V|^2 + |E|) \) —— 对于稠密图效果好


    +   - 方法2：将dist存在最小堆中 - \( O(\log|V|) \)

    +     - 更新dist[w]的值 - \( O(\log|V|) \)

