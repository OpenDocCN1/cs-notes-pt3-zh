    \n## 1.3 应用实例：最大子列和问题\n\n给定N个整数的序列{ A<sub>1</sub>, A<sub>2</sub>, ..., A<sub>N</sub>\
    \ }，求函数 f(i,j)=max{0,∑<sub>k=i</sub><sup>j</sup>A<sub>k</sub>} 的最大值。\n\n### 算法1\n\
    \n```c\nint MaxSubseqSum1( int A[], int N )\n{\n    int ThisSum, MaxSum = 0;\n\
    \    int i, j, k;\n    for( i = 0; i < N; i++ )   /* i是子列左端位置 */\n        for(\
    \ j = i; j < N; j++ )   /* j是子列右端位置 */\n        {\n            ThisSum = 0;  \
    \ /* ThisSum是从A[i]到A[j]的子列和 */\n            for( k = i; k <= j; k++ )\n      \
    \          ThisSum += A[k];\n\n            if( ThisSum > MaxSum )   /* 如果刚得到的这个子列和更大\
    \ */\n                MaxSum = ThisSum;   /* 则更新结果 */\n        }   /* j循环结束 */\n\
    \    }   /* i循环结束 */\n    return MaxSum;\n}\n```\n\n### 算法2\n\n```c\nint MaxSubseqSum2(\
    \ int A[], int N )\n{\n    int ThisSum, MaxSum = 0;\n    int i, j;\n    for( i\
    \ = 0; i < N; i++ ) { /* i是子列左端位置 */\n        ThisSum = 0; /* ThisSum是从A[i]到A[j]的子列和\
    \ */\n        for( j = i; j < N; j++ ) { /* j是子列右端位置 */\n            ThisSum +=\
    \ A[j];\n            /*对于相同的i，不同的j，只要在j-1次循环的基础上累加1项即可*/\n            if( ThisSum\
    \ > MaxSum ) /* 如果刚得到的这个子列和更大 */\n                MaxSum = ThisSum;    /* 则更新结果\
    \ */\n        } /* j循环结束 */\n    } /* i循环结束 */\n    return MaxSum;\n}\n```\n\n\
    $T(N)=O(N^2)$\n\n### 算法3：分而治之\n\nT(N/2)\n\nO(N)\n\nT(N/2)\n\nT(N) = 2 T(N/2) +\
    \ c N，　T(1) = O(1)\n\n= 2 [2 T(N/2²) + c N/2] + c N\n\n= 2ᵏ O(1) + c k N　其中 N/2ᵏ\
    \ = 1\n\n= O(N log N)\n\n### 算法4：在线处理\n\n```c\nint MaxSubseqSum( int A[], int\
    \ N )\n{\n    int ThisSum, MaxSum;\n    int i;\n    ThisSum = MaxSum = 0;\n  \
    \  for( i = 0; i < N; i++ ) {\n        ThisSum += A[i]; /* 向右累加 */\n        if(\
    \ ThisSum > MaxSum )\n            MaxSum = ThisSum; /* 发现更大和则更新当前结果 */\n     \
    \   else if( ThisSum < 0 ) /* 如果当前子列和为负 */\n            ThisSum = 0; /* 则不可能使后面的部分和增大，抛弃之\
    \ */\n    }\n    return MaxSum;\n}\n\nT(N) = O(N)\n```\n\n“在线”的意思指每输入一个数据就进行即时处理，在任何一个地方中止输入，算法都能正确给出当前的解。\n\
    \n## 运行时间比较（秒）\n\n| 算法 | 1 | 2 | 3 | 4 |\n|---|---|---|---|---|\n| 时间复杂度 | O(N³)\
    \ | O(N²) | O(Nlog N) | O(N) |\n| 输入规模 | | | | |\n| N=10 | 0.00103 | 0.00045 |\
    \ 0.00066 | 0.00034 |\n| N=100 | 0.47015 | 0.01112 | 0.00486 | 0.00063 |\n| N=1,000\
