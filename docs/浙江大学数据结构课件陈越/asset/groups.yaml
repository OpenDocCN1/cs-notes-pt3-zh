  - "[PAGE 81]\n\n[例] 请用一个数组实现两个堆栈，要求最大地利用数组空间，使数组只要有空间入栈操作就可以成功。\n\n【分析】一种比较聪明的方法是使这两个栈分别从数组的两头开始向中间生长；当两个栈的栈顶指针相遇时，表示两个栈都满了。\n\
    \n```\n#define MaxSize <存储数据元素的最大个数>\nstruct DStack {\n    ElementType Data[MaxSize];\n\
    \    int Top1; /* 堆栈 1 的栈顶指针 */\n    int Top2; /* 堆栈 2 的栈顶指针 */\n} S;\n\nS.Top1\
    \ = -1;\nS.Top2 = MaxSize;\n```"
  - "[PAGE 82]\n\n```\nvoid Push( struct DStack *PtrS, ElementType item, int Tag )\n\
    {\n    /* Tag作为区分两个堆栈的标志，取值为1和2 */\n    if ( PtrS->Top2 - PtrS->Top1 == 1 ) {\
    \ /*堆栈满*/\n        printf(\"堆栈满\");  return ;\n    }\n    if ( Tag == 1 ) /* 对第一个堆栈操作\
    \ */\n        PtrS->Data[++(PtrS->Top1)] = item;\n    else    /* 对第二个堆栈操作 */\n\
    \        PtrS->Data[--(PtrS->Top2)] = item;\n}\n```\n\n```\nElementType Pop( struct\
    \ DStack *PtrS, int Tag )\n{\n    /* Tag作为区分两个堆栈的标志，取值为1和2 */\n    if ( Tag ==\
    \ 1 ) { /* 对第一个堆栈操作 */\n        if ( PtrS->Top1 == -1 ) { /*堆栈1空 */\n        \
    \    printf(\"堆栈1空\");  return NULL;\n        } else return PtrS->Data[(PtrS->Top1)--];\n\
    \    } else {    /* 对第二个堆栈操作 */\n        if ( PtrS->Top2 == MaxSize ) { /*堆栈2空\
    \ */\n            printf(\"堆栈2空\");  return NULL;\n        } else return PtrS->Data[(PtrS->Top2)++];\n\
    \    }\n}\n```"
  - "[PAGE 83]\n\n# # 堆栈的链式存储实现\n\n栈的链式存储结构实际上就是一个单链表，叫做链栈。插入和删除操作只能在链栈的栈顶进行。栈顶指针Top应该在链表的哪一头？\n\
    \ntypedef struct SNode *Stack;\nstruct SNode{\n    ElementType Data;\n    struct\
