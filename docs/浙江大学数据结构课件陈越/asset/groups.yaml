    \ \"图中有回路\" );\n            break;\n        }\n        输出v，或者记录v的输出序号;\n     \
    \   for ( v 的每个邻接点 w )\n            Indegree[w]--;\n    }\n}\n```\n\n\U0001F44E\
    \ **T = O(|V|²)**\n\n### 聪明的算法\n\n- 随时将入度变为 0 的顶点放到一个容器里\n\n```c\nvoid TopSort()\n\
    {\n    for ( 图中每个顶点 V )\n        if ( Indegree[V]==0 )\n            Enqueue( V,\
    \ Q );\n    while ( !IsEmpty(Q) ) {\n        V = Dequeue( Q );\n        输出V，或者记录V的输出序号;\
    \ cnt++;\n        for ( V 的每个邻接点 W )\n            if ( --Indegree[W]==0 )\n  \
    \              Enqueue( W, Q );\n    }\n    if ( cnt != |V| )\n        Error(\
    \ \"图中有回路\" );\n}\n```\n\nT = O(|V| + |E|)\n\n此算法可以用来检测有向图是否 DAG\n\n### 关键路径问题\n\
    \n#### AOE (Activity On Edge) 网络\n\n- 一般用于安排项目的工序\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_364_0.png)\n\
    \n由绝对不允许延误的活动组成的路径\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_365_0.png)\n\n\
    问题1：整个工期有多长？\n\n`Earliest[8] = 18`\n`Earliest[0] = 0;`\n`Earliest[j] = max_{<i,j>∈E}\
    \ { Earliest[i] + C<i,j> };`\n\n问题2：哪几个活动有机动时间？\n\n`D<i,j> = Latest[j] − Earliest[i]\
    \ − C<i,j>`\n`Latest[8] = 18;`\n`Latest[i] = min_{<i,j>∈E} { Latest[j] − C<i,j>\
    \ };`\n\nCopyright © 2014, 浙江大学计算机科学与技术学院 All Rights Reserved\n\n## 图之习题选讲\n\n\
    浙江大学 陈 越\n\n### 旅游规划\n\n#### 题意理解\n\n- 城市为结点\n- 公路为边\n  - 权重1：距离\n  - 权重2：收费\n\
    - 单源最短路\n  - Dijkstra – 距离\n  - 等距离时按收费更新\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_368_0.png)\n\
    \n#### 其他类似问题\n\n- 要求数最短路径有多少条\n  - count[s] = 1;\n  - 如果找到更短路：count[W] = count[V];\n\
    \  - 如果找到等长路：count[W] += count[V];\n- 要求边数最少的最短路\n  - count[s] = 0;\n  - 如果找到更短路：count[W]\
    \ = count[V] + 1;\n  - 如果找到等长路：count[W] = count[V] + 1;\n\n## 第九讲 排序（上）\n\n浙江大学\
    \ 陈 越\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_371_0.png)\n\n### 9.1 简单排序\n\
    \n#### 前提\n\n`void X_Sort ( ElementType A[], int N )`\n\n- 大多数情况下，为简单起见，讨论从小到大的整数排序\n\
    - N 是正整数\n- 只讨论基于比较的排序（> = < 有定义）\n- 只讨论内部排序\n- 稳定性：任意两个相等的数据，排序前后的相对位置不发生改变\n\
    - 没有一种排序是任何情况下都表现最好的\n\n#### 冒泡排序\n\n```c\nvoid Bubble_Sort( ElementType A[],\
    \ int N )\n{\n    for ( P=N-1; P>=0; P-- ) {\n        flag = 0;\n        for(\
    \ i=0; i<P; i++ ) { /* 一趟冒泡 */\n            if ( A[i] > A[i+1] ) {\n         \
    \       Swap(A[i], A[i+1]);\n                flag = 1; /* 标识发生了交换 */\n       \
    \     }\n        }\n        if ( flag==0 ) break; /* 全程无交换 */\n    }\n}\n```\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_374_0.png)\n\n最好情况：顺序 T = O(N)\n\n\
    最坏情况：逆序 T = O(N²)\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_374_1.png)\n\n####\
    \ 时间复杂度下界\n\n- 对于下标 i < j，如果 A[i] > A[j]，则称 (i, j) 是一对逆序对 (inversion)\n- 问题：序列\
    \ {34, 8, 64, 51, 32, 21} 中有多少逆序对？\n  (34, 8) (34, 32) (34, 21) (64, 51) (64,\
    \ 32) (64, 21) (51, 32) (51, 21) (32, 21)\n- 交换 2 个相邻元素正好消去 1 个逆序对！\n- 插入排序：T(N,\
    \ I) = O(N + I) — 如果序列基本有序，则插入排序简单且高效\n"
