    \n$f(x)=a_0+x(a_1+x(\\cdots(a_{n-1}+x(a_n))\\cdots))$\n\n```\ndouble f( int n,\
    \ double a[], double x )\n{\n  int i;\n  double p = a[n];\n  for ( i=n; i>0; i--\
