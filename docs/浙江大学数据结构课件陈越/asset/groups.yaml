    \n    Graph = (MGraph)malloc(sizeof(struct GNode));\n    Graph->Nv = VertexNum;\n\
    \    Graph->Ne = 0;\n\n    /* 注意：这里默认顶点编号从0开始，到(Graph->Nv - 1) */\n    for (V=0;\
    \ V<Graph->Nv; V++)\n        for (W=0; W<Graph->Nv; W++)\n            Graph->G[V][W]\
    \ = 0; /* 或INFINITY */\n\n    return Graph;\n}\n```\n\n# 向MGraph中插入边\n\n```c\n\
    typedef struct ENode *PtrToENode;\nstruct ENode {\n    Vertex V1, V2; /* 有向边<V1,\
    \ V2> */\n    WeightType Weight; /* 权重 */\n};\ntypedef PtrToENode Edge;\n\nvoid\
    \ InsertEdge( MGraph Graph, Edge E )\n{\n    /* 插入边 <V1, V2> */\n    Graph->G[E->V1][E->V2]\
    \ = E->Weight;\n\n    /* 若是无向图，还要插入边<V2, V1> */\n    Graph->G[E->V2][E->V1] =\
    \ E->Weight;\n}\n```\n\n## 完整地建立一个MGraph\n\n### 输入格式\n\nNv Ne  \nV1 V2 Weight\
    \  \n......\n\n```c\nMGraph BuildGraph()\n{\n    MGraph Graph;\n    Edge E;\n\
    \    Vertex V;\n    int Nv, i;\n\n    scanf(\"%d\", &Nv);\n    Graph = CreateGraph(Nv);\n\
    \    scanf(\"%d\", &(Graph->Ne));\n    if ( Graph->Ne != 0 ) {\n        E = (Edge)malloc(sizeof(struct\
    \ ENode));\n        for (i=0; i<Graph->Ne; i++) {\n            scanf(\"%d %d %d\"\
    ,\n            &E->V1, &E->V2, &E->Weight);\n            InsertEdge( Graph, E\
    \ );\n        }\n    }\n\n    /* 如果顶点有数据的话，读入数据 */\n    for (V=0; V<Graph->Nv;\
    \ V++)\n        scanf(\" %c\", &(Graph->Data[V]));\n\n    return Graph;\n}\n```\n\
