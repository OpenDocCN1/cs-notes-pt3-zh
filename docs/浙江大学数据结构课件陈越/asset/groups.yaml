  mdcn: "\n\n## 图不连通怎么办？\n\n- 连通：如果从v到w存在一条（无向）路径，则称v和w是连通的\n- 路径：v到w的路径是一系列顶点{V,\
    \ v1, v2, ..., vn, w}的集合，其中任一对相邻的顶点间都有图中的边。路径的长度是路径中的边数（如果带权，则是所有边的权重和）。如果v到w之间的所有顶点都不同，则称简单路径\n\
    - 回路：起点等于终点的路径\n- 连通图：图中任意两顶点均连通\n\n## 连通分量：无向图的极大连通子图\n\n- 极大顶点数：再加1个顶点就不连通了\n\
    - 极大边数：包含子图中所有顶点相连的所有边\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_283_0.png)\n\
    \n## 图不连通怎么办？\n\n- 强连通：有向图中顶点v和w之间存在双向路径，则称v和w是强连通的\n- 强连通图：有向图中任意两顶点均强连通\n- 强连通分量：有向图的极大强连通子图\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_284_0.png)\n\n## 图不连通怎么办？\n\n```c\n\
