    [例] 在登录QQ的时候，QQ服务器是如何核对你的身份？面对庞大的用户群,如何快速找到用户信息？


    [分析] 看看是否可以用二分法查找。


    +   > 十亿（\(10^9 \approx 2^{30}\)）有效用户，用二分查找30次。


    +   > 十亿（\(10^9 \approx 2^{30}\)） × 1K ≈ 1024G，1T连续空间。


    +   > 按有效QQ号大小有序存储：在连续存储空间中，插入和删除一个新QQ号码将需要移动大量数据。


