    \n```c\n#define MaxTree 10\n#define ElementType char\n#define Tree int\n#define\
    \ Null -1\nstruct TreeNode\n{\n    ElementType Element;\n    Tree  Left;\n   \
    \ Tree  Right;\n} T1[MaxTree], T2[MaxTree];\n```\n\n|   | A | B | C | D |   |\n\
    |---|---|---|---|---|---|\n| Left | -1 | 2 | -1 | -1 |   |\n| Right | 1 | 3 |\
    \ -1 | -1 |   |\n|   | 0 | 1 | 2 | 3 | 4 |\n\n"
