    \ < |V|; cnt++ ) {\n        v = 未输出的入度为0的顶点;  /* O(|V|) */\n        if ( 这样的v不存在\
    \ ) {\n            Error ( “图中有回路” );\n            break;\n        }\n       \
    \ 输出v，或者记录v的输出序号;\n        for ( v 的每个邻接点 w )\n            Indegree[w]--;\n  \
