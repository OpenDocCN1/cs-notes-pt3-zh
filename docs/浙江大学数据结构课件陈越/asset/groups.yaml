    \n> 负数表示根结点；\n> 非负数表示双亲结点的下标。\n\n# 集合运算\n\n（1）查找某个元素所在的集合（用根结点表示）\n\n```c\nint\
    \ Find( SetType S[ ], ElementType X )\n{\n    /* 在数组S中查找值为X的元素所属的集合 */\n\n   \
