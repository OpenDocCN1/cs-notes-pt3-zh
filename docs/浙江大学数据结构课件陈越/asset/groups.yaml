    \ (answer==YES) output (\"Yes\" );\nelse output (\"No\" );\n}\n```\n\n## DFS算法\n\
    \n```c\nvoid DFS ( Vertex V )\n{ visited[V] = true;\n    for ( V 的每个邻接点 W )\n\
    \        if ( !visited[W] )\n            DFS(W);\n}\n```\n\n```c\nint DFS ( Vertex\
    \ V )\n{ visited[V] = true;\n    if ( IsSafe(V) ) answer = YES;\n    else {\n\
    \        for ( each W in G )\n            if ( !visited[W] && Jump(V,W) ) {\n\
    \                answer = DFS(W);\n                if (answer==YES) break;\n \
    \           }\n    }\n    return answer;\n}\n```\n\n# 第六讲 图（上）\n\n浙江大学 陈越\n\n\
    ## 算法思路\n\n- 对每个节点，进行广度优先搜索\n- 搜索过程中累计访问的节点数\n- 需要记录“层”数，仅计算6层以内的节点数\n\n```c\n\
    void SDS()\n{\n    for ( each V in G ) {\n        count = BFS( V );\n        Output(\
    \ count/N );\n    }\n}\n```\n\n```c\nint BFS ( Vertex V )\n{\n    visited[V] =\
    \ true; count = 1;\n    Enqueue( V, Q );\n    while( !IsEmpty( Q ) ){\n    V =\
    \ Dequeue( Q );\n    for ( V 的每个邻接点 W )\n    if ( !visited[W] ) {\n    visited[W]\
    \ = true;\n    Enqueue( W, Q ); count ++;\n    }\n    } return count;\n}\n```\n\
    \n```c\nint BFS ( Vertex V )\n{ visited[V] = true; count = 1;\n  level = 0; last\
    \ = V;\n  Enqueue(V, Q);\n  while(!IsEmpty(Q)){\n    V = Dequeue(Q);\n    for\
    \ ( V 的每个邻接点 W )\n      if ( !visited[W] ) {\n        visited[W] = true;\n   \
    \     Enqueue(W, Q); count++;\n        tail = W;\n      }\n    if ( V == last\
    \ ) {\n      level++; last = tail;\n    }\n    if ( level == 6 ) break;\n  }\n\
    \  return count;\n}\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_296_0.png)\n\
