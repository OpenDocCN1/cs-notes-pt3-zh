  - "[PAGE 40]\n\n# # 算法4：在线处理\n\n```\nint MaxSubseqSum( int A[], int N )\n{\n   \
    \ int ThisSum, MaxSum;\n    int i;\n    ThisSum = MaxSum = 0;\n    for( i = 0;\
    \ i < N; i++ ) {\n        ThisSum += A[i]; /* 向右累加 */\n        if( ThisSum > MaxSum\
    \ )\n            MaxSum = ThisSum; /* 发现更大和则更新当前结果 */\n        else if( ThisSum\
    \ < 0 ) /* 如果当前子列和为负 */\n            ThisSum = 0; /* 则不可能使后面的部分和增大，抛弃之 */\n  \
    \  }\n    return MaxSum;\n}\n\nT(N) = O(N)\n```\n\n“在线”的意思指每输入一个数据就进行即时处理，在任何一个地方中止输入，算法都能正确给出当前的解。"
