  - "[PAGE 178]\n\n# 什么是平衡二叉树\n\n“平衡因子（Balance Factor，简称BF）：**BF(T) = hₗ - hᵣ**，其中hₗ和hᵣ分别为T的左、右子树的高度。\n\
    \n> **平衡二叉树（Balanced Binary Tree）（AVL树）**  \n> 空树，或者  \n> 任一结点左、右子树高度差的绝对值不超过1，即\
    \ **|BF(T)| ≤ 1**\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_178_0.png)"
