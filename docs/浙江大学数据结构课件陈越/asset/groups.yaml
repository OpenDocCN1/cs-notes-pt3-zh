    \n- 空间复杂度\\(S(n)\\) —— 根据算法写成的程序在执行时占用存储单元的长度。这个长度往往与输入数据的规模有关。空间复杂度过高的算法可能导致使用的内存超限，造成程序非正常中断。\n\
    \n- 时间复杂度\\(T(n)\\) —— 根据算法写成的程序在执行时耗费时间的长度。这个长度往往也与输入数据的规模有关。时间复杂度过高的低效算法可能导致我们在有生之年都等不到运行结果。\n\
    \n## 1.1 例2\n\n```c\nvoid PrintN ( int N )\n{\n    if ( N ){\n        PrintN(\
    \ N - 1 );\n        printf(\"%d\\n\", N );\n    }\n    return;\n}\n```\n\n| ……\
    \ | 100000 | 99999 | 99998 | …… …… | 1 | …… |\n|---|---:|---:|---:|---|---:|---|\n\
    \nPrintN(100000)\nPrintN(99999)\nPrintN(99998)\nPrintN(99997)\n…… ……\nPrintN(0)\n\
    \n\\(S(N)=C\\cdot N\\)\n\n### 1.1 例3\n\n```c\ndouble f( int n, double a[], double\
    \ x )\n{ int i;\n  double p = a[0];\n  for ( i=1; i<=n; i++ )      (1+2+......+n)\n\
    \    p += (a[i] * pow(x, i));   =(n^2+n)/2次乘法\n  return p;\n}\n```\n\n```c\ndouble\
    \ f( int n, double a[], double x )\n{ int i;\n  double p = a[n];\n  for ( i=n;\
    \ i>0; i-- )      n次乘法!\n    p = a[i-1] + x*p;\n  return p;\n}\n```\n\n### 什么是好的算法？\n\
    \n在分析一般算法的效率时，我们经常关注下面两种复杂度\n\n- 最坏情况复杂度 \\( T_{worst}(n) \\)\n\n- 平均复杂度 \\( T_{avg}(n)\
    \ \\)\n\n\\( T_{avg}(n) \\leq T_{worst}(n) \\)\n\n## 输入规模 *n*\n\n| 函数 | 1 | 2\
    \ | 4 | 8 | 16 | 32 |\n|---|---:|---:|---:|---:|---:|---:|\n| 1 | 1 | 1 | 1 |\
    \ 1 | 1 | 1 |\n| \\(\\log n\\) | 0 | 1 | 2 | 3 | 4 | 5 |\n| \\(n\\) | 1 | 2 |\
    \ 4 | 8 | 16 | 32 |\n| \\(n\\log n\\) | 0 | 2 | 8 | 24 | 64 | 160 |\n| \\(n^2\\\
    ) | 1 | 4 | 16 | 64 | 256 | 1024 |\n| \\(n^3\\) | 1 | 8 | 64 | 512 | 4096 | 32768\
    \ |\n| \\(2^n\\) | 2 | 4 | 16 | 256 | 65536 | 4294967296 |\n| \\(n!\\) | 1 | 2\
    \ | 24 | 40320 | 20922789888000 | \\(2.6313 \\times 10^{35}\\) |\n"
