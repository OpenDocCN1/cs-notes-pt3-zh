    \ ) {\n        printf( \" 位置不合法 \" );\n        return;\n    }\n    for ( j = PtrL->Last;\
    \ j >= i-1; j-- )\n        PtrL->Data[j+1] = PtrL->Data[j]; /*将 a~i~ 到 a~n~ 倒序向后移动*/\n\
    \    PtrL->Data[i-1] = X; /*新元素插入*/\n    PtrL->Last++; /*Last仍指向最后元素*/\n    return;\n\
    }\n```\n\n### 4. 删除（删除表的第 \\( i \\ (1 \\leq i \\leq n) \\) 个位置上的元素）\n\n| 下标 i\
    \ | 0 | 1 | …… | i-1 | i | …… | n-1 | …… | MAXSIZE-1 |\n|---|---|---|---|---|---|---|---|---|---|\n\
    | Data | a₁ | a₂ | …… | aᵢ | aᵢ₊₁ | …… | aₙ | …… | - |\n\n后面的元素依次前移\n\n| 下标 i\
