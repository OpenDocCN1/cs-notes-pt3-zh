    \n```c\nPosition IterFind( ElementType X, BinTree BST )\n{\n    while( BST ) {\n\
    \        if( X > BST->Data )\n            BST = BST->Right; /* 向右子树中移动，继续查找 */\n\
    \        else if( X < BST->Data )\n            BST = BST->Left;  /* 向左子树中移动，继续查找\
    \ */\n        else /* X == BST->Data */\n            return BST; /* 查找成功，返回找到结点的地址\
    \ */\n    }\n    return NULL; /* 查找失败 */\n}\n```\n\n"
