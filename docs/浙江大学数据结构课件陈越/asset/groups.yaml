  - "[PAGE 432]\n\n# 一个“好”的散列函数一般应考虑下列两个因素：\n\n+   1. 计算简单，以便提高转换速度；\n+   2. 关键词对应的地址空间分布均匀，以尽量减少冲突。\n\
    \n# 数字关键词的散列函数构造\n\n+   1. 直接定址法\n\n取关键词的某个线性函数值为散列地址，即  \nh(key) = a × key +\
    \ b   （a、b为常数）\n\n| 地址h(key) | 出生年份(key) | 人数(attribute) |\n|------------|---------------|-----------------|\n\
    | 0          | 1990          | 1285万          |\n| 1          | 1991         \
    \ | 1281万          |\n| 2          | 1992          | 1280万          |\n| ... \
    \       | ......        | ......          |\n| 10         | 2000          | 1250万\
    \          |\n| ...        | ......        | ......          |\n| 21         |\
    \ 2011          | 1180万          |\n\n> h(key)=key-1990"
