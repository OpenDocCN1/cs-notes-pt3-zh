    \n栈的顺序存储结构通常由一个一维数组和一个记录栈顶元素位置的变量组成。\n\n```c\n#define MaxSize <储存数据元素的最大个数>\n\
    typedef struct SNode *Stack;\nstruct SNode{\n        ElementType Data[MaxSize];\n\
    \        int Top;\n};\n```\n\n```c\nvoid Push( Stack PtrS, ElementType item )\n\
    {\n    if ( PtrS->Top == MaxSize-1 ) {\n        printf( “堆栈满” );  return;\n  \
    \  } else {\n        PtrS->Data[++(PtrS->Top)] = item;\n        return;\n    }\n\
    }\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_79_0.png)\n\n[例] 请用一个数组实现两个堆栈，要求最大地利用数组空间，使数组只要有空间入栈操作就可以成功。\n\
    \n【分析】一种比较聪明的方法是使这两个栈分别从数组的两头开始向中间生长；当两个栈的栈顶指针相遇时，表示两个栈都满了。\n\n```c\n#define MaxSize\
    \ <存储数据元素的最大个数>\nstruct DStack {\n    ElementType Data[MaxSize];\n    int Top1;\
    \ /* 堆栈 1 的栈顶指针 */\n    int Top2; /* 堆栈 2 的栈顶指针 */\n} S;\n\nS.Top1 = -1;\nS.Top2\
    \ = MaxSize;\n```\n\n```c\nvoid Push( struct DStack *PtrS, ElementType item, int\
    \ Tag )\n{\n    /* Tag作为区分两个堆栈的标志，取值为1和2 */\n    if ( PtrS->Top2 - PtrS->Top1\
    \ == 1 ) { /*堆栈满*/\n        printf(\"堆栈满\");  return ;\n    }\n    if ( Tag ==\
    \ 1 ) /* 对第一个堆栈操作 */\n        PtrS->Data[++(PtrS->Top1)] = item;\n    else   \
    \ /* 对第二个堆栈操作 */\n        PtrS->Data[--(PtrS->Top2)] = item;\n}\n```\n\n```c\n\
    ElementType Pop( struct DStack *PtrS, int Tag )\n{\n    /* Tag作为区分两个堆栈的标志，取值为1和2\
    \ */\n    if ( Tag == 1 ) { /* 对第一个堆栈操作 */\n        if ( PtrS->Top1 == -1 ) {\
    \ /*堆栈1空 */\n            printf(\"堆栈1空\");  return NULL;\n        } else return\
    \ PtrS->Data[(PtrS->Top1)--];\n    } else {    /* 对第二个堆栈操作 */\n        if ( PtrS->Top2\
    \ == MaxSize ) { /*堆栈2空 */\n            printf(\"堆栈2空\");  return NULL;\n    \
    \    } else return PtrS->Data[(PtrS->Top2)++];\n    }\n}\n```\n\n## 堆栈的链式存储实现\n\
    \n栈的链式存储结构实际上就是一个单链表，叫做链栈。插入和删除操作只能在链栈的栈顶进行。栈顶指针Top应该在链表的哪一头？\n\ntypedef struct\
    \ SNode *Stack;\nstruct SNode{\n    ElementType Data;\n    struct SNode *Next;\n\
    };\n\n(1) 堆栈初始化（建立空栈）\n(2) 判断堆栈S是否为空\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_83_0.png)\n\
    \n```c\nStack CreateStack()\n{\n    /* 构建一个堆栈的头结点，返回指针 */\n    Stack S;\n    S\
    \ = (Stack)malloc(sizeof(struct SNode));\n    S->Next = NULL;\n    return S;\n\
    }\n```\n\n```c\nint IsEmpty(Stack S)\n{\n    /*判断堆栈s是否为空，若为空函数返回整数1，否则返回0 */\n\
    \    return ( S->Next == NULL );\n}\n```\n\n```c\nvoid Push( ElementType item,\
    \ Stack S)\n{ /* 将元素item压入堆栈S */\n    struct SNode *TmpCell;\n    TmpCell=(struct\
    \ SNode *)malloc(sizeof(struct SNode));\n    TmpCell->Element = item;\n    TmpCell->Next\
    \ = S->Next;\n    S->Next = TmpCell;\n}\n```\n\n```c\nElementType Pop(Stack S)\n\
    { /* 删除并返回堆栈S的栈顶元素 */\n    struct SNode *FirstCell;\n    ElementType TopElem;\n\
    \    if( IsEmpty( S ) {\n    printf(\"堆栈空\"); return NULL;\n    } else {\n   \
    \ FirstCell = S->Next;\n    S->Next = FirstCell->Next;\n    TopElem = FirstCell\
    \ ->Element;\n    free(FirstCell);\n    return TopElem;\n    }\n}\n```\n\n"
