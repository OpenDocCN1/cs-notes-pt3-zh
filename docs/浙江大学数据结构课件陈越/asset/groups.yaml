    \      if ( V!=T->v) return 0;\n        else T->flag = 1;\n\n        for (i=1;\
    \ i<N; i++) {\n                scanf(\"%d\", &V);\n                if (!check(T,\
    \ V)) return 0;\n        }\n\n        return 1;\n}\n```\n\n3 2 4 1  \n\n当发现序列中的某个数字与不一致时，必须把序列后面的数都读完！\
    \  \n\n# 如何判别\n\n```c\nint Judge( Tree T, int N )\n{\n        int i, V, flag =\
    \ 0;\n        /* flag: 0代表目前还一致，1代表已经不一致*/\n\n        scanf(\"%d\", &V);\n   \
    \     if ( V!=T->v) flag = 1;\n        else T->flag = 1;\n        for (i=1; i<N;\
    \ i++) {\n                scanf(\"%d\", &V);\n                if ( (!flag) &&\
    \ (!check(T, V)) ) flag = 1;\n        }\n        if (flag) return 0;\n       \
    \ else return 1;\n}\n```\n\n```c\nvoid ResetT ( Tree T ) /* 清除T中各结点的flag标记 */\n\
    {\n    if (T->Left) ResetT(T->Left);\n    if (T->Right) ResetT(T->Right);\n  \
    \  T->flag = 0;\n}\n```\n\n```c\nvoid FreeTree ( Tree T ) /* 释放T的空间 */\n{\n  \
    \  if (T->Left) FreeTree(T->Left);\n    if (T->Right) FreeTree(T->Right);\n  \
    \  free(T);\n}\n```\n\n"
