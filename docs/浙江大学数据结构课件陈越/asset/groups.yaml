  - "[PAGE 456]\n\n# 散列表的性能分析\n\n+   - 平均查找长度（ASL）用来度量散列表查找效率：成功、不成功\n+   - 关键词的比较次数，取决于产生冲突的多少\n\
    +   \n+     影响产生冲突多少有以下三个因素：\n+     1. 散列函数是否均匀；\n+     2. 处理冲突的方法；\n+     3.\
    \ 散列表的装填因子 α。\n\n分析：不同冲突处理方法、装填因子对效率的影响"
