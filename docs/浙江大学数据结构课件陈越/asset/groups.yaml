    \    while ( T || !IsEmpty(S) ){\n        while(T){ /*一直向左并将沿途结点压入堆栈*/\n     \
    \       Push(S,T);\n            T = T->Left;\n        }\n        if(!IsEmpty(S)){\n\
    \            T = Pop(S); /*结点弹出堆栈*/\n            printf(\"%5d\", T->Data); /*（访问）打印结点*/\n\
    \            T = T->Right; /*转向右子树*/\n        }\n    }\n}\n```\n\n### 后序遍历非递归遍历算法\n\
    \n## 层序遍历\n\n二叉树遍历的核心问题：二维结构的线性化\n\n- 从结点访问其左、右儿子结点\n- 访问左儿子后，右儿子结点怎么办？\n- 需要一个存储结构保存暂时不访问的结点\n\
    - 存储结构：堆栈、队列\n\n### 层序遍历\n\n❖ **队列实现：** 遍历从根结点开始，首先将根结点入队，然后开始执行循环：结点出队、访问该结点、其左右儿子入队\n\
    \n**层序遍历 =>** `A B C D F G I E H`\n\n层序基本过程：先根结点入队，然后：\n\n- ① 从队列中取出一个元素；\n- ②\
