    +   - 定义增量序列 $D_M>D_{M-1}>\cdots>D_1=1$

    +   - 对每个 $D_k$ 进行“$D_k$-间隔”排序 $(k=M,M-1,\ldots,1)$

    +   - **注意：**“$D_k$-间隔”有序的序列，在执行“$D_{k-1}$-间隔”排序后，仍然是“$D_k$-间隔”有序的'
  - "[PAGE 381]\n\n# 希尔增量序列\n\n▪ 原始希尔排序　$D_M=\\lfloor N/2\\rfloor,\\quad D_k=\\lfloor\
    \ D_{k+1}/2\\rfloor$\n\n```\n```c\nvoid Shell_sort( ElementType A[], int N )\n\
    {\n  for ( D=N/2; D>0; D/=2 ) { /* 希尔增量序列 */\n    for ( P=D; P<N; P++ ) { /* 插入排序\
    \ */\n      Tmp = A[P];\n      for ( i=P; i>=D && A[i-D]>Tmp; i-=D )\n       \
    \ A[i] = A[i-D];\n      A[i] = Tmp;\n    }\n  }\n}\n```\n```\n\n最坏情况：$T=O(N^2)$"
