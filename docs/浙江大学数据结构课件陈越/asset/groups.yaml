    # # 什么是二叉搜索树


    二叉搜索树（BST，Binary Search Tree），

    也称二叉排序树或二叉查找树


    二叉搜索树：一棵二叉树，可以为空；如果不为空，满足以下性质：

    1. 非空左子树的所有键值小于其根结点的键值。

    2. 非空右子树的所有键值大于其根结点的键值。

    3. 左、右子树都是二叉搜索树。


