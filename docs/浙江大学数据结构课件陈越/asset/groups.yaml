    \    return 0;\n}\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_474_0.png)\n\
    \n```c\nint main()\n{\n    int N, i;\n    ElementType Key;\n    HashTable H;\n\
    \n    scanf(\"%d\", &N);\n    H = CreateTable(N*2); /* 创建一个散列表 */\n    for (i=0;\
    \ i<N; i++) {\n        scanf(\"%s\", Key); Insert( H, Key );\n        scanf(\"\
    %s\", Key); Insert( H, Key );\n    }\n    ScanAndOutput( H );\n    DestroyTable(\
    \ H );\n    return 0;\n}\n```\n\n扫描整个散列表\n\n更新最大通话次数；\n更新最小号码 + 统计人数；\n\n## 模块的引用与裁剪\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_476_0.png)\n\n```c\n#define KEYLENGTH\
    \ 11 /* 关键词字符串的最大长度 */\n/* 关键词类型用字符串 */\ntypedef char ElementType[KEYLENGTH+1];\n\
    typedef int Index; /* 散列地址类型 */\n```\n\n```c\ntypedef struct LNode *PtrToLNode;\n\
    struct LNode {\n    ElementType Data;\n    PtrToLNode Next;\n    int Count;\n\
    };\ntypedef PtrToLNode Position;\ntypedef PtrToLNode List;\n```\n\n```c\ntypedef\
    \ struct TblNode *HashTable;\nstruct TblNode { /* 散列表结点定义 */\n    int TableSize;\
    \ /* 表的最大长度 */\n    List Heads; /* 指向链表头结点的数组 */\n};\n```\n\nCopyright @ 2014,\
    \ 浙江大学计算机科学与技术学院  \nAll Rights Reserved\n\n## 模块的引用与裁剪\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_477_0.png)\n\
    \n```c\n#define MAXTABLESIZE 100000\nint NextPrime( int N )\n{ /* 返回大于N且不超过MAXTABLESIZE的最小素数\
    \ */\n    int i, p = (N%2)? N + 2 : N+1; /* 从大于N的下一个奇数开始 */\n    while ( p <=\
    \ MAXTABLESIZE ) {\n        for( i=(int)sqrt( p ); i>2; i-- )\n            if\
    \ ( !(p%i) ) break; /* p不是素数 */\n        if ( i==2 ) break; /* for正常结束，说明p是素数\
    \ */\n        else p += 2; /* 否则试探下一个奇数 */\n    }\n    return p;\n}\n\nHashTable\
    \ CreateTable( int TableSize )\n{\n    HashTable H;\n    int i;\n    H = (HashTable)malloc(sizeof(struct\
    \ TblNode));\n    H->TableSize = NextPrime(TableSize);\n    H->Heads = (List)malloc(H->TableSize*sizeof(struct\
    \ LNode));\n    for( i=0; i<H->TableSize; i++ ) {\n        H->Heads[i].Data[0]\
    \ = '\\0'; H->Heads[i].Next = NULL;\n        H->Heads[i].Count = 0;\n    }\n \
    \   return H;\n}\n```\n\n```c\nint Hash ( int Key, int P )\n{ /* 除留余数法散列函数 */\n\
    \    return Key%P;\n}\n```\n\n## 模块的引用与裁剪\n\n```c\nbool Insert( HashTable H, ElementType\
    \ Key )\n{\n    Position P, NewCell;\n    Index Pos;\n\n    P = Find( H, Key );\n\
    \    if ( !P ) { /* 关键词未找到，可以插入 */\n        NewCell = (Position)malloc(sizeof(struct\
    \ LNode));\n        strcpy(NewCell->Data, Key);\n        NewCell->Count = 1;\n\
    \        Pos = Hash(atoi(Key+KEYLENGTH-MAX), H->TableSize);\n        /* 将NewCell插入为H->Heads[Pos]链表的第1个结点\
    \ */\n        NewCell->Next = H->Heads[Pos].Next;\n        H->Heads[Pos].Next\
    \ = NewCell;\n        return true;\n    }\n    else { /* 关键词已存在 */\n        P->Count++;\n\
    \        return false;\n    }\n}\n```\n\n## 树之 习题选讲\n\n浙江大学 陈 越\n\n## Tree Traversals\
    \ Again\n\nCopyright @ 2014, 浙江大学计算机科学与技术学院  \nAll Rights Reserved\n\n## 题意理解\n\
    \n### 非递归中序遍历\n\n- Push的顺序为先序遍历\n- Pop的顺序给出中序遍历\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_482_0.png)\n\
    \nSample Input:\n6\nPush 1\nPush 2\nPush 3\nPop\nPop\nPush 4\nPop\nPop\nPush 5\n\
    Push 6\nPop\nPop\n\n|   |   |   |   |   |   |\n|---|---|---|---|---|---|\n| pre\
    \ | 1 | 2 | 3 | 4 | 5 | 6 |\n| in | 3 | 2 | 4 | 1 | 6 | 5 |\n\n## 核心算法\n\npre\
    \ ① 2 3 4 5 6\n\nin 3 2 4 ① 6 5\n\npost 3 4 2 6 5 ①\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_483_0.png)\n\
    \n```c\nvoid solve( int prel, int inl, int postL, int n )\n{\n    if (n==0) return;\n\
    \n    if (n==1) (post[postL] = pre[preL]; return;)\n\n    root = pre[preL];\n\
    \    post[postL+n-1] = root;\n\n    for (i=0; i<n; i++)\n    if (in[inL+i] ==\
    \ root) break;\n\n    L = i; R = n-L-1;\n    solve(preL+1, inL, postL, L);\n \
    \   solve(preL+L+1, inL+L+1, postL+L, R);\n}\n```\n\nCopyright @ 2014, 浙江大学计算机科学与技术学院\n\
