    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_75_0.png)\n\n## 堆栈的抽象数据类型描述\n\n**类型名称：**堆栈（Stack）\n\
    \n**数据对象集：**一个有0个或多个元素的有穷线性表。\n\n**操作集：**长度为MaxSize的堆栈S ∈ Stack，堆栈元素item ∈ ElementType\n\
    \n+   1. `Stack CreateStack( int MaxSize )`：生成空堆栈，其最大长度为MaxSize；\n+   2. `int\
    \ IsFull( Stack S, int MaxSize )`：判断堆栈S是否已满；\n+   3. `void Push( Stack S, ElementType\
    \ item )`：将元素item压入堆栈；\n+   4. `int IsEmpty( Stack S )`：判断堆栈S是否为空；\n+   5. `ElementType\
    \ Pop( Stack S )`：删除并返回栈顶元素；\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_77_0.png)\n\
