    \ ( BinTree BT )\n{\n    Queue Q;  BinTree T;\n    if ( !BT ) return; /* 若是空树则直接返回\
    \ */\n    Q = CreatQueue( MaxSize ); /*创建并初始化队列Q*/\n    AddQ( Q, BT );\n    while\
    \ ( !IsEmpty( Q ) ) {\n        T = DeleteQ( Q );\n        printf(\"%d\\n\", T->Data);\
    \ /*访问取出队列的结点*/\n        if ( T->Left )  AddQ( Q, T->Left );\n        if ( T->Right\
    \ ) AddQ( Q, T->Right );\n    }\n}\n```\n\n## 【例】求二叉树的高度。\n\n```c\nint PostOrderGetHeight(\
