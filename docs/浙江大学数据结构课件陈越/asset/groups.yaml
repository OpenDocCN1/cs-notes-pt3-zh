    # # 前提


    `void X_Sort ( ElementType A[], int N )`


    +   - 大多数情况下，为简单起见，讨论从小大的整数排序


    +   - N是正整数


    +   - 只讨论基于比较的排序（> = < 有定义）


    +   - 只讨论内部排序


    +   - 稳定性：任意两个相等的数据，排序前后的相对位置不发生改变


    +   - 没有一种排序是任何情况下都表现最好的'
  - "[PAGE 374]\n\n# 简单排序\n\n# 冒泡排序\n\n```\n```c\nvoid Bubble_Sort( ElementType A[],\
    \ int N )\n{\n    for ( P=N-1; P>=0; P-- ) {\n        flag = 0;\n        for(\
    \ i=0; i<P; i++ ) { /* 一趟冒泡 */\n            if ( A[i] > A[i+1] ) {\n         \
    \       Swap(A[i], A[i+1]);\n                flag = 1; /* 标识发生了交换 */\n       \
    \     }\n        }\n        if ( flag==0 ) break; /* 全程无交换 */\n    }\n}\n```\n\
    ```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_374_0.png)\n\n最好情况：顺序 $T=O(N)$\n\
    \n最坏情况：逆序 $T=O(N^2)$\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_374_1.png)"
