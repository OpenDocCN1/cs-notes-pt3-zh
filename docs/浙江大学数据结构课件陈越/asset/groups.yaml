  - "[PAGE 407]\n\n# # 算法实现\n\n```\nvoid Quicksort( ElementType A[], int Left, int\
    \ Right )\n{\n    if ( Cutoff <= Right-Left ) {\n    Pivot = Median3( A, Left,\
    \ Right );\n    i = Left; j = Right - 1;\n    for( ; ; ) {\n        while ( A[++i]\
    \ < Pivot ) { }\n        while ( A[--j] > Pivot ) { }\n        if ( i < j )\n\
    \        Swap( &A[i], &A[j] );\n        else break;\n    }\n    Swap( &A[i], &A[\
    \ Right-1 ] );\n    Quicksort( A, Left, i-1 );\n    Quicksort( A, i+1, Right );\n\
    \    }\n    else\n    Insertion_Sort( A+Left, Right-Left+1 );\n}\n```"
