  - "[PAGE 363]\n\n# 聪明的算法\n\n+   随时将入度变为0的顶点放到一个容器里\n\n```\nvoid TopSort()\n{\n \
    \   for ( 图中每个顶点 V )\n        if ( Indegree[V]==0 )\n            Enqueue( V, Q\
    \ );\n    while ( !IsEmpty(Q) ) {\n        V = Dequeue( Q );\n        输出V，或者记录V的输出序号；\
    \ cnt++;\n        for ( V 的每个邻接点 W )\n            if ( --Indegree[W]==0 )\n  \
    \              Enqueue( W, Q );\n    }\n    if ( cnt != |V| )\n        Error(“图中有回路”\
    \ );\n}\n```\n\nT = O(|V| + |E|)\n\n此算法可以用来检测有向图是否 DAG"
