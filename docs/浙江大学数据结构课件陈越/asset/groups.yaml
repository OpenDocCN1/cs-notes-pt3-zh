  - '[PAGE 351]


    # 什么是最小生成树 (Minimum Spanning Tree)


    最小生成树存在 ↔ 图连通


    +   - 是一棵树

    +     - 无回路

    +     - \(|V|\) 个顶点一定有 \(|V|-1\) 条边


    +   - 是生成树

    +     - 包含全部顶点

    +     - \(|V|-1\) 条边都在图里


    +   - 边的权重和最小


    ![](img/8e26218ef88df8d6f4fe4ce3f83904a5_351_0.png)


    > 向生成树中再加一条边都一定构成回路'
