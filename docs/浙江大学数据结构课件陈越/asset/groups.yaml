    # 哈夫曼树的定义


    带权路径长度(WPL)：设二叉树有**n**个叶子结点，每个叶子结点带有权值 **w**<sub>_k_</sub>，从根结点到每个叶子结点的长度为 **l**<sub>_k_</sub>，则每个叶子结点的带权路径长度之和就是：

    \( WPL = \sum_{k=1}^{n} w_k l_k \)


    最优二叉树或哈夫曼树：WPL最小的二叉树'
