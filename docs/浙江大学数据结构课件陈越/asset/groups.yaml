  - "[PAGE 239]\n\n# 集合运算\n\n（1）查找某个元素所在的集合（用根结点表示）\n\n```\nint Find( SetType S[ ],\
    \ ElementType X )\n{\n    /* 在数组S中查找值为X的元素所属的集合 */\n\n    /* MaxSize是全局变量，为数组S的最大长度\
    \ */\n\n    int i;\n\n    for ( i=0; i < MaxSize && S[i].Data != X; i++);\n\n\
    \    if( i >= MaxSize ) return -1; /* 未找到X，返回-1 */\n\n    for( ; S[i].Parent >=\
    \ 0; i = S[i].Parent );\n\n    return i; /* 找到X所属集合，返回树根结点在数组S中的下标 */\n}\n```"
