  mdcn: "\n## 2.1 线性表及其实现\n\n### 多项式的表示\n\n#### [例] 一元多项式及其运算\n\n一元多项式：\\( f(x) =\
    \ a_0 + a_1x + \\cdots + a_{n-1}x^{n-1} + a_nx^n \\)\n\n主要运算：多项式相加、相减、相乘等\n\n\
    #### 【分析】如何表示多项式？\n\n##### 多项式的关键数据：\n\n- 多项式项数n\n- 各项系数aᵢ及指数i\n\n### 方法1：顺序存储结构直接表示\n\
    \n数组各分量对应多项式各项：\na[i]: 项x^i的系数a_i\n\n例如：\nf(x) = 4x^5 - 3x^2 + 1\n\n表示成：\n\n|\
    \ 下标i | 0 | 1 | 2 | 3 | 4 | 5 | ...... |\n|---|---|---|---|---|---|---|---|\n\
    | a[i] | 1 | 0 | -3 | 0 | 0 | 4 | ...... |\n\n1 -3x^2 4x^5\n\n两个多项式相加：两个数组对应分量相加\n\
    问题：如何表示多项式 x+3x^2000？\n\n### 方法2：顺序存储结构表示非零项\n\n每个非零项 \\(a_i x^i\\) 涉及两个信息：系数\
    \ \\(a_i\\) 和指数 \\(i\\)  \n可以将一个多项式看成是一个 \\((a_i, i)\\) 二元组的集合。\n\n用结构数组表示： 数组分量是由系数\\\
    (a_i\\)、指数\\(i\\)组成的结构，  \n对应一个非零项\n\n例如： \\(P_1(x) = 9x^{12} + 15x^8 + 3x^2\\\
    ) 和 \\(P_2(x) = 26x^{19} - 4x^8 - 13x^6 + 82\\)\n\n| 下标i | 0 | 1 | 2 | ......\
    \ |\n|---|---|---|---|---|\n| 系数a^i | 9 | 15 | 3 | - |\n| 指数i | 12 | 8 | 2 | -\
    \ |\n\n| 下标i | 0 | 1 | 2 | 3 | ...... |\n|---|---|---|---|---|---|\n| 系数a^i |\
    \ 26 | -4 | -13 | 82 | - |\n| 指数i | 19 | 8 | 6 | 0 | - |\n\n(a) \\(P_1(x)\\)\n\
    \n(b) \\(P_2(x)\\)\n\n按指数大小有序存储！\n\n### 方法2：顺序存储结构表示非零项\n\n相加过程：从头开始，比较两个多项式当前对应项的指数\n\
    \nP1: (9,12), (15,8), (3,2)\n\nP2: (26,19), (-4,8), (-13,6), (82,0)\n\nP3: (26,19)\
    \ (9,12) (11,8) (-13,6) (3,2) (82,0)\n\n\\(P_3(x) = 26x^{19} + 9x^{12} + 11x^8\
    \ - 13x^6 + 3x^2 + 82\\)\n\n### 方法3：链表结构存储非零项\n\n链表中每个结点存储多项式中的一个非零项，包括系数和指数两个数据域以及一个指针域\n\
    \n| coef | expon | link |\n|------|-------|------|\n\ntypedef struct PolyNode\
    \ *Polynomial;\nstruct PolyNode {\n    int coef;\n    int expon;\n    Polynomial\
    \ link;\n}\n\n例如：\nP₁(x) = 9x¹² + 15x⁸ + 3x²\nP₂(x) = 26x¹⁹ - 4x⁸ - 13x⁶ + 82\n\
    链表存储形式为：\n\nP1 → 9 12 → 15 8 → 3 2 NULL\nP2 → 26 19 → -4 8 → -13 6 → 82 0 NULL\n\
    \n### 什么是线性表\n\n多项式表示问题的启示：\n1. 同一个问题可以有不同的表示（存储）方法\n2. 有一类共性问题： 有序线性序列的组织和管理\n\
    \n**“线性表(Linear List)”：由同类型数据元素构成有序序列的线性结构**\n➤ 表中元素个数称为线性表的长度\n➤ 线性表没有元素时，称为空表\n\
    ➤ 表起始位置称表头，表结束位置称表尾\n\n### 线性表的抽象数据类型描述\n\n类型名称：线性表（List）\n\n数据对象集：线性表是 n (≥0)个元素构成的有序序列(\
    \ a₁, a₂, ...,aₙ )\n\n操作集：线性表L ∈ List，整数i表示位置，元素X ∈ ElementType，线性表基本操作主要有：\n\n\
    - 1、List MakeEmpty(): 初始化一个空线性表L；\n- 2、ElementType FindKth( int K, List L ): 根据位序K，返回相应元素；\n\
    - 3、int Find( ElementType X, List L ): 在线性表L中查找X的第一次出现位置；\n- 4、void Insert( ElementType\
    \ X, int i, List L): 在位序i前插入一个新元素X；\n- 5、void Delete( int i, List L ): 删除指定位序i的元素；\n\
    - 6、int Length( List L ): 返回线性表L的长度n。\n\n### 主要操作的实现\n\n#### 1.初始化（建立空的顺序表）\n\n\
    ```\nList MakeEmpty( )\n{\n    List PtrL;\n    PtrL = (List )malloc( sizeof(struct\
    \ LNode) );\n    PtrL->Last = -1;\n    return PtrL;\n}\n```\n\n#### 2.查找\n\n```\n\
    int Find( ElementType X, List PtrL )\n{\n    int i = 0;\n    while( i <= PtrL->Last\
    \ && PtrL->Data[i]!= X )\n        i++;\n    if (i > PtrL->Last) return -1; /*\
    \ 如果没找到，返回-1 */\n    else return i;    /* 找到后返回的是存储位置 */\n}\n```\n\n> 查找成功的平均比较次数为\
    \ (n +1)/2，平均时间性能为 O(n)。\n\n#### 3. 插入操作实现\n\n```\nvoid Insert( ElementType X,\
    \ int i, List PtrL )\n{\n    int j;\n    if ( PtrL->Last == MAXSIZE-1 ){ /* 表空间已满，不能插入*/\n\
    \        printf( \" 表满 \" );\n        return;\n    }\n    if ( i < 1 || i > PtrL->Last+2\
    \ ) {\n        printf( \" 位置不合法 \" );\n        return;\n    }\n    for ( j = PtrL->Last;\
    \ j >= i-1; j-- )\n        PtrL->Data[j+1] = PtrL->Data[j]; /*将 a~i~ 到 a~n~ 倒序向后移动*/\n\
    \    PtrL->Data[i-1] = X; /*新元素插入*/\n    PtrL->Last++; /*Last仍指向最后元素*/\n    return;\n\
    }\n```\n\n### 4. 删除（删除表的第 \\( i \\ (1 \\leq i \\leq n) \\) 个位置上的元素）\n\n| 下标 i\
    \ | 0 | 1 | …… | i-1 | i | …… | n-1 | …… | MAXSIZE-1 |\n|---|---|---|---|---|---|---|---|---|---|\n\
    | Data | a₁ | a₂ | …… | aᵢ | aᵢ₊₁ | …… | aₙ | …… | - |\n\n后面的元素依次前移\n\n| 下标 i\
    \ | 0 | 1 | …… | i-1 | …… | n-2 | n-1 | …… | MAXSIZE-1 |\n|---|---|---|---|---|---|---|---|---|---|\n\
    | Data | a₁ | a₂ | …… | aᵢ₊₁ | …… | aₙ | aₙ | …… | - |\n\n### 4. 删除操作实现\n\n```\n\
    void Delete( int i, List PtrL )\n{\n    int j;\n    if( i < 1 || i > PtrL->Last+1\
    \ ) {\n        printf(\"不存在第%d个元素\", i);\n        return;\n    }\n    for ( j\
    \ = i; j <= PtrL->Last; j++ )\n        PtrL->Data[j-1] = PtrL->Data[j];    /*\
    \ 将 aᵢ₊₁～aₙ顺序向前移动 */\n    PtrL->Last--;                           /* Last仍指向最后元素\
    \ */\n    return;\n}\n```\n"
