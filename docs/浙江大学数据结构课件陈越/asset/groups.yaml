    alpha < 0.5$ 的时候，各种探测法的期望探测次数都不大，也比较接近。\n\n线性探测法（虚线）、双散列探测法（实线）U 表示不成功查找，I 表示插入，S\
    \ 表示成功查找\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_459_0.png)\n\n期望探测次数与装填因子\
    \ $\\alpha$ 的关系。\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_460_0.png)\n\n随着\
    \ $\\alpha$ 的增大，线性探测法的期望探测次数增加较快，不成功查找和插入操作的期望探测次数比成功查找的期望探测次数要大。\n\n线性探测法（虚线）、双散列探测法（实线）U\
    \ 表示不成功查找，I 表示插入，S 表示成功查找\n\n期望探测次数与装填因子 $\\alpha$ 的关系。\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_461_0.png)\n\
    \n线性探测法（虚线）、双散列探测法（实线）\n\nU 表示不成功查找，I 表示插入，S 表示成功查找\n\n### 3. 分离链接法的查找性能\n\n所有地址链表的平均长度定义成装填因子\
    \ $\\alpha$，$\\alpha$ 有可能超过 1。\n不难证明：其期望探测次数 $p$ 为：\n\n$$p = \\begin{cases} \\\
    alpha + e^{-\\alpha} & \\text{（对插入和不成功查找而言）} \\\\ 1 + \\frac{\\alpha}{2} & \\\
    text{（对成功查找而言）} \\end{cases}$$\n\n当 $\\alpha = 1$ 时：\n\n- 插入操作和不成功查找的期望 $\\text{ASL}_u\
    \ = 1 + e^{-1} = 1.37$ 次。\n- 成功查找的期望 $\\text{ASL}_s = 1 + 1/2 = 1.5$ 次。\n\n前面例子\
    \ 14 个元素分布在 11 个单链表中，所以 $\\alpha = 14/11 \\approx 1.27$，故\n期望 $\\text{ASL}_u =\
    \ 1.27 + e^{-1.27} \\approx 1.55$ 次\n期望 $\\text{ASL}_s = 1 + 1.27/2 \\approx 1.64$\
    \ 次（例中 $\\text{ASL}_s = 1.36$）。\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_462_0.png)\n\
    \n- 选择合适的 $h(\\text{key})$，散列法的查找效率期望是常数 $O(1)$，它几乎与关键字的空间的大小 $n$ 无关！也适合于关键字直接比较计算量大的问题\n\
    - 它是以较小的 $\\alpha$ 为前提。因此，散列方法是一个以空间换时间\n- 散列方法的存储对关键字是随机的，不便于顺序查找关键字，也不适合于范围查找，或最大值最小值查找。\n\
    \n### 分离链法：\n\n散列表是顺序存储和链式存储的结合，链表部分的存储效率和查找效率都比较低。\n\n关键字删除不需要“懒惰删除”法，从而没有存储“垃圾”。\n\
    \n太小的 $\\alpha$ 可能导致空间浪费，大的 $\\alpha$ 又将付出更多的时间代价。不均匀的链表长度导致时间效率的严重下降。\n\n###\
    \ 应用：文件中单词词频统计\n\n[例] 给定一个英文文本文件，统计文件中所有单词出现的频率，并输出词频最大的前 10% 的单词及其词频。\n假设单词字符定义为大小写字母、数字和下划线，其它字符均认为是单词分隔符，不予考虑。\n\
    \n【分析】关键：对新读入的单词在已有单词表中查找，如果已经存在，则将该单词的词频加 1，如果不存在，则插入该单词并记词频为 1。\n\n如何设计该单词表的数据结构才可以进行快速地查找和插入？\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_467_0.png)\n\n```c\nint main() {\n\
    \    int TableSize = 10000; /* 散列表的估计大小 */\n    int wordcount = 0, length;\n \
    \   HashTable H;\n    ElementType word;\n    FILE *fp;\n    char document[30]\
    \ = \"HarryPotter.txt\"; /* 要被统计词频的文件名 */\n    H = InitializeTable( TableSize\
    \ ); /* 建立散列表 */\n    if(( fp = fopen(document, \"r\" ))==NULL) FatalError(\"\
    无法打开文件!\\n\");\n    while( !feof( fp ) ){\n        length = GetAWord( fp, word\
    \ ); /* 从文件中读取一个单词 */\n        if(length > 3){ /* 只考虑适当长度的单词 */\n            wordcount++;\
    \ /* 统计文件中单词总数 */\n            InsertAndCount( word, H );\n        }\n    }\n\
    \    fclose( fp );\n    printf(\"该文档共出现 %d 个有效单词， \", wordcount);\n    Show( H\
    \ , 10.0/100 ); /* 显示词频前10%的所有单词 */\n    DestroyTable( H ); /* 销毁散列表 */\n    return\
    \ 0;\n}\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_468_0.png)\n\n### 小白专场：\n\
    电话聊天狂人\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_469_0.png)\n\n浙江大学 陈 越\n\n"
