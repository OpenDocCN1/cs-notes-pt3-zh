  md: "\n\n# 第一讲 基本概念\n\n浙江大学 陈 越\n\n## 1.1 什么是数据结构\n\n官方统一定义——没有……\n\n- “数据结构是数据对象，以及存在于该对象的实例和组成实例的数据元素之间的各种联系。这些联系可以通过定义相关的函数来给出。”\n\
    \  Sartaj Sahni，《数据结构、算法与应用》\n\n- “数据结构是ADT（抽象数据类型 Abstract Data Type）的物理实现。”\n\
    \  Clifford A.Shaffer，《数据结构与算法分析》\n\n- “数据结构（data structure）是计算机中存储、组织数据的方式。通常情况下，精心选择的数据结构可以带来最优效率的算法。”\n\
    \  中文维基百科\n\n## 例1：如何在书架上摆放图书？\n\n图书的摆放要使得2个相关操作方便实现：\n\n- 操作1：新书怎么插入？\n- 操作2：怎么找到某本指定的书？\n\
    \n### 方法1：随便放\n\n- 操作1：新书怎么插入？\n  - 哪里有空放哪里，一步到位！\n- 操作2：怎么找到某本指定的书？\n  - ......累死\n\
    \n### 方法3：把书架划分成几块区域，每块区域指定摆放某种类别的图书；在每种类别内，按照书名的拼音字母顺序排放\n\n- 操作1：新书怎么插入？\n \
    \ 先定类别，二分查找确定位置，移出空位\n- 操作2：怎么找到某本指定的书？\n  先定类别，再二分查找\n- 问题：空间如何分配？类别应该分多细？\n\n\
    解决问题方法的效率，跟数据的组织方式有关\n\n## 例2：写程序实现一个函数PrintN，使得传入一个正整数为N的参数后，能顺序打印从1到N的全部正整数\n\
    \n循环实现\n\n```c\nvoid PrintN ( int N )\n{\n    int i;\n    for ( i=1; i<=N; i++\
    \ ){\n    printf(\"%d\\n\", i );\n    }\n    return;\n}\n```\n\n递归实现\n\n```c\n\
    void PrintN ( int N )\n{ if ( N ){\n    PrintN( N - 1 );\n    printf(\"%d\\n\"\
    , N );\n    }\n    return;\n}\n```\n\n令 N = 100, 1000, 10000, 100000, ......\n\
    \n递归实现\n\n```c\n#include <stdio.h>\nvoid PrintN ( int N );\nint main ()\n{ int\
    \ N;\n    scanf(\"%d\", &N);\n    PrintN( N );\n    return 0;\n}\n```\n\n循环实现\n\
    \nCopyright @ 2012, 浙江大学计算机科学与技术学院  \nAll Rights Reserved\n\n解决问题方法的效率，跟空间的利用效率有关\n\
    \n## 例3：写程序计算给定多项式在给定点x处的值\n\n$f(x)=a_0+a_1x+\\cdots+a_{n-1}x^{n-1}+a_nx^n$\n\n\
    ```c\ndouble f( int n, double a[], double x )\n{\n  int i;\n  double p = a[0];\n\
    \  for ( i=1; i<=n; i++ )\n    p += (a[i] * pow(x, i));\n  return p;\n}\n```\n\
    \n$f(x)=a_0+x(a_1+x(\\cdots(a_{n-1}+x(a_n))\\cdots))$\n\n```c\ndouble f( int n,\
    \ double a[], double x )\n{\n  int i;\n  double p = a[n];\n  for ( i=n; i>0; i--\
    \ )\n    p = a[i-1] + x*p;\n  return p;\n}\n```\n\nclock()：捕捉从程序开始运行到clock()被调用时所耗费的时间。这个时间单位是clock\
    \ tick，即“时钟打点”。\n常数CLK_TCK(或CLOCKS_PER_SEC)：机器时钟每秒所走的时钟打点数。\n\n```c\n#include\
    \ <stdio.h>\n#include <time.h>\n\nclock_t start, stop;\n/* clock_t是clock()函数返回的变量类型\
    \ */\ndouble duration;\n/* 记录被测函数运行时间，以秒为单位 */\nint main ()\n{ /* 不在测试范围内的准备工作写在clock()调用之前*/\n\
    \    start = clock();   /* 开始计时 */\n    MyFunction();      /* 把被测函数加在这里 */\n \
    \   stop = clock();    /* 停止计时 */\n    duration = ((double)(stop - start))/CLK_TCK;\n\
    \    /* 计算运行时间 */\n    /* 其他在不在测试范围的处理写在后面，例如输出duration的值 */\n    return 0;\n\
    }\n```\n\n## 例3：写程序计算给定多项式 \\( f(x) = \\sum_{i=0}^{9} i \\cdot x^i \\) 在给定点 \\\
    ( x = 1.1 \\) 处的值 \\( f(1.1) \\)\n\n```c\ndouble f1( int n, double a[], double\
    \ x )\n{\n    int i;\n    double p = a[0];\n    for ( i=1; i<=n; i++ )\n     \
    \   p += (a[i] * pow(x, i));\n    return p;\n}\n```\n\n```c\ndouble f2( int n,\
    \ double a[], double x )\n{\n    int i;\n    double p = a[n];\n    for ( i=n;\
    \ i>0; i-- )\n        p = a[i-1] + x*p;\n    return p;\n}\n```\n\n```c\n#include\
    \ <stdio.h>\n#include <time.h>\n#include <math.h>\nclock_t start, stop;\ndouble\
    \ duration;\n#define MAXN 10    /* 多项式最大项数，即多项式阶数+1 */\ndouble f1( int n, double\
    \ a[], double x );\ndouble f2( int n, double a[], double x );\nint main ()\n{\n\
    \    int i;\n    double a[MAXN]; /* 存储多项式的系数 */\n    for ( i=0; i<MAXN; i++ )\
    \ a[i] = (double)i;\n\n    start = clock();\n    f1(MAXN-1, a, 1.1);\n    stop\
    \ = clock();\n    duration = ((double)(stop - start))/CLK_TCK;\n    printf(\"\
    ticks1 = %f\\n\", (double)(stop - start));\n    printf(\"duration1 = %6.2e\\n\"\
    , duration);\n\n    start = clock();\n    f2(MAXN-1, a, 1.1);\n    stop = clock();\n\
    \    duration = ((double)(stop - start))/CLK_TCK;\n    printf(\"ticks2 = %f\\\
    n\", (double)(stop - start));\n    printf(\"duration2 = %6.2e\\n\", duration);\n\
    \n    return 0;\n}\n```\n\nCopyright @ 2012, 浙江大学计算机科学与技术学院  \nAll Rights Reserved\n\
    \n"
