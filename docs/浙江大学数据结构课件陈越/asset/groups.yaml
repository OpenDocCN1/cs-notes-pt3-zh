    \ 基本概念（1-1... > 1.3 应用实例：最大子...\n\n1. int Max(int a, int b, int c )\n2. {\n3.\
    \ /* 返回三个整数中的最大值 */\n4. return A > B ? A > C ? A : C : B > C ? B : C;\n5. }\n\
    6. }\n7. int DivideAndConquer( int list[], int left, int right )\n8. {\n9. /*\
    \ DivideAndConquer(list, left, right)返回list中左端为left、右端为right子段的最大和*/\n10. int\
