  mdcn: "\n\n## ❖ 算法：将新增结点插入到从其父结点到根结点的有序序列中\n\n```c\nvoid Insert( MaxHeap H, ElementType\
    \ item )\n{ /* 将元素item 插入最大堆，其中H->Element[0]是哨兵元素 */\n    int i;\n    if ( IsFull(H)\
    \ ) {\n        printf(\"最大堆已满\");\n        return;\n    }\n    i = ++H->Size;\
    \ /* i指向插入位置的最后一个元素的位置 */\n    for ( ; H->Elements[i/2] < item; i/=2 )\n     \
    \   H->Elements[i] = H->Elements[i/2]; /* 向下过滤结点 */\n    H->Elements[i] = item;\
    \ /* 将item 插入 */\n}\n```\n\n> H->Element[0] 是哨兵元素，它不小于堆中的最大元素，控制循环结束。\n\n*T(N)\
    \ = O(log N)*\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_216_0.png)\n\n## 最大堆的删除\n\
    \n取出根结点（最大值）元素，同时删除堆的一个结点。\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_217_0.png)\n\
    \nT(N) = O(log N)\n\n```c\nElementType DeleteMax( MaxHeap H )\n{\n    /* 从最大堆中取出键值为最大的元素，并删除一个结点\
    \ */\n    int Parent, Child;\n    ElementType MaxItem, temp;\n    if ( IsEmpty(H)\
    \ ) {\n        printf(\"最大堆已为空\");\n        return;\n    }\n    MaxItem = H->Elements[1];\
    \ /* 取出根结点最大值 */\n    /* 用最大堆中最后一个元素从根结点开始向上过滤下层结点 */\n    temp = H->Elements[H->Size--];\n\
    \    for( Parent=1; Parent*2<=H->Size; Parent=Child ) {\n        Child = Parent\
    \ * 2;\n        if( (Child!= H->Size) &&\n            (H->Elements[Child] < H->Elements[Child+1])\
    \ )\n            Child++;  /* Child指向左右子结点的较大者 */\n        if( temp >= H->Elements[Child]\
    \ ) break;\n        else  /* 移动temp元素到下一层 */\n            H->Elements[Parent]\
    \ = H->Elements[Child];\n    }\n    H->Elements[Parent] = temp;\n    return MaxItem;\n\
    }\n```\n\n## 最大堆的建立\n\n建立最大堆：将已经存在的N个元素按最大堆的要求存放在一个一维数组中。\n\n方法1：通过插入操作，将N个元素一个个相继插入到一个初始为空的堆中去，其时间代价最大为O(N\
    \ logN)。\n\n方法2：在线性时间复杂度下建立最大堆。\n（1）将N个元素按输入顺序存入，先满足完全二叉树的结构特性。\n（2）调整各结点位置，以满足最大堆的有序特性。\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_220_0.png)\n\n当前考察结点\n\n终结点\n\n当前考虑结点\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_221_0.png)\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_222_0.png)\n\
    \n## ➤ 线性时间复杂度 T(n)=O(n)\n\n| 结点数 | 最多交换次数 |\n|---|---|\n| n/4 | 1 |\n| n/8 |\
    \ 2 |\n| n/16 | 3 |\n| …… | |\n| n/2^k−1 | log₂n−1 (k−1) |\n\n$T(n)=\\frac{n}{4}+\\\
    frac{n}{8}\\times2+\\frac{n}{16}\\times3+\\cdots+\\frac{n}{2^k}\\times(k-1)$\n\
    \n$2T(n)=\\frac{n}{2}+\\frac{n}{4}\\times2+\\frac{n}{8}\\times3+\\cdots+\\frac{n}{2^{k-1}}\\\
    times(k-1)$\n\n$2T(n)-T(n)=\\frac{n}{2}+\\frac{n}{4}+\\frac{n}{8}+\\cdots+\\frac{n}{2^{k-1}}-\\\
    frac{n}{2^k}\\times(k-1)\\le n-(\\log_2 n-1)\\le n$\n\n## 5.2 哈夫曼树与哈夫曼编码\n\n如果考虑学生成绩的分布的概率：\n\
    \n| 分数段 | 0-59 | 60-69 | 70-79 | 80-89 | 90-100 |\n|---|---|---|---|---|---|\n\
    | 比例 | 0.05 | 0.15 | 0.40 | 0.30 | 0.10 |\n\n查找效率：0.05×1+0.15×2+0.4×3+0.3×4+0.1×4\
    \ = 3.15\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_225_0.png)\n\n如果考虑学生成绩的分布的概率：\n\
    \n| 分数段 | 0-59 | 60-69 | 70-79 | 80-89 | 90-100 |\n|---|---|---|---|---|---|\n\
    | 比例 | 0.05 | 0.15 | 0.40 | 0.30 | 0.10 |\n\n修改判定树：\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_226_0.png)\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_226_1.png)\n\n效率：0.05×3+0.15×3+0.4×2+0.3×2+0.1×2=2.2\n\
    \n如何根据结点不同的查找频率构造更有效的搜索树？\n\n## 哈夫曼树的定义\n\n带权路径长度(WPL)：设二叉树有n个叶子结点，每个叶子结点带有权值\
    \ $w_k$，从根结点到每个叶子结点的长度为 $l_k$，则每个叶子结点的带权路径长度之和就是：\n\\( WPL = \\sum_{k=1}^{n} w_k\
    \ l_k \\)\n\n最优二叉树或哈夫曼树：WPL最小的二叉树。\n\n【例】有五个叶子结点，它们的权值为{1,2,3,4,5}，用此权值序列可以构造出形状不同的多个二叉树。\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_228_0.png)\n\nWPL = 34\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_228_1.png)\n\
    \nWPL = 50\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_228_2.png)\n\nWPL = 33\n\
    \n## 哈夫曼树的特点：\n\n+ 没有度为1的结点；\n+ n个叶子结点的哈夫曼树共有2n-1个结点；\n+ 哈夫曼树的任意非叶节点的左右子树交换后仍是哈夫曼树；\n\
    + 对同一组权值{$w_1,w_2,\\ldots,w_n$}，是否存在不同构的两棵哈夫曼树呢？\n\n对一组权值{1, 2, 3, 3}，不同构的两棵哈夫曼树：\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_231_0.png)\n\n## 哈夫曼编码\n\n+ 给定一段字符串，如何对字符进行编码，可以使得该字符串的编码存储空间最少？\n\
    \n[例] 假设有一段文本，包含58个字符，并由以下7个字符构成：a, e, i, s, t, 空格（sp），换行（nl）；这7个字符出现的次数不同。如何对这7个字符进行编码，使得总编码空间最少？\n\
    \n【分析】\n\n+ （1）用等长ASCII编码：58 × 8 = 464位；\n+ （2）用等长3位编码：58 × 3 = 174位；\n+ （3）不等长编码：出现频率高的字符用的编码短些，出现频率低的字符则可以编码长些？\n\
    \n## 怎么进行不等长编码？\n\n## 如何避免二义性？\n\n前缀码prefix code：任何字符的编码都不是另一字符编码的前缀。\n\n+ 可以无二义地解码。\n\
    \n"
