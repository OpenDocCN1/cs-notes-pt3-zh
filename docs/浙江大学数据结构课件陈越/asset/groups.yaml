  md: "\n\n## 堆栈应用：表达式求值\n\n回忆：应用堆栈实现后缀表达式求值的基本过程：  \n从左到右读入后缀表达式的各项（运算符或运算数）；\n\n\
    1. 运算数：入栈；  \n2. 运算符：从堆栈中弹出适当数量的运算数，计算并结果入栈；  \n3. 最后，堆栈顶上的元素就是表达式的结果值。\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_85_0.png)\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_85_1.png)\n\n## 中缀表达式求值\n\n**基本策略**：将中缀表达式转换为后缀表达式，然后求值\n\
    \n如何将中缀表达式转换为后缀？\n\n**观察一个简单例子**： 2+9/3-5 → 2 9 3 / + 5 -\n\n- 1. 运算数相对顺序不变  \n\
    - 2. 运算符号顺序发生改变  \n  - 需要存储“等待中”的运算符号  \n  - 要将当前运算符号与“等待中”的最后一个运算符号比较\n\n堆栈！\n\
    \n有括号怎么办？\n\n## 【例】a*(b+c)/d = ?\n\nabc+*d/\n\n输出： a b c + * d /\n\n| 输入对象：a (操作数)\
    \ | 输入对象：* (乘法) |\n| --- | --- |\n| 输入对象：( (左括号) | 输入对象：b (操作数) |\n| 输入对象：+ (加法)\
    \ | 输入对象：c (操作数) |\n| 输入对象：) (右括号) | 输入对象：/ (除法) |\n| 输入对象：d (操作数) | |\n\nT(N)\
    \ = O ( N )\n\n## 中缀表达式求值\n\n字符序列的中缀表达式 对象分割 GetOp 对象序列的中缀表达式 利用堆栈 转换 对象序列的后缀表达式\
    \ 求值 利用堆栈 结果值\n\n(1.2 +1.3 – 2) * 4.2 对象分割 GetOp (1.2 +1.3 – 2)* 4.2 利用堆栈 转换 1.2\
    \ 1.3 + 2 - 4.2 * 求值 利用堆栈 2.1\n\n## 中缀表达式如何转换为后缀表达式\n\n从头到尾读取中缀表达式的每个对象，对不同对象按不同的情况处理。\n\
    \n- ① 运算数：直接输出；\n\n- ② 左括号：压入堆栈；\n\n- ③ 右括号：将栈顶的运算符弹出并输出，直到遇到左括号（出栈，不输出）；\n\n\
    - ④ 运算符：\n\n  - 若优先级大于栈顶运算符时，则把它压栈；\n\n  - 若优先级小于等于栈顶运算符时，将栈顶运算符弹出并输出；再比较新的栈顶运算符，直到该运算符大于栈顶运算符优先级为止，然后将该运算符压栈；\n\
    \n- ⑤ 若各对象处理完毕，则把堆栈中存留的运算符一并输出。\n\n## 堆栈的其他应用：\n\n- 函数调用及递归实现\n\n- 深度优先搜索\n\n\
    - 回溯算法\n\n- 。 。 。\n\n## 2.3 队列及实现\n\n## 什么是队列\n\n队列(Queue)：具有一定操作约束的线性表\n\n插入和删除操作：只能在一端插入，而在另一端删除。\n\
    \n- 数据插入：入队列（AddQ）\n\n- 数据删除：出队列（DeleteQ）\n\n- 先来先服务\n\n- 先进先出：FIFO\n\n## 队列的顺序存储实现\n\
    \n队列的顺序存储结构通常由一个一维数组和一个记录队列头元素位置的变量front以及一个记录队列尾元素位置的变量rear组成。\n\n### 【例】一个工作队列\n\
    \n| 0 | 1 | 2 | 3 | 4 | 5 | 6 |\n|---|---|---|---|---|---|---|\n| Job 1 | Job\
    \ 2 | Job 3 | Job 4 | Job 5 | Job 6 | Job 7 |\n\n| AddQ Job 1 | AddQ Job 2 | AddQ\
    \ Job 3 | DeleteQ Job 1 |\n|---|---|---|---|\n| AddQ Job 4 | AddQ Job 5 | AddQ\
    \ Job 6 | DeleteQ Job 2 |\n| AddQ Job 7 | AddQ Job 8 | | |\n\n## 顺环队列：\n\n- AddQ\
    \ Job 1\n\n- AddQ Job 2\n\n- AddQ Job 3\n\n- DeleteQ Job 1\n\n- AddQ Job 4\n\n\
    - AddQ Job 5\n\n- AddQ Job 6\n\n- AddQ Job 7\n\n## 思考：\n\n- （1）这种方案：堆栈空和满的判别条件是什么？\n\
    \n- （2）为什么会出现空、满无法区分？根本原因？\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_97_0.png)\n\
    \n### (1)入队列\n\n```c\nvoid AddQ( Queue PtrQ, ElementType item )\n{\n    if ( (PtrQ->rear+1)\
    \ % MaxSize == PtrQ->front ) {\n        printf(\"队列满\");\n        return;\n  \
    \  }\n    PtrQ->rear = (PtrQ->rear+1)% MaxSize;\n    PtrQ->Data[PtrQ->rear] =\
    \ item;\n}\n```\n\n```c\nElementType DeleteQ ( Queue PtrQ )\n{\n    if ( PtrQ->front\
    \ == PtrQ->rear ) {\n        printf(\"队列空\");\n        return ERROR;\n    } else\
    \ {\n        PtrQ->front = (PtrQ->front+1)% MaxSize;\n        return PtrQ->Data[PtrQ->front];\n\
    \    }\n}\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_98_0.png)\n\n## 队列的链式存储实现\n\
    \n队列的链式存储结构也可以用一个单链表实现。插入和删除操作分别在链表的两头进行； 队列指针front和rear应该分别指向链表的哪一头？\n\n```c\n\
    struct Node{\n    ElementType Data;\n    struct Node *Next;\n};\nstruct QNode{\
    \    /* 链队列结构 */\n    struct Node *rear;   /* 指向队尾结点 */\n    struct Node *front;\
    \  /* 指向队头结点 */\n};\ntypedef struct QNode *Queue;\nQueue PtrQ;\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_99_0.png)\n\
    \n## 不带头结点的链式队列出队操作的一个示例：\n\n```c\nElementType DeleteQ( Queue PtrQ )\n{\n    struct\
    \ Node *FrontCell;\n    ElementType FrontElem;\n\n    if ( PtrQ->front == NULL)\
    \ {\n        printf(\"队列空\"); return ERROR;\n    }\n    FrontCell = PtrQ->front;\n\
    \    if ( PtrQ->front == PtrQ->rear) /* 若队列只有一个元素 */\n        PtrQ->front = PtrQ->rear\
    \ = NULL; /* 删除后队列置为空 */\n    else\n        PtrQ->front = PtrQ->front->Next;\n\
    \    FrontElem = FrontCell->Data;\n    free( FrontCell ); /* 释放被删除结点空间 */\n  \
    \  return FrontElem;\n}\n```\n\n## 2.4 应用：多项式加法运算\n\n$P1=3X^5+4X^4-X^3+2X-1$\n\
    \n$P2=2X^4+X^3-7X^2+X$\n\n$P=3X^5+6X^4-7X^2+3X-1$\n\n主要思路：相同指数的项系数相加，其余部分进行拷贝。\n\
    \n## 多项式加法运算\n\n采用不带头结点的单向链表，按照指数递减的顺序排列各项\n\nP1→ 3 5 → 4 4 → -1 3 → 2 1 → -1\
    \ 0 → ||\nP2→ 2 4 → 1 3 → -7 2 → 1 1 → ||\n\n```c\nstruct PolyNode {\n    int\
    \ coef;    // 系数\n    int expon;   // 指数\n    struct PolyNode *link; // 指向下一个节点的指针\n\
    };\ntypedef struct PolyNode *Polynomial;\nPolynomial P1, P2;\n```\n\n## 多项式加法运算\n\
    \n**算法思路：** 两个指针P1和P2分别指向这两个多项式第一个结点，不断循环：\n\n- `P1->expon==P2->expon`：系数相加，若结果不为0，则作为结果多项式对应项的系数。同时，P1和P2都分别指向下一项；\n\
    - `P1->expon>P2->expon`：将P1的当前项存入结果多项式，并使P1指向下一项；\n- `P1->expon<P2->expon`：将P2的当前项存入结果多项式，并使P2指向下一项；\n\
    \n**当某一多项式处理完时，将另一个多项式的所有结点依次复制到结果多项式中去。**\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_103_0.png)\n\
    \n"
