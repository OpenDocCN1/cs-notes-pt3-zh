    cdots>D_1=1$\n- 对每个 $D_k$ 进行“$D_k$-间隔”排序 $(k=M,M-1,\\ldots,1)$\n- **注意：**“$D_k$-间隔”有序的序列，在执行“$D_{k-1}$-间隔”排序后，仍然是“$D_k$-间隔”有序的\n\
    \n#### 希尔增量序列\n\n- 原始希尔排序 $D_M=\\lfloor N/2\\rfloor,\\quad D_k=\\lfloor D_{k+1}/2\\\
    rfloor$\n\n```c\nvoid Shell_sort( ElementType A[], int N )\n{\n  for ( D=N/2;\
    \ D>0; D/=2 ) { /* 希尔增量序列 */\n    for ( P=D; P<N; P++ ) { /* 插入排序 */\n      Tmp\
    \ = A[P];\n      for ( i=P; i>=D && A[i-D]>Tmp; i-=D )\n        A[i] = A[i-D];\n\
    \      A[i] = Tmp;\n    }\n  }\n}\n```\n\n最坏情况：$T=O(N^2)$\n\n#### 更多增量序列\n\n-\
    \ ## Hibbard 增量序列\n  - \\( D_k = 2^k - 1 \\) — 相邻元素互质\n  - 最坏情况：\\( T = \\Theta(N^{3/2})\
    \ \\)\n  - 猜想：\\( T_{avg} = O(N^{5/4}) \\)\n\n- ## Sedgewick 增量序列\n  - \\( \\\
    {1, 5, 19, 41, 109, \\dots \\} \\)\n    - \\( 9 \\times 4^i - 9 \\times 2^i +\
    \ 1 \\) 或 \\( 4^i - 3 \\times 2^i + 1 \\)\n  - 猜想：\\( T_{avg} = O(N^{7/6}) \\\
    )，\\( T_{worst} = O(N^{4/3}) \\)\n\n### 选择排序\n\n```c\nvoid Selection_Sort ( ElementType\
    \ A[], int N )\n{\n    for ( i = 0; i < N; i ++ ) {\n        MinPosition = ScanForMin(\
    \ A, i, N-1 );\n        /* 从A[i]到A[N-1]中找最小元，并将其位置赋给MinPosition */\n        Swap(\
    \ A[i], A[MinPosition] );\n        /* 将未排序部分的最小元换到有序部分的最后后位置 */\n    }\n}\n```\n\
    \n无论如何：\\( T = \\Theta(N^2) \\)\n\n如何快速找到最小元？？？\n\nCopyright © 2014, 浙江大学计算机科学与技术学院\
    \  \nAll Rights Reserved\n\n### 堆排序\n\n#### 算法1\n\n```c\nvoid Heap_Sort ( ElementType\
    \ A[], int N )\n{\n    BuildHeap(A);  /* O(N) */\n    for ( i=0; i<N; i++ )\n\
    \        TmpA[i] = DeleteMin(A);  /* O(logN) */\n    for ( i=0; i<N; i++ )  /*\
    \ O(N) */\n        A[i] = TmpA[i];\n}\n```\n\n**T(N) = O(N log N)**\n\n需要额外O(N)空间，并且复制元素需要时间。\n\
    \n#### 算法2\n\n```c\nvoid Heap_Sort ( ElementType A[], int N )\n{\n    for ( i=N/2-1;\
    \ i>=0; i-- )/* BuildHeap */\n    PercDown( A, i, N );\n    for ( i=N-1; i>0;\
    \ i-- ) {\n    Swap( &A[0], &A[i] ); /* DeleteMax */\n    PercDown( A, 0, i );\n\
    \    }\n}\n```\n\n- 定理：堆排序处理N个不同元素的随机排列的平均比较次数是  \n  2N logN – O(Nlog logN)。\n\
    - 虽然堆排序给出最佳平均时间复杂度，但实际效果不如用Sedgewick增量序列的希尔排序。\n\n### 9.4 归并排序\n\n#### 核心：有序子列的归并\n\
    \n如果两个子列一共有N个元素，则归并的时间复杂度是？\n\nT(N) = O(N)\n\nCopyright @ 2014, 浙江大学计算机科学与技术学院\
    \  \nAll Rights Reserved\n\n#### 递归算法\n\n- 分而治之\n\n```c\nvoid MSort( ElementType\
    \ A[], ElementType TmpA[],\n           int L, int RightEnd )\n{\n    int Center;\n\
    \    if ( L < RightEnd ) {\n        Center = ( L + RightEnd ) / 2;\n        MSort(\
    \ A, TmpA, L, Center );\n        MSort( A, TmpA, Center+1, RightEnd );\n     \
    \   Merge( A, TmpA, L, Center+1, RightEnd );\n    }\n}\n```\n\n$T(N)=T(N/2)+T(N/2)+O(N)\\\
    ;\\longrightarrow\\;T(N)=O(N\\log N)$\n\n#### 递归算法\n\n- 如果只在Merge中声明临时数组\n  -\
    \ `void Merge( ElementType A[], int L, int R, int RightEnd )`\n  - `void MSort(\
    \ ElementType A[], int L, int RightEnd )`\n\n#### 非递归算法\n\n```c\nvoid Merge_sort(\
    \ ElementType A[], int N )\n{\n    ElementType *TmpA;\n    TmpA = malloc( N *\
    \ sizeof( ElementType ) );\n    if ( TmpA != NULL ) {\n        while( length <\
    \ N ) {\n            Merge_pass( A, TmpA, N, length );\n            length *=\
    \ 2;\n            Merge_pass( TmpA, A, N, length );\n            length *= 2;\n\
    \        }\n        free( TmpA );\n    }\n    else Error( \"空间不足\" );\n}\n```\n\
    \n"
