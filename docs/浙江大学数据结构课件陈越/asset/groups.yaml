  - "[PAGE 386]\n\n# # 选择排序\n\n```\nvoid Selection_Sort ( ElementType A[], int N )\n\
    {\n    for ( i = 0; i < N; i ++ ) {\n        MinPosition = ScanForMin( A, i, N-1\
    \ );\n        /* 从A[i]到A[N-1]中找最小元，并将其位置赋给MinPosition */\n        Swap( A[i],\
    \ A[MinPosition] );\n        /* 将未排序部分的最小元换到有序部分的最后后位置 */\n    }\n}\n\n```\n\n\
    无论如何： \\( T = \\Theta(N^2) \\)\n\n如何快速找到最小元？？？\n\nCopyright © 2014, 浙江大学计算机科学与技术学院\
    \  \nAll Rights Reserved"
  - "[PAGE 387]\n\n# 堆排序\n\n# 算法1\n\n```\nvoid Heap_Sort ( ElementType A[], int N\
    \ )\n{\n    BuildHeap(A);  /* O(N) */\n    for ( i=0; i<N; i++ )\n        TmpA[i]\
    \ = DeleteMin(A);  /* O(logN) */\n    for ( i=0; i<N; i++ )  /* O(N) */\n    \
    \    A[i] = TmpA[i];\n}\n```\n\n**T(N) = O(N log N)**\n\n需要额外O(N)空间，并且复制元素需要时间。"
  - "[PAGE 388]\n\n# # 堆排序\n\n# ## 算法2\n\n```\nvoid Heap_Sort ( ElementType A[], int\
    \ N )\n{\n    for ( i=N/2-1; i>=0; i-- )/* BuildHeap */\n    PercDown( A, i, N\
    \ );\n    for ( i=N-1; i>0; i-- ) {\n    Swap( &A[0], &A[i] ); /* DeleteMax */\n\
    \    PercDown( A, 0, i );\n    }\n}\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_388_0.png)\n\
    \n+   - 定理：堆排序处理N个不同元素的随机排列的平均比较次数是  \n+     2N logN – O(Nlog logN)。\n\n+   -\
    \ 虽然堆排序给出最佳平均时间复杂度，但实际效果不如用Sedgewick增量序列的希尔排序。"
