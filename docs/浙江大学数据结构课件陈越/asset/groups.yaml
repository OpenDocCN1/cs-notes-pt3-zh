    # # 时间复杂度


    【引理（Tarjan）】令 \( T(M, N) \) 为交错执行 \( M \geq N \) 次带路径压缩的查找和 \( N-1 \) 次按秩归并的最坏情况时间。则存在正常数
    \( k_1 \) 和 \( k_2 \) 使得：


    \( k_1 M \alpha(M, N) \leq T(M, N) \leq k_2 M \alpha(M, N) \)


    Ackermann 函数和 \( \alpha(M, N) \)


    \( A(i, j) = \begin{cases} 2^j & \quad i = 1 \text{ and } j \geq 1 \\ A(i-1, 2)
    & \quad i \geq 2 \text{ and } j = 1 \\ A(i-1, A(i, j-1)) & \quad i \geq 2 \text{
    and } j \geq 2 \end{cases} \)


    http://mathworld.wolfram.com/AckermannFunction.html


    \( \alpha(M, N) = \min \{ i \geq 1 | A(i, \lfloor M/N \rfloor) > \log N \} \leq
    O(\log^* N) \leq 4 \)


    \( \log^* N \) (Ackermann 反函数) = 对 \( N \) 求对数直到结果 \(\leq 1\) 的次数


