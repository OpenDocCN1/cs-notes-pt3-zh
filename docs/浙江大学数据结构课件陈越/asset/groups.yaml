    # # 最大堆的建立


    建立最大堆：将已经存在的N个元素按最大堆的要求存放在一个一维数组中


    方法1：通过插入操作，将N个元素一个个相继插入到一个初始为空的堆中去，其时间代价最大为O(N logN)。


    方法2：在线性时间复杂度下建立最大堆。

