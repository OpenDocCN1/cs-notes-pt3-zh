    20. center = ( left + right ) / 2; /* 找到中分点 */

    21. MaxLeftSum = DivideAndConquer( list, left, center );

    22. MaxRightSum = DivideAndConquer( list, left+1, right );

    23. MaxLeftBorderSum = 0; leftBorderSum = 0;

