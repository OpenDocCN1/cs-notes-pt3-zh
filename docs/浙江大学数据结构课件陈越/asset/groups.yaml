    # # 应用：文件中单词词频统计


    [例] 给定一个英文文本文件，统计文件中所有单词出现的频率，并输出词频最大的前10%的单词及其词频。

    假设单词字符定义为大小写字母、数字和下划线，其它字符均认为是单词分隔符，不予考虑。


    【分析】关键：对新读入的单词在已有单词表中查找，如果已经存在，则将该单词的词频加1，如果不存在，则插入该单词并记词频为1。


    如何设计该单词表的数据结构才可以进行快速地查找和插入？


