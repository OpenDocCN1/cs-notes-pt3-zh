    # 邻接矩阵 —— 有什么好处？


    +   - 直观、简单、好理解

    +   - 方便检查任意一对顶点间是否存在边

    +   - 方便找任一顶点的所有“邻接点”（有边直接相连的顶点）

    +   - 方便计算任一顶点的“度”（从该点发出的边数为“出度”，指向该点的边数为“入度”）

    +     - 无向图：对应行（或列）非0元素的个数

    +     - 有向图：对应行非0元素的个数是“出度”，对应列非0元素的个数是“入度”'
