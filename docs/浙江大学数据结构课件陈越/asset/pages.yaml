- pgno: 170
  md: "```\nBinTree Insert( ElementType X, BinTree BST )\n{\n    if( !BST ){\n   \
    \ /*若原树为空，生成并返回一个结点的二元搜索树*/\n    BST = malloc(sizeof(struct TreeNode));\n    BST->Data\
    \ = X;\n    BST->Left = BST->Right = NULL;\n    }else /*开始找要插入元素的位置*/\n    if(\
    \ X < BST->Data )\n    BST->Left = Insert( X, BST->Left );\n    /*递归插入左子树*/\n\
    \    else if( X > BST->Data )\n    BST->Right = Insert( X, BST->Right );\n   \
    \ /*递归插入右子树*/\n    /* else X已经存在，什么都不做 */\n    return BST;\n}\n```\n\n# 二叉搜索树的插入算法"
