- pgno: 118
  md: '# # 树的一些基本术语


    +   1. 结点的度（Degree）：结点的子树个数


    +   2. 树的度：树的所有结点中最大的度数


    +   3. 叶结点（Leaf）：度为0的结点


    +   4. 父结点（Parent）：有子树的结点是其子树的根结点的父结点


    +   5. 子结点（Child）：若A结点是B结点的父结点，则称B结点是A结点的子结点；子结点也称孩子结点。


    +   6. 兄弟结点（Sibling）：具有同一父结点的各结点彼此是兄弟结点。


    ![](img/8e26218ef88df8d6f4fe4ce3f83904a5_118_0.png)'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# ❖ 树的一些基本术语


    +   7. **路径和路径长度**：从结点 n₁ 到 nₖ 的路径为一个结点序列 n₁，n₂，…，nₖ，nᵢ 是 nᵢ₊₁ 的父结点。路径所包含边的个数为**路径的长度**。


    +   9. **祖先结点 (Ancestor)**：沿树根到某一结点路径上的所有结点都是这个结点的祖先结点。


    +   10. **子孙结点 (Descendant)**：某一结点的子树中的所有结点是这个结点的子孙。


    +   11. **结点的层次（Level）**：规定根结点在1层，其它任一结点的层数是其父结点的层数加1。


    +   12. **树的深度（Depth）**：树中所有结点中的最大层次是这棵树的深度。


