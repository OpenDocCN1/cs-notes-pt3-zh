  md: '# # 分离链法：


    散列表是顺序存储和链式存储的结合，链表部分的存储效率和查找效率都比较低。


    关键字删除不需要“懒惰删除”法，从而没有存储“垃圾”。


    太小的α可能导致空间浪费，大的α又将付出更多的时间代价。不均匀的链表长度导致时间效率的严重下降。'
