  md: "# 如何判别\n\n```\nint Judge( Tree T, int N )\n{\n        int i, V, flag = 0;\n\
    \        /* flag: 0代表目前还一致，1代表已经不一致*/\n\n        scanf(\"%d\", &V);\n        if\
    \ ( V!=T->v) flag = 1;\n        else T->flag = 1;\n        for (i=1; i<N; i++)\
    \ {\n                scanf(\"%d\", &V);\n                if ( (!flag) && (!check(T,\
    \ V)) ) flag = 1;\n        }\n        if (flag) return 0;\n        else return\
    \ 1;\n}\n```"
