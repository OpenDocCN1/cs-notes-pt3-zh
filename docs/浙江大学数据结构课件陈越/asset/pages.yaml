  md: "# # 算法思路\n\n+   - 对每个节点，进行广度优先搜索\n+   - 搜索过程中累计访问的节点数\n+   - 需要记录“层”数，仅计算6层以内的节点数\n\
    \n```\nvoid SDS()\n{\n    for ( each V in G ) {\n        count = BFS( V );\n \
    \       Output( count/N );\n    }\n}\n```\n\n```\nint BFS ( Vertex V )\n{\n  \
    \  visited[V] = true; count = 1;\n    Enqueue( V, Q );\n    while( !IsEmpty( Q\
    \ ) ){\n    V = Dequeue( Q );\n    for ( V 的每个邻接点 W )\n    if ( !visited[W] )\
    \ {\n    visited[W] = true;\n    Enqueue( W, Q ); count ++;\n    }\n    } return\
    \ count;\n}\n```"
