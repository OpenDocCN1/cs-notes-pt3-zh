- pgno: 451
  md: '# 3. 双散列探测法（Double Hashing）


    双散列探测法：dᵢ 为 i*h₂(key)，h₂(key) 是另一个散列函数

    探测序列成：h₂(key)，2h₂(key)，3h₂(key)，……


    +   - 对任意的 key，h₂(key) ≠ 0！

    +   - 探测序列还应该保证所有的散列存储单元都应该能够被探测到。选择以下形式有良好的效果：


    h₂(key) = p - (key mod p)


    其中：p < TableSize，p、TableSize 都是素数。'
