    \ <stdio.h>\n#include <time.h>\n#include <math.h>\n......\n#define MAXX 1e7 /*\
    \ 被测函数最大重复调用次数 */\n......\nint main ()\n{ ......\n    start = clock();\n    for\
    \ ( i=0; i<MAXX; i++ ) /* 重复调用函数以获得充分多的时钟打点数*/\n    f1(MAXX-1, a, 1.1);\n    stop\
    \ = clock();\n    duration = ( (double)(stop - start))/CLK_TCK/MAXX; /* 计算函数单次运行的时间\
