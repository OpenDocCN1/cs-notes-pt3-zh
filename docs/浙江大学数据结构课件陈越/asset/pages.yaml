- pgno: 195
  md: "# # 如何建搜索树\n\n```\nTree MakeTree( int N )\n{\n        Tree T;\n        int\
    \ i, V;\n\n        scanf(\"%d\", &V);\n        T = NewNode(V);\n        for (i=1;\
    \ i<=N; i++) {\n                scanf(\"%d\", &V);\n                T = Insert(T,\
    \ V);\n        }\n        return T;\n}\n```\n\n```\nTree Insert( Tree T, int V\
    \ )\n{\n        if ( !T ) T = NewNode(V);\n        else {\n                if\
    \ ( V>T->v )\n                        T->Right = Insert( T->Right, V );\n    \
    \            else\n                        T->Left = Insert( T->Left, V );\n \
    \       }\n        return T;\n}\n```\n\n```\nTree NewNode( int V )\n{\n      \
    \  Tree T = (Tree)malloc(sizeof(struct TreeNode));\n        T->V = V;\n      \
    \  T->Left = T->Right = NULL;\n        T->flag = 0;\n        return T;\n}\n```\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_195_0.png)"
