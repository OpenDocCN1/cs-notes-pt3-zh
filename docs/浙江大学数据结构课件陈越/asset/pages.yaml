  md: "# # 算法概述\n\n# ## 分而治之\n\n什么是快速排序算法的最好情况？\n每次正好中分 ➡️ T(N) = O( NlogN )\n\n```\n\
    void Quicksort( ElementType A[], int N )\n{\n    ?pivot = 从A[]中选一个主元;\n    ?将S\
    \ = { A[] \\ pivot } 分成2个独立子集:\n        A1={ a∈S | a ≤ pivot } 和\n        A2={\
    \ a∈S | a ≥ pivot };\n    A[] = Quicksort(A1,N1)∪\n        {pivot}∪\n        Quicksort(A2,N2);\n\
    }\n```"
