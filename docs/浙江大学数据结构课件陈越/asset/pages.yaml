  md: "```\nPosition FindMin( BinTree BST )\n{\n    if( !BST ) return NULL; /*空的二叉搜索树，返回NULL*/\n\
    \    else if( !BST->Left )\n        return BST; /*找到最左叶结点并返回*/\n    else\n   \
    \     return FindMin( BST->Left ); /*沿左分支继续查找*/\n}\n```\n\n查找最小元素的递归函数\n\n```\n\
    Position FindMax( BinTree BST )\n{\n    if(BST )\n        while( BST->Right )\
    \ BST = BST->Right;\n        /*沿右分支继续查找，直到最右叶结点*/\n    return BST;\n}\n```\n\n\
    查找最大元素的迭代函数"
