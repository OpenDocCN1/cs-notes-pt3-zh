- pgno: 20
  md: "# # 抽象数据类型 （Abstract Data Type）\n\n+   - 数据类型  \n+     - 数据对象集  \n+     - 数据集合相关联的操作集\n\
    \n+   - 抽象：描述数据类型的方法不依赖于具体实现  \n+     - 与存放数据的机器无关  \n+     - 与数据存储的物理结构无关  \n\
    +     - 与实现操作的算法和编程语言均无关\n\n只描述数据对象集和相关操作集“是什么”，并不涉及“如何做到”的问题"
  merge: -1
  img_proc: true
- pgno: 21
  md: "# # 例4：“矩阵”的抽象数据类型定义\n\n+   - 类型名称：矩阵（Matrix）\n\n+   - 数据对象集：一个M×N的矩阵A<sub>M×N</sub>\
    \ = (a<sub>ij</sub>) (i=1, ..., M; j=1, ..., N) 由M×N个三元组 < a, i, j > 构成，其中 a 是矩阵元素的值，i\
    \ 是元素所在的行号，j 是元素所在的列号。\n\n+   - 操作集：对于任意矩阵A、B、C ∈ Matrix，以及整数i、j、M、N\n\n+   -\
    \ Matrix Create( int M, int N )：返回一个M×N的空矩阵；\n\n+   - int GetMaxRow( Matrix A\
    \ )：返回矩阵A的总行数；\n\n+   - int GetMaxCol( Matrix A )：返回矩阵A的总列数；\n\n+   - ElementType\
    \ GetEntry( Matrix A, int i, int j )：返回矩阵A的第i行、第j列的元素；\n\n+   - Matrix Add( Matrix\
    \ A, Matrix B )：如果A和B的行、列数一致，则返回矩阵C=A+B，否则返回错误标志；\n\n+   - Matrix Multiply( Matrix\
    \ A, Matrix B )：如果A的列数等于B的行数，则返回矩阵C=AB，否则返回错误标志；\n\n+   - ......\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_21_0.png)\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_21_1.png)\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_21_2.png)\n\
