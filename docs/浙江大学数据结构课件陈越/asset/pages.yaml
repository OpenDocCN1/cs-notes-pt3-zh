- pgno: 188
  md: '# 题意理解


    给定一个插入序列就可以唯一确定一棵二叉搜索树。然而，一棵给定的二叉搜索树却可以由多种不同的插入序列得到。


    +   - 例如，按照序列 {2, 1, 3} 和 {2, 3, 1} 插入初始为空的二叉搜索树，都得到一样的结果。


    问题：对于输入的各种插入序列，你需要判断它们是否能生成一样的二叉搜索树。'
  merge: -1
