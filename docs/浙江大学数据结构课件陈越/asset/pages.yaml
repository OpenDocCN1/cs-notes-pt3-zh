- pgno: 356
  md: "# # Kruskal算法 — 将森林合并成树\n\n```\nvoid Kruskal ( Graph G )\n{\n    MST = { }\
    \ ;\n    while ( MST 中不到 |V| -1 条边 && E 中还有边 ) {\n    从 E 中取一条权重最小的边 E<sub>(v,w)</sub>\
    \ ; /* 最小堆 */\n    将 E<sub>(v,w)</sub> 从 E 中删除;\n    if ( E<sub>(v,w)</sub>不在\
    \ MST 中构成回路) /* 并查集 */\n    将 E<sub>(v,w)</sub> 加入 MST;\n    else\n    彻底无视 E<sub>(v,w)</sub>\
    \ ;\n    }\n    if ( MST 中不到 |V| -1 条边 )\n    Error ( \"生成树不存在\" ) ;\n}\n```\n\
    \nT = O(|E| log |E|)"
