- pgno: 14
  md: "clock()：捕捉从程序开始运行到clock()被调用时所耗费的时间。这个时间单位是clock tick，即“时钟打点”。\n常数CLK_TCK(或CLOCKS_PER_SEC)：机器时钟每秒所走的时钟打点数。\n\
    \n```\n```c\n#include <stdio.h>\n#include <time.h>\n\nclock_t start, stop;\n/*\
    \ clock_t是clock()函数返回的变量类型 */\ndouble duration;\n/* 记录被测函数运行时间，以秒为单位 */\nint main\
    \ ()\n{ /* 不在测试范围内的准备工作写在clock()调用之前*/\n    start = clock();   /* 开始计时 */\n  \
    \  MyFunction();      /* 把被测函数加在这里 */\n    stop = clock();    /* 停止计时 */\n   \
    \ duration = ((double)(stop - start))/CLK_TCK;\n    /* 计算运行时间 */\n    /* 其他在不在测试范围的处理写在后面，例如输出duration的值\
    \ */\n    return 0;\n}\n```\n```"
  merge: -1
  img_proc: true
