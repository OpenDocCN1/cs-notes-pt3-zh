- pgno: 53
  md: "# # 主要操作的实现\n\n# ## 1.初始化（建立空的顺序表）\n\n```\nList MakeEmpty( )\n{\n    List PtrL;\n\
    \    PtrL = (List )malloc( sizeof(struct LNode) );\n    PtrL->Last = -1;\n   \
    \ return PtrL;\n}\n```\n\n# ## 2.查找\n\n```\nint Find( ElementType X, List PtrL\
    \ )\n{\n    int i = 0;\n    while( i <= PtrL->Last && PtrL->Data[i]!= X )\n  \
    \      i++;\n    if (i > PtrL->Last) return -1; /* 如果没找到，返回-1 */\n    else return\
    \ i;    /* 找到后返回的是存储位置 */\n}\n```\n\n> 查找成功的平均比较次数为 (n +1)/2，平均时间性能为 O(n)。"
