    \ P2->expon)) {\n        case 1:\n            Attach(P1->coef, P1->expon, &rear);\n\
    \            P1 = P1->link;\n            break;\n        case -1:\n          \
    \  Attach(P2->coef, P2->expon, &rear);\n            P2 = P2->link;\n         \
    \   break;\n        case 0:\n            sum = P1->coef + P2->coef;\n        \
    \    if (sum) Attach(sum, P1->expon, &rear);\n            P1 = P1->link;\n   \
    \         P2 = P2->link;\n            break;\n        }\n    }\n    for (; P1;\
    \ P1 = P1->link) Attach(P1->coef, P1->expon, &rear);\n    for (; P2; P2 = P2->link)\
    \ Attach(P2->coef, P2->expon, &rear);\n    rear->link = NULL;\n    temp = front;\n\
    \    front = front->link;\n    free(temp);\n    return front;\n}\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_104_0.png)"
