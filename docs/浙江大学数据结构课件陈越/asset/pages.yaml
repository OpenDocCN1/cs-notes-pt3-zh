- pgno: 137
  md: "# # 中序遍历非递归遍历算法\n\n+   > 遇到一个结点，就把它压栈，并去遍历它的左子树；\n+   > 当左子树遍历结束后，从栈顶弹出这个结点并访问它；\n\
    +   > 然后按其右指针再去中序遍历该结点的右子树。\n\n```\nvoid InOrderTraversal( BinTree BT )\n{\n \
    \   BinTree T=BT;\n    Stack S = CreatStack( MaxSize ); /*创建并初始化堆栈s*/\n    while(\
    \ T || !IsEmpty(S) ){\n        while(T){ /*一直向左并将沿途结点压入堆栈*/\n            Push(S,T);\n\
    \            T = T->Left;\n        }\n        if(!IsEmpty(S)){\n            T\
    \ = Pop(S); /*结点弹出堆栈*/\n            printf(\"%5d\", T->Data); /*（访问）打印结点*/\n \
    \           T = T->Right; /*转向右子树*/\n        }\n    }\n}\n```"
  merge: -1
