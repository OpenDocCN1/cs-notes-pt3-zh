  md: "```\nPosition Find( ElementType Key, HashTable H ) /*平方探测*/\n{\n    Position\
    \ CurrentPos, NewPos;\n    int CNum; /* 记录冲突次数 */\n    CNum = 0;\n    NewPos =\
    \ CurrentPos = Hash( Key, H->TableSize );\n    while( H->TheCells[ NewPos ].Info\
    \ != Empty &&\n           H->TheCells[ NewPos ].Element != Key ) {\n    /* 字符串类型的关键词需要\
    \ strcmp 函数!! */\n    if(++CNum % 2){ /* 判断冲突的奇偶次 */\n    NewPos = CurrentPos\
    \ + (CNum+1)/2*(CNum+1)/2;\n    while( NewPos >= H->TableSize )\n    NewPos -=\
    \ H->TableSize;\n    } else {\n    NewPos = CurrentPos - CNum/2 * CNum/2;\n  \
    \  while( NewPos < 0 )\n    NewPos += H->TableSize;\n    }\n    }\n    return\
    \ NewPos;\n}\n```"
