- pgno: 212
  md: '# # 堆的抽象数据类型描述


    **类型名称：** 最大堆（MaxHeap）


    **数据对象集：** 完全二叉树，每个结点的元素值不小于其子结点的元素值


    **操作集：** 最大堆 H ∈ MaxHeap，元素 item ∈ ElementType，主要操作有：


    +   - `MaxHeap Create( int MaxSize )`：创建一个空的最大堆。

    +   - `Boolean IsFull( MaxHeap H )`：判断最大堆 H 是否已满。

    +   - `insert( MaxHeap H, ElementType item )`：将元素 item 插入最大堆 H。

    +   - `Boolean IsEmpty( MaxHeap H )`：判断最大堆 H 是否为空。

    +   - `ElementType DeleteMax( MaxHeap H )`：返回 H 中最大元素（高优先级）。'
  merge: -1
  img_proc: true
- pgno: 213
  md: "# # 最大堆的操作\n\n# ## 最大堆的创建\n\n```\ntypedef struct HeapStruct *MaxHeap;\nstruct\
    \ HeapStruct {\n    ElementType *Elements; /* 存储堆元素的数组 */\n    int Size; /* 堆的当前元素个数\
    \ */\n    int Capacity; /* 堆的最大容量 */\n};\n```\n\n```\nMaxHeap Create( int MaxSize\
    \ )\n{\n    /* 创建容量为MaxSize的空的最大堆 */\n    MaxHeap H = malloc( sizeof( struct HeapStruct\
    \ ) );\n    H->Elements = malloc( (MaxSize+1) * sizeof(ElementType) );\n    H->Size\
    \ = 0;\n    H->Capacity = MaxSize;\n    H->Elements[0] = MaxData;\n    /* 定义“哨兵”为大于堆中所有可能元素的值，便于以后更快操作\
    \ */\n    return H;\n}\n```\n\n> 把MaxData换成小于堆中所有元素的MinData，同样适用于创建最小堆。"
