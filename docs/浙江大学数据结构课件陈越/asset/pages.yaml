- pgno: 239
  md: "# 集合运算\n\n（1）查找某个元素所在的集合（用根结点表示）\n\n```\nint Find( SetType S[ ], ElementType\
    \ X )\n{\n    /* 在数组S中查找值为X的元素所属的集合 */\n\n    /* MaxSize是全局变量，为数组S的最大长度 */\n\n\
    \    int i;\n\n    for ( i=0; i < MaxSize && S[i].Data != X; i++);\n\n    if(\
    \ i >= MaxSize ) return -1; /* 未找到X，返回-1 */\n\n    for( ; S[i].Parent >= 0; i\
    \ = S[i].Parent );\n\n    return i; /* 找到X所属集合，返回树根结点在数组S中的下标 */\n}\n```"
  merge: -1
  img_proc: true
- pgno: 240
  md: "# （2）集合的并运算\n\n+   - 分别找到X1和X2两个元素所在集合树的根结点\n+   - 如果它们不同根，则将其中一个根结点的父结点指针设置成另一个根结点的数组下标。\n\
    \n```\nvoid Union( SetType S[ ], ElementType X1, ElementType X2)\n{\n    int Root1,\
    \ Root2;\n\n    Root1 = Find(S, X1);\n\n    Root2 = Find(S, X2);\n\n    if ( Root1\
    \ != Root2 ) S[Root2].Parent = Root1;\n}\n```\n\n> 当X1和X2不属于同一子集时，才需要合并"
  merge: -1
  img_proc: true
