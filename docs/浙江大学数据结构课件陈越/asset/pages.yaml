- pgno: 282
  md: '# # 图不连通怎么办？


    +   - 连通：如果从v到w存在一条（无向）路径，则称v和w是连通的


    +   - 路径：v到w的路径是一系列顶点{V, v1, v2, ..., vn, w}的集合，其中任一对相邻的顶点间都有图中的边。路径的长度是路径中的边数（如果带权，则是所有边的权重和）。如果v到w之间的所有顶点都不同，则称简单路径


    +   - 回路：起点等于终点的路径


    +   - 连通图：图中任意两顶点均连通'
  merge: -1
  img_proc: true
