  md: "# # 线性表的链式存储实现\n\n不要求逻辑上相邻的两个元素物理上也相邻；通过“链”建立起数据元素之间的逻辑关系。\n\n- 插入、删除不需要移动数据元素，只需要修改“链”。\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_58_0.png)\n\n```\ntypedef struct LNode\
    \ *List;\nstruct LNode{\n    ElementType Data;\n    List Next;\n};\nstruct Lnode\
    \ L;\nList PtrL;\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_58_1.png)"
  merge: -1
  img_proc: true
- pgno: 59
  md: "# # 主要操作的实现\n\n# ## 1.求表长\n\n```\nint Length ( List PtrL )\n{\n    List p =\
    \ PtrL; /* p指向表的第一个结点*/\n    int j = 0;\n    while ( p ) {\n        p = p->Next;\n\
    \        j++; /* 当前p指向的是第 j 个结点*/\n    }\n    return j;\n}\n```\n\n时间性能为 O(n)。"
  merge: -1
  img_proc: true
- pgno: 60
  md: "# 2. 查找\n\n# （1）按序号查找: FindKth;\n\n```\nList FindKth( int K, List PtrL )\n\
    {\n    List p = PtrL;\n    int i = 1;\n    while (p !=NULL && i < K){\n      \
    \  p = p->Next;\n        i++;\n    }\n    if (i == K) return p;\n    else return\
    \ NULL;\n}\n```\n\n# （2）按值查找: Find\n\n```\nList Find( ElementType X, List PtrL\
    \ )\n{\n    List p = PtrL;\n    while (p!=NULL && p->Data != X)\n        p = p->Next;\n\
    \    return p;\n}\n```\n\n> 平均时间性能为 O(n)"
  merge: -1
  img_proc: true
