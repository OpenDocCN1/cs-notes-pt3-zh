  md: "# # 无权图的单源最短路算法\n\n```\nvoid BFS ( Vertex S )\n{\n    visited[S] = true;\n\
    \    Enqueue(S, Q);\n    while(!IsEmpty(Q)){\n    V = Dequeue(Q);\n    for ( V\
    \ 的每个邻接点 W )\n    if ( !visited[W] ) {\n    visited[W] = true;\n    Enqueue(W,\
    \ Q);\n    }\n    }\n}\n```\n\n```\nvoid Unweighted ( Vertex S )\n{\n    Enqueue(S,\
    \ Q);\n    while(!IsEmpty(Q)){\n    V = Dequeue(Q);\n    for ( V 的每个邻接点 W )\n\
    \    if ( dist[W]==-1 ) {\n    dist[W] = dist[V]+1;\n    path[W] = V;\n    Enqueue\
    \ (W, Q) ;\n    }\n    }\n}\nT = O( |V| + |E| )\n```\n\ndist[W] = S到w的最短距离\n\n\
    dist[S] = 0\n\npath[W] = S到W的路上经过的某顶点"
