  md: "# 模块的引用与裁剪\n\n```\nbool Insert( HashTable H, ElementType Key )\n{\n    Position\
    \ P, NewCell;\n    Index Pos;\n\n    P = Find( H, Key );\n    if ( !P ) { /* 关键词未找到，可以插入\
    \ */\n        NewCell = (Position)malloc(sizeof(struct LNode));\n        strcpy(NewCell->Data,\
    \ Key);\n        NewCell->Count = 1;\n        Pos = Hash(atoi(Key+KEYLENGTH-MAX),\
    \ H->TableSize);\n        /* 将NewCell插入为H->Heads[Pos]链表的第1个结点 */\n        NewCell->Next\
    \ = H->Heads[Pos].Next;\n        H->Heads[Pos].Next = NewCell;\n        return\
    \ true;\n    }\n    else { /* 关键词已存在 */\n        P->Count++;\n        return false;\n\
    \    }\n}\n```"
