  md: "# 算法2\n\n```\n```c\nint MaxSubseqSum2( int A[], int N )\n{\n    int ThisSum,\
    \ MaxSum = 0;\n    int i, j;\n    for( i = 0; i < N; i++ ) { /* i是子列左端位置 */\n\
    \        ThisSum = 0; /* ThisSum是从A[i]到A[j]的子列和 */\n        for( j = i; j < N;\
    \ j++ ) { /* j是子列右端位置 */\n            ThisSum += A[j];\n            /*对于相同的i，不同的j，只要在j-1次循环的基础上累加1项即可*/\n\
    \            if( ThisSum > MaxSum ) /* 如果刚得到的这个子列和更大 */\n                MaxSum\
    \ = ThisSum;    /* 则更新结果 */\n        } /* j循环结束 */\n    } /* i循环结束 */\n    return\
    \ MaxSum;\n}\n```\n```\n\n$T(N)=O(N^2)$"
