  md: "# 递归算法\n\n+   - 分而治之\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_393_0.png)\n\
    \n```\n```c\nvoid MSort( ElementType A[], ElementType TmpA[],\n           int\
    \ L, int RightEnd )\n{\n    int Center;\n    if ( L < RightEnd ) {\n        Center\
    \ = ( L + RightEnd ) / 2;\n        MSort( A, TmpA, L, Center );\n        MSort(\
    \ A, TmpA, Center+1, RightEnd );\n        Merge( A, TmpA, L, Center+1, RightEnd\
    \ );\n    }\n}\n```\n```\n\n$T(N)=T(N/2)+T(N/2)+O(N)\\;\\longrightarrow\\;T(N)=O(N\\\
    log N)$"
