  md: "# 【例】求二叉树的高度。\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_143_0.png)\n\n```\n\
    int PostOrderGetHeight( BinTree BT )\n{\n    int HL, HR, MaxH;\n    if( BT ) {\n\
    \        HL = PostOrderGetHeight(BT->Left); /*求左子树的深度*/\n        HR = PostOrderGetHeight(BT->Right);\
    \ /*求右子树的深度*/\n        MaxH = (HL > HR) ? HL : HR; /*取左右子树较大的深度*/\n        return\
    \ ( MaxH + 1 ); /*返回树的深度*/\n    }\n    else return 0; /* 空树深度为0 */\n}\n```"
