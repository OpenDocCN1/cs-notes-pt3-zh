  md: '# # 查找（Searching）


    查找：根据某个给定关键字K，从集合R中找出关键字与K相同的记录


    静态查找：集合中记录是固定的


    +   - 没有插入和删除操作，只有查找


    动态查找：集合中记录是动态变化的


    +   - 除查找，还可能发生插入和删除'
