- pgno: 323
  md: "# # 核心算法\n\n# # 1. 计算最优编码长度\n\n```\nMinHeap H = CreateHeap( N ); /* 创建一个空的、容量为N的最小堆\
    \ */\nH = ReadData( N ); /* 将f[]读入H->Data[]中 */\nHuffmanTree T = Huffman( H );\
    \ /* 建立Huffman树 */\nint CodeLen = WPL( T, 0 );\n```\n\n```\nint WPL( HuffmanTree\
    \ T, int Depth )\n{\n    if ( !T->Left && !T->Right )\n        return (Depth*T->Weight);\n\
    \    else /* 否则T一定有2个孩子 */\n        return ( WPL(T->Left, Depth+1)\n         \
    \   + WPL(T->Right, Depth+1));\n}\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_323_0.png)\n\
    \nCopyright @ 2014, 浙江大学计算机科学与技术学院  \nAll Rights Reserved"
