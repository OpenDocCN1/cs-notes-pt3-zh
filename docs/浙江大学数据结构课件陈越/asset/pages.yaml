  md: '# # 什么是线性表


    多项式表示问题的启示：

    1. 同一个问题可以有不同的表示（存储）方法

    2. 有一类共性问题： 有序线性序列的组织和管理


    **“线性表(Linear List)”：由同类型数据元素构成有序序列的线性结构**

    ➤ 表中元素个数称为线性表的长度

    ➤ 线性表没有元素时，称为空表

    ➤ 表起始位置称表头，表结束位置称表尾'
