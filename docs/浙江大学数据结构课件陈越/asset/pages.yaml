- pgno: 257
  md: "# # 按秩归并 最坏情况下的树高 = O(log N)\n\n# ## 另一种做法：比规模\n\n# ### 把小树贴到大树上 S[Root] =\
    \ -元素个数；\n\n```\nvoid Union( SetType S, SetName Root1, SetName Root2 )\n{\n  \
    \  if ( S[Root2]<S[Root1] ){\n        S[Root2] += S[Root1];\n        S[Root1]\
    \ = Root2;\n    }\n    else {\n        S[Root1] += S[Root2];\n        S[Root2]\
    \ = Root1;\n    }\n}\n```\n\n两种方法统称“按秩归并”"
