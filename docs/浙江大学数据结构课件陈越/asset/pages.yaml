  md: "# # 单链表的逆转\n\n取巧：用顺序表存储，先排序，再直接逆序输出。\n\n在“内存”里多加几个没用的结点，让你偷懒！\n\n```\n```c\n\
    Ptr Reverse( Ptr head, int K )\n{\n    cnt = 1;\n    new = head->next;\n    old\
    \ = new->next;\n    while ( cnt < K )\n    {\n        tmp = old->next;\n     \
    \   old->next = new;\n        new = old; old = tmp;\n        cnt++;\n    }\n \
    \   head->next->next = old;\n    return new;\n}\n```\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_204_0.png)\n\
