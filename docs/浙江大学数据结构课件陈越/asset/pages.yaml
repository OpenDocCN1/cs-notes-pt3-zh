  md: "# 算法\n\n```\n```cpp\nvoid TopSort()\n{\n    for ( cnt = 0; cnt < |V|; cnt++\
    \ ) {\n        v = 未输出的入度为0的顶点;  /* O(|V|) */\n        if ( 这样的v不存在 ) {\n    \
    \        Error ( “图中有回路” );\n            break;\n        }\n        输出v，或者记录v的输出序号;\n\
    \        for ( v 的每个邻接点 w )\n            Indegree[w]--;\n    }\n}\n```\n```\n\n\
    \U0001F44E  **T = O(|V|²)**"
  merge: -1
  img_proc: true
- pgno: 363
  md: "# 聪明的算法\n\n+   随时将入度变为0的顶点放到一个容器里\n\n```\nvoid TopSort()\n{\n    for ( 图中每个顶点\
    \ V )\n        if ( Indegree[V]==0 )\n            Enqueue( V, Q );\n    while\
    \ ( !IsEmpty(Q) ) {\n        V = Dequeue( Q );\n        输出V，或者记录V的输出序号； cnt++;\n\
    \        for ( V 的每个邻接点 W )\n            if ( --Indegree[W]==0 )\n           \
    \     Enqueue( W, Q );\n    }\n    if ( cnt != |V| )\n        Error(“图中有回路” );\n\
    }\n```\n\nT = O(|V| + |E|)\n\n此算法可以用来检测有向图是否 DAG"
  merge: -1
