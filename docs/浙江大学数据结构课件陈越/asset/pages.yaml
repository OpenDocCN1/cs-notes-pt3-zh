- pgno: 380
  md: '# 举个例子


    | 81 | 94 | 11 | 96 | 12 | 35 | 17 | 95 | 28 | 58 | 41 | 75 | 15 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|


    **5-间隔**


    | 35 | 17 | 11 | 28 | 12 | 41 | 75 | 15 | 96 | 58 | 81 | 94 | 95 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|


    **3-间隔**


    | 28 | 12 | 11 | 35 | 15 | 41 | 58 | 17 | 94 | 75 | 81 | 96 | 95 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|


    **1-间隔**


    | 11 | 12 | 15 | 17 | 28 | 35 | 41 | 58 | 75 | 81 | 94 | 95 | 96 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|


    +   - 定义增量序列 $D_M>D_{M-1}>\cdots>D_1=1$

    +   - 对每个 $D_k$ 进行“$D_k$-间隔”排序 $(k=M,M-1,\ldots,1)$

    +   - **注意：**“$D_k$-间隔”有序的序列，在执行“$D_{k-1}$-间隔”排序后，仍然是“$D_k$-间隔”有序的'
  merge: -1
  img_proc: true
- pgno: 381
  md: "# 希尔增量序列\n\n▪ 原始希尔排序　$D_M=\\lfloor N/2\\rfloor,\\quad D_k=\\lfloor D_{k+1}/2\\\
    rfloor$\n\n```\n```c\nvoid Shell_sort( ElementType A[], int N )\n{\n  for ( D=N/2;\
    \ D>0; D/=2 ) { /* 希尔增量序列 */\n    for ( P=D; P<N; P++ ) { /* 插入排序 */\n      Tmp\
    \ = A[P];\n      for ( i=P; i>=D && A[i-D]>Tmp; i-=D )\n        A[i] = A[i-D];\n\
    \      A[i] = Tmp;\n    }\n  }\n}\n```\n```\n\n最坏情况：$T=O(N^2)$"
  merge: -1
  img_proc: true
