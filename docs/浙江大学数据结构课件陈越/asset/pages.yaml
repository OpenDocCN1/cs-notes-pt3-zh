- pgno: 222
  md: '![](img/8e26218ef88df8d6f4fe4ce3f83904a5_222_0.png)


    # ➤ 线性时间复杂度 T(n)=O(n)


    | 结点数 | 最多交换次数 |

    |---|---|

    | n/4 | 1 |

    | n/8 | 2 |

    | n/16 | 3 |

    | …… | |

    | n/2^k−1 | log₂n−1 (k−1) |


    $T(n)=\frac{n}{4}+\frac{n}{8}\times2+\frac{n}{16}\times3+\cdots+\frac{n}{2^k}\times(k-1)$


    $2T(n)=\frac{n}{2}+\frac{n}{4}\times2+\frac{n}{8}\times3+\cdots+\frac{n}{2^{k-1}}\times(k-1)$


    $2T(n)-T(n)=\frac{n}{2}+\frac{n}{4}+\frac{n}{8}+\cdots+\frac{n}{2^{k-1}}-\frac{n}{2^k}\times(k-1)\le
    n-(\log_2 n-1)\le n$'
  merge: -1
