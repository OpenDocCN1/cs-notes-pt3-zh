    \    TmpCell->Element = item;\n    TmpCell->Next = S->Next;\n    S->Next = TmpCell;\n\
    }\n```\n\n```\nElementType Pop(Stack S)\n{ /* 删除并返回堆栈S的栈顶元素 */\n    struct SNode\
