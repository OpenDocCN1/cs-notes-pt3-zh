- pgno: 376
  md: "# # 时间复杂度下界\n\n+   - 对于下标i<j，如果A[i]>A[j]，则称(i, j)是一对逆序对 (inversion)\n\n+  \
    \ - 问题：序列{34, 8, 64, 51, 32, 21}中有多少逆序对？  \n+     (34, 8) (34, 32) (34, 21) (64,\
    \ 51) (64, 32) (64, 21) (51, 32) (51, 21) (32, 21)\n\n+   - 交换2个相邻元素正好消去1个逆序对！\n\
    \n+   - 插入排序：\\( T(N, I) = O(N + I) \\)  \n+     — 如果序列基本有序，则插入排序简单且高效"
