- pgno: 164
  md: '# # 二叉搜索树的查找操作：Find


    +   - 查找从根结点开始，如果树为空，返回NULL


    +   - 若搜索树非空，则根结点关键字和X进行比较，并进行不同处理：


    +   1. 若X小于根结点键值，只需在左子树中继续搜索；


    +   2. 如果X大于根结点的键值，在右子树中进行继续搜索；


    +   3. 若两者比较结果是相等，搜索完成，返回指向此结点的指针。


    ![](img/8e26218ef88df8d6f4fe4ce3f83904a5_164_0.png)'
  merge: -1
  img_proc: true
- pgno: 165
  md: "# 二叉搜索树的查找操作Find\n\n```\nPosition Find( ElementType X, BinTree BST )\n{\n \
    \   if( !BST ) return NULL; /*\n\n    if( X > BST->Data )\n        return Find(\
    \ X, BST->Right ); /*在右子树中继续查找*/\n\n    Else if( X < BST->Data )\n        return\
    \ Find( X, BST->Left ); /*在左子树中继续查找*/\n\n    else /* X == BST->Data */\n     \
    \   return BST; /*查找成功，返回结点的找到结点的地址*/\n}\n```\n\n> 都是“尾递归”"
  merge: -1
  img_proc: true
- pgno: 166
  md: "□ 由于**非递归函数**的执行效率高，可将“**尾递归**”函数改为**迭代**函数\n\n```\nPosition IterFind( ElementType\
    \ X, BinTree BST )\n{\n    while( BST ) {\n        if( X > BST->Data )\n     \
    \       BST = BST->Right; /*向右子树中移动，继续查找*/\n        else if( X < BST->Data )\n\
    \            BST = BST->Left;  /*向左子树中移动，继续查找*/\n        else /* X == BST->Data\
    \ */\n            return BST; /*查找成功，返回结点的找到结点的地址*/\n    }\n    return NULL; /*查找失败*/\n\
    }\n```\n\n# 查找的效率决定于树的高度"
  merge: -1
  img_proc: true
