- pgno: 337
  md: '# 多源最短路算法


    # Floyd 算法


    +   - \(D^k[i][j]\) = 路径\({i \to \{l \le k\} \to j}\)的最小长度

    +   - \(D^0, D^1, \ldots, D^{|V|-1}[i][j]\)即给出了i到j的真正最短距离

    +   - 最初的\(D^{-1}\)是什么？

    +   - 当\(D^{k-1}\)已经完成，递推到\(D^k\)时：

    +     - 或者\(k \notin\)最短路径\({i \to \{l \le k\} \to j}\)，则\(D^k=D^{k-1}\)

    +     - 或者\(k \in\)最短路径\({i \to \{l \le k\} \to j}\)，则该路径必定由两段最短路径组成：\(D^k[i][j]=D^{k-1}[i][k]+D^{k-1}[k][j]\)'
  merge: -1
  img_proc: true
- pgno: 338
  md: "# 多源最短路算法\n\n```\nvoid Floyd()\n{\n    for ( i = 0; i < N; i++ )\n        for(\
    \ j = 0; j < N; j++ ) {\n            D[i][j] = G[i][j];\n            path[i][j]\
    \ = -1;\n        }\n    for( k = 0; k < N; k++ )\n        for( i = 0; i < N; i++\
    \ )\n            for( j = 0; j < N; j++ )\n                if( D[i][k] + D[k][j]\
    \ < D[i][j] ) {\n                    D[i][j] = D[i][k] + D[k][j];\n          \
    \          path[i][j] = k;\n                }\n}\n```\n\n$T = O(|V|^3)$"
  merge: -1
