- pgno: 215
  md: "# ❖ **算法：** 将新增加结点插入到从其父结点到根结点的有序序列中\n\n```\nvoid insert( MaxHeap H, ElementType\
    \ item )\n{ /* 将元素item 插入最大堆，其中H->Elements[0]已经定义为哨兵 */\n    int i;\n    if (\
    \ IsFull(H) ) {\n        printf(\"最大堆已满\");\n        return;\n    }\n    i = ++H->Size;\
    \ /* i指向插入后堆中的最后一个元素的位置 */\n    for ( ; H->Elements[i/2] < item; i/=2 )\n    \
    \    H->Elements[i] = H->Elements[i/2]; /* 向下过滤结点 */\n    H->Elements[i] = item;\
    \ /* 将item 插入 */\n}\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_215_0.png)"
  merge: -1
