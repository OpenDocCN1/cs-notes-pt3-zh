- pgno: 454
  md: "```\n```c\ntypedef struct ListNode *Position, *List;\nstruct ListNode {\n \
    \   ElementType Element;\n    Position   Next;\n};\ntypedef struct HashTbl *HashTable;\n\
    struct HashTbl {\n    int TableSize;\n    List TheLists;\n};\n```\n```\n\n```\n\
    ```c\nPosition Find( ElementType Key, HashTable H )\n{\n    Position P;\n    int\
    \ Pos;\n\n    Pos = Hash( Key, H->TableSize );  /*初始散列位置*/\n    P = H->TheLists[Pos].Next;\
    \        /*获得链表头*/\n    while( P != NULL && strcmp(P->Element, Key) )\n      \
    \  P = P->Next;\n    return P;\n}\n```\n```"
