- pgno: 175
  md: "```\nBinTree Delete( ElementType X, BinTree BST )\n{\n    Position Tmp;\n \
    \   if( !BST ) printf(\"要删除的元素未找到\");\n    else if( X < BST->Data )\n        BST->Left\
    \ = Delete( X, BST->Left); /* 左子树递归删除 */\n    else if( X > BST->Data )\n     \
    \   BST->Right = Delete( X, BST->Right); /* 右子树递归删除 */\n    else /*找到要删除的结点 */\n\
    \    if( BST->Left && BST->Right ) { /*被删除结点有左右两个子结点 */\n        Tmp = FindMin(\
    \ BST->Right );\n        /*在右子树中找最小的元素填充删除结点*/\n        BST->Data = Tmp->Data;\n\
    \        BST->Right = Delete( BST->Data, BST->Right);\n        /*在删除结点的右子树中删除最小元素*/\n\
    \    } else { /*被删除结点有一个或无子结点*/\n        Tmp = BST;\n        if( !BST->Left )\
    \ /* 有右孩子或无子结点*/\n        BST = BST->Right;\n        else if( !BST->Right ) /*有左孩子或无子结点*/\n\
    \        BST = BST->Left;\n        free( Tmp );\n    }\n    return BST;\n}\n```"
