  md: "# # 深度优先搜索 (Depth First Search, DFS)\n\n类似于树的先序遍历\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_277_0.png)\n\
    \n```\nvoid DFS ( Vertex V )\n{\n    visited[ V ] = true;\n    for ( V 的每个邻接点\
    \ W )\n        if ( !visited[ W ] )\n            DFS( W );\n}\n```\n\n若有 N 个顶点、E\
    \ 条边，时间复杂度是\n\n+   - 用邻接表存储图，有 O(N+E)\n+   - 用邻接矩阵存储图，有 O(N²)"
