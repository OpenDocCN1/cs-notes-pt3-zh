  md: '# 二叉树几个重要性质


    +   - 一个二叉树第 *i* 层的最大结点数为：$2^{i-1}$，$i \ge 1$。


    +   - 深度为 *k* 的二叉树有最大结点总数为：$2^k-1$，$k \ge 1$。


    +   - 对任何非空二叉树 T，若 $n_0$ 表示叶结点的个数、$n_2$ 是度为 2 的非叶结点个数，那么两者满足关系 $n_0=n_2+1$。


