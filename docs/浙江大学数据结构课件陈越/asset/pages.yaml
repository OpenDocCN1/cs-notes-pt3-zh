  md: "[例] 请用一个数组实现两个堆栈，要求最大地利用数组空间，使数组只要有空间入栈操作就可以成功。\n\n【分析】一种比较聪明的方法是使这两个栈分别从数组的两头开始向中间生长；当两个栈的栈顶指针相遇时，表示两个栈都满了。\n\
    \n```\n#define MaxSize <存储数据元素的最大个数>\nstruct DStack {\n    ElementType Data[MaxSize];\n\
    \    int Top1; /* 堆栈 1 的栈顶指针 */\n    int Top2; /* 堆栈 2 的栈顶指针 */\n} S;\n\nS.Top1\
    \ = -1;\nS.Top2 = MaxSize;\n```"
  merge: -1
