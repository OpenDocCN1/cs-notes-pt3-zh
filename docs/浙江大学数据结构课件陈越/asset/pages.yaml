  md: '# # 小规模数据的处理


    +   - **快速排序的问题**

    +     - 用递归……

    +     - 对小规模的数据（例如 N 不到 100）可能还不如插入排序快


    +   - **解决方案**

    +     - 当递归的数据规模充分小，则停止递归，直接调用简单排序（例如插入排序）

    +     - 在程序中定义一个 **Cutoff** 的阈值——课后去实践一下，比较不同的 **Cutoff** 对效率的影响'
