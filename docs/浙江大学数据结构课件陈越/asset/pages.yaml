- pgno: 216
  md: "# ❖ **算法：** 将新增结点插入到从其父结点到根结点的有序序列中\n\n```\n```c\nvoid Insert( MaxHeap H, ElementType\
    \ item )\n{ /* 将元素item 插入最大堆，其中H->Element[0]是哨兵元素 */\n    int i;\n    if ( IsFull(H)\
    \ ) {\n        printf(\"最大堆已满\");\n        return;\n    }\n    i = ++H->Size;\
    \ /* i指向插入位置的最后一个元素的位置 */\n    for ( ; H->Elements[i/2] < item; i/=2 )\n     \
    \   H->Elements[i] = H->Elements[i/2]; /* 向下过滤结点 */\n    H->Elements[i] = item;\
    \ /* 将item 插入 */\n}\n```\n```\n\n> H->Element[0] 是哨兵元素，\n> 它不小于堆中的最大元素，\n> 控制顺环结束。\n\
    \n*T(N) = O(log N)*\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_216_0.png)"
