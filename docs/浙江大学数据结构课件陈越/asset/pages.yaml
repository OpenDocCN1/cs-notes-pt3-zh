  md: "# # Prim算法 — 让一棵小树长大\n\n```\nvoid Dijkstra( Vertex s )\n{\n    while (1) {\n\
    \    V = 未收录顶点中dist最小者;\n    if ( 这样的V不存在 )\n    break;\n    collected[V] = true;\n\
    \    for ( V 的每个邻接点 W )\n    if ( collected[W] == false )\n    if ( dist[V]+E<v,\
    \ w> < dist[W] ){\n    dist[W] = dist[V] + E<v, w> ;\n    path[W] = V;\n    }\n\
    \    }\n}\n```\n\n```\nvoid Prim()\n{ MST = {s};\n    while (1) {\n    V = 未收录顶点中dist最小者;\n\
    \    if ( 这样的V不存在 )\n    break;\n    将v收录进MST: dist[V] = 0;\n    for ( V 的每个邻接点\
    \ W )\n    if ( dist[W]!= 0 )\n    if ( E<v, w> < dist[W] ){\n    dist[W] = E<v,\
    \ w> ;\n    parent[W] = V;\n    }\n    }\n    if ( MST中收的顶点不到|V|个 )\n    Error\
    \ ( “生成树不存在” );\n}\n```\n\ndist[V] = E<sub>(s,v)</sub>或 正无穷\n\nparent[s] = -1\n\
    \nT = O(|V|<sup>2</sup>)\n\n稠密图合算\n\nCopyright © 2014, 浙江大学计算机科学与技术学院\nAll Rights\
