  md: "# 给定N个整数的序列{ A<sub>1</sub>, A<sub>2</sub>, ..., A<sub>N</sub> }，求函数 f(i,j)=max{0,∑<sub>k=i</sub><sup>j</sup>A<sub>k</sub>}\
    \ 的最大值。\n\n# 算法1\n\n```\nint MaxSubseqSum1( int A[], int N )\n{\n    int ThisSum,\
    \ MaxSum = 0;\n    int i, j, k;\n    for( i = 0; i < N; i++ )   /* i是子列左端位置 */\n\
    \        for( j = i; j < N; j++ )   /* j是子列右端位置 */\n        {\n            ThisSum\
    \ = 0;   /* ThisSum是从A[i]到A[j]的子列和 */\n            for( k = i; k <= j; k++ )\n\
    \                ThisSum += A[k];\n\n            if( ThisSum > MaxSum )   /* 如果刚得到的这个子列和更大\
    \ */\n                MaxSum = ThisSum;   /* 则更新结果 */\n        }   /* j循环结束 */\n\
    \    }   /* i循环结束 */\n    return MaxSum;\n}\n```"
  merge: -1
