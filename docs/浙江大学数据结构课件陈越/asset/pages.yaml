- pgno: 462
  md: '# 3. 分离链接法的查找性能


    所有地址链表的平均长度定义成装填因子α，α有可能超过1。

    不难证明：其期望探测次数p为：


    $$p=\begin{cases}\alpha+e^{-\alpha} &（对插入和不成功查找而言）\\1+\frac{\alpha}{2} &（对成功查找而言）\end{cases}$$


    当 α = 1 时，


    +   - 插入操作和不成功查找的期望 ASLu = 1+e⁻¹ = 1.37 次。

    +   - 成功查找的期望 ASLs = 1+1/2 = 1.5 次。


    ➢ 前面例子14个元素分布在11个单链表中，所以α=14/11≈1.27，故

    期望 ASLu = 1.27+e⁻¹·²⁷ ≈ 1.55次

    期望 ASLs = 1+1.27/2 ≈ 1.64次（例中ASLs =1.36）。


    ![](img/8e26218ef88df8d6f4fe4ce3f83904a5_462_0.png)'
  merge: -1
  img_proc: true
- pgno: 463
  md: '+   👉 选择合适的 **h(key)**，散列法的查找效率期望是 **常数 O(1)**，它几乎与关键字的空间的大小 n 无关！也适合于关键字直接比较计算量大的问题

    +   👉 它是以**较小的 α**为前提。因此，散列方法是一个以**空间换时间**

    +   👇 散列方法的存储对关键字是**随机**的，不便于**顺序查找**关键字，也不适合于**范围查找**，或**最大值最小值**查找。'
