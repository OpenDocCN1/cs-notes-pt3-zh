- pgno: 278
  md: "# # 广度优先搜索(Breadth First Search, BFS)\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_278_0.png)\n\
    \n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_278_1.png)\n\n```\n```cpp\nvoid BFS\
    \ ( Vertex V )\n{\n    visited[V] = true;\n    Enqueue(V, Q);\n    while(!IsEmpty(Q)){\n\
    \    V = Dequeue(Q);\n    for ( V 的每个邻接点 W )\n    if ( !visited[W] ){\n    visited[W]\
    \ = true;\n    Enqueue (W, Q);\n    }\n    }\n}\n```\n```\n\n若有N个顶点、E条边，时间复杂度是\n\
    \n+   - 用邻接表存储图，有O(N+E)\n\n+   - 用邻接矩阵存储图，有O(N²)"
