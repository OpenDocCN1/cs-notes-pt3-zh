- pgno: 208
  md: '# # 若采用数组或链表实现优先队列


    +   ### 数组：

    +   插入 — 元素总是插入尾部 ~ Θ(1)

    +   删除 — 查找最大（或最小）关键字 ~ Θ(n)

    +   　　　从数组中删去需要移动元素 ~ O(n)


    +   ### 链表：

    +   插入 — 元素总是插入链表的头部 ~ Θ(1)

    +   删除 — 查找最大（或最小）关键字 ~ Θ(n)

    +   　　　删除结点 ~ Θ(1)


    +   ### 有序数组：

    +   插入 — 找到合适的位置 ~ O(n) 或 O(log₂ n)

    +   　　　移动元素并插入 ~ O(n)

    +   删除 — 删去最后一个元素 ~ Θ(1)


    +   ### 有序链表：

    +   插入 — 找到合适的位置 ~ O(n)

    +   　　　插入元素 ~ Θ(1)

    +   删除 — 删除首元素或最后元素 ~ Θ(1)'
