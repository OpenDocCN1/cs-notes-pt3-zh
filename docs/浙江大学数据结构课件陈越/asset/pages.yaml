- pgno: 110
  md: "# 静态查找\n\n# 方法1：顺序查找\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_110_0.png)\n\
    \n```\n```c\nint SequentialSearch (StaticTable *Tbl,\n                     ElementType\
    \ K)\n{ /*在表Tbl[1]~Tbl[n]中查找关键字为K的数据元素*/\n    int i;\n    Tbl->Element[0] = K;\
    \   /*建立哨兵*/\n    for(i = Tbl->Length; Tbl->Element[i] != K; i--);\n    return\
    \ i; /*查找成功返回所在单元下标，不成功返回0*/\n}\n```\n```\n\n顺序查找算法的时间复杂度为 **O(n)**。"
