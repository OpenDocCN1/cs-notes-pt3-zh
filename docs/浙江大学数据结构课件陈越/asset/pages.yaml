  md: "# # 堆栈的链式存储实现\n\n栈的链式存储结构实际上就是一个单链表，叫做链栈。插入和删除操作只能在链栈的栈顶进行。栈顶指针Top应该在链表的哪一头？\n\
    \ntypedef struct SNode *Stack;\nstruct SNode{\n    ElementType Data;\n    struct\
    \ SNode *Next;\n};\n\n(1) 堆栈初始化（建立空栈）\n(2) 判断堆栈S是否为空\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_83_0.png)\n\
    \n```\nStack CreateStack()\n{\n    /* 构建一个堆栈的头结点，返回指针 */\n    Stack S;\n    S\
    \ = (Stack)malloc(sizeof(struct SNode));\n    S->Next = NULL;\n    return S;\n\
    }\n```\n\n```\nint IsEmpty(Stack S)\n{\n    /*判断堆栈s是否为空，若为空函数返回整数1，否则返回0 */\n\
    \    return ( S->Next == NULL );\n}\n```"
