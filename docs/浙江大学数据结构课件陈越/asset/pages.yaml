  md: "层序基本过程：先根结点入队，然后：\n\n+   ① 从队列中取出一个元素；\n+   ② 访问该元素所指结点；\n+   ③ 若该元素所指结点的左、右孩子结点非空，则将其左、右孩子的指针顺序入队。\n\
    \n```\nvoid LevelOrderTraversal ( BinTree BT )\n{\n    Queue Q;  BinTree T;\n\
    \    if ( !BT ) return; /* 若是空树则直接返回 */\n    Q = CreatQueue( MaxSize ); /*创建并初始化队列Q*/\n\
    \    AddQ( Q, BT );\n    while ( !IsEmpty( Q ) ) {\n        T = DeleteQ( Q );\n\
    \        printf(\"%d\\n\", T->Data); /*访问取出队列的结点*/\n        if ( T->Left )  AddQ(\
    \ Q, T->Left );\n        if ( T->Right ) AddQ( Q, T->Right );\n    }\n}\n```"
  merge: -1
