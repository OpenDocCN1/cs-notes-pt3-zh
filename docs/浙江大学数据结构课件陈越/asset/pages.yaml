- pgno: 374
  md: "# 简单排序\n\n# 冒泡排序\n\n```\n```c\nvoid Bubble_Sort( ElementType A[], int N )\n\
    {\n    for ( P=N-1; P>=0; P-- ) {\n        flag = 0;\n        for( i=0; i<P; i++\
    \ ) { /* 一趟冒泡 */\n            if ( A[i] > A[i+1] ) {\n                Swap(A[i],\
    \ A[i+1]);\n                flag = 1; /* 标识发生了交换 */\n            }\n        }\n\
    \        if ( flag==0 ) break; /* 全程无交换 */\n    }\n}\n```\n```\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_374_0.png)\n\
    \n最好情况：顺序 $T=O(N)$\n\n最坏情况：逆序 $T=O(N^2)$\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_374_1.png)"
  merge: -1
