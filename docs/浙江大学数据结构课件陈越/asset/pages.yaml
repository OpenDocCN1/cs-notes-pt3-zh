  md: "# # 模块的引用与裁剪\n\n![](img/8e26218ef88df8d6f4fe4ce3f83904a5_477_0.png)\n\n```\n\
    ```c\n#define MAXTABLESIZE 100000\nint NextPrime( int N )\n{ /* 返回大于N且不超过MAXTABLESIZE的最小素数\
    \ */\n    int i, p = (N%2)? N + 2 : N+1; /* 从大于N的下一个奇数开始 */\n    while ( p <=\
    \ MAXTABLESIZE ) {\n        for( i=(int)sqrt( p ); i>2; i-- )\n            if\
    \ ( !(p%i) ) break; /* p不是素数 */\n        if ( i==2 ) break; /* for正常结束，说明p是素数\
    \ */\n        else p += 2; /* 否则试探下一个奇数 */\n    }\n    return p;\n}\n\nHashTable\
    \ CreateTable( int TableSize )\n{\n    HashTable H;\n    int i;\n    H = (HashTable)malloc(sizeof(struct\
    \ TblNode));\n    H->TableSize = NextPrime(TableSize);\n    H->Heads = (List)malloc(H->TableSize*sizeof(struct\
    \ LNode));\n    for( i=0; i<H->TableSize; i++ ) {\n        H->Heads[i].Data[0]\
    \ = '\\0'; H->Heads[i].Next = NULL;\n        H->Heads[i].Count = 0;\n    }\n \
    \   return H;\n}\n```\n```\n\n```\n```c\nint Hash ( int Key, int P )\n{ /* 除留余数法散列函数\
    \ */\n    return Key%P;\n}\n```\n```"
