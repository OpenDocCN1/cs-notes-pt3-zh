- pgno: 955
  md: '# # 二元关系的性质对应于关系图，有：


    （1）自反性：每个顶点都有自回路，


    （2）对称性：任二个顶点间或没有边，或有二条相对而指的有向边；


    （3）反对称性：任二个顶点至多只有一条有向边；


    （4）传递性：若 x 到 y 有边， y 到 z 有边，则 x 到 z 必有边。'
  merge: -1
  img_proc: true
- pgno: 956
  md: '# # Relations关系


    注： 由对称性与传递性可推出自反性。


    理由：若 \( (a, b) \in R \)，由对称性，

    有 \( (b, a) \in R \)，由传递性

    有 \( (a, a) \in R \)。


    错误原因：不是 \(\forall a\)，

    \(\exists b\)，使 \( (a, b) \in R \)。


    如：

    R的相关矩阵是全0矩阵，是对称的，

    传递的，但不是自反的。'
