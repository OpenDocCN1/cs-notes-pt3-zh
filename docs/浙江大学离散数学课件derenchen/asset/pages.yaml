  md: "# # 注：\n\n二元关系： 二个对象之间相关的关系  \n多元关系： 多个对象之间的关系  \n多元关系常化成二元关系来研究  \n无序的二元关系：\
    \ 方块 k 与梅花 k，谁在前，谁在后都还是同点的  \n有序的二元关系： 父子关系，不能交换父与子的次序\n\n又如：  \n(1) a + b = 偶数，\
    \ a 与 b 是无序的  \n用 [ a, b ] 表示无序对  \n(2) a ≤ b， a 与 b 是有序的二元关系，叫作 a 相关于 b，记成 a\
