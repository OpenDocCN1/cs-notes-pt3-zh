- pgno: 1503
  md: "# Algorithms\n算法\n\n```\nWhile z ∈ S\n\nBegin\n\n    u := a vertex not in S\
    \ with L(u) minimal\n\n    S := S ∪ {u}\n\n    for all vertices v not in S\n\n\
    \        if L(u) + w(u,v) < L(v) := L(u) + w(u,v)\n\n{this adds a vertex to S\
    \ with minimal label and updates the\nlabels of vertices not in S}\n\nEnd {L(z)\
    \ = length of shortest path from a to z}\n```"
