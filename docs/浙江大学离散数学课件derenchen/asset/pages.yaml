- pgno: 1894
  md: '# 二．联结词与复合命题


    定义1.0 一个命题若不能被分解成更简单的陈述句，则称为简单命题或原子命题；若一个命题是由几个简单陈述句通过联结词联结而成的，则称为复合命题。


    定义1.1 设 $p$ 为命题，复合命题“非 $p$”（即“$p$ 的否定”）称为 $p$ 的否定式，记为 ¬$p$。符号 ¬ 称为否定联结词。¬$p$ 为真当且仅当
    $p$ 为假。'
