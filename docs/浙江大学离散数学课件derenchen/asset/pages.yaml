  md: '# 定理9.5 任何无限集合A必含有无限可数子集。


    **证：** 从A中任取一个元素，记为 $a_1$，因 A 是无限集，故 $A-\{a_1\}$ 仍是无限集，从 $A-\{a_1\}$ 中再取一个元素，记为
    $a_2$。一般地，记已取出 $a_1,a_2,\ldots,a_n$，则因 $A-\{a_1,a_2,\ldots,a_n\}$ 仍是无限集，故可从 $A-\{a_1,a_2,\ldots,a_n\}$
    中再取出一个元素，记为 $a_{n+1}$。如此继续，便可得到 A 的一个无限可数子集 $M=\{a_1,a_2,\ldots,a_n,\ldots\}$。


    # 定理9.6


    +   1. 可数集的任何子集都是可数集；

    +   2. 两个可数集的并是可数集；

    +   3. 两个可数集的笛卡尔积是可数集；

    +   4. 可数个可数集的并是可数集；

    +   5. 无限集A的幂集P(A)不是可数集。


