  md: "# 应用问题：旅行商问题（TSP）\nTraveling Salesman Problem\n\n问题：从某地出发，恰好一次经过 n 个城市回到原地，寻找最短的道路。\n\
    \n实质：无向简单加权图，寻找最短 H 回路的问题。\n\n+   说明：\n+   \n+   1. 不一定存在，若无向图是完全图则存在。\n+   2.\
    \ 图是连通的，两个城市间总有路，若以两城市间交通费用作为边的权，则是无向图的 H 回路问题。"
