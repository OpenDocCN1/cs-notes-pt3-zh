- pgno: 1643
  md: '（4）不含个体变项的谓词称为0元谓词。


    例如 F(a)，G(a, b)，P(a₁, a₂，…，aₙ) 等。当F，G，P等为谓词常项时，0元谓词即为命题。因此，命题可看作特殊的谓词。


    # 例4.1 用0元谓词将下列命题符号化，并讨论它们的真值。


    +   1. 只有当2是素数时，4才是素数；

    +   2. 如果5大于4，则4大于6。


    解：（1）设一元谓词F(x)：x是素数；个体常项：a：2；b：4。则(1)中命题可符号化：F(b) → F(a)。


    因为该蕴含式前件为假，故命题为真。


    （2）设二元谓词G(x,y)：x大于y。个体常项：a：4；b：5；c：6。则(2)中命题可符号化为：G(b,a) → G(a,c)。


    由于G(b,a)为真，而G(a,c)为假，故命题为假。'
  merge: -1
  img_proc: true
- pgno: 1644
  md: '# 3. 量词：表示个体常项或变项之间数量关系的词。


    量词只有两个：全称量词、存在量词。


    (1) 全称量词：表示“全部”含义的词。全称量词统一符号化为“∀”。


    注：a. 常用语中“全部”、“所有的”、“一切”、“每一个”、“任何”、


    “任意的”、“凡”、“都”等词都是全称量词。


    b. ∀x F(x)表示个体域里所有个体都有性质F。


    (2) 存在量词：表示“存在”含义的词。存在量词统一符号化为“∃”。


    注：a. 常用语中“存在”、“有一个”、“有的”、“至少有一个”


    等词都


    是存在量词。


    b. ∃x F(x)表示个体域中存在一个个体具有性质F。'
  merge: -1
  img_proc: true
- pgno: 1645
  md: '# 例4.2 将下面两个命题符号化：


    +   (1) 凡是人都要呼吸； (2) 有人用左手写字。


    其中个体域为人类集合。


    解：令 F(x): x 呼吸；G(x): x 用左手写字。则 (1) ∀x F(x); (2) ∃x G(x)。


    # 例4.3 上例中，将个体域改为全总个体域后，两命题的符号化形式如何？


    解：令 F(x): x呼吸；G(x): x用左手写字；M(x): x是人。


    +   则：(1) ∀x (M(x) → F(x)); (2) ∃x (M(x)∧ G(x)).


    由例4.2和例4.3可见，在不同个体域中，同一个命题的符号化形式可能不同。此外，同一个命题，在不同个体域中的真值也可能不同。例如“存在x,使得x+5=3”这一命题，可符号化为∃xF(x)，(F(x):
    x+5=3)。当个体域是自然数集合时，命题为假，当个体域是实数域时，命题为真。


    问题中没有指明个体域时，默认为全总体域。'
