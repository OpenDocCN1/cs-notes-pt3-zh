- pgno: 1700
  md: '# § 6.3 集合恒等式


    设A,B,C是集合，则下列运算律成立：


    +   1. 幂等律： \( A \cup A = A, A \cap A = A \)


    +   2. 结合律： \( (A \cup B) \cup C = A \cup (B \cup C), (A \cap B) \cap C = A \cap
    (B \cap C) \)


    +   3. 交换律： \( A \cup B = B \cup A, A \cap B = B \cap A \)


    +   4. 分配律： \( A \cup (B \cap C) = (A \cup B) \cap (A \cup C), A \cap (B \cup
    C) = (A \cap B) \cup (A \cap C) \)


    +   5. 同一律： \( A \cup \varnothing = A, A \cap E = A \)


    +   6. 零律： \( A \cup E = E, A \cap \varnothing = \varnothing \)


    +   7. 排中律： \( A \cup \sim A = E \)


    +   8. 矛盾律： \( A \cap \sim A = \varnothing \)


    +   9. 吸收律： \( A \cup (A \cap B) = A, A \cap (A \cup B) = A \)


    +   10. 德摩根律： \( A - (B \cup C) = (A - B) \cap (A - C), A - (B \cap C) = (A -
    B) \cup (A - C) \)

    +       \( \sim (B \cup C) = \sim B \cap \sim C, \sim (B \cap C) = \sim B \cup
    \sim C \)

    +       \( \sim \varnothing = E, \sim E = \varnothing \)


    +   11. 双重否定律： \( \sim (\sim A) = A \)'
  merge: -1
  img_proc: true
- pgno: 1701
  md: '# # 其它重要运算性质：


    +   1. \( A \cap B \subseteq A \, A \cap B \subseteq B \)


    +   2. \( A \subseteq A \cup B \, B \subseteq A \cup B \)


    +   3. \( A - B \subseteq A \)


    +   4. \( A - B = A \cap \sim B \)


    +   5. \( A \cup B = B \Leftrightarrow A \subseteq B \Leftrightarrow A \cap B
    = A \Leftrightarrow A - B = \varnothing \)


