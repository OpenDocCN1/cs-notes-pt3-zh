  md: '# 定义9.2


    设 $A$、$B$ 是集合，若存在从 $A$ 到 $B$ 的单射，则称 $B$ 优势于 $A$，记作 $A\preceq B$。如果 $A\preceq B$
    但 $A\not\approx B$，则称 $B$ 真优势于 $A$，记作 $A\prec B$。


    例如：$M\preceq N$；$N\preceq R$；$A\preceq P(A)$；$N\prec R$；$A\prec P(A)$ 等


    **注：** $B$ 真优势于 $A$，通俗地说，就是集合 $B$ 大于集合 $A$，即 $B$ 含元素的量多于 $A$ 含元素的量。但应注意这并不是说 $B$
    包含 $A$。


    # 定理9.3


    设 $A$、$B$、$C$ 是任意集合，则


    +   1. $A\preceq A$

    +   2. 若 $A\preceq B$ 且 $B\preceq A$，则 $A\approx B$

    +   3. 若 $A\preceq B$ 且 $B\preceq C$，则 $A\approx C$


    证明略'
