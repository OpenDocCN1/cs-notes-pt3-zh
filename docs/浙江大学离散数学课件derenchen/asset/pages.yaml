- pgno: 1650
  md: '# § 4.2（一阶）谓词逻辑公式及解释


    定义4.1（一阶）谓词语言 F 字母表定义如下：


    +   1. 个体常项：$a,b,c,\ldots;\ a_i,b_i,c_i,\ldots,\ i\geq 1$

    +   2. 个体变项：$x,y,z,\ldots;\ x_i,y_i,z_i,\ldots,\ i\geq 1$

    +   3. 函数符号：$f,g,h,\ldots;\ f_i,g_i,h_i,\ldots,\ i\geq 1$

    +   4. 谓词符号：$F,G,H,\ldots;\ F_i,G_i,H_i,\ldots,\ i\geq 1$

    +   5. 联结词符号：$\neg,\land,\lor,\rightarrow,\leftrightarrow$。

    +   6. 逗号与括号：$，、（）$。


    定义 4.2（一阶）谓词语言 F 的项定义如下：


    +   1. 个体常项和个体变项是项；

    +   2. 若 $\varphi(x_1,x_2,\ldots,x_n)$ 是任意的 $n$ 元函数，$t_1,t_2,\ldots,t_n$ 是任意的
    $n$ 个项，则 $\varphi(t_1,t_2,\ldots,t_n)$ 是项。

    +   3. 所有的项都是有限次使用(1)、(2)得到的。'
  merge: -1
  img_proc: true
- pgno: 1651
  md: '定义4.3 设 \( R(x_1,x_2,\dots,x_n) \) 是一阶语言 \( F \) 中的任意一个 \( n \) 元谓词。\( t_1,t_2,\dots,t_n
    \) 是 \( F \) 的任意 \( n \) 个项，则称 \( R(t_1,t_2,\dots,t_n) \) 是 \( F \) 的原子公式。


    定义4.4 一阶谓词语言 \( F \) 中的合式公式（也称为谓词公式或公式）定义如下：


    +   (1) 原子公式是合式公式；

    +   (2) 若 \( A \) 是合式公式，则 \( (\neg A) \) 也是合式公式；

    +   (3) 若 \( A, B \) 是合式公式，则 \( (A \land B), (A \lor B), (A \to B), (A \leftrightarrow
    B) \) 也是合式公式；

    +   (4) 若 \( A \) 是合式公式，则 \( \forall x A, \exists x A \) 也是合式公式；

    +   (5) 只有有限次应用 (1)~(4) 构成的符号串才是合式公式。


    定义4.5 在公式 \( \forall x A \) 和 \( \exists x A \) 中，称 \( x \) 为指导变元，\( A \) 为相应量词的辖域。

    在 \( \forall x \) 和 \( \exists x \) 的辖域中，\( x \) 的所有出现都称为约束出现，\( A \) 中不是约束出现的其它变项都称为自由出现。'
  merge: -1
  img_proc: true
