- pgno: 1752
  md: '# 定理 7.13 设 R 是非空集合 A 上的关系


    +   1. 若 R 是自反的，则 s(R) 和 t(R) 也是自反的。

    +   2. 若 R 是对称的，则 r(R) 和 t(R) 也是自反的。

    +   3. 若 R 是传递的，则 r(R) 也是传递的。


    **证明：** 只证（2），其余留作练习。


    先考虑 r(R)。因 R 是 A 上的对称关系。故 R=R⁻¹，同时 I_A=I_A⁻¹，于是


    (R∪I_A)⁻¹=R⁻¹∪I_A⁻¹（根据习题 7.20）。


    从而  r(R)⁻¹=(R∪R⁰)⁻¹=(R∪I_A)⁻¹=R⁻¹∪I_A⁻¹=R∪I_A=r(R)。


    这便说明 r(R) 是对称的。


    下面证明 t(R) 的对称性。为此，先用数学归纳法证明：若 R 是对称的，则对任何正整数 n，Rⁿ 也是对称的。


    事实上，当 n=1 时，R¹=R 显然是对称的。'
