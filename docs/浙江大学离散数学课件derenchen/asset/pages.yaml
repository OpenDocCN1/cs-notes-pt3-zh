- pgno: 576
  md: '# # 2.4 Integers and Algorithms


    # # INTRODUCTION


    As mentioned in Section 2.1 , the term algorithm originally referred to procedures
    for performing arithmetic operations using the decimal representations of integers
    . These algorithms,adapted for use with binary representations , are the basis
    for computer arithmetic . The provide good illustrations of the concept of the
    algorithm and the complexity of algorithms . For these reasons,they will be discussed
    in this section.


    These are many important algorithms involving integers besides those used in arithmetic
    . We will begin our discussion lf integers and algorithms with the Euclidean algorithm
    . It is one lf the most useful algorithms , and perhaps the oldest algorithm in
    mathematics .We will also describe an algorithm for finding the base b expansion
    of a positive integer for any base b.'
