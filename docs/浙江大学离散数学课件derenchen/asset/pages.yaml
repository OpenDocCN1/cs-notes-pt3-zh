    **【定义4.3】** 集合的分划：把集合 A 分为若干子集 A₁，A₂，…，满足：


    （1）当 i ≠ j 时，Aᵢ∩Aⱼ=Φ


    （2）∀a∈A，∃i，使 a∈Aᵢ（i=1，2，…）


    则集合 Pᵣ（A）={{A₁，A₂，…，Aₙ，…}} 称为 A 的一个分划。'
