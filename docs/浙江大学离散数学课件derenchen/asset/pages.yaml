- pgno: 1774
  md: '# 定义8.6 设 $f:A\to B$。


    +   1. 若 $ran\,f=B$，则称 $f$ 是满射。


    +   2. 若 $\forall y\in ran\,f$ 都存在唯一的 $x\in A$ 使得 $f(x)=y$，则称 $f$ 是单射。


    +   3. 若 $f$ 既是满射又是单射，则称 $f$ 是双射（一一映射）。


    # 注：


    +   1. 如果 $f$ 是满射，则对 $\forall y\in B$，都存在 $x\in A$，使 $f(x)=y$。


    +   2. 如果 $f$ 是单射，则对 $x_1,x_2\in A$，$x_1\ne x_2$，必定 $f(x_1)\ne f(x_2)$。


    也就是说，如果 $f(x_1)=f(x_2)$，则 $x_1=x_2$。'
