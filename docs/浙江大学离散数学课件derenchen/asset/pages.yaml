- pgno: 1758
  md: '# 四、商集


    定义7.17 设R为非空集合A上的等价关系，以R的所有等价类作为元素，形成的集合称为A关于R的商集，记为A/R，即：


    $$A/R=\{[x]_R\mid x\in A\}$$


    例如：例7.16中等价关系形成的商集为：


    $$A/R=\{\{1,4,7\},\{2,5,8\},\{3,6\}\}$$


    # 五、集合的划分


    定义7.18 设A为非空集合，若A的子集族π（π⊆P(A)，是由A的一些子集形成的集合）满足下列条件：


    +   1. $\Phi\in\pi$

    +   2. $\forall x\forall y(x,y\in\pi\land x\ne y\Rightarrow x\cap y=\Phi)$

    +   3. $\bigcup_{x\in\pi}x=A$


    则称π是A的一个划分，而π中的元素为A的划分块或类。'
  merge: -1
  img_proc: true
- pgno: 1759
  md: '例7.17 设 A={a，b，c，d}，则


    $\pi_1=\{\{a,b,c\},\{d\}\}$ 和 $\pi_2=\{\{a,b\},\{c\},\{d\}\}$ 都是 A 的划分，


    而 $\pi_3=\{\{a\},\{a,b,c,d\}\}$ 和 $\pi_4=\{\Phi,\{a,b\},\{c\}\}$ 都不是 A 的划分。


    注：给定非空有限集 A 上的一个等价关系 R，在 R 下彼此等价的元素构成的子集便形成了 A 的一个划分，它其实就是商集 A/R，其每个类（等价块）就是 R
    的一个等价类；反之，任何给 A 的一个划分 π，可定义 A 上的关系 R 如下：


    ```

    R={<x,y>| x,y∈A ∧ x与y在π的同一个类中}

    ```


    可以验证 R 是 A 上的一个等价关系。可见 A 上的等价关系与 A 的划分是一一对应的。'
