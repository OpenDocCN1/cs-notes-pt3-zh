- pgno: 1857
  md: '# A 上各类二元关系的性质


    # 3）传递性


    若（a，b），（b，c）∈R，则（a，c）∈R，称这样的R为传递的二元关系(Transitive relation)。


    此R的相关矩阵满足（）∀=1'
  merge: -1
  img_proc: true
- pgno: 1858
  md: '# # A 上各类二元关系的性质


    注意，a<sub>ij</sub>，a<sub>jk</sub>中有一个不是 1，a<sub>ik</sub>就可以任意。例如：

    A = { a， b， c， d }，R = { (a， b) （c， d） }

    是传递的二元关系，因为没有传递的条件，也就不需传递的结果。二元关系的这些性质，体现在关系图中，自反性表现为每个顶点都有自回路，反自反性表现为每个顶点都没有自回路；对称性表现为任二个顶点间或没有边，或有二条相对而指的有向边，反对称性表现为任二个顶点至多只有一条有向边；传递性则表现为：若
    x 到 y 有边， y 到 z 有边，则 x 到 z 必有边。有人说，对称性与传递性可以推出自反性来，因为（a， b）∈R，由对称性（b， a）∈R，又由传递性得出（a，
    a）∈R，'
  merge: -1
  img_proc: true
- pgno: 1859
  md: '# # A 上各类二元关系的性质


