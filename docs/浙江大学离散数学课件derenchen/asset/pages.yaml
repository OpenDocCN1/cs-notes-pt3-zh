  md: '定理3：令 A（a1、a2、……、an）包含有 n 个变量的公式，则有：


    +   1、如果 A 存在与之等价的主析取范式，则必唯一；

    +   2、如果 A 存在与之等价的主合取范式，则必唯一；

    +   3、A 是永真公式当且仅当与 A 等价的主析取范式恰有 $2^n$ 个极小项或没有主合取范式；

    +   4、A 是永假公式当且仅当与 A 等价的主合取范式恰有 $2^n$ 个极大项或没有主析取范式；

    +   5、两个命题公式等价当且仅当它们有相同的主合取范式或相同的主析取范式。'
