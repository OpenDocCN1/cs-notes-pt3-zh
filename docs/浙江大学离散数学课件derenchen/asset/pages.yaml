- pgno: 804
  md: '# 递归算法和迭代算法


    # 推理与证明方法


    建立在递归函数上的算法称为递归算法，即要求解一个有参数n的函数可以调用含有更小参数的同样的函数。


    任何一个递归算法都有一个迭代算法与之对应。递归算法要保存和计算一系列中间过步骤，而迭代算法只须保存最新结果，因此其计算量与存贮量都比递归算法好，但是从逻辑结构上讲，递归算法更加紧凑简洁。'
