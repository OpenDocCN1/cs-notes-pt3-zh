    **定理/Theorem**: 一个真值为 T 的命题语句。


    **证明/Proof**: 用论证方式形成的一个命题语句序列说明一个定理为 T。


    证明的构造/形式：由两个部分组成


    +   1. **公理、假定或前提/axiom、postulate、hypotheses**

    +   2. **推理规则/rule of inference**


