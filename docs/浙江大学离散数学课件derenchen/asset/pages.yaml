  md: '# Example 1


    What are the chromatic numbers of the graphs G and H shown in Figure 3?


    **Solution:** The chromatic number of G is at least 3, since the vertices a, b,
    and c must be assigned different colors. To see if G can be colored with three
    colors, assign red to a, blue to b, and green to c. Then d can (and must) be colored
    red since it is adjacent to b and c. Furthermore, e can (and must) be colored
    green since it is adjacent only to vertices colored red and blue, and f can (and
    must) be colored blue since it is adjacent only to vertices colored blue and green.
    This produces a coloring of G using exactly three colors. Figure 4 displays such
    a coloring.'
