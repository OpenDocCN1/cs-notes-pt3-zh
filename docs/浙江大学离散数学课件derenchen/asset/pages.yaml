    # 注：笛卡尔积的性质：


    +   1. A×Φ= Φ， Φ ×A= Φ；


    +   2. A×B ≠ B×A，除非 A=Φ 或 B= Φ 或 A=B；


    +   3. (A×B)×C ≠ A×(B×C)，除非 A= Φ或 B= Φ 或C= Φ.


    +   4. A×(B∪C)= (A×B)∪(A×C);


    +   (B∪C)×A=(B×A)∪(C×A);


    +   A×(B∩C)=(A×B)∩(A×C);


    +   (B∩C)×A=(B×A)∩(C×A);


    +   5. (A ⊆ C)∧(B ⊆ D) ⇒ (A×B)⊆ (C×D).'
