- pgno: 1855
  md: '# # A 上各类二元关系的性质


    设 R 是 A 上的二元关系，


    # ## 1）自反性与反自反性


    a A，（a，a）∈R，称这样的 R 为自反的二元关系.自反的二元关系的相关矩阵对角元均为 1，即 \(a_{ii}=1\) （i = 1，2，..., n）。
    a ∈A，（a，a）R，称这样的 R 为反自反的二元关系。此 R 的相关矩阵对角元均为 0，即 \(a_{ii}=0\) （i = 1，2，..., n）。


    注意，不是自反的不一定反自反，不是反自反的不一定自反。如果对角元中有 0 有 1，就既不是自反的又不是反自反的。自反性与反自反性是互斥的，但不互补。'
  merge: -1
  img_proc: true
