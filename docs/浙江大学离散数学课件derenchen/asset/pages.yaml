  md: '算法的概念与程序十分相似，但实际上有很大不同。程序并不都满足算法所要求的上述特征，例如有限性特征。算法代表了对特定问题的求解，而程序则是算法在计算机上的实现。因此算法也常常称为是一个能行过程。一个函数如果可以用一个算法来计算，那么我们称该函数是能行可计算的。


