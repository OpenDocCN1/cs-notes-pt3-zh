- pgno: 686
  md: '# § 3 A 上各类二元关系的性质


    设 R 是 A 上的二元关系， \( R=(r_{ij})_{n*n} \)


    (1) 自反性：


    对 \(\forall a \in A\)， \( (a, a) \in R\)，则 R 称为自反的二元关系。


    显然， \( r_{ii}=1 \ (i=1, 2, ..., n) \)


    反自反性：


    对 \(\forall a \in A\)， \( (a, a) \notin R\)，则 R 称为反自反的二元关系。


    即 \( r_{ii}=0 \ (i=1, 2, ..., n) \)'
  merge: -1
  img_proc: true
- pgno: 687
  md: '# 注：


    自反和反自反性互斥，但不互补。

    如：r<sub>ij</sub>中既有0又有1，则R既不

    是自反的也不是反自反的。


    (2) 对称性：

    若 \(a \neq b\)，\(a \ (a, b) \in R\)，必有 \((b, a) \in R\)，称R为对称的二元关系即R的相关矩阵

    为对称阵，\(a_{ij} = a_{ji}\)'
  merge: -1
  img_proc: true
- pgno: 688
  md: '# 反对称性：


    若 \( a \neq b \)，\( (a, b) \in R \)，则 \( (b, a) \notin R \)，称 \( R \) 为反对称的二元关系。


    # 注：


    +   (1) \( R \) 的相关矩阵是反对称的，即 \( r_{ij} \wedge r_{ji} = 0 \quad (i \neq j) \)


    +   (2) 若 \( r_{ij} = 1 \)，则 \( r_{ji} = 0 \)，但 \( r_{ij} = 0 \) 时，不要求 \( r_{ji}
    = 1 \)，即 \( r_{ij} = r_{ji} = 0 \) 是允许的。


    +   (3) 对称性与反对称性既不互斥，又不互补'
