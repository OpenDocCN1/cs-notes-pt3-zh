- pgno: 1489
  md: '# 9.3 双曲线


    在直线与圆、椭圆的学习中，我们已经接触过解析几何的研究方法。本章将在这些研究的基础上，进一步学习双曲线和抛物线。


    我们知道，平面内与两个定点 F1, F2 的距离的和等于常数（大于 |F1F2|）的点的轨迹是椭圆。一个自然的问题是：平面内与两个定点的距离的差等于常数的点的轨迹是什么？


    如图 9.3-1，取一条拉链，打开它的一部分，在拉开的两边上各选择一点，分别固定在点 F1, F2 上，把笔尖放在点 M 处，随着拉链逐渐拉开或者闭拢，笔尖就画出一条曲线。


    ![](img/5123c27d7478faaa822d0f1f02fc503f_1489_0.png)


    由图 9.3-1 可知，笔尖在点 M 处移动时，|MF1| 与 |MF2| 之差的绝对值保持不变，即 |MF1|−|MF2|| 等于常数。这样，笔尖就画出一条双曲线。


    一般地，平面内与两个定点 F1, F2 的距离的差的绝对值等于非零常数（小于 |F1F2|）的点的轨迹叫做双曲线。这两个定点叫做双曲线的焦点，两焦点间的距离叫做双曲线的焦距。


    思考 类比求椭圆标准方程的过程，我们如何建立适当的坐标系，得出双曲线的方程？'
