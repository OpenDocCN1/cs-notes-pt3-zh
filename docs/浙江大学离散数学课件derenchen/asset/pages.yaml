  md: '# # [定义]极大元与极小元：


    设 \( (P, \leq) \) 是半序集，\( A \subseteq P \)，若 \( a \in A \)，且在 \( A \) 中找不到一个元素
    \( b \)（\( b \neq a \)），使 \( a \leq b \)（\( b \leq a \)），则称 \( a \) 为 \( A \)
    中的极大元（极小元）。


    例：\( (\mathbb{N}, \mid) \) 是半序集，

    \( A = \{2, 3, 4, 5, 6, 7, 8, 9\} \)

    则 \( A \) 中极大元：\( 8, 6, 9, 5, 7 \)

    极小元：\( 2, 3, 5, 7 \)


    注：

    极大元，极小元并不要求唯一，且同一元素，可以既是极大元，又是极小元，如 \( 5, 7 \)。'
