- pgno: 1934
  md: '# 例2.7 求公式 \((p\to q)\leftrightarrow r\) 的析取范式与合取范式。


    解：（1）合取范式：


    \((p\to q)\leftrightarrow r\Leftrightarrow(\lnot p\lor q)\leftrightarrow r\)　（消去\(\to\)）


    \(\Leftrightarrow((\lnot p\lor q)\to r)\land(r\to(\lnot p\lor q))\)　（消去\(\leftrightarrow\)）


    \(\Leftrightarrow(\lnot(\lnot p\lor q)\lor r)\land(\lnot r\lor(\lnot p\lor q))\)　（消去\(\to\)）


    \(\Leftrightarrow((p\land\lnot q)\lor r)\land(\lnot p\lor q\lor\lnot r)\)　（否定号内移，结合律，交换律）


    \(\Leftrightarrow(p\lor r)\land(\lnot q\lor r)\land(\lnot p\lor q\lor\lnot r)\)　（\(\lor\)
    对\(\land\) 的分配律）


    （2）析取范式


    \((p\to q)\leftrightarrow r\Leftrightarrow((p\land\lnot q)\lor r)\land(\lnot p\lor
    q\lor\lnot r)\)　（见上述第一至第四步）


    \(\Leftrightarrow(p\land\lnot q\land\lnot p)\lor(p\land\lnot q\land q)\lor(p\land\lnot
    q\land\lnot r)\lor(r\land\lnot p)\lor(r\land q)\lor(r\land\lnot r)\)


    （\(\land\) 对 \(\lor\) 的分配律）


    \(\Leftrightarrow(p\land\lnot q\land\lnot r)\lor(\lnot p\land r)\lor(q\land r)\)　（矛盾律和同一律）'
  merge: -1
  img_proc: true
- pgno: 1935
  md: '# 注：


    +   1. 在演算过程中，利用交换律，可使每个简单析取式或简单合取式中命题变项都按字典序出现。


    +   2. 上述求析取范式的过程中，第二步和第三步结果都是析取范式。这说明命题公式的析取范式是不唯一的。同样，合取范式也是不唯一的。为了得到唯一的规范化形式的范式，需要定义主析取范式和主合取范式。为此，先引入如下极小项和极大项概念。'
