- pgno: 1945
  md: '# 2. 判断公式的类型


    设公式A中含n个变项，则


    +   (1) A为重言式当且仅当A的主析取范式含全部2ⁿ个极小项；


    +   (2) A为矛盾式当且仅当A的主析取范式不含任取极小项。（此时，记A的主析取范式为0）。


    +   (3) A为可满足式当且仅当A的主析取范式中至少含一个极小项。'
