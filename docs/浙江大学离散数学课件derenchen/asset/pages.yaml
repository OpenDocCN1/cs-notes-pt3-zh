  md: "# 计数原理\n\n字典序组合算法：\n\n+   1. $S_1=\\{1,\\ 2,\\ ...,\\ k\\}$\n+   \n+   2. 若\
    \ $S_i=\\{a_1,\\ a_2,\\ ...,\\ a_k\\}$ 已得到（$1\\leq i\\leq C_n^k-1$）则构造下一个子集\n\
