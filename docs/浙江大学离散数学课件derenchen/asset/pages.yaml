- pgno: 1233
  md: '# # 关系的闭包/Closure of Relations


    [定义1]：称 \( R \cup I_A \) 是 \( R \) 的自反闭包/reflexive closure of \( R \)，记为 \( r(R)
    \)。


    [定理1]：设 \( R \) 是 \( A \) 上的二元关系，则 \( r(R) \) 是包含 \( R \)，具有自反性的最小关系。


    证明：对 \(\forall x \in A\)，\( (x, x) \in I_A \subseteq R \cup I_A \)，且 \( R \subseteq
    R \cup I_A \)。


    若 \( R'' \) 为包含 \( R \) 且具有自反性，则 \( I_A \subseteq R'' \)，\( R \subseteq R'' \)，\(
    I_A \cup R \subseteq R'' \)。即 \( I_A \cup R \) 为最小。


    [推论1]：\( R \) 是自反闭包当且仅当 \( R \) 是自反的。


    证明：


    (1) \( R \) 是自反闭包，\( R = I_A \cup R \Rightarrow I_A \subseteq R \);

    (2) \( R \) 具有自反性，\( I_A \subseteq R \)，\( R \cup I_A = R \);


    2022年11月3日 Deren Chen, Zhejiang Univ. 51'
