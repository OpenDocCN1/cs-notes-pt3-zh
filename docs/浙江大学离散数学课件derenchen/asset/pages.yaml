  md: '# 【定义】极大元与极小元/maximal element and minimal element:


    设（P，≤）是半序集，A⊆P，若 a∈A，且在 A 中没有一个元素 b（b≠a），使 a≤b（b≤a），则称 a 为 A 中的极大元（极小元）。


    例：（N，|）是半序集，


    A = { 2，3，4，5，6，7，8，9 }


    则  A 中极大元：8，6，9，5，7


    极小元：2，3，5，7


    说明：极大元、极小元并不要求唯一，且同一元素，可以既是极大元，又是极小元，如5，7。'
