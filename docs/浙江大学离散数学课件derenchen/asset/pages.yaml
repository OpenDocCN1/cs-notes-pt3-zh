- pgno: 594
  md: '**How many additions of bits and shifts of bits are used to multiply a and
    b using Algorithm 4?**


    Solution: Algorithm 4 computes the products of *a* and *b* by adding the partial
    products $c_0, c_1, c_2, \ldots,$ and $c_{n-1}$. When $b_j=1$, we compute the
    partial product $c_j$ by shifting the binary expansion of $a$ $j$ bits. When $b_j=0$,
    no shifts are required since $c_j=0$. Hence, to find all $n$ of the integers $a
    b_j 2^j$, $j=0,1,\ldots,n-1$, requires at most


    $$0+1+2+\cdots+n-1$$


    Shift. Hence, by Example 4 in Section 1.8 the number of shifts required is $O(n^2)$.


    To add the integers $a b_j$ from $j=0$ to $j=n-1$ requires the addition of an
    $n$-bit integer, an $(n+1)$-bit integer, ..., and a $(2n)$-bit integer. We know
    from Example 8 that each of these additions requires $O(n)$ additions of bits.
