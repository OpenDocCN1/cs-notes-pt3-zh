    (2) 前提：¬ p∨q, r∨¬ q, r→s    结论：p→s


    证明：


    ① ¬ p∨q    前提引入        ⑤ p→r        ②④假言三段论

    ② p→q    ①置换        ⑥ r→s    前提引入

    ③ r∨¬ q    前提引入        ⑦ p→s        ⑤⑥假言三段式

