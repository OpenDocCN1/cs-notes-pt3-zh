  md: "# § 5.3 谓词逻辑的推理理论\n\n# 一、谓词逻辑推理的形式结构\n\n从前提 A₁, A₂, …, Aₖ 出发推结论 B 的推理，其形式结构为蕴含式\n\
    \nA₁∧A₂∧…∧Aₖ→B。若该蕴含式为永真式，则称推理正确，否则称推理不正确。\n\n# 二、谓词逻辑推理定律\n\n第一组：命题逻辑推理定律的代换实例都是谓词逻辑的推理定律。\n\
    \n+   如：\n+   \n+   - ∀x F(x) ∧ ∀y G(y) ⇒ ∀x F(x)\n+   - ∀x F(x) ⇒ ∀x F(x) ∨ ∃y\
    \ G(y)\n+   - ∀x F(x) ⇒ ¬¬∀x F(x)\n+   - ¬¬∀x F(x) ⇒ ∀x F(x)\n+   \n+   等。"
