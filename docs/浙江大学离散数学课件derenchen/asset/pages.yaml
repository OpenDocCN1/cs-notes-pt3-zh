  md: '# 例7.3 设\(A, B, C, D\)为任意集合，判断下列命题是否为真。


    (1) \(A \times B = A \times C \Rightarrow B = C\)


    (2) \(A - (B \times C) = (A - B) \times (A - C)\)


    (3) \((A=B) \wedge (C=D) \Rightarrow A \times C = B \times D\)


    (4) 存在集合\(A\)，使 \(A \subseteq A \times A\)


    解：(1) 不一定为真，当\(A=\Phi, B=\{1\}, C=\{2,3\}\)时，便不真。


    (2) 不一定为真，当\(A=B=\{1\}, C=\{2\}\)时，


    \(A-(B \times C) = \{1\}-\{<1,2>\} = \{1\}\)，而\((A-B) \times (A-C) = \Phi \times
    \{1\} = \Phi\)。


    (3) 为真。等量代入。


    (4) 为真。当\(A=\Phi\)时，使\(A \subseteq A \times A\)。'
