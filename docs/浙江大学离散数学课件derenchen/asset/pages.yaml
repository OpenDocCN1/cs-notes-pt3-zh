  md: '# Example 4


    Suppose that a connected planar simple graph has 20 vertices, each of degree 3.Into
    how many regions does a representation of this planar graph split the plane ?


    Solution : This graph has 20 vertices ,each of degree 3,so that v=20 . Since the
    sum of the degrees of the vertices, 3v =3·20=60,is equal to twice the number of
    edges, 2e, we have 2e= 60,or e = 30. Consequently,from Euler’s formula, the number
    of regions is


    r = e –v +2 = 30-20+2= 12.'
