  md: '# 布尔代数的抽象定义：


    # 半序集（A，≤）


    **格/Lattice:** 半序集（A，≤）对任意 a,b∈A，a,b 的上确界 c 和下确界 d 存在，记 a∨b=c，a∧b=d


    **有界格：** 格中存在最大元素 1 和最小元素 0。


    **有界格中元素的余元：** a∈A，若存在 b∈A 使得 a∨b=1，a∧b=0，称 b 是 a 的一个余元。'
