  md: '# 定理2] 库氏定理/Kuratowski’s theorem


    # 平面图判断的充要条件。


    一个图是平面图的充分必要条件是它不含有与 $K_5$ 和 $K_{3,3}$ 同胚的子图。


    例：6个顶点的完全图必不是平面图。


    图b是图a的子图，图b去掉次为2的顶点 $V_6$，使 $V_1$ 与 $V_5$ 直接相邻，就是5个顶点的完全图 $K_5$，图b与 $K_5$ 同胚，所以图a一定不是平面图。当然，$K_5$
    也是图a的子图。


    尽管有了库氏定理，判别一个图是否平面图还是相当困难。'
  merge: -1
