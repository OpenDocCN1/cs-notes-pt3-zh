  md: '# §7.7 偏序关系


    # 1 偏序关系与偏序集


    # 定义7.19 设R为非空集合A上的关系。如果R是自反的、反对称的和传递的，则称 R 为 A 上的偏序关系，记为 ≤ 。对一个偏序关系 ≤ ，如果 <x,
    y> ∈ ≤ ，则记为 x ≤ y。


