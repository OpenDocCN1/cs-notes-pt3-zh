- pgno: 53
  md: '# # EXAMPLE 5


    # # Logic 命题逻辑


    What is the disjunction of the propositions p and q where p and q are the same
    propositions as in Example 4?


    Solution:

    The disjunction ofp and q, \(p \lor q\), is the proposition "Today is Friday or
    it is raining today." This proposition is true on any day that is either a Friday
    or a rainy day (including rainy Fridays). It is only false on days that are not
    Fridays when it also does not rain.'
  merge: -1
  img_proc: true
