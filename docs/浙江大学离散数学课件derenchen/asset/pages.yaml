- pgno: 2086
  md: '# # 排列/Permutations


    # ## 排列的函数表示：


    |A| = n，B={1,2,...,r}，F:B→A

    （1）F是一个单射 ⇔ A的一个r-排列

    （2）B到A的所有单射总数 ⇔ P(n,r)


    # ## 排列的球盒模型表示：


    |A| = n ⇔ n个盒子

    B={1,2,...,r} ⇔ r个不同的球

    F:B→A且是单射 ⇔ 每个盒子最多放一个球

    ⇔ A的一个r-排列

    B到A的所有单射总数 ⇔ 球放入盒子的放法总数

    ⇔ P(n,r)'
  merge: -1
  img_proc: true
- pgno: 2087
  md: '# 组合/Combinations


    定义2：n个元素的集合A中任意选择r个（r≤n）称为A的一个 **r-组合/r-Combination**


    定义2：n个元素的集合A的r-组合数为


    n(n-1)(n-2)…(n-r+1)/r!


    记为C(n,r)


    组合的球盒模型表示：


    B={0，1}  ⇔ 两个盒子

    A  ⇔ n个不同的球

    F:B→A且使得A中的r个元素的象为1

    　　⇔ 指定一个盒子恰好放r个球

    　　⇔ A的一个r-组合

    满足条件的F总数 = C(n,r) = 满足条件的球的放法总数'
