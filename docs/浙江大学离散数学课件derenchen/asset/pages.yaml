  md: '假设Rⁿ是对称的， 下证Rⁿ⁺¹ 的对称性。由于


    <x, y>∈ Rⁿ⁺¹ => <x, y>∈ Rⁿ °R


    => ∃t (<x, t>∈Rⁿ)∧<t, y>∈R)


    => ∃t (<t, x>∈Rⁿ)∧<y, t>∈R)


    => <y, x>∈R °Rⁿ


    => <y, x>∈Rⁿ⁺¹


    故 Rⁿ⁺¹ 是对称的。归纳法定成。


    现在来证 t(R)的对称性。由于


