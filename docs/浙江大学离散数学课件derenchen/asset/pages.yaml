    ne n-(k-j)\\}$，即 $\\{a_1,\\ a_2,\\ ...\\ a_j,\\ ...\\ a_k\\}$ 与 $\\{n-k+1,\\ n-k+2,\\\
    \ ...,\\ n-k+j,\\ ...,\\ (n-1),\\ n\\}$ 比较，从右边开始比较第一个不相等的项为 $a_m$"
