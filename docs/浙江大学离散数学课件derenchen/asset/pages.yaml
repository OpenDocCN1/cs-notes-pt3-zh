  md: '# 定理9.1 设 $A$、$B$、$C$ 是任意集合


    +   1. $A\approx A$

    +   2. 若 $A\approx B$，则 $B\approx A$

    +   3. 若 $A\approx B$，$B\approx C$，则 $A\approx C$


    证明留作练习。


    这个定理说明，集合的等势关系满足自反性，对称性和传递性，因而是一种等价关系。


    **注：** 由前面的例题可知：


    $N\approx Z\approx Q\approx N\times N；\quad (0,1)\approx[0,1]\approx R$。'
