- pgno: 1385
  md: '# # 无向加权完全图的最近邻域算法/Approximation:


    1. 从任一顶点出发，记为 \( V_1 \)，找一个与 \( V_1 \) 最近的顶点 \( V_2 \)，\( (V_1, V_2) \) 为两个顶点的基本道路。


    2. 若找出有 \( p \) 个顶点的基本道路 \( (V_1, V_2, \ldots, V_p) \)，\( p < n \)，在道路外找一个离 \(
    V_p \) 最近的顶点，记为 \( V_{p+1} \)，将其加入则得到具有 \( P+1 \) 个顶点的基本道路。


    3. 若 \( p+1 = n \)，转 4，否则转 2。


    4. 闭合 H 回路：即增加一条边 \( (V_n, V_1) \)，则 \( (V_1, V_2, \ldots, V_n, V_1) \) 为一条近似的最短回路。'
  merge: -1
  img_proc: true
