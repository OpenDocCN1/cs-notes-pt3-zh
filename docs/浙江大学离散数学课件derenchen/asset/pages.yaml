  md: '# EXAMPLE 12


    Find the bitwise OR, bitwise AND, and bitwise XOR of the bit strings 01 1011 0110
    and 11 0001 1101. (Here, and throughout this book, bit strings will be split into
    blocks of four bits to make them easier to read.)


    **Solution:**


    The bitwise OR, bitwise AND, and bitwise XOR of these strings are obtained by
    taking the OR, AND, and XOR of the corresponding bits, respectively. This gives
    us


    ```

    01 1011 0110

    11 0001 1101

    11 1011 1111    bitwise OR

    01 0001 0100    bitwise AND

    10 1010 1011    bitwise XOR

    ```'
