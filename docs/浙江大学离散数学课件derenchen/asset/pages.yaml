  md: '# 二元关系的复合运算


    Let R be a relation from a set A to a set B and S a relation from B to a set C.
    The composite of R and S is the relation consisting of ordered pairs (a, c), when
    a ∈ A, c ∈ C, and for which there exists an element b ∈ B such that (a, b) ∈ R
