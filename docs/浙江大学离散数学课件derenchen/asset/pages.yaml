  md: "# Algorithm 1 Dijkstra’s Algorithm.\n\n```\nProcedure Dijkstra(G: weighted\
    \ connected simple graph, with all weights positive)\n\n{G has vertices a = v₀,\
    \ v₁, …, vₙ = z and weights w(vᵢ, vⱼ)\n\n    where w(vᵢ, vⱼ) = ∞ if {vᵢ, vⱼ} is\
    \ not an edge in G}\n\nFor i := 1 to n\n\n    L(vᵢ) := ∞\n\nL(a) := 0\n\nS :=\
    \ ∅\n\n{the labels are now initialized so that the label of a is zero and all\
    \ other labels are ∞, and S is the empty set}\n```"
