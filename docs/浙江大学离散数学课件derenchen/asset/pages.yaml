  md: '# ## 7.2 图的术语/Graph Terminology


    # ### [定义]相邻和关联：


    在无向图G中，若e=（a，b）∈E，则称a与b相邻/adjacent，或边e关联a、b/incident或联结a、b/connect。a、b称为边e的端点或结束顶点/endpoint.


    在有向图G中，若e=（a，b）∈E，即箭头由a到b，称a相邻到b，或a关联或联结b。a称为e的起点/initial vertex，b称为e的终点/terminal
    or end vertex。'
