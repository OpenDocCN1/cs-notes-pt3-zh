    # Rⁿ的关系图的构造：


    可由 R 的关系图来构造，从 R 的每个结点 aᵢ 出发，数 n 条边。凡通过数 n 条边能到达的结点 aⱼ，则有（aᵢ，aⱼ）∈Rⁿ。关系图中从 aᵢ 出发到
    aⱼ 的边是存在的。


    这样处理容易出错，用相关矩阵的布尔型乘法来做，简单，又不容易错，还适宜于计算机处理。'
