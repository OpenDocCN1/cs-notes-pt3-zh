- pgno: 540
  md: '# Theorem 6


    Let m be a positive integer. The integers a and b are congruent modulo m if and
    only if there is an integer k such that a=b+km.


    **Proof:** If a≡b(mod m), then m ∣ (a − b). This means that there is an integer
    k such that a − b=km, so that a=b+km. Conversely, if there is an integer k such
    that a=b+km, then km=a − b. Hence, m divides a − b, so that a≡b(mod m).'
  merge: -1
  img_proc: true
- pgno: 541
  md: '# Theorem 7


    Let m be a positive integer. If a≡b(mod m)and c≡d(mod m),

    then a+c ≡b+d(mod m) and ac≡bd(mod m).


    Proof: Since a≡b(mod m)and c≡d(mod m),there are integers s

    and t with b=a+sm and d=c+tm.Hence,


    b+d=(a+sm)+(c+tm)=(a+c)+m(s+t) and

    bd=(a+sm)(c+tm)=ac+m(at+cs+stm).


    Hence,

    a+c ≡b+d(mod m) and ac≡bd (mod m).'
