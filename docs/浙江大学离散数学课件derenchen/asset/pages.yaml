    ·54)=4 ·54 - 1 ·198. The first division tells us that 54=252 - 1 ·198. Substituting
    this expression for 54 into the previous equation,we can express 18 as a linear
    combination of 252 and 198.We conclude that 18= 4 ·(252-1 ·198) - 1 ·198= 4 ·252-5
    ·198, Completing the solution.
