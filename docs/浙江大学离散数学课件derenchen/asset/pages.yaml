  md: '# # 求和规则/The Sum Rule


    If a first task can be done in **n** ways and a second task in **m** ways, and
    if there these tasks cannot be done at the same time, then there are **n+m** ways
    to be either task.


    |A₁ ∪ A₂| = |A₁| + |A₂| 其中A₁ ∩ A₂ = ∅


    # ## 求和规则的推广


    |A₁ ∪ A₂ ∪ ... ∪ Aₙ| = |A₁| + |A₂| +... + |Aₙ| 其中Aᵢ ∩ Aⱼ = ∅ i≠j, i,j =1,2,...,n'
  merge: -1
  img_proc: true
- pgno: 2081
  md: '# # 求积规则/The Product Rule


    Suppose that a procedure can be broken down into two tasks. If there are n ways
    to do the first task and m ways to do the second task after the first task has
    been done, then there are nm ways to do the procedure.


    \(|A_1 \times A_2| = |A_1| \ |A_2|\)


    # # 求积规则的推广


    \(|A_1 \times A_2 \times ... \times A_n| = |A_1| \ |A_2| \ ... \ |A_n|\)'
