- pgno: 1641
  md: "# § 4.1 谓词逻辑命题符号化\n\n一、谓词逻辑命题符号化的三个基本要素：个体词、谓词、量词。\n\n+   1. 个体词：研究对象中可以独立存在的具体的或抽象的客体。\n\
    \n例如：小王、小张、√2、3、北京等都可做为个体词。\n\n+   注：\n+   (1) 表示具体或特定客体的个体词称为个体常项，一般用小写字母 a,\
    \ b, c, … 表示；\n+   \n+   (2) 表示抽象或泛指的个体词称为个体变项，一般用小写字母 x, y, z, … 表示。个体变项的取值范围称为个体域（或论域）。个体域可以是有限集合，如\
    \ {1, 2, 3} 或 {a, b, c}，也可以是无限集合，如自然数集合 N 或实数集合 R。由宇宙间一切事物组成的个体域称为全总个体域。\n\n+\
    \   2. 谓词：用来刻划个体词的性质或个体词之间相互关系的词。"
  merge: -1
  img_proc: true
