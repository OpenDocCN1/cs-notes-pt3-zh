- pgno: 1197
  md: '# ## Relations关系


    (2) 对称性：

    若 \(a \neq b\)，\((a, b) \in R\)，必有 \((b, a) \in R\)，称 \(R\) 为对称的二元关系 / symmetric


    即 \(R\) 的相关矩阵为对称阵，\(a_{ij} = a_{ji}\)


    A relation R on a set A is called symmetric if \((b,a) \in R\) whenever \((a,
    b) \in R\), for \(a, b \in A\). A relation R on a set A such that \((a,b) \in
    R\) and \((b, a) \in R\) only if \(a=b\), for \(a, b \in A\), is called antisymmetric.'
  merge: -1
