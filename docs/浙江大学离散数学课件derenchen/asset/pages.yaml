- pgno: 1725
  md: '# ## 二. 关系的运算性质


    关系是集合，故有关集合的所有运算性质对关系都成立。


    # ### 定理7.1 设F是关系，则


    +   (1) \( (F^{-1})^{-1} = F \);


    +   (2) \( \text{dom } F^{-1} = \text{ran } F, \quad \text{ran } F^{-1} = \text{dom
    } F \).


    证：(1) \(\because <x,y> \in (F^{-1})^{-1} \Leftrightarrow <y,x> \in F^{-1} \Leftrightarrow
    <x,y> \in F\)


    \(\therefore (F^{-1})^{-1} = F\).


    (2) \(\because x \in \text{dom } F^{-1} \Leftrightarrow \exists y(<x,y> \in F^{-1})\)


    \(\Leftrightarrow \exists y(<y,x> \in F)\)


    \(\Leftrightarrow x \in \text{ran } F\)


    \(\therefore \text{dom } F^{-1} = \text{ran } F\).


    同理可证 \(\text{ran } F^{-1} = \text{dom } F\).'
  merge: -1
  img_proc: true
- pgno: 1726
  md: '# 定理7.2 设F,G,H是关系，则


    (1) (F∘G)∘H=F∘(G∘H);　(2) (F∘G)⁻¹=G⁻¹∘F⁻¹


    证：(1) ∵ ⟨x,y⟩∈((F∘G)∘H) ⇔ ∃t(⟨x,t⟩∈(F∘G) ∧ ⟨t,y⟩∈H)

    ⇔ ∃t(∃s(⟨x,s⟩∈F ∧ ⟨s,t⟩∈G) ∧ ⟨t,y⟩∈H)

    ⇔ ∃t∃s(⟨x,s⟩∈F ∧ ⟨s,t⟩∈G) ∧ ⟨t,y⟩∈H)

    ⇔ ∃s(⟨x,s⟩∈F ∧ ∃t(⟨s,t⟩∈G ∧ ⟨t,y⟩∈H))

    ⇔ ∃s(⟨x,s⟩∈F ∧ ⟨s,y⟩∈(G∘H))

    ⇔ ⟨x,y⟩∈F∘(G∘H)

    ∴ (F∘G)∘H=F∘(G∘H)


    (2) ∵ ⟨x,y⟩∈(F∘G)⁻¹ ⇔ ⟨y,x⟩∈F∘G

    ⇔ ∃t(⟨y,t⟩∈F ∧ ⟨t,x⟩∈G)

    ⇔ ∃t(⟨x,t⟩∈G⁻¹ ∧ ⟨t,y⟩∈F⁻¹)

    ⇔ ⟨x,y⟩∈(G⁻¹∘F⁻¹)

    ∴ (F∘G)⁻¹=G⁻¹∘F⁻¹'
  merge: -1
  img_proc: true
