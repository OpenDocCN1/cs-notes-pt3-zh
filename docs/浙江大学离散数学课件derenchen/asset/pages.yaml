- pgno: 1896
  md: '# 定义1.2


    设 $p$，$q$ 为两个命题。复合命题“$p$ 与 $q$”（即“$p$ 并且 $q$”）称为 $p$ 与 $q$ 的合取式，记为 $p \land q$。符号
    $\land$ 称为合取联结词。当且仅当 $p$ 与 $q$ 同时为真时，$p \land q$ 为真。


    注：自然语言中“与”，“和”，“且”，“既……又……”，“不仅……而且……”，“虽然……但是……”，“一面……一面……”等联结词都可以符号化为 $\land$；但并不是所有的“与”、“和”等都能用联结词
    $\land$ 替代。'
