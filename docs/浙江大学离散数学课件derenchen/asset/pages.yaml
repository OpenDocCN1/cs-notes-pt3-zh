  md: '# # 排列/Permutations


    定义1： n个元素的集合A中任意选择r个（r ≤ n）进行排列称为A的一个r-排列/r-Permutation


    定理1： n个元素的集合A的r-排列数为


    n(n-1)(n-2)...(n-r+1) =P(n,r)


