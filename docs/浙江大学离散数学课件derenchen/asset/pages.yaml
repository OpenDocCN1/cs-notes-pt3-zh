- pgno: 561
  md: '![](img/5123c27d7478faaa822d0f1f02fc503f_561_0.png)


    # Algorithms 算法


    $$ab=a\sum_{j=0}^{n-1}b_j2^j=\sum_{j=0}^{n-1}a(b_j2^j)$$


    We can compute ab using this equation. We first note that $ab_j=a$ if $b_j=1$
    and $ab_j=0$ if $b_j=0$. Each time we multiply a term by 2, we shift its binary
    expansion one place to the left and add a zero at the tail end of the expansion.
    Consequently, we can obtain $(ab_j)2^j$ by shifting the binary expansion of $ab_j$
    $j$ places to the left, adding $j$ zero bits at the tail end of this binary expansion.
    Finally, we obtain $ab$ by adding the $n$ integers $ab_j2^j$, $j=0,1,2,\ldots,n-1$.'
  merge: -1
  img_proc: true
- pgno: 562
  md: '# Example 7


    Find the product of $a=(110)_2$ and $b=(101)_2$.


    **Solution:** First note that


    $ab_0\cdot 2^0=(110)_2\cdot 1\cdot 2^0=(110)_2,$


    $ab_1\cdot 2^1=(110)_2\cdot 0\cdot 2^1=(0000)_2,$


    and


    $ab_2\cdot 2^2=(110)_2\cdot 1\cdot 2^2=(11000)_2.$


    To find the product, add $(110)_2$, $(0000)_2$, and $(11000)_2$.


    Carrying out these additions (using Algorithm 3, including initial zero bits when
    necessary) shows that $ab=(11110)_2$. This multiplication is displayed in Figure
    2.'
