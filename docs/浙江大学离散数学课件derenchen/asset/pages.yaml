- pgno: 1930
  md: '# § 2.2 析取范式与合取范式


    定义2.2 命题变项及其否定统称作文字。仅由有限个文字构成的析取式称作简单析取式，仅由有限个文字构成的合取式称作简单合取式。


    定理2.1 (1)一个简单析取式是重言式当且仅当它同时含有某个命题变项及它的否定式；

    (2)一个简单合取式是矛盾式当且仅当它同时含有某个命题变项及其否定式。


    定义2.3 由有限个简单合取式构成的析取式称为析取范式；

    由有限个简单析取式构成的合取式成为合取范式；析取范式与合取范式统称为范式。'
  merge: -1
  img_proc: true
- pgno: 1931
  md: '例如：\((p \land \neg q) \lor (\neg q \land \neg r) \lor r\) 是一个析取范式，而 \((p \lor
    q \lor r) \land (\neg p \lor \neg q) \land r\) 是一个合取范式。


    注：单个文字既是简单析取式又是简单合取式。因此形如 \(\neg p \land q \land r\) 的公式既是由一个简单合取式构成的析取范式，又是由三个简单析取式构成的合取范式。类似地，形如
    \(p \lor \neg q \lor r\) 的公式既可看成析取范式也可看成合取范式。


    定理2.2 一个析取范式是矛盾式当且仅当它的每个简单合取式都是矛盾式；一个合取范式是重言式当且仅当它的每个简单析取式都是重言式。


    证明留作练习。'
  merge: -1
  img_proc: true
- pgno: 1932
  md: '定理2.3（范式存在定理）任一命题公式都存在着与之等值的析取范式与合取范式。


    证明：首先给出一组等值式。由蕴含等值式和等价等值式可知：


    $A\to B\Leftrightarrow\neg A\lor B,\quad A\leftrightarrow B\Leftrightarrow(\neg
    A\lor B)\land(A\lor\neg B)。$


    由双重否定律和德摩根律可知：


    $\neg\neg A\Leftrightarrow A,\quad \neg(A\land B)\Leftrightarrow\neg A\lor\neg
    B,\quad \neg(A\lor B)\Leftrightarrow\neg A\land\neg B。$


    利用分配律，可得：


    $A\land(B\lor C)\Leftrightarrow(A\land B)\lor(A\land C),$


    $A\lor(B\land C)\Leftrightarrow(A\lor B)\land(A\lor C)。$


    使用这些等值式，便可将任一公式化成与之等值的析取范式或合取范式。'
  merge: -1
  img_proc: true
- pgno: 1933
  md: '# 求给定公式的范式的步骤：


    +   1. 消去联结词→和↔；

    +   2. 否定号¬的消去（双重否定）

    +      或内移（德摩根律）；

    +   3. 利用∨对∧的分配律求合取范式；

    +      利用∧对∨的分配律求析取范式。'
