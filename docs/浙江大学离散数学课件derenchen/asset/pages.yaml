- pgno: 1629
  md: '(3) 设p: 下午超过30℃; q: 王小燕去游泳; r: 王小燕去看电影。

    前提: p→q, q→¬ r  结论: ¬ r→p

    推理形式结构: ((p→q) ∧ (q→¬ r))→(¬ r→p)

    我们用主析取式法检验该蕴含式是否为重言式。

    ((p→q) ∧ (q→¬ r))→(¬ r→p)

    ⇔ ¬ ((¬ p∨q) ∧ (¬ q∨¬ r)) ∨ (r∨p)

    ⇔ ((p∧¬ q) ∨ (q∧ r)) ∨ (r∨p)

    ⇔ p∨r

    ⇔ (p∧q) ∨ (p∧¬ q) ∨ (q∧ r) ∨ (¬ q∧ r)(两次吸收律及例2.11 (1))

    ⇔ (p∧¬ q∧¬ r)∨(p∧¬ q∧r)∨(p∧q∧¬ r)∨(p∧q∧r)

    ∨ (¬ p∧¬ q∧r)∨(¬ p∧q∧r)∨(p∧¬ q∧r)∨(p∧q∧r) (用例2.11(1))

    ⇔ m1 ∨ m3∨ m4∨ m5∨ m6∨ m7  （顺序经过重排）。

    可见， 主析取范式中少两个极小项m0和 m2， 故蕴含式不是重言式， 从而推理不正确。'
