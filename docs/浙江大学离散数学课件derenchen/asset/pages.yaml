  md: '# Algorithms

    算 法


    n = bq₀ + a₀, 0 ≤ a₀ < b.


    The remainder, a₀, is the rightmost digit in the base b expansion of n. Next,
    divide q₀ by b to obtain


    q₀ = bq₁ + a₁, 0 ≤ a₁ < b.


    We see that a₁ is the second digit from the right in the base b expansion of n.
    Continue this process, successively dividing the quotients by b, obtaining additional
    base b digits as the remainders. This process terminates when we obtain a quotient
    equal to zero.'
