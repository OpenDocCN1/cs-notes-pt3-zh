- pgno: 1558
  md: '# (4)在树上任添一条边，产生唯一回路。


    # (5)设T = (V, E)， | V | = v， | E | = e，则v = e + 1。


    树是平面图，且无回路，区域数γ = 1，满足欧拉公式v - e + γ = 2，即v = e + 1。


    也可用强归纳法证： （对V归纳）


    +   (1) v ≤ 2，显然成立


    +   (2) 假设v < p时成立，v = p时，先移去一条边，成了两棵树T₁和T₂，有v₁ = e₁ + 1，v₂ = e₂ + 1，且e₁ + e₂
    = e - 1，故v = v₁ + v₂ = e₁ + 1 + e₂ + 1 = (e₁ + e₂ + 1) + 1 = e + 1。'
  merge: -1
  img_proc: true
- pgno: 1559
  md: '【定义】有向树：如果有向图 $G=(V,E)$ 对应的无向图是树，称 $G$ 为有向树/directed tree。


    【定义】有根树：如果有向树存在唯一一个入次为 0 的顶点，其余顶点入次均为 1，称此有向树为有根树/rooted tree。


    【定义】根：有根树中入次为 0 的顶点称为根/root。


    【定义】叶：有根树中出次为 0 的顶点称为叶/leaf。


    【定义】枝点：有根树中除叶以外的顶点均为枝点/internal vertices。'
