  md: '# §9.1 集合大小的比较——等势与优势


    **定义9.1** 集合的势是一个用来度量集合所含元素多少的量。

    集合的势越大，所含的元素越多。对两个集合 A 和 B，如果存在从 A 到 B 的双射，就称 A 和 B 是等势的，记为 A≈B。

    否则，称 A 与 B 不等势，记为 $A\not\approx B$。


    **注：**


    +   1. 集合 A 与 B 等势当且仅当 A 的元素与 B 的元素一一对应。

    +   2. 有些文献将 A 与 B 等势记为 A∼B。'
  merge: -1
  img_proc: true
