  md: '# 定理9.4 无限集合A为可数集的充分必要条件是A的全部元素可以排成无重复项的序列：\(a_1, a_2, \cdots, a_n, \cdots\)。


    证：若A可排成上述形式，则将A的元素 \(a_n\) 与其下标 \(n\) 对应，就得到 A 与自然数集 \(N\) 之间的一一对应，故A是可数集。


