    V_2, \dots, V_p \} \) 中某一顶相邻，不妨与 \( V_k \) 相邻，\( V_k \neq V_1 \)，\( V_k \neq V_p
    \)，连上 \( V_x \) 与 \( V_k \) 的边，去掉 \( V_{k-1} \) 到 \( V_k \) 的边，可以从 \( V_{k-1}
