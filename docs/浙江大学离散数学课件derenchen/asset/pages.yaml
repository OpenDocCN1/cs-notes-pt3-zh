- pgno: 1766
  md: '# 三、偏序集中的特殊元素


    定义7.24 设⟨A,≼⟩为偏序集，B⊆A，y∈B。


    +   1. 若 ∀x(x∈B→y≼x) 成立，则称 y 是B的最小元；

    +   2. 若 ∀x(x∈B→x≼y) 成立，则称 y 是B的最大元；

    +   3. 若 ∀x(x∈B∧x≼y→x=y) 成立，则称 y 是B的极小元；

    +   4. 若 ∀x(x∈B∧y≼x→x=y) 成立，则称 y 是B的极大元；


    # 注：


    +   1. 极大（极小）元未必是最大（最小）元。极大（极小）元未必与B中任何元素都可比；

    +   2. 对有限集B，极大（极小）元一定存在，但最大（最小）元不一定存在；

    +   3. 最大（最小）元如果存在，必定是唯一的；而极大（极小）元一般不唯一。但如果B中只有一个极大（极小）元，则它一定是B的最大（最小）元。'
  merge: -1
  img_proc: true
