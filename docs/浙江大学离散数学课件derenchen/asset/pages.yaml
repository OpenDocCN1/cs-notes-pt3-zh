- pgno: 314
  md: '# # Predicates and Quant 谓词与量词


    前两节介绍的命题与命题演算是命题逻辑的内容，其基本组成单位是原子命题。一般地，原子命题作为具有真假意义的句子至少由主语和谓语两部分组成。


    例如，电子商务是计算机技术的一个应用，这里“电子商务”是主语，而“是……”是谓语。当主语改变为“电子政务”时就得到新的原子命题：电子政务是计算机技术的一个应用。'
  merge: -1
  img_proc: true
- pgno: 315
  md: 由此可知，主语是独立存在的个体/值/Value，而谓语用来描述该个体的性质或个体间的关系，这里我们称其为谓词/Predicate。用P表示谓词“是......”。则P（电子商务）或P（电子政务）分别等值于前述两个命题的表达。将个体用变量（称为个体变量）x推广，则P（x）表示：x是计算机技术的一个新的应用。这时该语句就不是一个命题，而是一个命题函数。
  merge: -1
  img_proc: true
- pgno: 316
  md: '# # DEFINITION 1.


    定义 一个谓词P连同相关的n（n≥0）个个体变量组成的表达式称为n元谓词（n-predicate），记P（x₁，x₂，...，xₙ），其中n是该表达式中不同个体变量的数目。n元谓词也称简单命题函数，将简单命题函数视为命题，按1.1节定义10得到的递归定义的表达式称为复合命题函数。简单命题函数和复合命题函数，统称为命题函数（proposition
    function）。'
  merge: -1
  img_proc: true
