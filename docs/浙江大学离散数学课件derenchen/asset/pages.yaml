- pgno: 446
  md: '# # Algorithms


    一个算法通常应具有下列特征：


    （1）输入：一个算法具有零个或多个取自指定集合的输入值；


    （2）输出：对算法的每一次输入，算法具有一个或多个与输入值接联系的输出值；


    （3）确定性：算法的每一个指令步骤都是明确的；


    （4）有限性：对算法的每一次输入，算法都必须在有限步骤（即有限时间）内结束；


    （5）正确性：对每一次输入，算法应产生出正确的输出值；


    （6）通用性：算法的执行过程可应用于所有同类求解问题，而不是仅适用于特殊的输入。'
  merge: -1
  img_proc: true
- pgno: 447
  md: '# # Algorithms 算法


    算法的概念与程序十分相似，但实际上有很大不同。程序并不都满足算法所要求的上述特征，例如有限性特征。算法代表了对特定问题的求解，而程序则是算法在计算机上的实现。因此算法也常常称为是一个能行过程。一个函数如果可以用一个算法来计算，那么我们称该函数是能行可计算的。'
  merge: -1
  img_proc: true
