    of G.We will prove the theorem by constructing a

    sequence of subgraphs G1 , G2 , ⋯ , Ge =

    G,successively adding an edge at each stage. This is

    done using the following inductive

    definition.Arbitrarily pick one edge of G to obtain

    G1.Obtain Gn from Gn-1 by arbitrarily adding an

    edge that is incident with a vertex already in Gn-1.'
