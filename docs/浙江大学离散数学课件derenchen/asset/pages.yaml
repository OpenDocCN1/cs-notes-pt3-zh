- pgno: 1771
  md: '# § 8.1 函数的定义与性质


    **定义8.1** 设 F 为二元关系，若 ∀x∈dom F 都存在唯一的 y∈ran F 使 xFy 成立，则称 F 为函数。对于函数 F，如果 xFy，则记
    y=F(x)，并称 y 为 F 在 x 的值。


    **例8.1** 设 F₁={<x₁,y₁>, <x₂,y₁>, <x₃,y₂>}，F₂={<x₁,y₁>, <x₁,y₂>}，则 F₁ 是函数，而 F₂
    不是函数。


    **定义8.2** 设 F、G 是函数，如果它们满足：


    +   1. dom F=dom G；

    +   2. ∀x∈dom F=dom G 都有 F(x)=G(x)，则称 F 与 G 相等，记为 F=G。


    **注：** F=G ⇔ F⊆G ∧ G⊆F。'
  merge: -1
  img_proc: true
- pgno: 1772
  md: '**定义8.3** 设A，B为集合，如果 *f* 是函数，且 $\operatorname{dom}f=A$，$\operatorname{ran}f\subseteq
    B$，则 *f* 称为从 A 到 B 的函数，记作 $f:A\to B$。


    **定义8.4** 所有从 A 到 B 的函数的集合记作 $B^A$，即：


    $$B^A=\{f\mid f:A\to B\}.$$


    +   **注：**

    +   1. 若 $|A|=m$，$|B|=n$，则 $|B^A|=n^m$；

    +   2. $\Phi^\Phi=\{\Phi\}$，$B^\Phi=\{\Phi\}$，$\Phi^A=\Phi$。


    **例8.2** 见教材P₁₄₇。'
  merge: -1
  img_proc: true
