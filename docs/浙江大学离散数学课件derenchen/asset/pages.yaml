  md: Solution :The subgraph H of the Petersen graph obtained by deleting b and the
    three edges that have b as an endpoint ,shown in Figure 14(b),is homeomorphic
    to K3,3, with vertex sets {f,d,j}and {e,I,h},since it can be obtained by a sequence
    of elementary subdivisions,deleting {d,h} and adding {c,h} and {c,d},deleting
    {e,f} and adding {a,e }and {a,f},and deleting {I,j}and adding {g,I} and {g,j}.Hence,the
    Petersen graph is not planar.
