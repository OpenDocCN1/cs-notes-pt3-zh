  md: '# # Relations关系


    [定义]上确界与下确界：

    设 \( (P, \leq) \) 是半序集，\( A \subseteq P \)，

    若 \( a \) 是 \( A \) 的一个上界（下界），而 \(\forall A\) 的上界（下界）\( b \)，都有 \( a \leq b \)（\(
    b \leq a \)），则称 \( a \) 是 \( A \) 的上确界（下确界）。


    注：

    上确界：最小上界

    下确界：最大下界

    如果存在上（下）确界，则上（下）确界一定是唯一的'
