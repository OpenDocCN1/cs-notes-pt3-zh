  md: 'Euler(欧拉)1736年对这个问题，给出了否定的回答。将河岸和小岛作为图的顶点，七座桥为边，构成一个无向重图，问题化为图论中简单道路的问题：


    [定义] 欧拉道路（回路）：


    G =（V，E），称包含 E 中所有边的简单道路为欧拉道路/Euler Path/E道路。


    包含 E 中所有边的简单回路为欧拉回路/Euler Circuit/E回路'
