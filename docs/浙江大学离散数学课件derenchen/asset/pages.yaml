- pgno: 1367
  md: '# Graphs/图论


    如果 V₁ 与 Vₚ 相邻，显然成了环。不然，由于 V₁，Vₚ 仅与 { V₁， V₂， ...， Vₚ } 中顶点相邻， V₁， Vₚ 的次 ≤ p -
    1 。不妨设 V₁ 的次为 k ≤ p - 1 ，分别记相邻顶点为 Vᵢ₁， Vᵢ₂， ...， Vᵢₖ，它们前面的顶点（指在基本道路 { V₁， V₂，
    ...， Vₚ } 中的序）为 Vᵢ₁₋₁，Vᵢ₂₋₁，...，Vᵢₖ₋₁， Vₚ 必与 Vᵢ₁₋₁，Vᵢ₂₋₁，...，Vᵢₖ₋₁ 中某顶点相邻，否则 Vₚ
    的次 ≤ p - 1 - k ， V₁ 与 Vₚ 的次之和 ≤ k + p - 1 - k = p - 1 < n - 1 ，与任一对顶点次之和 ≥ n -
    1 矛盾。

    不妨 Vₚ 与 Vⱼ₋₁ 相邻， V₁ 与 Vⱼ 相邻。将 V₁ 与 Vⱼ 连起来， Vₚ 与 Vⱼ₋₁ 连起来，并将 Vⱼ₋₁ 到 Vⱼ 的边去掉，就形成一个环，如下图所示。'
  merge: -1
  img_proc: true
- pgno: 1368
  md: '![](img/5123c27d7478faaa822d0f1f02fc503f_1368_0.png)


    又由 G 的连通性，总可在 V − { V₁， V₂， ...， Vₚ } 中找到一个点 Vₓ，与 { V₁， V₂， ...， Vₚ } 中某一顶相邻，不妨与
    Vₖ相邻， Vₖ ≠ V₁， Vₖ ≠ Vₚ，连上 Vₓ与 Vₖ的边，去掉 Vₖ₋₁到 Vₖ的边，可以从 Vₖ₋₁为起点，一直走到 Vₖ，再到 Vₓ，这是一条
    p + 1 个顶点的基本道路。'
  merge: -1
  img_proc: true
- pgno: 1369
  md: '如果 p + 1 < n，仍继续扩充基本道路内的顶点，直至达到 n。


