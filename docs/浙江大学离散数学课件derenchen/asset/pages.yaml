- pgno: 604
  md: '# Example 3


    # Find the inverse of 3 modulo 7.


    Solution: Since gcd(3,7)=1, Theorem 2 tells us that an inverse of 3 modulo 7 exists.
    The Euclidean algorithm ends quickly when used to find the greatest common divisor
    of 3 and 7:


    7 = 2 · 3 + 1


    From this equation we see that


    -2 · 3 + 1 · 7 = 1.


    This shows that −2 is an inverse of 3 modulo 7. (Note that every integer congruent
    to −2 modulo 7 is also an inverse of 3, such as 5, −9, 12, and so on.)'
  merge: -1
  img_proc: true
