- pgno: 596
  md: '# Example 1


    Express gcd(252,198)=18 as a linear combination of 252 and 198.


    **Solution:** To show that gcd(252,198)=18, the Euclidean algorithm uses the following
    divisions:


    ```

    252 = 1 · 198 + 54

    198 = 3 · 54 + 36

    54 = 1 · 36 + 18

    36 = 2 · 18.

    ```


    Using the next-to-last division (the third division), we can express gcd(252,198)=18
    as a linear combination of 54 and 36. We find that


    ```

    18 = 54 − 1 · 36

    ```


    The second division tells us that


    ```

    36 = 198 − 3 · 54.

    ```'
  merge: -1
  img_proc: true
