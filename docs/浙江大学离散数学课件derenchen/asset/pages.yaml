- pgno: 1713
  md: '# §7.2 二元关系


    # 一、基本概念


    **定义7.3** 如果一个非空集合的元素都是有序对，则称该集合为一个二元关系。特别地，空集也是一个二元关系。


    **注：** 对一个二元关系R，如果<x,y>∈R，则记为xRy；如果<x,y>∉R，则记为x\not R y。


    **定义7.4** 设A,B为集合，A×B的任何子集所定义的二元关系称为从A到B的二元关系。特别地，当A=B时，称为A上的二元关系。


    **定义7.5** 对任何集合A，


    +   1. 称空集∅为A上的空关系。

    +   2. A上的全域关系E_A={<x,y>|x∈A ∧ y∈A}=A×A。

    +   3. A上的恒等关系I_A={<x,x>|x∈A}。'
  merge: -1
  img_proc: true
