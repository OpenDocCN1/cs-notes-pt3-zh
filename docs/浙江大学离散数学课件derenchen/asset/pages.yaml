- pgno: 1486
  md: '# Graphs/图论


    如果 \( V_1 \) 与 \( V_p \) 相邻，显然成了环。不然，由于 \( V_1 \)，\( V_p \) 仅与 \( \{ V_1, V_2,
    \dots, V_p \} \) 中顶点相邻，\( V_1 \)，\( V_p \) 的次 \(\leq p - 1\)。不妨设 \( V_1 \) 的次为
    \( k \leq p - 1\)，分别记相邻顶点为 \( V_{i_1}, V_{i_2}, \dots, V_{i_k} \)，它们前面的顶点（指在基本道路
    \( \{ V_1, V_2, \dots, V_p \} \) 中的序）为 \( V_{i_1-1}, V_{i_2-1}, \dots, V_{i_k-1}
    \)，\( V_p \) 必与 \( V_{i_1-1}, V_{i_2-1}, \dots, V_{i_k-1} \) 中某顶点相邻，否则 \( V_p
    \) 的次 \(\leq p - 1 - k\)，\( V_1 \) 与 \( V_p \) 的次之和 \(\leq k + p - 1 - k = p -
    1 < n - 1\)，与任一对顶点次之和 \(\geq n - 1\) 矛盾。


    不妨 \( V_p \) 与 \( V_{j-1} \) 相邻，\( V_1 \) 与 \( V_j \) 相邻。将 \( V_1 \) 与 \( V_j
    \) 连起来，\( V_p \) 与 \( V_{j-1} \) 连起来，并将 \( V_{j-1} \) 到 \( V_j \) 的边去掉，就形成一个环，如下图所示。'
