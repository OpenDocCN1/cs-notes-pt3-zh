  md: "# [定理1]（欧拉公式/Euler’s formula）\n\n对任何一个连通平面简单图，有v−e+γ=2，  \n其中v为顶点数，e为边数，γ是区域数。\n\
    \n证明：  \n对e归纳：  \n(1)e=1，只有二种情况  \na）______，v=2，γ=1，  \nv−e+γ=2−1+1=2\n\nb）______，v=1，γ=2，\
    \  \nv−e+γ=1−1+2=2"
  merge: -1
  img_proc: true
- pgno: 1399
  md: "# (2) 若 e = n − 1 时欧拉公式成立\n\ne = n 时，\n\na）若 G 中有有限区域，去掉此区域的  \n一条边，成 G’，只有\
    \ n − 1 条边，满足 v’  \n− e’ + γ’ = 2，而 v = v’， e = e’ + 1，  \nγ = γ’ + 1，仍有 v − e\
    \ + γ = v’ − e’ −  \n1 + γ’ + 1 = v’ − e’ + γ’ = 2 。\n\nb）若 G 不存在有限区域，即 G 中无回\
    \  \n路，必有次为 1 的顶点，去掉这个顶点及关联  \n的边，得 G’，顶点和边都减少 1，区域数总  \n为 1，由假设 G’ 中只有 n − 1\
    \ 条边，满足 v’  \n− e’ + γ’ = 2，而 v = v’ + 1， e = e’  \n+ 1， γ = γ’ = 1， v − e + γ\
    \ = v’ + 1 − e’  \n− 1 + γ’ = v’ − e’ + γ’ = 2 。"
