- pgno: 924
  md: "# 计数原理\n\n例：\n排列 1 3 2 6 5 4\n顺序：1 3，2 6，逆序：3 2，6 5，5 4。\n对 n 个对象进行全排列，有 n！个排列，可\n\
    以对 n 个对象加上标记。\n不失一般性，我们只需对 n 个自然数 { 1，\n2，...，n } 进行全排列，枚举出所有的情况。\n\n# 字典序排列算法\n\
    \n1. 给出初始排列： p₁ = 1，2，3，4，...，n\n2. 若 pₖ 已定义 （1 ≤ k ≤ n！- 1）\n   pₖ = a₁，a₂，...，aₘ，...，aₙ"
  merge: -1
  img_proc: true
- pgno: 925
  md: "# # 计数原理\n\n则按下列规定，定义 \\( p_k \\) 的下一个排列  \n\\( p_{k+1} = b_1, b_2, \\ldots,\
    \ b_m, \\ldots, b_n \\)\n\n(1) 寻找 \\( a_m \\): \\( m = \\max \\{ j \\mid a_j <\
    \ a_{j+1} \\} \\)  \n即 \\( a_m, a_{m+1} \\) 是最右面的顺序，自 \\( a_{m+1} \\) 开始均为逆序。\n\
    \n(2) 给出 \\( b_i \\) (\\( i = 1, 2, \\ldots, n \\))  \na) 第 \\( m \\) 项之前的项不变：\
    \  \n\\( b_1 = a_1, b_2 = a_2, \\ldots, b_{m-1} = a_{m-1} \\)\n\nb) \\( b_m =\
    \ \\min \\{ a_p \\mid a_p > a_m, p > m \\} \\)  \n即在 \\( a_m \\) 右面大于 \\( a_m\
    \ \\) 的项中选取最小的项作为 \\( b_m \\)。\n\nc) 把 \\( a_m, a_{m+1}, \\ldots, a_{p-1}, a_{p+1},\
    \ \\ldots, a_n \\) 从小到大排列，送入 \\( b_{m+1}, b_{m+2}, \\ldots, b_n \\)。"
  merge: -1
  img_proc: true
- pgno: 926
  md: '# # 计数原理


    例1：设有 \( n = 6 \) 个数字的排列 \( a_1, a_2, \ldots, a_6 \) 为 \( 1, 2, 4, 6, 5, 3 \)，求它的下一个排列。


    解：1.求 \( m \)：\( 4, 6 \) 是最右的顺序，\( a_m = 4 \)，\( m = 3 \)


    2.定义 \( b_i \)：\( b_1 = 1, b_2 = 2 \)，在 \( a_m \) 右边还有 \( 6, 5, 3 \)，其中 \( 6 \)
    和 \( 5 \) 大于 \( a_m = 4 \)，\( 5 \) 是最小的，\( b_3 = 5 \)


    3.余下 \( a_3 = 4, a_4 = 6, a_6 = 3 \)，从小到大排起来，为 \( 3, 4, 6 \)，即让 \( b_4 = 3, b_5
    = 4, b_6 = 6 \)


    得到 \( 1, 2, 4, 6, 5, 3 \) 的下一个排列：\( 1, 2, 5, 3, 4, 6 \)。'
