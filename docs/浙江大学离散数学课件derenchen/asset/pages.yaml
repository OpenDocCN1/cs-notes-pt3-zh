- pgno: 556
  md: 'Consider the problem of adding two integers in binary notation .A procedure
    to perform addition can be based on the usual method for adding numbers with pencil
    and paper.This method proceeds by adding pairs of binary digits together with
    carries, when they occur,to computer the sum of two integers.This procedure will
    now be specified in detail.


    To add a and b ,first add their rightmost bits .This gives


    \(a_0+b_0=c_0 \cdot 2+s_0\)


    Where s<sub>0</sub> is the rightmost bit in the binary expansion of a +b and c<sub>0</sub>
    is the carry,which is either 0 or 1 Then add the next pair of bits and the carry,'
  merge: -1
  img_proc: true
- pgno: 557
  md: '$a_0+b_0+c_0=c_1\cdot2+s_1,$


    Where $s_1$ is the next bit (from the right) in the binary expansion of $a+b$,
    and $c_1$ is the carry. Continue this process, adding the corresponding bits in
    the two binary expansion of $a+b$. At the last stage, add $a_{n-1}$, $b_{n-1}$,
    and $c_{n-2}$ to obtain $c_{n-1}\cdot2+s_{n-1}$. The leading bit of the sum is
    $s_n=c_{n-1}$. This procedure produces the binary expansion of the sum, namely,
    $a+b=(s_ns_{n-1}\cdots s_1s_0)_2$.'
  merge: -1
  img_proc: true
- pgno: 558
  md: '# Example 5


    Add a=(1110)₂ and b=(1011)₂.


    **Solution:** Following the procedure specified in the algorithm, first note that


    $a_0+b_0=0+1=0\cdot2+1,$


    so that $c_0=0$ and $s_0=1$. Then, since


    $a_1+b_1+c_0=1+1+0=1\cdot2+0,$


    it follows that $c_1=1$ and $s_1=0$. Continuing,


    $a_2+b_2+c_1=1+0+1=1\cdot2+0,$


    so that $c_2=1$ and $s_2=0$. Finally, since


    $a_3+b_3+c_2=1+1+1=1\cdot2+1,$


    it follows that $c_3=1$ and $s_3=1$. This means that $s_4=c_3=1$. Therefore, $s=a+b=(11001)_2$.
    This addition is displayed in figure 1.


