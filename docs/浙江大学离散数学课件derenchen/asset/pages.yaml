  md: '# 【定理3】：设 $G=(V,E)$ 是 $n$ 个顶点的简单图，如果任何一对顶点的次之和 $\ge n-1$，则 $G$ 中一定有 $H$ 道路（$n\ge2$）。


    # 证明：


    1、$G$ 一定连通，否则 $G$ 分为二个不连通的分图 $G_1$、$G_2$，其中 $G_1$ 有 $n_1$ 个顶点，$G_2$ 有 $n_2$ 个顶点，$G_1$
    中每个顶点次 $\le n_1-1$，$G_2$ 中每个顶点次 $\le n_2-1$，从 $G_1$ 中取一个顶点，从 $G_2$ 中取一个顶点，这一对顶点之和
    $\le n_1-1+n_2-1=n_1+n_2-2=n-2<n-1$，与定理的假设矛盾。'
