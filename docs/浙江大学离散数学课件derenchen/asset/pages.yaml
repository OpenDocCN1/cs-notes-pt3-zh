  md: "# 注：构造证明时的两个技巧：\n\n+   1. 附加前提证明法：欲证 $(A_1\\land A_2\\land\\ldots\\land A_k)\\\
    Rightarrow(A\\to B)$，可改证\n+   \n+      $(A_1\\land A_2\\land\\ldots\\land A_k\\\
    land A)\\Rightarrow B$。道理如下：\n+   \n+      $(A_1\\land A_2\\land\\ldots\\land\
    \ A_k)\\to(A\\to B)$\n+   \n+      $\\Leftrightarrow\\neg(A_1\\land A_2\\land\\\
    ldots\\land A_k)\\lor(\\neg A\\lor B)$\n+   \n+      $\\Leftrightarrow(\\neg A_1\\\
    lor\\neg A_2\\lor\\ldots\\lor\\neg A_k\\lor\\neg A)\\lor B$\n+   \n+      $\\\
    Leftrightarrow\\neg(A_1\\land A_2\\land\\ldots\\land A_k\\land A)\\lor B$\n+ \
    \  \n+      $\\Leftrightarrow(A_1\\land A_2\\land\\ldots\\land A_k\\land A)\\\
    to B$\n\n+   2. 归谬法：欲证 $(A_1\\land A_2\\land\\ldots\\land A_k)\\Rightarrow B$，若将\
    \ $\\neg B$ 做为附加前提后能得出矛盾（比如得到 $A\\land\\neg A$），则说明原推理正确。道理如下：\n+   \n+      $(A_1\\\
    land A_2\\land\\ldots\\land A_k)\\to B$\n+   \n+      $\\Leftrightarrow\\neg(A_1\\\
    land A_2\\land\\ldots\\land A_k)\\lor B$\n+   \n+      $\\Leftrightarrow\\neg(A_1\\\
    land A_2\\land\\ldots\\land A_k\\land\\neg B)$\n+   \n+      可见若 $A_1\\land A_2\\\
    land\\ldots\\land A_k\\land\\neg B$ 为矛盾式，则 $A_1\\land A_2\\land\\ldots\\land A_k\\\
    to B$ 为重言式。"
