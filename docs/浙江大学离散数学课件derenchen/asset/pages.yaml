- pgno: 1944
  md: '# 主析取范式和主合取范式的用途（以主析取范式为例）。


    # 1. 求公式的成真与成假赋值


    对含有n个变项的命题公式A，若其主析取范式含s（0≤s≤2<sup>n</sup>）个极小项，则A有s个成真赋值，它们是极小项下标的二进制表示，其余2<sup>n</sup>
    - s个赋值都是成假赋值。


    例如，在例2.8中，（p→q)↔r⇔m<sub>1</sub>∨m<sub>3</sub>∨m<sub>4</sub>∨m<sub>7</sub>，因各极小项含三个文字，故各极小项下标的长为3的二进制数
    001， 011， 100， 111为该公式的成真赋值，而其余赋值000， 010， 101， 110为成假赋值。'
  merge: -1
