- pgno: 1705
  md: '# 例6.6 证明 $A\cup B=B\Leftrightarrow A\subseteq B\Leftrightarrow A\cap B=A\Leftrightarrow
    A-B=\varnothing$


    证明：(1) 先证 $A\cup B=B\Rightarrow A\subseteq B$


    对∀x，$x\in A\Rightarrow x\in A\lor x\in B\Rightarrow x\in(A\cup B)\Rightarrow x\in
    B$，（∵ $A\cup B=B$）


    ∴ $A\subseteq B$


    (2) 再证 $A\subseteq B\Rightarrow A\cap B=A$


    显然 $A\cap B\subseteq A$，下面只需证 $A\subseteq A\cap B$


    对∀x，$x\in A\Rightarrow x\in A\land x\in A\Rightarrow x\in A\land x\in B\Rightarrow
    x\in(A\cap B)$。（∵ $A\subseteq B$）


    ∴ $A\cap B=A$


    (3) 下证 $A\cap B=A\Rightarrow A-B=\varnothing$


    $A-B=A\cap\sim B=(A\cap B)\cap\sim B=A\cap(B\cap\sim B)=A\cap\varnothing=\varnothing$


    (4) 最后证明 $A-B=\varnothing\Rightarrow A\cup B=B$


    $A\cup B=(A-B)\cup B=\varnothing\cup B=B$（由上例及 $A-B=\varnothing$）'
  merge: -1
  img_proc: true
- pgno: 1706
  md: '# 例 6.7 化简 \(((A \cup B \cup C) \cap (A \cup B)) - ((A \cup (B - C)) \cap A)\)


    解：因 \(A \cup B \subseteq A \cup B \cup C\)，\(A \subseteq A \cup (B - C)\)，故

    \(((A \cup B \cup C) \cap (A \cup B)) - ((A \cup (B - C)) \cap A)\)

    \(=(A \cup B) - A\)

    \(=(A \cup B) \cap \sim A\)

    \(=(A \cap \sim A) \cup (B \cap \sim A)\)

    \(=\emptyset \cup (B - A)\)

    \(=B - A\)


    # 例 6.8 已知 \(A \oplus B = A \oplus C\)，证明 \(B = C\)


    证：\(A \oplus (A \oplus B) = A \oplus (A \oplus C)\) （已知）

    \(\Rightarrow (A \oplus A) \oplus B = (A \oplus A) \oplus C\)

    \(\Rightarrow \emptyset \oplus B = \emptyset \oplus C\)

    \(\Rightarrow B = C\)'
