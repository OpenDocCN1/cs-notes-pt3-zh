- pgno: 1595
  md: '# # Graphs/图论


    [定义]生成树：无向简单图G = (V, E) 的生成子图T 是树，则称T 为G的生成树/spanning tree。


    T = (V, E’)， E’ ⊆E


    [定理一]：

    无向简单图G = (V, E) 存在生成树的充要条件是G 是连通的。

    证明： 必要性：T 是生成子图，包含G 的所有顶点，T 是树，T 连通，则G 连通。'
  merge: -1
  img_proc: true
- pgno: 1596
  md: '充分性：若 G 是连通的，

    （1）若 G 无回路，则 G 本身是树，即生成树。

    （2）若存在回路，去掉回路中任一边，不影响连通性，也不减少顶点。


    所有回路都移去一条边，剩下的子图包含所有顶点，又是无回路的连通图，即为生成树。


    注：① 移去边时可随意，故生成树不唯一。

    ② 生成树是 G 的最小连通生成子图，若将 G =（V，E）看成是各顶点间的通讯联络图，则生成树 T =（V，E′）即为各顶点间直接或间接联络的最小通讯联络图。'
  merge: -1
  img_proc: true
- pgno: 1597
  md: '# # 最小生成树/minimum spanning tree


    城市通讯网图中，最小生成树就是能保证通讯费用最小的通讯网。


    [定义]


    最小生成树：设加权图G = (V, E, W)，T = (V, E′) 是G的生成树，称w（T） = \(\sum_{e \in E''} w(e)\) 为T的权，使权w（T）达到最小值的'
  merge: -1
  img_proc: true
- pgno: 1598
  md: '# # Kruskal 算法：


    设 \( G = (V, E, W) \) 是连通图


    +   1. 各边以权由小到大排序。


    +   2. 选 \( E \) 中最小边 \( e_1 \)，令 \( G_1 = (V, S_1) \)，\( S_1 = \{ e_1 \} \)，\(
    i = 1 \)


    +   3. 设 \( S_i = \{ e_1, e_2, \dots, e_i \} \)，\( G_i = (V, S_i) \) 选出 \( S_{i+1}
    \)，从 \( E - S_i \) 中选一条边 \( e_{i+1} \)，满足：


    +   (1) \( S_i \cup \{ e_{i+1} \} \) 中不含回路；


    +   (2) \( e_{i+1} \) 是满足 (1) 的最小权的边。令 \( S_{i+1} = \{ e_1, e_2, \dots, e_i, e_{i+1}
    \} \)，\( G_{i+1} = (V, S_{i+1}) \)；


    +   4. \( i = i + 1 \)，若 \( i = v - 1 \)，则 \( G_i = G_{v-1} \) 为最小生成树，否则转 3 继续。'
  merge: -1
  img_proc: true
