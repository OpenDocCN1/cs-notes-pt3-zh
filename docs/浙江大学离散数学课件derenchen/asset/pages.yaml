  md: '# # A 上各类二元关系的性质


    定义三：设 \( R_0 = R \)，\( R_{k+1} \) 是 \( R_k \) 的传递扩张（\( k = 0, 1, 2, ...\)），则称
    \( R_0 \cup R_1 \cup R_2 \cup ... \cup R_k \cup ... \) 为 \( R \) 的传递闭包，也记作 \(
    T(R) \)。


    \( R_2 = R \cdot R = \{ (a, b) \mid (a, c), (c, b) R \} \)


    \( R_1 = \{ (a, b) \mid (a, b \ R \ or \ (a, c), (c, b) R) \} = R \cup R \cdot
    R \)


    \( R_2 = \{ (a, b) \mid (a, b) \ R_1, \ or \ (a, c), (c, b) \ R_1 \} \) 其中 \(
    (a, c), (c, b) \ R_1 = R \cup R \cdot R \)，


    当二者均 \( R \) 时 \( (a, b) \ R \cdot R \)，当一个 \( R \)，另一个 \( R \cdot R \) 时，\( (a,
    b) \ R^3 \)，当二者均 \( R \cdot R \) 时，\( (a, b) \ R^4 \)，因此 \( R_2 = \{ (a, b) \mid
    (a, b) \ R, \ or \ (a, b) \ R^2, \ or \ (a, b) \ R^4, \ or \ (a, b) \ R^4 \} =
    R \cup R^2 \cup R^3 \cup R^4 \)'
