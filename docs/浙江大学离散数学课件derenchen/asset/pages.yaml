  md: '**定义7.21** 设R为非空集合A上的偏序关系，如果∀x，y∈A，x与y都是可比的，则称R为A上的全序关系。


    **例如** 大于等于关系（小于等于关系）是全序集，但整除关系一般不是全序集。


    **定义7.22** 带有某种指定的偏序关系≤的集合A称为偏序集，记为⟨A，≤⟩。


    **例如** 整数集Z和数的小于等于关系⟨构成偏序集⟨Z，≤⟩；

    集合A的幂集P(A)和集合的包含关系⊆构成偏序集⟨P(A)，⊆⟩。


    **定义7.23** 设⟨A，≤⟩为偏序集，∀x，y∈A，如果x＜y且不存在z∈A，使得x＜z＜y，则称y覆盖x。


    **例如** A={1，2，4，6}上的整除关系，有2覆盖1，4和6都覆盖2，但4不覆盖1，6不覆盖4。'
