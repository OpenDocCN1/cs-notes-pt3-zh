  md: "在实际应用中，往往不仅需要计数，而且要把各种情况都枚举出来。\n\n# # 一、字典序排列/lexicographic ordering for permutation\n\
    \n# ## 定义：\n\n顺序：排列 \\(a_1, a_2, \\ldots, a_n\\) 中相邻两数  \n\\(a_i < a_{i+1}\\)，称为一个顺序。\
    \  \n\n逆序：排列 \\(a_1, a_2, \\ldots, a_n\\) 中相邻两数  \n\\(a_i > a_{i+1}\\)，称为一个逆序。"
