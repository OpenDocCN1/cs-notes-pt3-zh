  md: '[定义]前缀：a，b，c 均为二进制序列，如果 b = a 并列 c，c 不是空序列，则称 a 是 b 的前缀/prefix。即 a 是 b 的前面一部分。


    [定义]前缀码：一个二进制序列集合，如果这些二进制序列互不为前缀，则称此集合为前缀码/prefix code。


    例：二元有序加权树


    每枝点左边对应权为0，右边对应权1，叶对应一个码（即每片叶都有一条从根到叶的路径，路径上的权排列成序即为叶的码，也称作叶的名。'
