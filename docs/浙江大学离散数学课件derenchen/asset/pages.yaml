- pgno: 1745
  md: '# § 7.5 关系的闭包


    # 一．闭包的定义


    定义7.14 设R是非空集合A上的关系,R的自反闭包(对称闭包、传递闭包)是 A上的关系 R′，它满足：


    +   (1) R′是自反的 (对称的、传递的);


    +   (2) R⊆ R′;


    +   (3) 对A上任何包含 R 的自反关系 (对称关系、传递关系)

    +   R″ 都有R′⊆ R″.


    注： R的自反闭包记为 r(R)，对称闭包记为 s(R)，传递闭包记为 t(R)。'
  merge: -1
