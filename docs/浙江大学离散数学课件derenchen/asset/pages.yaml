  md: '解：首先，因A≠Φ，故n≥2，x中单个元素构成的子集都在 A 中，他

    们在 R⊆ 下互相不可比，因此A中无最大元和最小元。

    其次考察(P (x)，R⊆)的哈斯图。

    其最低层是空集Φ，记为第0层，由底向上，第1层是单元

    集，第2层是二元子集，⋯，第n-1层是x的所有n-1元子集，最顶

    层即第n层，只有一个顶点x。

    偏序集<A，R⊆>的哈斯图是由⟨P (x) 的哈斯图去掉第0层与第

    n层得到的，故x的所有单元集都是<A，R⊆>的极小元，x的所有

    n-1元子集都是<A，R⊆>的极大元'
