- pgno: 1623
  md: '# § 3.1 推理的形式结构


    定义3.1 推理是指从一些已知的命题公式（称为前提）应用推理规则推演出另一些命题公式（称为结论）的过程。设 A₁，A₂，…，Aₖ，B 是命题公式，若对于 A₁，A₂，…，Aₖ，B
    中出现的命题变项的任一组赋值，要么 A₁∧A₂∧…∧Aₖ 为假，要么 A₁∧A₂∧…∧Aₖ 为真且 B 也为真，则称由前提 A₁，A₂，…，Aₖ 推出 B
    的推理是有效的（或正确的），并称 B 是有效的结论。'
  merge: -1
  img_proc: true
- pgno: 1624
  md: "# # 注：\n\n+   1. 由前提A₁,A₂,...,Aₖ 推结论B的推理是否正确与诸前提的排列次序无关。\n\n+   2. 将一个推理诸前提的集合记为Γ，则由Γ推出结论B的推理一般记为Γ\
    \ ⊢ B。若该推理是正确的，则记为Γ ⊢ B（或Γ⇒B），否则记为Γ ⊬ B（或Γ⇏B）。称Γ ⊢ B 和 {A₁, A₂, ..., Aₖ} ⊢ B为推理的形式结构。\n\
    \n+   3. 设命题公式A₁, A₂, ..., Aₖ, B中共有n个命题变项。对于任一组赋值α₁, α₂, ..., αₙ(αᵢ取0或1, i=1,2,...,\
    \ n)，前提和结论的取值情况有如下四种：\n+   (1) A₁∧A₂∧...∧Aₖ 为0，B为0\n+   (2) A₁∧A₂∧...∧Aₖ 为0，B为1\n\
    +   (3) A₁∧A₂∧...∧Aₖ 为1，B为0\n+   (4) A₁∧A₂∧...∧Aₖ 为1，B为1\n+   \n+   按照定义，只要不出现(3)，推理就是正确的。因而判断一个推理正确与否，只需判断是否会出现情况(3)即可。\n\
    \n+   4. 推理正确，并不能保证结论B一定为真。因为前提可能是假的(情况(1))。"
  merge: -1
  img_proc: true
- pgno: 1625
  md: '# 定理3.1


    命题公式 \( A_1, A_2, \ldots, A_k \) 推 \( B \) 的推理正确，(即 \( \{A_1, A_2, \ldots, A_k\}
    \Rightarrow B \))

    当且仅当 \( (A_1 \land A_2 \land \ldots \land A_k) \rightarrow B \) 为重言式。


    证明 见教材54页。


    由该定理，我们可以将推理的形式结构 \( \{A_1, A_2, \ldots, A_k\} \vdash B \) 转换成 \( (A_1 \land A_2
    \land \ldots \land A_k) \rightarrow B \)。


    判断推理是否正确的三种直接方法：


