  md: '# Relations关系


    # 【定义】上界与下界/upper bound and lower bound:


    设（P，≤）是半序集，A⊆P，

    若 a∈P，对 ∀b∈A，b≤a（a≤b）称 a 为 A 的上界（下界）。


    说明：


    +   （1）上例中，A无最大元，但存在A的上界 {a，b，c}。

    +   （2）Φ为A的最小元，也是A的下界

    +   （3）最大（小）元是A的一个上（下）界

    +   （4）上（下）界可以不唯一，也可以不存在'
