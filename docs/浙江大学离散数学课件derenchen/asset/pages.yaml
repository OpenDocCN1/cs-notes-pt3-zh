- pgno: 1923
  md: '利用这16组24个等值式可以推演出更多的等值式。由已知的等值式推演出另一些等值式的过程称为等值演算。在等值演算中，经常用到如下置换规则。


    置换规则：设Φ（A）是含公式A的命题公式， Φ（B）是用公式B置换了 Φ（A）中所有的A后所得的公式。若 B ⇔ A，则 Φ（B）⇔ Φ（A）。


    此规则可用数学归纳法证明。'
