  md: '# 定理9.2　(1) \(N\not\sim R\)；(2) 对任意集合 \(A\)，都有 \(A^*\notin P(A)\)。


    证：(1) 由于 \(R\approx[0,1]\)，我们只需证明 \(N\not\approx[0,1]\)，为此只要能证明任何函数 \(f:N\to[0,1]\)
    都不是满射即可。


    对∀x∈[0,1]，x总可写成x=0.a₁a₂…，(aᵢ是自然数且0≤aᵢ≤9)的形式。设 \(f:N\to[0,1]\) 是从 \(N\) 到 \([0,1]\)
    的任意一个函数，列出 \(f\) 的所有函数值：


    ```

    $$\begin{aligned}

    f(0)&=0.a_1^{(1)}a_2^{(1)}\cdots\\

    f(1)&=0.a_1^{(2)}a_2^{(2)}\cdots\\

    \cdots\quad&\cdots\\

    f(n-1)&=0.a_1^{(n)}a_2^{(n)}\cdots\\

    \cdots\quad&\cdots

    \end{aligned}$$

    ```


    构造数字 \(y=0.b_1b_2\cdots\)，其中 \(b_i\) 是自然数，\(0\le b_i\le 9\) 且 \(b_i\ne a_i^{(i)}\)（i=1,2,…），则
    \(y\in[0,1]\)，但 \(y\) 与上述 \(f\) 的任何一个函数值都不相等，故 \(y\notin ran\,f\)，这便说明 \(f\) 不是满射。'
