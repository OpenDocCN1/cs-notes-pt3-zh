    例如：非空集合上的空关系，对应于全零矩阵，是对称的，传递的，而不是自反的。


    传递性不象自反，对称等性质容易判别，可以用高级语言编一个子程序来判别，利用等式（）V = 1，当然，只要对 a ij = 1 的情况进行判别，凡出现一个逻辑表达式为
