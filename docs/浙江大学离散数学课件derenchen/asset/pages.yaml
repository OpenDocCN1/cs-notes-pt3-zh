- pgno: 867
  md: '# # 字典序组合算法：


    +   1. \( S_1 = \{ 1, 2, ..., k \} \)


    +   2. 若 \( S_i = \{ a_1, a_2, ..., a_k \} \) 已得到（\( 1 \leqslant i \leqslant C_n^k
    - 1 \)）则构造下一个子集 \( S_{i+1} = \{ b_1, b_2, ..., b_k \} \)


    +   (1) \( m = \max \{ j \mid a_j \neq n - (k - j) \} \)，即 \(\{ a_1, a_2, ...
    a_j, ..., a_k \}\) 与 \(\{ n - k + 1, n - k + 2, ..., n - k + j, ..., (n - 1),
    n \}\) 比较，从右边开始比较第一个不相等的项为 \( a_m \)'
