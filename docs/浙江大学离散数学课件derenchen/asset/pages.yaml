  md: '2. 全称量词引入规则（记为UG）：A(y) ⇒ ∀x A(x)，其中y是A(y)中自由出现的个体变项，且无论y取何值，A(y)总为真。\n注：取代y的x不能在A(y)中约束出现。\n例：取个体域为实数，F(x,y)：x>y，A(y)=∃x
    F(x,y)，则


    A(y) ⇒ ∀z A(z) = ∀z∃x F(x,z)，


    但不能　A(y) ⇒ ∀x A(x) = ∀x∃x F(x,x)


    3. 存在量词引入规则（记为EG）：A(c) ⇒ ∃x A(x)，其中c是特定的个体常项。取代c的x不能在A(c)中出现过。\n例：取个体域为实数，F(x,y)：x>y，A(5)=∃x
    F(x,5)，则


    A(5) ⇒ ∃y A(y) = ∃y∃x F(x,y)，


    但不能　A(5) ⇒ ∃x A(x) = ∃x∃x F(x,x)'
