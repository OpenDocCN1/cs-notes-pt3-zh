- pgno: 1365
  md: '# 【定理3】：设 G =（V，E）是 n 个顶点的简单图，如果任何一对顶点的次之和 ≥ n − 1，则 G 中一定有 H 道路。


    证明：


    +   1、G 一定连通，否则 G 分为二个不连通的分图 G₁、G₂，其中 G₁ 有 n₁ 个顶点，G₂ 有 n₂ 个顶点，G₁ 中每个顶点次 ≤ n₁ −
    1，G₂ 中每个顶点次 ≤ n₂ − 1，从 G₁ 中取一个顶点，G₂ 中取一个顶点，这一对顶点之和 ≤ n₁ − 1 + n₂ − 1 = n₁ + n₂
    − 2 = n − 2 < n − 1，与定理的假设矛盾。'
  merge: -1
  img_proc: true
