  img_proc: true
- pgno: 1906
  md: '# § 1.2 命题公式及其赋值


    定义1.6 简单命题（原子命题）称为命题常项，而称真值可以变化的陈述句为命题变项。命题变项一般也用小写字母 $p,q,r,\ldots$ 来表示。将命题变项用联结词和括号按一定逻辑关系联结起来的符号串称为合式公式或命题公式。具体地说，合式公式定义如下：


    +   1. 单个命题变项是合式公式，称为原子命题公式。

    +   2. 若 $A$ 是合式公式，则 $\neg A$ 也是合式公式。

    +   3. 若 $A,B$ 是合式公式，则 $A\land B$、$A\lor B$、$A\to B$、$A\leftrightarrow B$ 也是合式公式。

    +   4. 只有有限次地应用(1)～(3)形成的符号串才是合式公式。


    例如：$p$、$(p\lor q)\lor(\neg r)$、$(p\to q)\land(q\leftrightarrow r)$、$(p\land q)\land\neg
    r$、$p\land(q\lor\neg r)$ 都是命题公式。'
  merge: -1
  img_proc: true
- pgno: 1907
  md: '定义1.7 (1) 若命题公式A是单个命题变项，则称A为0层公式。

    (2) 称命题A是n+1(n≥0) 层公式，只要A是下列情况之一：

    (a) A = ¬B，B 是 n层公式；

    (b) A= B∧C，B，C 分别为 i 层和j 层公式，且max (i , j)= n。

    (c) A=B∨C，B，C 分别为 i 层和j 层公式，且max (i , j)= n。

    (d) A= B→C，B，C 分别为 i 层和j 层公式，且max (i , j)= n。

    (e) A= B↔C，B，C 分别为 i 层和j 层公式，且max (i , j)= n。


    例如：(¬ p∧q)→r，(¬ (p→¬ q))∧(( r∨s)↔¬ p) 分别为3层和4层公式。'
  merge: -1
  img_proc: true
- pgno: 1908
  md: '由于命题公式中含有命题变项，故其真值一般是不确定的。当公式中所有命题变项都解释成具体的命题后，命题公式就成了真值确定的命题了。


    例如，在命题公式 (p∨q)→r 中，若将 p 解释成命题：2 是素数，q 解释成：3 是偶数，r 解释成：√2 是无理数，则命题公式 (p∨q)→r 就被解释成了一个真命题：若2是素数或3是偶数，则√2是无理数。（因p,q,r
    的真值为 1, 0, 1）；另一方面，如果p,q 的解释不变，而将r解释成：√2 是有理数，则 (p∨q)→r 就被解释成了一个假命题。'
  merge: -1
  img_proc: true
- pgno: 1909
  md: '**定义 1.8** 设在命题公式 A 中出现的所有命题变项为 \(p_1,p_2,\ldots,p_n\)，给它们各指定一个真值，称为对公式 A 的一个赋值（或解释）。若一个赋值使
    A 的真值为 1，则称该赋值为 A 的成真赋值（或真赋值），否则称为 A 的成假赋值（或假赋值）。


    注：设 A 中的变项为 \(p_1,p_2,\ldots,p_n\)，给 A 的赋值 \(a_1,a_2,\ldots,a_n\) 是指 \(p_1=a_1,p_2=a_2,\ldots,p_n=a_n\)，其中
    \(a_i\) 为 0 或 1，\((i=1,2,\ldots,n)\)。


    例如：公式 \((\neg p_1\land\neg p_2\land\neg p_3)\lor(p_1\land p_2)\) 中，000（即 \(p_1=0,p_2=0,p_3=0\)）和
    110（即 \(p_1=1,p_2=1,p_3=0\)）都是成真赋值；而 001（即 \(p_1=0,p_2=0,p_3=1\)）和 011（即 \(p_1=0,p_2=1,p_3=1\)）都是成假赋值。'
  merge: -1
  img_proc: true
- pgno: 1910
  md: '将命题公式 A 在其变项的所有可能的赋值下的取值情况列表，称为真值表。含 n 个命题变项的公式共有 $2^n$ 个不同的赋值。构造真值表的一般步骤如下：


    +   1. 列出命题公式中的所有命题变项 $p_1,p_2,\ldots,p_n$，（无下标时按字典序排列）。列出这些变项的所有 $2^n$ 个赋值。一般从
    00…0 开始，按二进制加法依次列到 11…1 为止。

    +   2. 按从低到高的顺序依次列出公式的各个层。

    +   3. 对应于变项的 $2^n$ 个赋值分别计算出各层的真值，直至算出公式的真值。'
  merge: -1
