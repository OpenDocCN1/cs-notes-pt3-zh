  md: '# Example 4


    What are the solutions of the linear congruence 3x ≡ 4 (mod 7)?


    **Solution:** By Example 3 we know that −2 is an inverse of 3 modulo 7. Multiplying
    both sides of the congruence by −2 shows that


    −2 · 3x ≡ −2 · 4 (mod 7).


    Since −6 ≡ 1 (mod 7) and −8 ≡ 6 (mod 7), it follows that if x is a solution. Assume
    that x ≡ −8 ≡ 6 (mod 7).


    We need to determine whether every x with x ≡ 6 (mod 7) is a solution. Assume
    that x ≡ 6 (mod 7). Then, by Theorem 7 of Section 2.3, it follows that


    3x ≡ 3 · 6 ≡ 18 ≡ 4 (mod 7),


    which shows that all such x satisfy the congruence. We conclude that the solutions
    to the congruence are the integers x such that x ≡ 6 (mod 7), namely, 6, 13, 20,
    … and −1, −8, −15, …'
