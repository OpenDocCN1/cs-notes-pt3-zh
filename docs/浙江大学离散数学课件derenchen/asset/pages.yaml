- pgno: 1950
  md: '# • 关于主合取范式的两点说明


    +   1. 主合取范式可由主析取范式直接得到。


    设公式 A 含有 n 个变项，A 的主析取范式为


    $$A \Leftrightarrow m_{i_1} \lor m_{i_2} \lor \cdots \lor m_{i_l},\ (0 \leq i_r
    \leq 2^n-1,\ r=1,2,\cdots,l)$$


    未在主析取范式中出现的极小项设为 $m_{j_1},m_{j_2},\cdots,m_{j_{2^n-l}}$，则 A 的主合取范式为：$A \Leftrightarrow
    M_{j_1}\land M_{j_2}\land\cdots\land M_{j_{2^n-l}}$


    事实上，因 $\neg A \Leftrightarrow m_{j_1}\lor m_{j_2}\lor\cdots\lor m_{j_{2^n-l}}$，故


    $$A \Leftrightarrow \neg(\neg A) \Leftrightarrow \neg(m_{j_1}\lor m_{j_2}\lor\cdots\lor
    m_{j_{2^n-l}}) \Leftrightarrow \neg m_{j_1}\land\neg m_{j_2}\land\cdots\land\neg
    m_{j_{2^n-l}}$$


    $$\Leftrightarrow M_{j_1}\land M_{j_2}\land\cdots\land M_{j_{2^n-l}}$$'
  merge: -1
  img_proc: true
- pgno: 1951
  md: '# 例2.13 由公式的主析取范式，求主合取范式：


    +   (1) A ⇔ m₁ ∨ m₂, (A含两个变项p, q);

    +   (2) B ⇔ m₁ ∨ m₂ ∨ m₃ , (B含三个变项p, q, r)。


    解：(1) 主析取范式中未出现的极小项为： m₀, m₃, 故A的主合取范式为：

    A ⇔ M₀ ∧ M₃。


    (2) 主析取范式中未出现的极小项为m₀，m₄，m₅，m₆，m₇， 故A的主合取范式为： A ⇔ M₀ ∧ M₄ ∧ M₅ ∧ M₆ ∧ M₇。


    # 2 . 重言式与矛盾式的主合取范式


    重言式无成假赋值，因而其主合取范式不含任何极大项。重言式的主合取范式记为1。矛盾式无成真赋值，故其主合取范式含有所有2ⁿ个极大项。'
