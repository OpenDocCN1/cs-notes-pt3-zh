  md: '# 7.4 连通性/Connectivity


    [定义] 道路/path：当 G 中相邻边的序列 $(V_0,V_1)$，$(V_1,V_2)$，…，$(V_{k-1},V_k)$ 称为一条道路（通路）。此道路的长度为
    $k$。也可以以 $(V_0,V_1,…,V_k)$ 表示道路，$V_0$ 为起点，$V_k$ 为终点。


    当 $V_0=V_k$ 时，该道路称为回路/circuit。'
