- pgno: 1839
  md: '# # 二元关系(Binary relation)


    注意，相关性，与指定的规则有关。如：


    +   - 扑克牌中的方块 k 与梅花 k，以同花关系来说是不相关的，而以同点关系来说是相关的。


    +   - 父子二人，以同辈关系来说是不相关的，以父子关系来说是相关的。


    以上例子都是二个对象相关的关系，称为二元关系，多个对象之间的关系，称多元关系，我们常常把多元关系也化成二元关系来研究。方块 k 与梅花 k，谁在前，谁在后都还是同点的，这种二元关系是无序的；而父子关系，不能交换父与子的次序，因此是有序的。'
