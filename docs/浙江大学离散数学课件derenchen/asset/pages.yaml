- pgno: 1630
  md: '# # 常用的推理定律


    +   (1) 附加律： \( A \Rightarrow A \lor B \)


    +   (2) 化简律： \( A \land B \Rightarrow A \)


    +   (3) 假言推理： \( (A \rightarrow B) \land A \Rightarrow B \)


    +   (4) 拒取式： \( (A \rightarrow B) \land \neg B \Rightarrow \neg A \)


    +   (5) 析取三段论： \( (A \lor B) \land \neg B \Rightarrow A \)


    +   (6) 假言三段论： \( (A \rightarrow B) \land (B \rightarrow C) \Rightarrow (A \rightarrow
    C) \)


    +   (7) 等价三段论： \( (A \leftrightarrow B) \land (B \leftrightarrow C) \Rightarrow
    (A \leftrightarrow C) \)


    +   (8) 构造性二难： \( (A \rightarrow B) \land (C \rightarrow D) \land (A \lor C) \Rightarrow
    (B \lor D) \)


    +   构造性二难(特殊形式)： \( (A \rightarrow B) \land (\neg A \rightarrow B) \land (A \lor
    \neg A) \Rightarrow B \)


    +   (9) 破坏性二难： \( (A \rightarrow B) \land (C \rightarrow D) \land (\neg B \lor
    \neg D) \Rightarrow (\neg A \lor \neg C) \)'
