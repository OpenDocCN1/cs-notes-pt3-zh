  md: '# # Relations关系


    [定义]反链：

    设 \((A, \leq_R)\) 为半序集，\(B \subseteq A\)，对 \(\forall a, b \in B (a \neq b)\)，\(a\)
    与 \(b\) 不可比较，则称 \(B\) 为 \((A, \leq_R)\) 中的反链/antichain。

    当 \(B\) 为有限集时，\(|B|\) 为反链的长度。


    例：\((A, R_2)\) 中

    \(B_1 = \{2, 3, 5, 7\} \quad |B_1| = 4\)

    \(B_2 = \{4, 6, 9\} \quad |B_2| = 3\)

    \(B_3 = \{8, 6, 9, 5, 7\} \quad |B_3| = 5\)

    ...

    都是反链。'
