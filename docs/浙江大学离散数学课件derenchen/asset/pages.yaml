  md: '# 例3.3 在自然推理系统P中构造下面推理的证明：


    (1) 前提：p∨q, q→r, p→s, ¬ s    结论：r∧(p∨q)


    证明：


    ① p→s    前提引入        ⑤ q        ③④析取三段式

    ② ¬ s    前提引入        ⑥ q→r    前提引入

    ③ ¬ p    ①②拒取式        ⑦ r        ⑤⑥假言推理

