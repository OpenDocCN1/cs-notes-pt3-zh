  md: '# [定义] 孤立顶点：


    若 a ∈ V，a 不与其他顶点相邻，称 a 为孤立顶点 isolated。


    # [定义] 自回路：


    若（a，a）∈ E，（{a，a}∈ E），称边（a，a）（{a，a}）是自回路/loop。'
