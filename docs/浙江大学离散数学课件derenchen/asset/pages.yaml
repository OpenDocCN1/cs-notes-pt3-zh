- pgno: 1941
  md: '# 例 2.8 求公式 (p→q)↔r的主析取范式和主合取范式。


    解: (1)主析取范式


    由例 2.7 知， (p→q)↔r ⇔(p∧q∧r)∨(¬p∧r)∨(q∧r)


    ⋮ (¬p∧r) ⇔¬p∧(¬q∨q)∧r


    ⇔ (¬p∧¬q∧r)∨(¬p∧q∧r)


    ⇔ m₁∨m₃


    (q∧r) ⇔ (¬p∨p)∧q∧r


    ⇔(¬p∧q∧r)∨(p∧q∧r)


    ⇔ m₃∨m₇


    (p∧q∧r) ⇔ m₄


    ⋮ (p→q)↔r ⇔m₁∨m₃∨m₄∨m₇'
  merge: -1
  img_proc: true
- pgno: 1942
  md: '# ## (2) 主合取范式


    由例2.7 知， (p→q)↔r ⇔(p∨r)∧(¬q∨r)∧(¬p∨q∨¬r)


    ∵ (p∨r) ⇔ p∨(q∧¬q)∨r


    ⇔ (p∨q∨r)∧(p∨¬q∨r)


    ⇔ M₀∧M₂


    (¬q∨r)⇔ (p∧¬p)∨¬q∨r


    ⇔ (p∧¬q∨r)∧(¬p∨¬q∨r)


    ⇔ M₂∧M₆


    (¬p∨q∨¬r) ⇔ M₅


    ∴ (p→q)↔r ⇔ M₀∧M₂ ∧M₅∧M₆'
