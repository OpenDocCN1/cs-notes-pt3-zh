- pgno: 1754
  md: '# § 7.6 等价关系与划分


    # 一. 等价关系


    定义7.15 设R为非空集合上的关系。如果R是自反的，对称的和传递的，则称 R 为A上的等价关系。对等价关系R，若<x,y>∈R，则称 x 等价于y，记为x
    ~ y.


    例7.16 设 A={1,2,...,8},定义 A 上的关系 R如下：


    R = {< x, y > |x, y ∈ A ∧ x ≡ y(mod3)}


    验证R是A上的等价关系。


    解：∵ ∀x∈A，有 x ≡ x(mod3) 故R是自反的。


    ∀x,y∈A，若 x ≡ y(mod3) 则 y ≡ x(mod3)故R是对称的。


    ∀x,y,z∈A，若 x ≡ y(mod3) y ≡ z(mod3)，则 x ≡ z(mod3)


    故 R是传递的。


    ∴ R是A上的一个等价关系。'
