- pgno: 1352
  md: '# # [定理1]（欧拉定理）：没有次为 0 的孤立顶点的无向图存在欧拉道路的充要条件是：(1) 图是连通的；(2) 图中奇次顶点个数是 0 个或2个。'
  merge: -1
  img_proc: true
- pgno: 1353
  md: '# # Graphs/图论


    # ## 证明：


    # ### 必要性：


    若存在欧拉道路，且没有 0 次顶点，则每个顶点都有边关联，而边又全在欧拉道路上，故所有顶点都连通。


    除了起点，终点外，欧拉道路每经过一个顶点，使顶点的次增加 2，故只有起点和终点才可能成为奇次顶点，而一个奇次顶点是不可能的，当无奇次顶点时，是欧拉回路。


    # ### 充分性：


    若（1），（2）成立，构造欧拉道路。'
  merge: -1
  img_proc: true
- pgno: 1354
  md: '若图G存在奇次顶点，任取一个作为起点，若不存在，则任取一个顶点作为起点。

    若此图有 n 条边，总次为 2 n。每进入或离开一个顶点，让此顶点的次减 1，由于除了两个（或没有）奇次顶点外，其余顶点次为偶数，只要进得去，一定出来，直至进入另一个奇次顶点（或起点）作为终点。这样构造的是简单道路，如果经过所有的边，即得到一条欧拉道路。


    不然，记走过的简单道路为 p1， p1 上顶点集 V1，边集 E1， G1=（V1， E1）是G的子图。'
  merge: -1
  img_proc: true
- pgno: 1355
  md: '若 \( G_2 = (V_2, E_2) \) 是 \( G_1 \) 的关于 \( G \) 的余图，\( E_2 = E - E_1 \)，但
    \( V_1 \cap V_2 \neq \phi \)，否则 \( G \) 不连通，设 \( C \in V_1 \cap V_2 \)，从 \( C
    \) 出发，用上面方法作 \( G_2 \) 的简单回路 \( p_2 \) 回到 \( C \)，这能做到。


    因为作好 \( p_1 \) 后，留下顶点的次都是偶次。若 \( p_1 \cup p_2 \) 经过所有边，则欧拉道路是 \( p_1 \) 走到 \(
    C \) 时，先把 \( p_2 \) 走完，最后走完 \( p_1 \) 的余下道路。


    若 \( p_1 \cup p_2 \) 仍未经过所有边，将 \( p_1 \cup p_2 \) 视为 \( p_1 \) 重复上述过程，由于 \( E
    \) 边有限，故存在欧拉道路。'
  merge: -1
  img_proc: true
