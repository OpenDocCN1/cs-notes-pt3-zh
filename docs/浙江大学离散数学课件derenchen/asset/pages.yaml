- pgno: 1900
  md: '# 定义1.4 设 p,q为两个命题。复合命题 “如果 p，则 q ” 称为p与q的蕴含式，记作p→q。称 p 是蕴含式的前件，q 是蕴含式的后件。符号→称为为蕴含联结词。当且仅当
    p 为真且q为假时， p→q为假。


    # 注：


    +   1. p→q 可理解为 “ q 是 p 的必要条件” 。


    +   2. 在自然语言中，“如果 p，则 q ” 中的前件 p 和后件 q 往往具有某种内在联系，而在数理逻辑中，p 与 q 可以无任何内在联系。


    +   3. 在自然语言中，“如果 p，则 q ”这种命题还有其它叙述方式，比如：“只要 p，就 q”，“因为 p，所以 q”，“ p 仅当 q ”，“只有
    q 才 p”，“除非 q 才 p”，“除非 q，否则非 p ” 等等，它们都可符号化为 p→q。


    +   4. 在数学或其它自然科学中，“如果 p，则 q ”往往表达的是前件 p 为真，后件 q 也为真的推理关系。但在数理逻辑中，作为一种规定，当 p 为假时，无论
    q 是真是假， p→q 均为真。'
