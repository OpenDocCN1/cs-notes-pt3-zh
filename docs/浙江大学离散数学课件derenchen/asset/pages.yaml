- pgno: 1892
  md: '# § 1.1 命题与联结词


    # 一、命题


    命题：能判断真假的陈述句。


    **命题的真值：**命题的判断结果。它只有两种可能：真或假，分别用1和0来表示。真值为1的命题称为真命题；真值为0的命题称为假命题。


    **判断一个句子是否为命题：**首先判断它是否陈述句，如果是陈述句，再判断它是否具有唯一的真值。'
  merge: -1
  img_proc: true
- pgno: 1893
  md: '# 例 1.1 判断下列句子是否为命题


    +   (1) 4是素数。


    +   (2) \(\sqrt{5}\) 是无理数。


    +   (3) \(x\) 大于 \(y\)。


    +   (4) 月球上有冰。


    +   (5) 2000年元旦是晴天。


    +   (6) \(\pi\) 大于 \(\sqrt{2}\) 吗？


    +   (7) 请不要吸烟！


