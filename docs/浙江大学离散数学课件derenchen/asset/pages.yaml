  md: '# Lemma 2


    If p is a prime and p | _a_<sub>1</sub>,_a_<sub>2</sub>...,_a_<sub>n</sub> where
    each _a<sub>i</sub>_ is an integer,then p | _a<sub>i</sub>_ for some i.


    _Proof_: suppose that the positive integer n can be written as the product of
    primes in two different ways ,say,n= _p_<sub>1</sub>_p_<sub>2</sub>..._p<sub>s</sub>_and
    n= _q_<sub>1</sub>_q_<sub>2</sub>..._q<sub>t</sub>_,each _p<sub>i</sub>_and _q<sub>j</sub>_
    are primes such that _p_<sub>1</sub>≤_p_<sub>2</sub>≤...≤_p<sub>s</sub>_ and _q_<sub>1</sub>≤_q_<sub>2</sub>≤...≤_q<sub>t</sub>_.
    When we remove all common primes from the two factorizations,we have _p_<sub>_i_1</sub>_p_<sub>_i_2</sub>..._p<sub>iu</sub>_
    = _q_<sub>_j_1</sub>_q_<sub>_j_2</sub>..._q<sub>jv</sub>_, Where no prime occurs
    on both sides of this equation and u and v are positive integers. By Lemma 2 it
    follows that _p<sub>il</sub>_divides _q<sub>jk</sub>_ for some k .Since no prime
    divides another prime,this is impossible.Consequently,there can be at most one
    factorization of n into primes in nondecreasing order.'
