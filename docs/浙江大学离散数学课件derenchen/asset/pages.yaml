  md: '# ## 二、各种性质的充分必要条件


    定理7.9 设R为A上的关系，则


    +   (1) R在A上自反当且仅当 \( I_A \subseteq R \)


    +   (2) R在A上反自反当且仅当 \( R \cap I_A = \Phi \)


    +   (3) R在A上对称当且仅当 \( R = R^{-1} \)


    +   (4) R在A上反对称当且仅当 \( R \cap R^{-1} \subseteq I_A \)


    +   (5) R在A上传递当且仅当 \( R \circ R \subseteq R \)


    证：(1)必要性：因 \( R \) 在 \( A \) 上自反，故 \( <x,y> \in I_A \Rightarrow x,y \in A \wedge
    x=y \Rightarrow <x,y> \in R \)，

    从而 \( I_A \subseteq R \)。

    充分性：因 \( I_A \subseteq R \)，故 \( x \in A \Rightarrow <x,x> \in I_A \Rightarrow
    <x,x> \in R \)，因此 \( R \) 在 \( A \) 上自反。'
