- pgno: 1696
  md: "# §6.1 集合的基本概念\n\n+   1. **集合**：将一些事物汇集到一起组成的整体，其中每个事物称为这个集合的元素。\n+   \n+ \
    \  注：如果 x 是集合 A 的元素，则记为 x∈A。\n\n+   2. **子集合**：若集合 B 中的元素都在集合 A 中，则称 B 是 A 的子集合（简称子集）。这时也称\
    \ B 被 A 包含，或 A 包含 B。记为 B⊆A。\n+   \n+   注：(1) 包含的符号化：B⊆A⇔∀x(x∈B→x∈A)。\n+   \n+\
    \   (2) 对任何集合 A，都有 A⊆A。\n\n+   3. **集合的相等**：如果 A⊆B 且 B⊆A，则称集合 A 与 B 相等，记为 A=B。\n\
    +   \n+   注：相等的符号化：A=B⇔A⊆B∧B⊆A。\n\n+   4. **真子集**：对符号 A,B，若 B⊆A 且 B≠A，则称 B 是 A\
    \ 的真子集，记为 B⊂A。\n+   \n+   注：真子集的符号化：B⊂A⇔(B⊆A)∧(B≠A)。"
  merge: -1
  img_proc: true
- pgno: 1697
  md: '# 5. 空集：不含任何元素的集合称为空集，记为∅


    +   注：

    +   1. 空集的符号化：∅ = {x | x≠x}。

    +   2. 空集是一切集合的子集。（证明见教材P₉₃）。

    +   3. 空集是唯一的。（证明见教材P₉₃）。


    # 6. n元集：含有n个元素的集合。


    # 7. 集合A的幂集：由A的所有子集作为元素形成的集合。记为P(A)，或2^A。


    注：幂集的符号化：P(A) = { B | B ⊆ A }。


    # 8. 全集：如果一个问题中所涉及的集合都是某一集合的子集，则称该集合为全集。全集一般记为E。


    注：不同问题有不同的全集，同一问题也可以取不同的全集。一般总是将全集取得尽可能小，以便描述和处理问题更加简便。'
