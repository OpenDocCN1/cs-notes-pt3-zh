    # # Deep concept in Cache


    # # Four Questions for Memory Hierarchy Designers


    **Caching** is a general concept used in processors, operating systems, file systems,
    and applications.


    There are **Four Questions** for Memory Hierarchy Designers


    +   • Q1: Where can a block be placed in the upper level? _(Block placement)_

    +     – Fully Associative, Set Associative, Direct Mapped


    +   • Q2: How is a block found if it is in the upper level? _(Block identification)_

    +     – Tag/Block


    +   • Q3: Which block should be replaced on a miss? _(Block replacement)_

    +     – Random, LRU, FIFO


    +   • Q4: What happens on a write? _(Write strategy)_

    +     – Write Back or Write Through (with Write Buffer)'
  - '[PAGE 385]


    # # Q1: Block Placement


    +   - Direct mapped

    +     - Block can only go in one place in the cache

    +       Usually address MOD Number of blocks in cache

    +   - Fully associative

    +     Block can go anywhere in cache.

    +   - Set associative

    +     - Block can go in one of a set of places in the cache.

    +     - A set is a group of blocks in the cache.

    +       Block address MOD Number of sets in the cache

    +     - If sets have n blocks, the cache is said to be n-way set associative.


    > > Note that direct mapped is the same as 1-way set associative, and fully associative
    is m-way set-associative (for a cache with m blocks).'
