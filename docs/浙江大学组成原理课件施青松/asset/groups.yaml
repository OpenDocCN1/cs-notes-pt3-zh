    \ be placed in the right half of the remainder register at first?\n\n![](img/273e5640629250d9497f523c984c99c0_230_0.png)\n\
    \n## Division V 2\n\n- Reduction of Divisor and ALU width by half\n- Shifting\
    \ of the remainder\n- Saving 1 iteration\n\n![](img/273e5640629250d9497f523c984c99c0_231_0.png)\n\
    \n## Division V 3\n\n- Remainder register keeps quotient No quotient register\
    \ required\n\n![](img/273e5640629250d9497f523c984c99c0_232_0.png)\n\n## Algorithm\
    \ V 3\n\n- Much the same than the last one\n- Except change of register usage\n\
    \n![](img/273e5640629250d9497f523c984c99c0_233_0.png)\n\n## Example 7/2 for Division\
    \ V3\n\nWell known numbers: 0000 0111/0010\n\n| iteration | step | Divisor | Remainder\
    \ |\n|---|---|---|---|\n| 0 | Initial Values | 0010 | 0000 0111 |\n| | Shift Rem\
    \ left 1 | 0010 | **0000 1110** |\n| 1 | 1.Rem=Rem-Div | 0010 | 0110 1110 |\n\
    | | 2b: Rem<0 → +Div, sll R, R₀=0 | 0010 | **0001 1100** |\n| 2 | 1.Rem=Rem-Div\
    \ | 0010 | 0111 0110 |\n| | 2b: Rem<0 → +Div, sll R, R₀=0 | 0010 | **0011 1000**\
    \ |\n| 3 | 1.Rem=Rem-Div | 0010 | 0001 1000 |\n| | 2a: Rem≥0 → sll R, R₀=1 | 0010\
    \ | **0011 0001** |\n| 4 | 1.Rem=Rem-Div | 0010 | 0001 0011 |\n| | 2a: Rem≥0 →\
    \ sll R, R₀=1 | 0010 | **0010 0111** |\n| | Shift left half of Rem right 1 | |\
    \ |\n\n![](img/273e5640629250d9497f523c984c99c0_234_0.png)\n\n## Signed division\n\
    \n- Keep the signs in mind for Dividend and Remainder\n  - (+ 7) ÷(+ 2) = + 3\
    \ Remainder = +1\n  - 7 = 3 × 2 + (+1) = 6 + 1\n  - (- 7 ) ÷(+ 2) = - 3 Remainder\
    \ = -1\n  - -7 = -3 × 2 + (-1) = - 6 - 1\n  - (+ 7 ) ÷(- 2) = - 3 Remainder =\
    \ +1\n  - (- 7 ) ÷(- 2) = + 3 Remainder = -1\n- One 64 bit register : Hi & Lo\n\
    \  - Hi: Remainder, Lo: Quotient\n- Instructions: div, divu\n- Divide by 0 → overflow\
    \ : Check by software\n\n## 3.6 Floating point numbers\n\n- **Reasoning**\n  -\
    \ Larger number range than integer range\n  - Fractions\n  - Numbers like e (2.71828)\
    \ and π (3.14159265....)\n- **Representation**\n  - Sign\n  - Significant\n  -\
    \ Exponent\n  - More bits for significand: more accuracy\n  - More bits for exponent:\
    \ increases the range\n\n"
