- raw:
  - '[PAGE 306]


    +   - CPU performance is dependent upon three characteristics:

    +     - clock cycle (or rate)

    +     - clock cycles per instruction

    +     - and instruction count.

    +   - It is difficult to change one parameter in complete isolation from others
    because the basic technologies involved in changing each characteristic are interdependent:

    +     - Clock cycle time—Hardware technology and organization

    +     - Clock cycle time—Hardware technology and organization

    +     - Instruction count—Instruction set architecture and compiler technology'
  - '[PAGE 307]


    # MIPS (*million instruction per second*)


    $$\mathrm{MIPS}=\frac{\mathrm{Instruction\ count}}{\mathrm{Execution\ time}\times
    10^6}=\frac{\mathrm{Clock\ rate}}{\mathrm{CPI}\times 10^6}$$


    $$\mathrm{Execution\ time}=\frac{\mathrm{Instruction\ count}}{\mathrm{MIPS}\times
    10^6}$$


    > ❌ **The bigger the MIPS, the faster the machine.**


    +   - **Three problems with MIPS:**

    +     - MIPS is dependent on the instruction set, making it difficult to compare
    MIPS of computers with different instruction sets.

    +     - MIPS varies between programs on the same computer.

    +     - Most importantly, MIPS can vary inversely to performance!'
  - '[PAGE 308]


    # Single Cycle Problems


    +   - what if we had a more complicated instruction like floating point?

    +     If so, the waste of time will be more serious.

    +   - wasteful of area. The reason is the following:

    +     - **Let’s see the instruction ‘mult’. This instruction needs to use the
    ALU repeatedly.**

    +     - **But, in the single cycle implementation, one ALU can be used only once
    in one clock cycle.**

    +     - **So, the instruction ‘mult’ will need many ALUs. The CPU will be very
    large.**'
  - '[PAGE 309]


    # # One Solution for Single Cycle Problems


    +   - One Solution:

    +     - Use a smaller cycle time

    +     - Let different instructions take different numbers of cycles

    +   - a Multicycle datapath:


    ![](img/273e5640629250d9497f523c984c99c0_309_0.png)'
  - '[PAGE 310]


    # Chapter Five


    # The processor : Datapath and control


    +   1. 5.1 Introduction

    +   2. 5.2 Logic Design Conventions (skip)

    +   3. 5.3 Building a datapath

    +   4. 5.4 A Simple Implementation Scheme

    +   5. 5.5 A Multicycle Implementation

    +   6. 5.5 Microprogramming

    +   7. 5.6 Exception'
  - '[PAGE 311]


    # Multicycle Approach


    +   - Break up the instructions into steps, each step takes a cycle

    +     - balance the amount of work to be done

    +     - restrict each cycle to use only one major functional unit

    +   - At the end of a cycle

    +     - store values for use in later cycles

    +     - introduce additional internal registers'
  - '[PAGE 312]


    # Analyse events: Five Execution Steps


    +   - **F:** Instruction Fetch

    +   - **ID:** Instruction Decode and Register Fetch

    +   - **EX (BC):** Execution, Memory Address Computation, or Branch Completion

    +   - **MEM (WB):** Memory Access or R-type instruction completion

    +   - **WB:** Write-back step


    ***INSTRUCTIONS TAKE FROM 3 - 5 CYCLES!***'
  - "[PAGE 313]\n\n# Step 1: Instruction Fetch\n\n+   - Use PC to get instruction\
    \ and put it in the Instruction Register.\n+     - `IR = Memory[PC];`\n+   - Increment\
    \ the PC by 4 and put the result back in the PC.\n+     - `PC = PC + 4;`\n+  \
    \ - Can be described simply using RTL \"Register-Transfer Language\"\n+   \n+\
    \     `IR = Memory[PC];`\n+   \n+     `PC = PC + 4;`\n+   - Can we figure out\
    \ the values of the control signals?\n+   - What is the advantage of updating\
    \ the PC now?"
  - '[PAGE 314]


    # Step 2: Instruction Decode and Register Fetch


    +   - Read registers rs and rt in case we need them

    +   - Compute the branch address in case the instruction is a branch

    +   - RTL:


    ```

    A = Reg[IR[25–21]];

    B = Reg[IR[20–16]];

    ALUOut = PC + (sign-extend(IR[15–01]) << 2);

    ```


    +   - We aren''t setting any control lines based on the instruction type

    +     (we are busy "decoding" it in our control logic)'
  - '[PAGE 315]


    # # Step 3 (instruction dependent)


    +   - ALU is performing one of three functions, based on instruction type

    +   - Memory Reference ( lw / sw ):

    +     ALUOut = A + sign-extend(IR[15-0]);

    +   - R-type:

    +     ALUOut = A op B;

    +   - Branch:

    +     if (A==B) PC = ALUOut;

    +   - jump:

    +     pc = pc31-28 + IR25-0 << 2'
