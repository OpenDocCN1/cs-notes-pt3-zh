  - '[PAGE 366]


    # Memories: Review


    +   - **DRAM:**

    +     - value is stored as a charge on capacitor (must be refreshed)

    +     - very small but slower than SRAM (factor of 5 to 10)

    +   - **Write**

    +     - Charge bitline HIGH or LOW and set wordline HIGH

    +   - **Read**

    +     - Bit line is precharged to a voltage **halfway between HIGH and LOW**,
    and then the word line is set HIGH.

    +     - Depending on the charge in the cap, the precharged bitline is pulled slightly
    higher or lower.

    +     - Sense Amp Detects change


    ![](img/273e5640629250d9497f523c984c99c0_366_0.png)'
