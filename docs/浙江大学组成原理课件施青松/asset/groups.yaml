    \n- 所以上天将要降落重大责任在这样的人身上，一定要首先使他的内心痛苦，使他的筋骨劳累，使他经受饥饿，以致肌肤消瘦，使他受贫困之苦，使他做的事颠倒错乱，总不如意。通过这些来使他的内心警觉，使他的性格坚定，增加他不具备的才能。\n\
    \n- 人经常犯错误，然后才能改正；内心困苦，思虑阻塞，然后才能有所作为；这一切表现在脸色上，抒发到言语中，然后才被人了解。在内（国内）如果没有坚持法度的世臣和辅佐君主的贤士，在外（国际）如果没有敌对国家和外患，此国便经常导致灭亡。\n\
    \n- 这就可以说明，忧愁患害可以使人生存，而安逸快乐使人萎靡死亡。\n\n![](img/273e5640629250d9497f523c984c99c0_6_0.png)\n\
    \n![](img/273e5640629250d9497f523c984c99c0_6_1.png)\n\n## 课堂教学的作用\n\n- 教学是双方互动的，不能一边倒。大学应素质教育为主，要鼓励学生在教师指导下的自学与动手。\n\
    \n- 课堂教学作用是：引出知识及相关知识点，引导学生猎取知识的方向，分析知识的难点，学会分析讨论解决问题的途径，节省课余时间，提高自学的效率。\n\n-\
    \ 学会‘止于至善’，知道‘物极必反’\n  - 大学之道，在明明德，在亲民，在止於至善。知止而後有定，定而後能静，静而後能安，安而後能虑，虑而後能得。物有本末，事有终始，知所先後，则近道矣。\n\
    \n## 课堂教学——实践的指导方针\n\n### 注重知识的系统性、连贯性，强化实践能力\n\n- 立足组成，三位一体，从程序员角度俯视组成结构\n\n\
    - 知其来路，又知其去路；知其然，知其所以然。\n\n### 培养自主学习能力\n\n- 引出组成及相关知识的自主获取和消化方法\n\n- 力求充分体现培养学生硬件知识的自学方法\n\
    \n- 引导猎取知识的方向，给出分析问题的途径\n\n- 节省课余时间，提高预习、复习、自学的效率。\n\n### 启发式、鼓励式课堂交互\n\n- 引出关键问题，开展提问和讨论\n\
    \n- 培养讨论，争论，辩论的学习气氛\n\n- 核心、重要知识点学生上台\n\n- *课程设计presentation*\n\n![](img/273e5640629250d9497f523c984c99c0_8_0.png)\n\
    \n## 实验教学——知识的感性化\n\n| 序号 | 实验项目 | 实验内容 |\n|---|---|---|\n| 1 | MIPS汇编模拟 | （光盘）用软件进行汇编反汇编MIPS模拟机实现实验\
    \ |\n| 2 | 硬件设计基础 | Spartan实验板与ISE软件进行硬件设计基础实验 |\n| 3 | 基本组件设计 | MUX、寄存器组组件设计\
    \ |\n| 4 | ALU与ALU控制器 | ALU设计实验，ALU控制器 |\n| 5 | R类型指令设计 | 单指令设计实现 |\n| 6 | CPU控制器\
    \ | CPU控制器设计 |\n| 7 | 单时钟数据通道 | 单时钟数据通道设计 |\n| 8 | 多时钟数据通道 | 多时钟数据通道设计 |\n| 9\
    \ | 微程序控制单元 | 微程序控制单元设计 |\n| 10 | 微程序控制处理器 | 微程序控制数据通道设计 |\n| 11 | 有限指令CPU设计 |\
    \ 9条指令的IP核实现 |\n| 12 | MIPS处理器系统模拟 | 编写MIPS模拟执行 |\n\n以实验课为准\n\nComputer Organization\n\
    \n1.10\n\n## 考核\n\n- 平时 15%\n  - 作业、阅读：光盘+一篇论文\n- 期中 15%（统一时间）\n  - 5.4 A Simple\
    \ Implementation Scheme\n- 期末 70%\n  - The all and the one\n- 英文试卷\n\n## Content\
    \ at Classroom\n\n- **Chapter One: Computer Abstractions and Technology**\n- **Chapter\
    \ Two: Instructions: Language of the Computer**\n  - 2.1 Introduction\n  - 2.2\
    \ Operations of the Computer Hardware\n  - 2.3 Operands of the Computer Hardware\n\
    \  - 2.4 Representing Instructions in the Computer\n  - 2.5 Logical Operations\n\
    \  - 2.6 Instructions for Making Decisions\n  - 2.7 Supporting Procedures in Computer\
    \ Hardware\n  - 2.8 Communicating with People\n  - 2.9 MIPS Addressing for 32-bit\
    \ Immediates and Addresses\n  - 2.10 Starting a Program\n  - 2.11 How Compilers\
    \ Optimize\n  - 2.12 How Compilers Work: An Introduction\n  - 2.13 A C Sort Example\
    \ to Put It All Together\n  - 2.14 Implementing an Object Oriented Language\n\
    \  - 2.15 Arrays versus Pointers\n\n## Content at Classroom-2\n\n- **Chapter Three:\
