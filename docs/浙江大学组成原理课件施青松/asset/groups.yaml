  - "[PAGE 130]\n\n# # 2.13 A C Sort Example to Put it All Together\n\n+   Three general\
    \ steps for translating C procedures\n+   \n+   - Allocate registers to program\
    \ variables\n+   - Produce code for the body of the procedures\n+   - Preserve\
    \ registers across the procedures invocation\n\n# ## Procedure swap\n\n+   - C\
    \ code\n\n```\n```c\nswap( int v[], int k )\n{\n    int temp;\n    temp = v[k];\n\
    \    v[k] = v[k + 1];\n    v[k + 1] = temp;\n}\n```\n```"
  - '[PAGE 131]


    # # Register allocation for swap


    v ---- $a0  k ---- $a1   temp ---- $t0


    # # swap is a leaf procedure, nothing to preserve


    # # MIPS code for the procedure swap


    # ## Procedure body


    swap: sll $t1, $a1, 2 # $t1 = k * 4


    add $t1, $a0, $t1 # $t1 = v + ( k * 4 )


    # $t1 has the address of v[ k ]


    lw $t0, 0($t1) # $t0 ← v[ k ]


    lw $t2, 4($t1) # $t2 ← v[ k + 1 ]


    sw $t2, 0($t1) # v[k+1]) → v[ k ]


    sw $t0, 4($t1) # v[k] → v[ k + 1 ]


    # ## Procedure return


    jr $ra # return to calling routine'
  - "[PAGE 132]\n\n# Procedure *sort*\n\n# C code\n\n```\nsort ( int v[ ], int n )\n\
    {\n        int i, j;\n        for ( i = 0; i < n; i += 1 ) {\n               \
    \ for ( j = i - 1; j >= 0 && v[j] > v[j+1]; j -= 1 )\n                       \
    \ swap ( v, j );\n        }\n}\n```\n\n![](img/273e5640629250d9497f523c984c99c0_132_0.png)\n\
    \n# Register allocation for *sort*\n\nv ---- $a0    n ---- $a1    i ---- $s0 \
    \   j ---- $s1\n\n# Passing parameters in *sort*\n\n# Preserving registers in\
    \ *sort*\n\n$ra, $s0, $s1, $s2, $s3"
  - '[PAGE 133]


    # # Code for the procedure sort


    # ## Saving registers


    ```

    sort: addi $sp, $sp, -20 # make room on stack for 5 registers

    sw $ra, 16($sp) # save $ra on stack

    sw $s3, 12($sp) # save $s3 on stack

    sw $s2, 8($sp) # save $s2 on stack

    sw $s1, 4($sp) # save $s1 on stack

    sw $s0, 0($sp) # save $s0 on stack

    ```


    # ## Procedure body{Outer loop {Inner loop} }


    # ## Restoring registers


    ```

    exit1: lw $s0, 0($sp) # restore $s0 from stack

    lw $s1, 4($sp) # restore $s1 from stack

    lw $s2, 8($sp) # restore $s2 from stack

    lw $s3, 12($sp) # restore $s3 from stack

    lw $ra, 16($sp) # restore $ra from stack

    addi $sp, $sp, 20 # restore stack pointer

    ```


    # ## Procedure return


    ```

    jr $ra # return to calling routine

    ```'
