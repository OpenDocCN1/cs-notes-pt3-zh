  - '[PAGE 412]


    # # The disadvantage of a direct-mapped cache


    ![](img/273e5640629250d9497f523c984c99c0_412_0.png)


    +   - If the CPU requires the following memory units sequentially: word 0,word
    8 and word 0. Word 0 and word 8 both are mapped to cache block 0, so the third
    access will be a miss.


    +   - But obviously, if one memory block can be placed in **any** cache block
    , the miss can be avoided. So, there is possibility that the miss rate can be
    improved.'
  - '[PAGE 413]


    # # The basics of a set-associative cache


    # # Decreasing miss ratio with associativity


    +   - A set-associative cache is divided into some sets. A set contains several
    blocks.


    +   - A memory block is mapped to a set in the cache through a mapping algorithm.

    +     – The memory block can be placed in any block in the corresponding set.


    +   - The mapping algorithm is: (set with direct-mapped)

    +   Set number (Index) =

    +   (Memory block number) modulo (Number of sets in the cache)


    +   - If a set has only one block, this set-associative cache is actually a direct-mapped
    cache.

    +   - If a set-associative cache has only one set, this set-associative cache
    is called a fully-associative cache.'
