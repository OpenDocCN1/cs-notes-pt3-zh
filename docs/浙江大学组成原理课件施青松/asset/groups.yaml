    \ replacement<br>Instruction TLB: 128 entries<br>Data TLB: 128 entries<br>TLB\
    \ misses handled in hardware |\n\n![](img/273e5640629250d9497f523c984c99c0_433_0.png)\n\
    \n| Characteristic | Intel Pentium Pro | PowerPC 604 |\n|---|---|---|\n| Cache\
    \ organization | Split instruction and data caches | Split instruction and data\
