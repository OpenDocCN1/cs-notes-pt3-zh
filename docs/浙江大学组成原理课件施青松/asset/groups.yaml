    \  - illusion of having more physical memory\n  - program relocation\n  - protection\n\
    \n## Pages: virtual memory blocks\n\n- **Page faults: the data is not in memory,\
    \ retrieve it from disk**\n  - huge miss penalty, thus pages should be fairly\
    \ large (e.g., 4KB)\n  - reducing page faults is important (LRU is worth the price)\n\
    \  - can handle the faults in software instead of hardware\n  - using write-through\
    \ is too expensive so we use write back\n\n![](img/273e5640629250d9497f523c984c99c0_426_0.png)\n\
    \n## Page Tables\n\n![](img/273e5640629250d9497f523c984c99c0_427_0.png)\n\n##\
    \ Page faults\n\n- When the OS creates a process, it usually creates the space\
    \ on disk for all the pages of a process.\n\n- When a page fault occurs, the OS\
    \ will be given control through exception mechanism.\n\n- The OS will find the\
    \ page in the disk by the page table.\n\n- Next, the OS will bring the requested\
    \ page into main memory. If all the pages in main memory are in use, the OS will\
    \ use LRU strategy to choose a page to replace\n\n![](img/273e5640629250d9497f523c984c99c0_429_0.png)\n\
    \n## What about writes?\n\n- Because disk accesses are too slow, virtual memory\
    \ systems cannot use write-through strategy.\n- Instead, they must use write-back\
    \ strategy. To do so, the machines need add a dirty bit to the entry of page table.\n\
    - The dirty bit is set when a page is first written. If the dirty bit of a page\
    \ is set, the page must be written back to disk before being replaced.\n\n## Making\
    \ Address Translation Fast----TLB\n\n- A cache for address translations: translation\
