    # Q2: Block Identification


    +   - Every block has an **address tag** that stores the main memory address of
    the data stored in the block.

    +   - When checking the cache, the processor will **compare** the requested **memory
    address** to the **cache tag** -- if the two are equal, then there is a cache
    hit and the data is present in the cache.

    +   - Often, each cache block also has a **valid bit** that tells if the contents
    of the cache block are valid'
