  md: "\n\n## 2.7 Supporting Procedures in Computer Hardware\n\n### Procedure/function\
    \ be used to structure programs\n\n- A stored subroutine that performs a specific\
    \ task based on the parameters with which it is provided\n- easier to understand,\
    \ allow code to be reused\n\n### Six step\n\n1. Place Parameters in a place where\
    \ the procedure can access them\n2. Transfer control to the procedure\n3. Acquire\
    \ the storage resources needed for the procedure\n4. Perform the desired task\n\
    5. Place the result value in a place where the calling program can access it\n\
    6. Return control to the point of origin\n\n## Registers for procedure calling\n\
    \n- $a0 ~ $a3: four argument registers to pass parameters\n- $v0 ~ $v1: two value\
    \ registers to return values\n- $ra: one return address register to return to\
    \ origin point\n\n## Instruction for procedures: jal ( jump-and-link )\n\nCaller\
    \ jal ProcedureAddress  \nCallee jr $ra\n\n## Using more registers\n\n- Stack:\
    \ ideal data structure for spilling registers\n  - Push, pop\n  - Stack pointer\
    \ ($sp)\n\n![](img/273e5640629250d9497f523c984c99c0_98_0.png)\n\n```\nadd    $t0,\
    \ $a0, $a1      # register $t0 contains  g + h\nadd    $t1, $a2, $a3      # register\
    \ $t1 contains  i + j\nsub    $s0, $t0, $t1      # f = $t0 - $t1, which is (g\
    \ + h) - (i + j)\n\nadd    $v0, $s0, $zero   # returns f   ( $v0 = $s0 + 0)\n\n\
    lw    $s0, 0($sp)         # restore register $s0 for caller\nlw    $t0, 4($sp)\
    \         # restore register $t0 for caller\nlw    $t1, 8($sp)         # restore\
    \ register $t1 for caller\nadd   $sp, $sp, 12        # adjust stack to delete\
    \ 3 items\njr    $ra                 # jump back to calling routine\n```\n\nBut\
    \ maybe some of the three are not used by the caller. So, this way might be inefficient.\n\
    \n## Two classes of registers\n\n- $t0 ~ $t9: 10 temporary registers, not preserved\n\
    - $s0 ~ $s7: 8 saved registers, must be preserved\n\n## The values of the stack\
    \ pointer and stack before, during and after procedure call in Example 2.15\n\n\
    ![](img/273e5640629250d9497f523c984c99c0_101_0.png)\n\n- Conflict over the use\
    \ of register both\n- Push all the registers to stack\n  - Caller: pushes $a0~$a3\
    \ or $t0~$t9\n  - Callee: pushes $ra (return address) and $s0~$s7\n\n## Nested\
    \ Procedures\n\nExample 2.16 Compiling a recursive procedure  \n( Assume: n ---\
    \ $a0 )\n\nC code for n!\n\n```\nint fact ( int n )\n{\n    if ( n < 1 ) return\
    \ ( 1 );\n    else return ( n * fact ( n - 1 ) );\n}\n```\n\nMIPS assembly code\n\
    \n```\nfact: sub $sp, $sp, 8 # adjust stack for 2 items\n    sw $ra, 4($sp) #\
    \ save the return address\n    sw $a0, 0($sp) # save the argument n\n    slt $t0,\
    \ $a0, 1 # test for n < 1\n    beq $t0, $zero, L1 # if n >= 1, go to L1(else)\n\
    \    add $v0, $zero, 1 # return if n < 1\n    add $sp, $sp, 8 # Recover $sp (Why\
    \ not recover $ra and $a0 ?)\n    jr $ra # return to after jal\n```\n\n```\nL1:\
    \  sub  $a0, $a0, 1        # n >= 1: argument gets ( n - 1 )\n     jal  fact \
    \                 # call fact with ( n - 1 )\n     lw   $a0, 0($sp)          \
    \ # return from jal: restore argument n\n     lw   $ra, 4($sp)           # restore\
    \ the return address\n     add  $sp, $sp, 8           # adjust stack pointer to\
    \ pop 2 items\n     mul  $v0, $a0, $v0         # return n*fact ( n - 1 )\n   \
    \  jr   $ra                    # return to the caller\n```\n\n- **Why $a0 is saved?\
    \ Why $ra is saved?**\n- **Preserved things across a procedure call**\n  - Saved\
    \ registers ($s0 ~ $s7), stack pointer register ($sp), return address register\
    \ ($ra), stack **above** the stack pointer\n- **Not preserved things across a\
    \ procedure call**\n  - Temporary registers ($t0 ~ $t9), argument registers ($a0\
    \ ~ $a3), return value registers ($v0 ~ $v1), stack **below** the stack pointer\n\
    \n## Stack allocation before, during and after procedure call\n\nHigh address\
    \  \n$fp  \n$sp  \nLow address  \n\na.\n\n$fp  \nSaved argument registers (if\
    \ any)  \nSaved return address  \nSaved saved registers (if any)  \nLocal arrays\
    \ and structures (if any)  \n$sp  \n\nb.\n\n$fp  \n$sp  \n\nc.\n\n"
