    MIPS assembler code in Example 2.12:\n\n```\n```asm\nLoop:    add   $t1, $s3,\
    \ $s3       # temp reg $t1 = 2 * i\n         add   $t1, $t1, $t1       # temp\
    \ reg $t1 = 4 * i\n         add   $t1, $t1, $s6       # $t1 = address of save[i]\n\
    \         lw    $t0, 0($t1)         # temp reg $t0 = save[i]\n         bne   $t0,\
    \ $s5, Exit      # go to Exit if save[i] != k\n\n         add   $s3, $s3, $s4\
