  - '[PAGE 397]


    # Write misses


    +   - **Write misses**

    +     - *If a miss occurs on a write (the block is not present), there are two
    options.*

    +       - *Write allocate*

    +         - **The block is loaded into the cache on a miss before anything else
    occurs.**

    +       - *Write around (no write allocate)*

    +         - **The block is only written to main memory**

    +         - **It is not stored in the cache.**

    +     - *In general, write-back caches use write-allocate, and write-through caches
    use write-around.*'
  - '[PAGE 398]


    # # Larger blocks exploit spatial locality


    +   - Taking advantage of spatial locality to lower miss rates with many word
    in the block:


    ![](img/273e5640629250d9497f523c984c99c0_398_0.png)'
  - '[PAGE 399]


    # # Designing the Memory system to Support Cache


    +   - Make reading multiple words easier by using banks of memory


