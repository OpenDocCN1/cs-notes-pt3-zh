    if $s2=1000, it will load word in element number 1200 to $t0\n\n## Combine the\
    \ datapath R & I type\n\n![](img/273e5640629250d9497f523c984c99c0_277_0.png)\n\
    \n## Combine the datapath R & I type\n\nPC\nRead address\nInstruction\nInstruction\
