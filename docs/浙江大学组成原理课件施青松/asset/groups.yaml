  mdcn: "\n\n## Instruction execution in MIPS\n\n- **Fetch:**\n  - Take instructions\
    \ from the instruction memory\n  - Modify PC to point the next instruction\n\n\
    - **Instruction decoding & Read Operand:**\n  - Will be translated into machine\
    \ control command\n  - Reading Register Operands, whether or not to use\n\n- **Executive\
    \ Control:**\n  - Control the implementation of the corresponding ALU operation\n\
    \n- **Memory access:**\n  - Write or Read data from memory\n  - Only LW/SW\n\n\
    - **Write results to register:**\n  - If it is R-type instructions, ALU results\
    \ are written to Rd\n  - If it is I-type instructions, Results are written to\
    \ Rt\n\n## Instruction fetching unit\n\n![](img/273e5640629250d9497f523c984c99c0_267_0.png)\n\
    \nPC\n\nRead address\n\nInstruction memory\n\nInstruction\n\nAdd\n\n4\n\nCPU\n\
    \n## More Implementation Details\n\n### Abstract / Simplified View:\n\n![](img/273e5640629250d9497f523c984c99c0_268_0.png)\n\
    \n## Register File--Built using D flip-flops\n\n### Read\n\nOutput from the register\n\
    \n5 bits\n\nRead register number 1\n\n5 bits\n\nRead register number 2\n\n5 bits\n\
    \nWrite register\n\n32 bits\n\nWrite data\n\nRegister file\n\nWrite\n\nRead data\
    \ 1\n\n32 bits\n\nRead data 2\n\n32 bits\n\nRead register number 1\n\nRead register\
    \ number 2\n\nReg. address\n\nReg. address\n\nData output\n\nRegister 0\n\nRegister\
    \ 1\n\n...\n\nRegister n − 1\n\nRegister n\n\nMux\n\nRead data 1\n\nMux\n\nRead\
    \ data 2\n\n![](img/273e5640629250d9497f523c984c99c0_269_0.png)\n\n## Register\
    \ File\n\n### Write\n\nWritten to the register\n\nWrite signals\n\nrd or rt\n\
    5 bits\n\nReg. address\n\n32 bits\n\n![](img/273e5640629250d9497f523c984c99c0_270_0.png)\n\
    \n## Register files\n\n- Foundation element of Computer（Part of Datapath）\n- Aggregation\
    \ of many Registers\n- Register address、Control signals: Read/Write\n\n![](img/273e5640629250d9497f523c984c99c0_271_0.png)\n\
    \n## Description: 32×32bits Register files\n\n```verilog\nModule regs(clk, rst,reg_Rd_addr_A,\
    \ reg_Rt_addr_B, reg_Wt_addr, wdata, we, rdata_A,\nrdata_B);\n\ninput clk, rst,\
    \ we;\ninput [4:0] reg_Rd_addr_A, reg_Rt_addr_B, reg_Wt_addr;\ninput [31:0] wdata;\n\
    output [31:0] rdata_A, rdata_B;\nreg [31:0] register [1:31];          // r1 -\
    \ r31\ninteger i;\n\nassign rdata_A = (reg_Rd_addr_A == 0)? 0 : register[reg_Rd_addr_A];\
    \ // read\nassign rdata_B = (reg_Rt_addr_B == 0)? 0 : register[reg_Rt_addr_B];\
    \ // read\nalways @(posedge clk or posedge rst)\nbegin\n    if (rst==1) begin\
    \                // reset\n        for (i=1; i<32; i=i+1)\n            register[i]\
    \ <= 0;\n    end\n    else begin\n        if ((reg_Wt_addr != 0) && (we == 1))\
    \ // write\n            register[reg_Wt_addr] <= wdata;\n    end\nend\nendmodule\n\
    ```\n\n## Path Built using Multiplexer\n\n- R-type instruction Datapath\n- I-type\
    \ instruction Datapath\n  - For ALU\n  - For memory\n  - For branch\n- J-type\
    \ instruction Datapath\n  - For Jump\n- First, Look at the data flow within instruction\
    \ execution\n\n## R type Instruction & Data stream\n\n| Bnegate | op   | function\
    \   |\n|---------|------|------------|\n| 0       | 00   | and        |\n| 0 \
