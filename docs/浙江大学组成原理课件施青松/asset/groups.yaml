    +   - We''ll look at an implementation of the MIPS

    +   - Simplified to contain only:

    +     - memory-reference instructions: `lw`, `sw`

    +     - arithmetic-logical instructions: `add`, `sub`, `and`, `or`, `slt`

    +     - control flow instructions: `beq`, `j`

