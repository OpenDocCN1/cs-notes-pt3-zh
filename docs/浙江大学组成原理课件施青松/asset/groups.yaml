    \n```\n```asm\nmove $s0, $zero    # $s0 ← $zero (i = 0)\nfor1tst:  slt  $t0, $s0,\
    \ $s3    # test if $s0 >= $s3 (i >= n)\n          beq  $t0, $zero, exit1 # go\
    \ to exit1 if $s0 >= $s3 (i >= n)\n```\n```\n\n........................................................................\n\
    \n( **body of first for loop is second _for_ loop** )\n\n........................................................................\n\
