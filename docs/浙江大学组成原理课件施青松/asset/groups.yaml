  md: "\n## Problems in Memory Designing\n\n- In fact\n\n| Memory technology | Typical\
    \ access time | Cost per GByte (2004) |\n|---|---|---|\n| SRAM | 0.5-5ns | $4000-$10,000\
    \ |\n| DRAM | 50-70ns | $100-$200 |\n| Magnetic disk | 5,000,000-20,000,000ns\
    \ |  |\n\n- Users want large and fast memories!\n\n## Locality — Two Important\
    \ Concepts\n\n1. Temporal locality (locality in time):\n   If an item is referenced,\
    \ it will tend to be referenced again soon.\n\n2. Spatial locality (locality in\
    \ space):\n   If an item is referenced, items whose addresses are close by will\
    \ tend to be referenced soon.\n\n- As we know, these two principles actually exist\
    \ in most programs.\n  - *Why does code have locality?*\n- Our initial focus:\
    \ two levels (upper, lower)\n  - `block`: minimum unit of data\n  - `hit`: data\
    \ requested is in the upper level\n  - `miss`: data requested is not in the upper\
    \ level\n\n## Solutions\n\n- Build a memory hierarchy\n\n![](img/273e5640629250d9497f523c984c99c0_370_0.png)\n\
    \n![](img/273e5640629250d9497f523c984c99c0_370_1.png)\n\n## Some Important Items\n\
    \n**Hit:** The CPU accesses the upper level and succeeds.\n\n**Miss:** The CPU\
    \ accesses the upper level and fails.\n\n**Hit time:**\n\nThe time to access the\
    \ upper level of the memory hierarchy, which includes the time needed to determine\
    \ whether the access is a hit or a miss.\n\n**Miss penalty:**\n\nThe time to replace\
    \ a block in the upper level with the corresponding block from the lower level,\
    \ plus the time to deliver this block to the processor.\n\n## Exploiting Memory\
    \ Hierarchy\n\n### The Method\n\n- **Hierarchies** are based on memories of different\
    \ speeds and sizes\n- The more closely the level is to the CPU, the faster it\
    \ is.\n- The more closely the level is to the CPU, the smaller it is.\n- The more\
    \ closely the level is to the CPU, the more expensive it is.\n\n![](img/273e5640629250d9497f523c984c99c0_372_0.png)\n\
    \n## There Has Been Exploited Memory Hierarchy\n\n### 1. The Basics of Cache:\
    \ SRAM and DRAM (Main Memory)\n\nThe solution is in speed.\n\n### 2. Virtual Memory:\
    \ DRAM and DISK\n\nThe solution is in size.\n\n## 7.2 The Basics of Cache\n\n\
    ### Simple Implementations\n\n- For each item of data at the lower level, there\
    \ is exactly one location in the cache where it might be.\n  - e.g., lots of items\
    \ at the lower level share locations in the upper level\n\n![](img/273e5640629250d9497f523c984c99c0_374_0.png)\n\
    \n- **Two issues:**\n  - How do we know if a data item is in the cache?\n  - If\
    \ it is, how do we find it?\n\n- **Our first example: \"direct mapped\"**\n  -\
    \ block size is one word of data\n\n## Accessing a Cache — How Do We Find It?\n\
    \n- Memory block address is larger than cache block address\n\n![](img/273e5640629250d9497f523c984c99c0_376_0.png)\n\
    \n![](img/273e5640629250d9497f523c984c99c0_376_1.png)\n\n## Access Sequence\n\n\
