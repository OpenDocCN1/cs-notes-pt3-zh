  - '[PAGE 481]


    # # Obtaining Access to the Bus


    +   - “Without any control, multiple device desiring to communicate could each
    try to assert the control and data lines for different transfers!”


    +   - So,a bus master is needed. Bus masters initiate and control all bus requests.


    +   - e.g., processor is always a bus master.


    +   - Example: the initial steps in a bus transaction with a single master (the
    processor).


    ![](img/273e5640629250d9497f523c984c99c0_481_0.png)


    > > First, the device generates a bus request to indicate to the processor that
    it wants to use the bus.'
  - '[PAGE 482]


    ![](img/273e5640629250d9497f523c984c99c0_482_0.png)


    The processor responds and generates appropriate bus control signals. For example,
    if the devices wants to perform output from memory, the processor asserts the
    read request lines to memory.


    ![](img/273e5640629250d9497f523c984c99c0_482_1.png)


    The processor also notifies the device that its bus request is being processed;
    as a result, the device knows it can use the bus and places the address for the
    request on the bus.'
  - '[PAGE 483]


    # ❖ **Bus Arbitration**


    +   - 🔗 Deciding which bus master gets to use the bus next

    +   - 🔗 In a bus arbitration scheme, a device wanting to use the bus signals a
    **bus request** and is later **granted** the bus.

    +   - 🔗 four bus arbitration schemes:

    +     - ❖ *daisy chain arbitration* (**not very fair**)(p670)

    +     - ❖ **centralized, parallel arbitration** (*requires an arbiter*), *e.g.,*
    **PCI**

    +     - ❖ **self selection**, *e.g.,* **NuBus used in Macintosh**

    +     - ❖ **collision detection**, *e.g.,* **Ethernet**


    # ❖ **Two factors in choosing which device to grant the bus:**


    +   - **bus priority**

    +   - **fairness**'
