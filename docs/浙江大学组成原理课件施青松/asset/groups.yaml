    \ & $a1<0) goto IndexOutofBounds\n\nsltu $t0, $a1, $t2 #Temp reg $t0=0 if k>=length\
    \ or k<0\n\nbeq $t0, $zero, IndexOutofBounds # if bad, goto Error\n\nlw $t2, 4($s6)\
    \ #temp reg $s2=length of array save\n\nslt $t0, $s3, $zero #temp reg $t0=1 if\
    \ i<0\n\nslt $t3, $s3, $t2 #temp reg $t3=0, if i>=length\n\nslti $t3, $t3, 1 #temp\
    \ reg $t3=1, if i>=length\n\nor $t3, $t3, $t0 # $t3=1, if i is out of bounds\n\
    \nbne $t3,$zero, IndexOutofBounds # if out of bounds, goto Error\n\n## Adition\
    \ & subtraction\n\n+   - Adding bit by bit, carries -> next digit\n\n![](img/273e5640629250d9497f523c984c99c0_175_0.png)\n\
    \n### Subtraction\n\n+   - Directly\n+   - Addition of 2's complement\n\n![](img/273e5640629250d9497f523c984c99c0_175_1.png)\n\
    \n![](img/273e5640629250d9497f523c984c99c0_175_2.png)\n\n## Overflow\n\n+   -\
    \ The sum of two numbers can exceed any representation\n\n1111 1111 255₁₀\n+1111\
    \ 1010 250₁₀\n1 1111 1001 249₁₀\n\n+   - The difference of two numbers can exceed\
    \ any representation\n\n+   - 2's complement:\n\nNumbers change\nsign and size\n\
    \n1000 0001 -127₁₀\n+1111 1110 -2₁₀\n0111 1111 +127₁₀\n\n## Overflow conditions\n\
    \n### General overflow conditions\n\n| Operation | Operand A | Operand B | Result\
    \ overflow |\n|---|---|---|---|\n| A+B | ≥0 | ≥0 | <0 _(01)_ |\n| A+B | <0 | <0\
    \ | ≥0 _(10)_ |\n| A-B | ≥0 | <0 | <0 _(01)_ |\n| A-B | <0 | ≥0 | ≥0 _(10)_ |\n\
    \n### Reaction on overflow\n\n+   - Ignore ?\n+   - Reaction of the OS\n+   -\
    \ Signalling to application (Ada, Fortran,...)\n\n![](img/273e5640629250d9497f523c984c99c0_177_0.png)\n\
    \n## Which instructions cause Overflow\n\n+   • Overflows in signed arithmetic\
    \ instructions cause exceptions:\n+   \n+     add\n+   \n+     add immediate (addi)\n\
    +   \n+     subtract (sub)\n\n+   • Overflows in unsigned arithmetic instructions\
    \ don't cause exceptions\n+   \n+     add unsigned (addu)\n+   \n+     add immediate\
    \ unsigned (addiu)\n+   \n+     Subtract unsigned (subu)\n\n### Handle with care!\n\
    \n## New MIPS instructions\n\n### Byte instructions\n\n+   - **lbu**: load byte\
    \ unsigned\n+     - Loads a byte into the lowest 8 bit of a register\n+     -\
    \ Fills the remaining bits with '0'\n+   - **Lb**: load byte (signed)\n+     -\
    \ Loads a byte into the lowest 8 bit of a register\n+     - Extends the highest\
    \ bit into the remaining 24 bits\n\n### Set instructions for conditional branches\n\
    \n+   - **sltu**: set on less than unsigned\n+   - **Sltiu**: set on less than\
    \ unsigned immediate\n\n"
