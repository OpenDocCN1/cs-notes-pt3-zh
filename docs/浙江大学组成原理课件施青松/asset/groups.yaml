  - '[PAGE 400]


    # # Performance basic memory organization


    ![](img/273e5640629250d9497f523c984c99c0_400_0.png)


    # Assume


    +   1. 1 clock cycles to send the address

    +   2. 15 memory bus clock cycles for each DRAM access initiated

    +   3. 1 bus clock cycles to send a word of data

    +   4. Block size is 4 words

    +   5. Every word is 4 bytes


    The time to transfer one word is 1+15+1=17


    **The miss penalty** *(The time to transfer one block is):*


    $1+4\times(1+15)=65\ \text{CLKs}$


    **Bandwidth:** $\frac{4\times4}{65}\approx\frac{1}{4}$


    Only one word is useful, and three other words may be useless. So, for caches
    using four-word blocks, this memory system is not viable.


    ![](img/273e5640629250d9497f523c984c99c0_400_1.png)'
  - '[PAGE 401]


    # Performance in Wider Main Memory


    +   - With a main memory width of 2 words(64bits)


    **The miss penalty:** 4words/Block


    \[1+2\times(15+1)=33\text{ CLK}s\]


    **Bandwidth:**


    \[\frac{4\times4}{33}=\frac{16}{33}\approx0.48\]


    ![](img/273e5640629250d9497f523c984c99c0_401_0.png)


    > only two times that needed

    > to transfer one word.


    +   - With a main memory width of 4 words(128bits)


    **The miss penalty:** 4words/Block


    \[1+1\times(15+1)=17\text{ CLK}s\]


    **Bandwidth:**


    \[\frac{4\times4}{17}=\frac{16}{17}\approx0.98\]


    > Equal to time to

    > transfer one word.'
