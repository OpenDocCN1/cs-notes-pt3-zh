  - '[PAGE 169]


    # sign extension **(I**[**ou**](https://example.com)** vs. lb)**


    +   - Expansion

    +     - e.g. 16 bit numbers to 32 bit numbers

    +   - Required for operations with registers(32 bits) and immediate operands (16
    bits)

    +   - Sign extension

    +     - Take the lower 16 bits as they are

    +     - Copy the highest bit to the remaining 16 bits

    +     - `0000 0000 0000 0010 → 2`

    +       `0000 0000 0000 0000 0000 0000 0000 0010`

    +     - `1111 1111 1111 1110 → -2`

    +       `1111 1111 1111 1111 1111 1111 1111 1110`'
