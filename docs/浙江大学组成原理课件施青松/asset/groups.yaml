  md: "\n## 1.2 Below Your Program: From a High-Level Language to the Language of\
    \ Hardware\n\nA simplified view of hardware and software as hierarchical layers\n\
    \n![](img/273e5640629250d9497f523c984c99c0_29_0.png)\n\nProblem: should we really\
    \ place compilers in the systems software level?\n\nHierarchical layers\n\n###\
    \ Some terms\n\n- **Machine language**\n  - Computers only understands electrical\
    \ signals\n  - Easiest signals: *on* and *off*\n  - Binary numbers express machine\
    \ instructions ex. **1000110010100000** means to add two numbers\n  - Very tedious\
    \ to write\n\n- **Assembly language**\n  - Symbolic notations ex. **add A, B**\n\
    \  - The assembler translates them into machine instruction\n  - Programmers have\
    \ to think like the machine\n\n- **High-level programming language**\n  - Notations\
    \ more closer to the natural language ex. A + B\n  - The compiler translates them\
    \ into assembly language statements\n  - Subroutine library — reusing programs\n\
    \  - Advantages over assembly language\n    - Programmers can think in a more\
    \ natural language\n    - Improved programming productivity\n    - Programs can\
    \ be independent of hardware\n\n### From a High-Level Language to the Language\
    \ of Hardware\n\n#### The process of compiling and assembling\n\nHigh-level language\
    \ program (in C)\n\n```\nswap(int v[], int k)\n{\nint temp;\ntemp = v[k];\nv[k]\
    \ = v[k+1];\nv[k+1] = temp;\n}\n```\n\n![](img/273e5640629250d9497f523c984c99c0_33_0.png)\n\
    \nAssembly language program (for MIPS)\n\n```\nswap:\nmuli $2, $5, 4\nadd $2,\
    \ $4, $2\nlw $15, 0($2)\nlw $16, 4($2)\nsw $16, 0($2)\nsw $15, 4($2)\njr $31\n\
    ```\n\n![](img/273e5640629250d9497f523c984c99c0_33_1.png)\n\nBinary machine language\
    \ program (for MIPS)\n\n```\n00000000101000010000000000011000\n00000000100011100000110000000001\n\
    10001100110001010000000000000000\n10001100111001010000000000000100\n10101100111100100000000000000000\n\
    10101100111100100000000000000100\n00000011111000000000000000001000\n```\n\n###\
    \ An example of the decomposability of computer systems\n\n- Software\n  - Applications\
    \ Software\n    - LaTeX\n    - ......\n  - System Software\n    - Compilers\n\
    \      - gcc\n      - ......\n    - Operating system\n      - Virtual memory\n\
    \        - ......\n      - File system\n        - ......\n      - I/O device drivers\n\
    \        - ......\n    - Assemblers\n      - as\n      - ......\n\n![](img/273e5640629250d9497f523c984c99c0_36_0.png)\n\
    ![](img/273e5640629250d9497f523c984c99c0_36_1.png)\n![](img/273e5640629250d9497f523c984c99c0_36_2.png)\n\
    ![](img/273e5640629250d9497f523c984c99c0_36_3.png)\n![](img/273e5640629250d9497f523c984c99c0_36_4.png)\n\
    ![](img/273e5640629250d9497f523c984c99c0_36_5.png)\n\n### Display\n\n#### CRT\
    \ (raster cathode ray tube) display\n\n- Scan an image one line at a time, 30\
    \ to 75 times / s\n- Pixels and the bit map, 512×340 to 1560×1280\n- The more\
    \ bits per pixel, the more colors to be displayed\n\n#### LCD (liquid crystal\
    \ display)\n\n- Thin and low-power\n- The LCD pixel is not the source of light\n\
    - Rod-shaped molecules in a liquid that form a twisting helix that bends light\
    \ entering the display\n\n- Hardware support for graphics — raster refresh buffer\
    \ (**frame buffer**) to store bit map\n- Goal of bit map — to faithfully represent\
    \ what is on the screen\n\n![](img/273e5640629250d9497f523c984c99c0_38_0.png)\n\
    ![](img/273e5640629250d9497f523c984c99c0_38_1.png)\n\n### Motherboard and the\
    \ hardware on it\n\n#### Motherboard\n\n- Thin, green, plastic, covered with dozens\
    \ of small rectangles which contain **integrated circuits (chips)**\n- Three pieces:\
    \ the piece connecting to the I/O devices, memory, and processor\n\n#### Memory\n\
    \n- Place to keep running programs and data needed\n- Each memory board contains\
    \ some integrated circuits\n- DRAM and cache\n\n#### Central Processor Unit —\
    \ CPU\n\n- Add numbers, tests numbers, signals I/O devices to activate, and so\
    \ on\n- CPU (central processor unit)\n"
