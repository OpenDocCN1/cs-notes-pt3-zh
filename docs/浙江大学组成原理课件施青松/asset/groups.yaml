    # The datapath there are ......


    | Name | Example | Comments |

    |---|---|---|

    | 32 register | `$s0-$s7, $t0-$t9, $zero, $a0-$a3, $v0-$v1` | **Fast locations
    for data.** In MIPS, data must be in registers to perform arithmetic. MIPS register
    `$zero` always equals 0. `$gp`(28) is the global pointer, `$sp`(29) is the stack
    pointer, `$fp`(30) is the frame pointer, and `$ra`(31) is the return address.
    |

    | 30 Word Addresses signals line | Memory[0], Memory[4], Memory[4294967292] |
    Accessed only by data transfer instructions. MIPS uses byte addresses, so sequential
    word addresses differ by 4. Memory holds data structures, arrays, and spilled
    registers, such as those saved on procedure calls. |


