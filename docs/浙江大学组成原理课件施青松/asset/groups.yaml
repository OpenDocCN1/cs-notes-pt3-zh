    1000 0000<sub>hex</sub>\n\nPC → 0040 0000<sub>hex</sub>\n\n![](img/273e5640629250d9497f523c984c99c0_128_0.png)\n\
    \n## Loading\n\n- Determine size of text and data segments\n- Create an address\
    \ space large enough\n- Copy instructions and data from executable file to memory\n\
    - Copy parameters (if any) to the main program onto the stack\n- Initialize registers\
    \ and set $sp to the first free location\n- Jump to a start-up routine\n\n## 2.13\
    \ A C Sort Example to Put it All Together\n\nThree general steps for translating\
    \ C procedures\n\n- Allocate registers to program variables\n- Produce code for\
    \ the body of the procedures\n- Preserve registers across the procedures invocation\n\
    \n### Procedure swap\n\n- C code\n\n```c\nswap( int v[], int k )\n{\n    int temp;\n\
    \    temp = v[k];\n    v[k] = v[k + 1];\n    v[k + 1] = temp;\n}\n```\n\n### Register\
    \ allocation for swap\n\nv ---- $a0  k ---- $a1   temp ---- $t0\n\nswap is a leaf\
    \ procedure, nothing to preserve\n\n### MIPS code for the procedure swap\n\n####\
    \ Procedure body\n\nswap: sll $t1, $a1, 2 # $t1 = k * 4\n\nadd $t1, $a0, $t1 #\
    \ $t1 = v + ( k * 4 )\n\n# $t1 has the address of v[ k ]\n\nlw $t0, 0($t1) # $t0\
    \ ← v[ k ]\n\nlw $t2, 4($t1) # $t2 ← v[ k + 1 ]\n\nsw $t2, 0($t1) # v[k+1]) →\
    \ v[ k ]\n\nsw $t0, 4($t1) # v[k] → v[ k + 1 ]\n\n#### Procedure return\n\njr\
    \ $ra # return to calling routine\n\n## Procedure *sort*\n\n### C code\n\n```c\n\
    sort ( int v[ ], int n )\n{\n        int i, j;\n        for ( i = 0; i < n; i\
    \ += 1 ) {\n                for ( j = i - 1; j >= 0 && v[j] > v[j+1]; j -= 1 )\n\
    \                        swap ( v, j );\n        }\n}\n```\n\n![](img/273e5640629250d9497f523c984c99c0_132_0.png)\n\
    \n### Register allocation for *sort*\n\nv ---- $a0    n ---- $a1    i ---- $s0\
    \    j ---- $s1\n\n### Passing parameters in *sort*\n\n### Preserving registers\
    \ in *sort*\n\n$ra, $s0, $s1, $s2, $s3\n\n### Code for the procedure sort\n\n\
    #### Saving registers\n\n```asm\nsort: addi $sp, $sp, -20 # make room on stack\
    \ for 5 registers\nsw $ra, 16($sp) # save $ra on stack\nsw $s3, 12($sp) # save\
    \ $s3 on stack\nsw $s2, 8($sp) # save $s2 on stack\nsw $s1, 4($sp) # save $s1\
    \ on stack\nsw $s0, 0($sp) # save $s0 on stack\n```\n\n#### Procedure body{Outer\
    \ loop {Inner loop} }\n\n#### Restoring registers\n\n```asm\nexit1: lw $s0, 0($sp)\
    \ # restore $s0 from stack\nlw $s1, 4($sp) # restore $s1 from stack\nlw $s2, 8($sp)\
    \ # restore $s2 from stack\nlw $s3, 12($sp) # restore $s3 from stack\nlw $ra,\
    \ 16($sp) # restore $ra from stack\naddi $sp, $sp, 20 # restore stack pointer\n\
    ```\n\n#### Procedure return\n\n```asm\njr $ra # return to calling routine\n```\n\
    \n### Code for Procedure body\n\n#### Outer loop—first for loop\n\n```c\nfor (\
    \ i = 0 ; i < n ; i += 1 ){\n```\n\n#### Move parameters\n\n```asm\nmove $s2,\
    \ $a0      # $s2 ← $a0 ($a0: base address)\nmove $s3, $a1      # $s3 ← $a1 ($a1:\
    \ array size)\n```\n\n#### Outer loop\n\n```asm\nmove $s0, $zero    # $s0 ← $zero\
    \ (i = 0)\nfor1tst:  slt  $t0, $s0, $s3    # test if $s0 >= $s3 (i >= n)\n   \
    \       beq  $t0, $zero, exit1 # go to exit1 if $s0 >= $s3 (i >= n)\n```\n\n........................................................................\n\
    \n( **body of first for loop is second _for_ loop** )\n\n........................................................................\n\
    \n```asm\nexit2:  addi  $s0, $s0, 1       # i = i + 1\n         j     for1tst\
    \           # jump to test of outer loop\nexit1:\n```\n\n"
