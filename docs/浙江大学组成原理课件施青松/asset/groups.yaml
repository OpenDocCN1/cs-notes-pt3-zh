    # asynchronous bus:


    If we look carefully at Figure 8.10 in the text, we realize that several of the
    steps can be overlapped with the memory access time.


    In particular, the memory receives the address at the end of step 1 and does not
    need to put the data on the bus until the beginning of step 5; steps 2, 3, and
    4 can overlap with the memory access time.


    This leads to the following timing:


    step1: 40ns


    step2,3,4: maximum(2×40ns+40ns,200ns)=200ns


    step5,6,7: 3×40ns=120ns


    Thus, the total time is 360ns, so


    the maximum bandwidth = 4bytes/360ns = 4MB/0.36seconds


    =11.1MB/second


    Accordingly, the synchronous bus is only about 20% faster. (Why?)


