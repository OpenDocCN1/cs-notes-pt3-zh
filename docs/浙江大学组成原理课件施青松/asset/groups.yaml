    # Types of buses:


    +   - **processor-memory** (short high speed, custom design)

    +   - **backplane** (high speed, often standardized, e.g., PCI)

    +   - **I/O** (lengthy, different devices, standardized, e.g., SCSI)


    ![](img/273e5640629250d9497f523c984c99c0_475_0.png)


    *Older PCs often use a single bus for processor-to-memory communication, as well
    as communication between I/O devices and memory.*'
