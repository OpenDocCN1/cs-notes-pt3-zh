  - '[PAGE 380]


    # # Bits in Cache


    # ## Example


    +   - How many total bits are required for a direct-mapped cache 16KB of data
    and 4-word blocks, assuming a 32-bit address?


    # ## Answer


    +   - 16KB=4KWord=2<sup>12</sup> words


    +   - One block=4 words = 2<sup>2</sup> words


    +   - Number of blocks (index bit) = 2<sup>12</sup> ÷ 2<sup>2</sup> = 2<sup>10</sup>
    blocks


    +   - Data bits of block =4×32=128 bits


    +   - Tag bits = address - index-block size =32-10-2-2 =18 bits


    +   - Valid bit = 1 bit


    +   - Total Cache size = 2<sup>10</sup> × (128+18+1)= 2<sup>10</sup>×147= 147
    Kbits = 18.4KB


    +   - It is about 1.15 times as many as needed just for the data'
  - '[PAGE 381]


    # # Mapping an Address to Multiword Cache Block


    # ## Example


    +   - Consider a cache with 64 blocks and a block size of 16 bytes.

    +   - What block number does byte address 1200 map to?


    # ### Answer


    (Block address) modulo (Number of cache blocks)


    Where the address of the block is


    \(\left\lfloor \frac{\text{Byte address}}{\text{Bytes per block}} \right\rfloor
    = \left\lfloor \frac{1200}{16} \right\rfloor = 75\)


    **75 modulo 64 = 11**


    # ## Notice!!!


    \(\left\lfloor \frac{\text{Byte address}}{\text{Bytes per block}} \right\rfloor
    \times \text{Byte per block} \longleftrightarrow \left\lfloor \frac{\text{Byte
    address}}{\text{Bytes per block}} \right\rfloor \times \text{Byte per block} +
    (\text{Byte per block} - 1)\)


    **Here:** 1200 ↔ 1215'
  - '[PAGE 382]


    # # Handling Cache reads hit and Misses


    +   - **Read hits**

    +     - this is what we want!

    +   - **Read misses—two kinds of misses**

    +     - instruction cache miss

    +     - data cache miss

    +   - **let’s see main steps taken on an instruction cache miss**

    +     - stall the CPU, fetch block from memory, deliver to cache, restart CPU
    read


    +   1. Send the original PC value (current PC-4) to the memory.

    +   2. Instruct main memory to perform a read and wait for the memory to complete
    its access.

    +   3. Write the cache entry, putting the data from memory in the data portion
    of the entry, writing the upper bits of the address (from the ALU) into the tag
    field,and turning the valid bit on.

    +   4. Restart the instruction execution at the first step, which will refetch
    the instruction again, this time finding it in the cache.'
  - '[PAGE 383]


    # Handling Cache Writes hit and Misses


    +   - **Write hits:** *Difference Strategy*

    +     - write-back: Cause Inconsistent

    +       - Wrote the data into only the data cache

    +       - Strategy --- write back data from the cache to memory later

    +         Fast

    +     - write-through: Ensuring Consistent

    +       - Write the data into both the memory the cache

    +       - Strategy --- writes always update both the cache and the memory

    +       - Slower----write buffer


    +   - **Write misses:**

    +     - read the entire block into the cache, then write the word'
