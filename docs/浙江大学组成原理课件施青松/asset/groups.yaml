    # Booth''s Algorithm rule


    # Analysis of two consecutive bits


    | Current | last | Explanation | Example |

    |---|---|---|---|

    | 1 | 0 | Beginning | 000011110000 |

    | 1 | 1 | middle of ''1'' | 000011110000 |

