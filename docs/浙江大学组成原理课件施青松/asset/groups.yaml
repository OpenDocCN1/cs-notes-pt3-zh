  - '[PAGE 421]


    # # For two-way associative


    Number of cache set = 2<sup>12</sup> ÷ 2= 2<sup>11</sup>

    Bits of index = 12-1=11 bits

    Bits of Tag = (28-11) ×2×2×2K=17×2×2K=68 Kbits


    # # For four-way associative


    Number of cache set = 2<sup>12</sup> ÷ 4= 2<sup>10</sup>

    Bits of index = 12-1=10 bits

    Bits of Tag = (28-10) ×4×1K=18×4×1K=72 Kbits


    # # For full associative


    Number of cache set = 2<sup>12</sup> ÷ 2<sup>12</sup> = 2<sup>0</sup>

    Bits of index = 12-12=0 bits

    Bits of Tag = (28-0) ×4K×1=128 Kbits


    |    | Direct | 2-way | 4-way | Fully |

    |---|---|---|---|---|

    | Index(bit) | 12 | 11 | 10 | 0 |

    | Tag(bit) | 16 | 17 | 18 | 28 |'
  - '[PAGE 422]


    # # Choosing which block to replace


    +   - In an associative cache, we must decide which block to replace when a miss
    happens and the corresponding set is full.


    +   - The most commonly used scheme is least recently used (LRU), which we used
    in the previous example. In an LRU scheme, the block replaced is the one that
    has been unused for the longest time.


    +   - For a two-way set associative cache, the LRU can be implemented easily.
    We could keep a single bit in each set. We set the bit whenever a specific block
    in the set is referenced, and reset the bit whenever another block is referenced.


    +   - As associativity increases, implementing LRU gets harder.'
  md: "\n## The disadvantage of a direct-mapped cache\n\n![](img/273e5640629250d9497f523c984c99c0_412_0.png)\n\
    \n- If the CPU requires the following memory units sequentially: word 0, word\
    \ 8 and word 0. Word 0 and word 8 both are mapped to cache block 0, so the third\
    \ access will be a miss.\n- But obviously, if one memory block can be placed in\
    \ **any** cache block, the miss can be avoided. So, there is a possibility that\
    \ the miss rate can be improved.\n\n## The basics of a set-associative cache\n\
    \n### Decreasing miss ratio with associativity\n\n- A set-associative cache is\
    \ divided into some sets. A set contains several blocks.\n- A memory block is\
    \ mapped to a set in the cache through a mapping algorithm.\n  - The memory block\
    \ can be placed in any block in the corresponding set.\n- The mapping algorithm\
    \ is: (same as direct-mapped)\n\n  Set number (Index) = (Memory block number)\
    \ modulo (Number of sets in the cache)\n\n- If a set has only one block, this\
    \ set-associative cache is actually a direct-mapped cache.\n- If a set-associative\
    \ cache has only one set, this set-associative cache is called a fully-associative\
    \ cache.\n\n## Miss rate versus set-associativity\n\n**Assume:** there are three\
    \ small caches, each consisting of **four** one-word blocks. One cache is direct-mapped,\
    \ the second is two-way set associative, and the third is fully associative.\n\
    \n**Question:** Given the following sequence of block addresses: 0, 8, 0, 6, 8,\
    \ find the number of misses for each cache organization.\n\n**Answer: for direct-mapped**\
    \ — **5 misses**\n\n| Memory block | Hit or miss | Set 0 Block 0 | Set 1 Block\
    \ 1 | Set 2 Block 2 | Set 3 Block 3 |\n|---|---|---|---|---|---|\n| 0 | Miss |\
    \ M[0] |  |  |  |\n| 8 | Miss | M[8] |  |  |  |\n| 0 | Miss | M[0] |  |  |  |\n\
    | 6 | Miss | M[0] |  | M[6] |  |\n| 8 | Miss | M[8] |  | M[6] |  |\n\n## How much\
    \ of a reduction in the miss rate is achieved by associativity?\n\n| Associativity\
    \ | Data miss rate |\n|---:|---:|\n| 1 | 10.3% |\n| 2 | 8.6% |\n| 4 | 8.3% |\n\
    | 8 | 8.1% |\n\nThe data cache miss rates for organization like the Intrinsity\
    \ FastMATH processor for SPEC2000 benchmarks with associativity varying from one-way\
    \ to eight-way.\n\n- Data cache organization is 64KB data cache and 16-word block.\n\
    \n## Locating a block in the set-associative cache\n\n![](img/273e5640629250d9497f523c984c99c0_419_0.png)\n\
    \n- The implementation of a four-way set-associative cache requires four comparators\
    \ and a 4-to-1 multiplexer.\n\n## Size of tags versus set associativity\n\n###\
    \ Assume\n\n- Cache size is 4K blocks.\n- Block size is 4 words.\n- Physical address\
    \ is 32 bits.\n\n### Question\n\nFind the total number of sets and total number\
    \ of tag bits for various associativities.\n\n### Answer\n\n- Offset size (byte)\
    \ = 16 = 2⁴\n- Number of memory blocks = 2³² ÷ 2⁴ = 2²⁸\n- Number of cache blocks\
    \ = 2¹²\n- 4 bits for offset address\n- 28 bits for memory block address\n- 12\
    \ bits for cache index\n\n### For direct-mapped\n\n- Bits of index = 12 bits\n\
    - Bits of tag = (28 - 12) × 4K = 16 × 4K = 64 Kbits\n\n### For two-way associative\n\
    \n- Number of cache sets = 2¹² ÷ 2 = 2¹¹\n- Bits of index = 12 - 1 = 11 bits\n\
    - Bits of tag = (28 - 11) × 2 × 2K = 17 × 2 × 2K = 68 Kbits\n\n### For four-way\
    \ associative\n\n- Number of cache sets = 2¹² ÷ 4 = 2¹⁰\n- Bits of index = 12\
    \ - 2 = 10 bits\n- Bits of tag = (28 - 10) × 4 × 1K = 18 × 4 × 1K = 72 Kbits\n\
    \n### For fully associative\n\n- Number of cache sets = 2¹² ÷ 2¹² = 2⁰\n- Bits\
    \ of index = 12 - 12 = 0 bits\n- Bits of tag = (28 - 0) × 4K × 1 = 28 × 4K = 112\
    \ Kbits\n\n|  | Direct | 2-way | 4-way | Fully |\n|---|---|---|---|---|\n| Index\
    \ (bit) | 12 | 11 | 10 | 0 |\n| Tag (bit) | 16 | 17 | 18 | 28 |\n\n## Choosing\
    \ which block to replace\n\n- In an associative cache, we must decide which block\
    \ to replace when a miss happens and the corresponding set is full.\n- The most\
    \ commonly used scheme is least recently used (LRU), which we used in the previous\
    \ example. In an LRU scheme, the block replaced is the one that has been unused\
    \ for the longest time.\n- For a two-way set associative cache, the LRU can be\
    \ implemented easily. We could keep a single bit in each set. We set the bit whenever\
    \ a specific block in the set is referenced, and reset the bit whenever another\
    \ block is referenced.\n- As associativity increases, implementing LRU gets harder.\n"
