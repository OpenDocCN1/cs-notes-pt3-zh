    \n目标1：以MIPS为主，本课程主要介绍的是RISC，补充CISC处理器(X86)后续微机原理课程主要介绍X86结构\n\n目标2：这部分包括了汇编，本课程介绍RISC汇编，CISC汇编在微机原理课程介绍中；内容还涉及到部分计算机体系结构课程，后面有详述\n\
    \n目标3：这部分涉及了数字电路知识，由逻辑与计算机设计基础课程介绍\n\n![](img/273e5640629250d9497f523c984c99c0_18_0.png)\n\
    \n## 大知识点分析\n\n### 大纲涉及七大知识点\n\n- 一、计算机系统概述\n- 二、数据的表示和运算\n- 三、存储器层次结构\n- 四、指令系统\n\
    - 五、中央处理器(CPU)\n- 六、总线\n- 七、输入输出(I/O)系统\n\n结论：在大知识点上，本课程覆盖大纲\n\n### 本课程的大纲：\n\n\
    - 一、概述\n- 二、MIPS汇编语言（属于RISC指令集）\n- 三、计算机代数（含数的表示、ALU设计）\n- 四、数据通道（含控制器）设计*\n-\
    \ 五、存储层次\n- 六、输入输出（含一小部分总线知识点）\n\n## Contents of Chapter 1\n\n- 1.1 Introduction\n\
    - 1.2 Computer Language and Software System\n- 1.3 Computer Hardware System\n\
    - 1.4 Integrated Circuits\n- 1.5 Real Stuff: Manufacturing Pentium Chips\n- 1.6\
    \ History of Computer Development\n\n## 1.1 Introduction\n\n- Computers have led\
    \ to a third revolution for civilization\n- The following applications used to\
    \ be “computer science fiction”\n- Automatic teller machines\n- Computers in automobiles\n\
    - Laptop computers\n- Human genome project\n- World Wide Web\n\n## Classes of\
    \ Computer Applications and Their Characteristics\n\n- Desktop computer\n- Servers\n\
    - Embedded computer\n\n## Brief introduction to this course\n\n- The internal\
    \ organization of computers and its influence on the performance of programs\n\
    - The hierarchy of software and hardware\n  - How are programs written in high-level\
    \ language translated into the language of the hardware, and how does it run?\n\
    \  - What is the interface between the software and the hardware, and how does\
    \ software instruct the hardware to perform?\n  - What determines the performance\
    \ of a program, and a programmer improve the performance?\n  - What techniques\
    \ can used to improve performance?\n\n## Brief introduction to Chapter 1\n\n-\
    \ Basic ideas and definitions\n- Major components of software and hardware\n-\
    \ Introduction to integrated circuits\n- Technology that fuels the computer revolution\n\
    \n## Where is the performance bottleneck?\n\n| Hardware or software component\
    \ | How this component affects performance | Where is this topic covered? |\n\
    |---|---|---|\n| Algorithm | Determines both the number of source-level statements\
    \ and the number of I/O operations executed | Other books! |\n| Programming language,compiler,\
    \ and architecture | Determines the number of machine instructions for each source-level\
    \ statements | Chapter 2 and 3 |\n| Processor and memory system | Determines how\
    \ fast instructions can be executed | Chapter 5,6 and 7 |\n| I/O system(hardware\
    \ and operating system) | Determines how fast I/O operations may be executed |\
    \ Chapter 8 |\n\n"
