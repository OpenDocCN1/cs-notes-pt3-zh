  - '[PAGE 406]


    # Measuring cache performance


    • We use CPU time to measure cache performance.


    CPU time = (CPU execution clock cycles + Memory-stall clock cycles) × Clock cycle
    time


    CPU time = I × CPI × Clock cycle time


    Memory-stall clock cycles = # of instructions × miss ratio × miss penalty

    = Read-stall cycles + Write-stall cycles


    For Read-stall


    Read-stall cycles = (Read / Program) × Read miss rate × Read miss penalty


    • For a write-through plus write buffer scheme:


    Write-stall cycles = {(Read / Program) × Write miss rate × Write miss penalty}
    + Write buffer stalls


    +   • If the write buffer stalls are small, we can safely ignore them.

    +   • If the cache block size is one word, the write miss penalty is 0.'
  - '[PAGE 407]


    # Combine the reads and writes


    +   - In most write-through cache organizations, the read and write miss penalties
    are the same

    +     - the time to fetch the block from memory.

    +   - If we neglect the write buffer stalls, we get the following equation:


    Memory-stall clock cycles = \frac{\text{Memory accesses}}{\text{Program}} \times
    \text{Miss rate} \times \text{Miss penalty}


    We can also write this as:


    Memory-stall clock cycles = \frac{\text{Instructions}}{\text{Program}} \times
    \frac{\text{Misses}}{\text{Instructions}} \times \text{Miss penalty}'
  - '[PAGE 408]


    # Calculating cache performance


    +   - **Assume:**

    +     - instruction cache miss rate: **2%**

    +     - data cache miss rate: **4%**

    +     - CPI without any memory stalls: **2**

    +     - miss penalty: **100 cycles**

    +     - The frequency of all loads and stores in gcc is 36%, as we see in Figure
    3.26, on page 288.


    +   - **Question: How faster a processor would run with a perfect cache?**


    +   - **Answer:**


    Instruction miss cycles = I × 2% × 100 = 2.00I


    Data miss cycles = I × 36% × 4% × 100 = 1.44I


    Total memory-stall cycles = 2.00I + 1.44I = 3.44 I


    CPI with stall = CPI with perfect cache + total memory-stalls


    = (2 + 3.44) I = 5.44I'
  - '[PAGE 409]


    # # How faster a processor for ideal


    \(\frac{\text{CPU time with stalls}}{\text{CPU time with perfect cache}} = \frac{\text{I}
    \times \text{CPI}_\text{stall} \times \text{Clock cycle}}{\text{I} \times \text{CPI}_\text{perfect}
    \times \text{Clock cycle}}\)


    \(= \frac{\text{CPI}_\text{stall}}{\text{CPI}_\text{perfect}} = \frac{5.44}{2}
    = 2.72\)


    +   - What happens if the processor is made faster?


    # ## Assume CPI reduces from 2 to 1


    CPI with stall = CPI with perfect cache + total memory-stalls


    \(=(1+3.44)\text{I} = 4.44\text{I}\)


    \(\frac{\text{CPU time with stalls}}{\text{CPU time with perfect cache}} = \frac{\text{CPI}_\text{stall}}{\text{CPI}_\text{perfect}}
    = \frac{4.44}{1} = 4.44\)


    Ratio time for Memory stalls


    \(\text{from } \frac{3.44}{5.44} = 63\% \quad \text{to } \frac{3.44}{4.44} = 77\%\)'
  - '[PAGE 410]


    # # Calculating cache performance with Increased Clock Rate


    +   - Suppose we increase the performance of the computer in the previous example
    by doubling its clock rate for same memory system.


    +   - Question : How much faster will the computer be with the faster clock to
    slow clock?


    +   - Answer


    Total miss cycles per instruction = (2% × 200) + 36% × (4% × 200)=6.88 CPI with
    cache misses = 2 + 6.88 =8.88


    \(\frac{\text{Performance with fast clock}}{\text{Performance with slow clock}}
    = \frac{\text{Execution time with slow clock}}{\text{Execution time with fast
    clock}}\)

    \(= \frac{\text{IC} \times \text{CPI}_\text{slow clock} \times \text{Clock cycle}}{\text{IC}
    \times \text{CPI}_\text{fast clock} \times \text{Clock cycle}/2} = \frac{5.44}{8.88
    \times 1/2} = 1.23\)


    This, the computer with the faster clock is about 1.2 times faster rather than
    2 time faster.'
