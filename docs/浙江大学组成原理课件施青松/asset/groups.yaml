  - '[PAGE 449]


    +   - To access data of disk:


    +     - Seek: position read/write head over the proper track


    +       - **minimum seek time**

    +       - **maximum seek time**

    +       - **average seek time (3 to 14 ms)**


    +     - Rotational latency: wait for desired sector


    +       - **average latency is the half-way round the disk.**


    Average rotational latency = \(\frac{0.5\ rotation}{5400\ RPM}\) = \(\frac{0.5\
    rotation}{5400\ RPM\left(\frac{60\ seconds}{minute}\right)}\) = **0.0056 seconds
    = 5.6 ms**


    Average rotational latency = \(\frac{0.5\ rotation}{15000\ RPM}\) = \(\frac{0.5\
    rotation}{15000\ RPM\left(\frac{60\ seconds}{minute}\right)}\) = **0.0020 seconds
    = 2.0 ms**'
  - '[PAGE 450]


    # Transfer: time to transfer a sector (1 KB/sector) function of rotation speed,
    Transfer rate today''s drives - 30 to 80 MBytes/second


    # Disk controller, which control the transfer between the disk and the memory


    # Disk Read Time


    Access Time = Seek time + Rotational Latency + Transfer time + Controller Time


    =6ms + 0.5 10,000PRM + 0.5KB 50MB/sec + 0.2ms


    =6ms + 3.0 + 0.01 + 0.2 =9.2ms


    # Assuming the measured seek time is 25% of the calculated average


    Access Time =25%×6ms + 3.0 ms+ 0.01ms + 0.2ms =4.7ms'
  - '[PAGE 451]


    # Dependability, Reliability, Availability


    Computer system dependability is the quality of delivered service such that reliance
    can justifiably be placed on this service. The service delivered by a system is
    its observed actual behavior as perceived by other system(s) interacting with
    this system’s users. Each module also has an ideal specified behavior, where a
    service specification is an agreed description of the expected behavior. A system
    failure occurs when the actual behavior deviates from the specified behavior.


    +   - **Service accomplishment**, where the service is delivered as specified

    +   - **Service interruption**, where the delivered service is different from
    the specified service'
