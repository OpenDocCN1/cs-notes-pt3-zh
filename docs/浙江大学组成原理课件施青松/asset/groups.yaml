  md: "\n## 2.15 Arrays versus Pointers\n\n### Two C procedures\n\n**Array version**\n\
    \n```c\nclear1(int array[], int size)\n{\n    int i;\n    for (i = 0; i < size;\
    \ i = i + 1)\n        array[i] = 0;\n}\n```\n\n**Pointer version**\n\n```c\nclear2(int\
    \ *array, int size)\n{\n    int *p;\n    for (p = &array[0]; p < &array[size];\
    \ p = p + 1)\n        *p = 0;\n}\n```\n\n### Assembly code for clear-1 procedure\
    \ (array version)\n\n```\nmove $t0,$zero # i = 0\nloop1: sll $t1,$t0,2 # $t1 =\
    \ i * 4\nadd $t2,$a0,$t1 # $t2 = address of array[i]\nsw $zero,0($t2) # array[i]\
    \ = 0\naddi $t0,$t0,1 # i = i + 1\nslt $t3,$t0,$a1 # test if i < size\nbne $t3,$zero,loop1\
    \ # if ( i < size ) go to loop1\njr $ra\n```\n\nThis code works as long as **_size_**\
    \ is greater than 0.  \n(In this case, the loop will be executed once even though\
    \ the value of the size parameter is invalid. Actually, size > 0 must be checked\
    \ at first)\n\n### Assembly code for clear-2 procedure (pointer version)\n\n```\n\
    move $t0, $a0 # p = the start address of the array[]\nsll $t1, $a1, 2 # $t1 =\
    \ size * 4\nadd $t2, $a0, $t1 # $t2 = &array[size] (address of array[size])\n\
    loop2: sw $zero, 0($t0) # Memory[p] = 0\naddi $t0, $t0, 4 # p = p + 4\nslt $t3,\
    \ $t0, $t2 # $t3 = (p < &array[size])\nbne $t3, $zero, loop2 # if ( p < &array[size]\
    \ ) go to loop2\njr $ra\n```\n\nThis code works as long as **size** is greater\
    \ than 0.\n\n### Compare the two versions\n\n- Array version has the “multiply”\
    \ and add inside loop\n- Pointer version reduces instructions/iteration from **6**\
    \ to **4**\n- For modern compilers, both ways are the same.\n\n## 2.16 Real Stuff:\
    \ IA-32 Instructions\n\n### The Intel IA-32\n\n- **1978** — Intel 8086\n  - 16-bit\
    \ architecture\n  - Is not considered a general-purpose register\n- **1980** —\
    \ Intel 8087 floating-point processor\n- **1982** — 80286 extended the 8086 architecture\
    \ by\n  - Increasing Address Space to 24 bits\n  - Manipulate the protection model\n\
    - **1985** — **80386** extended the 80286 architecture\n  - 32-bit architecture\
    \ with 32-bit registers\n  - 32-bit address space\n  - Add paging support in addition\
    \ to segmented addressing\n  - Nearly a general-purpose register machine **?**\n\
    \n### 1989~95 Higher performance\n\n- 80486 in 1989\n- Pentium in 1992\n- Pentium\
    \ Pro in 1995\n\n### 1997 Expand Pentium and Pentium Pro with MMX\n\n### 1999\
    \ Expand Pentium with SSE (SIMD) as Pentium III\n\n- 8 separate registers, double\
    \ their width to 128 bits\n- Add a single-precision floating-point data type\n\
    - 4 32-bit floating-point operations can be performed in parallel\n- Cache prefetch\
    \ instructions\n\n### 2001 Intel Pentium 4\n\n### 2003 A company other than Intel\
    \ enhanced the IA-32 architecture\n\n- AMD\n- Executing all IA-32 instructions\
    \ with 64-bit Address space & data\n\n### 2004 Intel capitulates and embraces\
    \ AMD64\n\n### 80x86 registers and data addressing modes\n\n- 80386 extended all\
    \ 16-bit registers but segment ones to 32 bits\n- GPR ( general-purpose register\
    \ )\n- Addressing modes\n- Register indirect\n- Based mode with 8- or 32-bit displacement\n\
    - Base plus scaled index\n- Base plus scaled index with 8- or 32-bit displacement\n\
    \n### 80x86 integer operations\n\n- Data movement instructions\n- Arithmetic and\
    \ logic instructions\n- Control flow\n- String instructions\n\n### IA-32 Register\
