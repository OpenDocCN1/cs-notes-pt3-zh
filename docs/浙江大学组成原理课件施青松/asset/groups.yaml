  - '[PAGE 425]


    # 7.4 Virtual Memory


    +   - Main memory can act as a cache for the secondary storage (disk)


    ![](img/273e5640629250d9497f523c984c99c0_425_0.png)


    +   - **Advantages:**

    +     - illusion of having more physical memory

    +     - program relocation

