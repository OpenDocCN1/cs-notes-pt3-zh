    \ responds and generates appropriate bus control signals. For example, if the\
    \ device wants to perform output from memory, the processor asserts the read request\
    \ lines to memory.\n\nThe processor also notifies the device that its bus request\
    \ is being processed; as a result, the device knows it can use the bus and places\
    \ the address for the request on the bus.\n\n## ❖ Bus Arbitration\n\n- \U0001F517\
    \ Deciding which bus master gets to use the bus next\n- \U0001F517 In a bus arbitration\
    \ scheme, a device wanting to use the bus signals a **bus request** and is later\
    \ **granted** the bus.\n- \U0001F517 four bus arbitration schemes:\n  - ❖ *daisy\
    \ chain arbitration* (**not very fair**)(p670)\n  - ❖ **centralized, parallel\
    \ arbitration** (*requires an arbiter*), *e.g.,* **PCI**\n  - ❖ **self selection**,\
    \ *e.g.,* **NuBus used in Macintosh**\n  - ❖ **collision detection**, *e.g.,*\
    \ **Ethernet**\n\n## ❖ Two factors in choosing which device to grant the bus:\n\
    \n- **bus priority**\n- **fairness**\n\n"
  mdcn: "\n\n## Types of buses:\n\n- **processor-memory** (short high speed, custom\
    \ design)\n- **backplane** (high speed, often standardized, e.g., PCI)\n- **I/O**\
    \ (lengthy, different devices, standardized, e.g., SCSI)\n\nOlder PCs often use\
    \ a single bus for processor-to-memory communication, as well as communication\
    \ between I/O devices and memory.\n\nA separate bus is used for processor-memory\
    \ traffic. The I/O bus uses a bus adapter to interface to the processor-memory\
    \ bus.\n\nA separate bus is used for processor-memory traffic. A small number\
    \ of backplane buses tap into the processor-memory bus.\n\n## Synchronous vs.\
    \ Asynchronous\n\n- Synchronous bus uses a clock and a synchronous protocol, fast\
    \ and small but every device must operate at same rate and clock skew requires\
    \ the bus to be short\n- Asynchronous bus doesn't use a clock and instead uses\
    \ handshaking\n\n## Handshaking protocol\n\n- Our example, which illustrates how\
    \ asynchronous buses use handshaking, assumes there are three control lines.\n\
    \  - ReadReq: Used to indicate a read request for memory. The address is put on\
    \ the data lines at the same time.\n  - DataRdy: Used to indicate that data word\
    \ is now ready on the data lines.\n  - Ack: Used to acknowledge the ReadReq or\
    \ the DataRdy signal of the other party.\n\n❖ **Example:** The asynchronous handshaking\
    \ consists of seven steps to read a word from memory and receive it in an I/O\
    \ device.\n\n1. When memory sees the ReadReq line, it reads the address from the\
    \ data bus, begins the memory read operation, then raises Ack to tell the device\
    \ that the ReadReq signal has been seen.\n2. I/O device sees the Ack line high\
    \ and releases the ReadReq data lines.\n3. Memory sees that ReadReq is low and\
    \ drops the Ack line.\n\n❖ **Example:** The asynchronous handshaking consists\
    \ of seven steps to read a word from memory and receive it in an I/O device.\n\
    \n4. When the memory has the data ready, it places the data on the data lines\
    \ and raises **DataRdy**.\n5. The I/O device sees **DataRdy**, reads the data\
    \ from the bus, and signals that it has the data by raising **ACK**.\n6. The memory\
    \ sees **Ack** signals, drops **DataRdy**, and releases the data lines.\n7. Finally,\
    \ the I/O device, seeing **DataRdy** low, drops the **ACK** line, which indicates\
    \ that the transmission is completed.\n\n## Obtaining Access to the Bus\n\n- “Without\
    \ any control, multiple devices desiring to communicate could each try to assert\
    \ the control and data lines for different transfers!”\n- So, a bus master is\
    \ needed. Bus masters initiate and control all bus requests.\n- e.g., processor\
    \ is always a bus master.\n- Example: the initial steps in a bus transaction with\
    \ a single master (the processor).\n\n> First, the device generates a bus request\
    \ to indicate to the processor that it wants to use the bus.\n\nThe processor\
    \ responds and generates appropriate bus control signals. For example, if the\
    \ device wants to perform output from memory, the processor asserts the read request\
    \ lines to memory.\n\nThe processor also notifies the device that its bus request\
    \ is being processed; as a result, the device knows it can use the bus and places\
    \ the address for the request on the bus.\n\n## ❖ Bus Arbitration\n\n- \U0001F517\
    \ Deciding which bus master gets to use the bus next\n- \U0001F517 In a bus arbitration\
    \ scheme, a device wanting to use the bus signals a **bus request** and is later\
    \ **granted** the bus.\n- \U0001F517 four bus arbitration schemes:\n  - ❖ *daisy\
    \ chain arbitration* (**not very fair**)(p670)\n  - ❖ **centralized, parallel\
    \ arbitration** (*requires an arbiter*), *e.g.,* **PCI**\n  - ❖ **self selection**,\
    \ *e.g.,* **NuBus used in Macintosh**\n  - ❖ **collision detection**, *e.g.,*\
    \ **Ethernet**\n\n## ❖ Two factors in choosing which device to grant the bus:\n\
    \n- **bus priority**\n- **fairness**\n\n"
