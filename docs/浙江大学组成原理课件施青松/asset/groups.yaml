  mdcn: "\n\n## Allocating Space for New Data on the Stack\n\n- Procedure frame/activation\
    \ record\n  - The segment of stack containing a procedure’s saved registers and\
    \ local variables\n- Frame pointer\n  - A value denoting the location of saved\
    \ register and local variables for a given procedure\n\n![](img/273e5640629250d9497f523c984c99c0_106_0.png)\n\
    \n## Allocating Space for New Data on the Heap\n\n![](img/273e5640629250d9497f523c984c99c0_107_0.png)\n\
    \n$sp → 7fff ffff\n\nhex\n\n$gp → 1000 8000\n\n1000 0000   hex\n\npc → 0040 0000\n\
    \nStack\n\nDynamic data\n\nStatic data\n\nText\n\nReserved\n\n## MIPS operands\n\
    \n| Name | Example | Comment |\n|---|---|---|\n| 32 registers | $s0-$s7,$t0-$t9.<br>$zero,$a0-$a3,$v0-$v1,\
    \ | Fast locations for data. In MIPS, data must be in registers to perform arithmetic.\
    \ MIPS register $zero always equals 0.<br>$gp(28) is the global pointer, $sp(29)\
    \ is the stack pointer,<br>$fp(30) is the frame pointer, and $ra(31) is the return\
    \ address. |\n| 2³⁰ memory words | Memory[0]<br>Memory[4]......<br>Memory[4294967292]\
    \ | Accessed only by data transfer instructions. MIPS uses byte addresses, so\
    \ sequential word addresses differ by 4. Memory holds data structures, arrays,\
    \ and spilled registers, such as those saved on procedure calls. |\n\n| Name |\
    \ Register no. | Usage | Preserved on call |\n|---|---|---|---|\n| $zero | 0 |\
    \ The constant value 0 | n.a. |\n| $v0-$v1 | 2-3 | Values for results and expression\
    \ evaluation | no |\n| $a0-$a3 | 4-7 | Arguments | no |\n| $t0-$t7 | 8-15 | Temporaries\
    \ | no |\n| $s0-$s7 | 16-23 | Saved | yes |\n| $t8-$t9 | 24-25 | More temporaries\
    \ | no |\n| $gp | 28 | Global pointer | yes |\n| $sp | 29 | Stack pointer | yes\
    \ |\n| $fp | 30 | Frame pointer | yes |\n| $ra | 31 | Return address | yes |\n\
    \n## MIPS assembly language\n\n| Category | Instruction | Example | Meaning |\
    \ Comments |\n|---|---|---|---|---|\n| Arithmetic | add | Add $s1,$s2,$s3 | $s1=$s2\
    \ + $s3 | Three register operands |\n| | subtract | Sub $s1,$s2,$s3 | $s1=$s2\
    \ - $s3 | Three register operands |\n| Data transfer | load word | lw $1, 100($s2)\
    \ | $s1=Memory[$s2+100] | Data from memory to register |\n| | store word | sw\
    \ $s1, 100($s2) | Memory[$s2+100]=$s1 | Data from register to memory |\n| logical\
    \ | and | and $s1,$s2,$s3 | $s1=$s2 & $s3 | three reg. operands;bit-by-bit AND\
