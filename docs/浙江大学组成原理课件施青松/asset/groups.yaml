  - "[PAGE 369]\n\n# Locality---- two important concepts\n\n1. temporal locality (locality\
    \ in time):\n   If an item is referenced, it will tend to be referenced again\
    \ soon.\n\n2. spatial locality (locality in space):\n   If an item is referenced,\
    \ items whose addresses are close by will tend to be referenced soon.\n\n+   -\
    \ As we know, these tow principles actually exists in most programs.\n+     -\
    \ *Why does code have locality?*\n\n+   - Our initial focus: two levels (upper,\
    \ lower)\n+     - `block`: minimum unit of data\n+     - `hit`: data requested\
    \ is in the upper level\n+     - `miss`: data requested is not in the upper level"
  - '[PAGE 370]


    # Solutions


    +   - Build a memory hierarchy


    ![](img/273e5640629250d9497f523c984c99c0_370_0.png)


    ![](img/273e5640629250d9497f523c984c99c0_370_1.png)'
  - '[PAGE 371]


    # Some important items


    **hit:** The CPU accesses the upper level and succeeds.


    **Miss:** The CPU accesses the upper level and fails.


    **Hit time:**


    The time to access the upper level of the memory hierarchy, which includes the
    time needed to determine whether the access is a hit or a miss.


    **miss penalty:**


    The time to replace a block in the upper level with the corresponding block from
    the lower level, plus the time to deliver this block to the processor.'
  - '[PAGE 372]


