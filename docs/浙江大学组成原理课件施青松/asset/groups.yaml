  - '[PAGE 5]


    # # 如何学好这门课？---耕耘与收获


    +   ### 孟子曰：

    +   舜发于畎亩之中，傅说举于版筑之间，胶鬻举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。


    +   故天将降大任于斯人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。


    +   人恒过，然后能改。困于心，衡于虑，而后作。征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒忘。


    +   然后知生于忧患，而死于安乐也。'
  - '[PAGE 6]


    # 成功的秘诀


    +   • 弄从田野之中被任用，传说从筑墙工作中被举用；胶属从赎卖盐的工作中被举用；管夷查从狱官手里释放后被举用为相；孙叔敖从海边被举用进了朝廷，百里奚从市井中被举用登上了相位。


    +   • 所以上天将要降落重大责任在这样的人身上，一定要道先使他的内心痛苦，使他的筋骨劳累，使他经受饥饿，以致肌肤消瘦，使他受贫困之苦，使他做的事颠倒错乱，总不如意。通过那些来使他的内心警觉，使他的性格坚定，增加他不具备的才能。


    +   • 人经常犯错误，然后才能改正；内心困苦，思虑阻塞，然后才能有所作为；这一切表现在脸色上，抒发到言语中，然后才被人了解。在内（国内）如果没有坚持法度的世臣和辅佐君主的贤士，在外（国际）如果没有敌对国家和外患，此国便经常导致灭亡。


    +   • 这就可以说明，忧愁患害可以使人生存，而安逸快乐使人萎靡死亡。


    ![](img/273e5640629250d9497f523c984c99c0_6_0.png)


    ![](img/273e5640629250d9497f523c984c99c0_6_1.png)'
  - '[PAGE 7]


    # # 课堂教学的作用


    +   - 教学是双方互动的，不能一边倒。大学应素质教育为主，要鼓励学生在教师指导下的自学与动手。


    +   - 课堂教学作用是：引出知识及相关知识点，引导学生猎取知识的方向，分析知识的难点，学会分析讨论解决问题的途径，节省课余时间，提高自学的效率。


    +   - 学会‘止于至善’，知道‘物极必反’

    +     - 大学之道，在明明德，在亲民，在止於至善。知止而後有定，定而後能静，静而後能安，安而後能虑，虑而後能得。物有本末，事有终始，知所先後，则近道矣。'
  - '[PAGE 8]


    # # 课堂教学---实践的指导方针


    # ## 注重知识的系统性、连贯性，强化实践能力


    +   - 立足组成，三位一体，从程序员角度俯视组成结构


    +   - 知其来路，又知其去路；知其然，知其所以然。


    # ## 培养自主学习能力


    +   - 引出组成及相关知识的自主获取和消化方法


    +   - 力求充分体现培养学生硬件知识的自学方法


    +   - 引导猎取知识的方向，给出分析问题的途径


    +   - 节省课余时间，提高预习、复习、自学的效率。


    # ## 启发式、鼓励式课堂交互


    +   - 引出关键问题，开展提问和讨论


    +   - 培养讨论，争论，辩论的学习气氛


    +   - 核心、重要知识点学生上台


    +   - *课程设计presentation


    ![](img/273e5640629250d9497f523c984c99c0_8_0.png)'
  - '[PAGE 9]


    # # 实验教学---知识的感性化


    | 序号 | 实验项目 | 实验内容 |

    |---|---|---|

    | 1 | MIPS汇编模拟 | （光盘）用软件进行汇编反汇编MIPS模拟机实现实验 |

    | 2 | 硬件设计基础 | Spartan实验板与ISE软件进行硬件设计基础实验 |

    | 3 | 基本组件设计 | MUX、寄存器组组件设计 |

    | 4 | ALU与ALU控制器 | ALU设计实验，ALU控制器 |

    | 5 | R类型指令设计 | 单指令设计实现 |

    | 6 | CPU控制器 | CPU控制器设计 |

    | 7 | 单时钟数据通道 | 单时钟数据通道设计 |

    | 8 | 多时钟数据通道 | 多时钟数据通道设计 |

    | 9 | 微程序控制单元 | 微程序控制单元设计 |

    | 10 | 微程序控制处理器 | 微程序控制数据通道设计 |

    | 11 | 有限指令CPU设计 | 9条指令的IP核实现 |

    | 12 | MIPS处理器系统模拟 | 编写MIPS模拟执行 |


    以实验课为准


    Computer Organization


    1.10'
  - '[PAGE 10]


    # # 考核


    +   - 平时 15%

    +     - 作业、阅读：光盘+一篇论文

    +   - 期中 15%(统一时间)

    +     - 5.4 A Simple Implementation Scheme

    +   - 期末 70%

    +     - The all and the one

    +   - 英文试卷'
