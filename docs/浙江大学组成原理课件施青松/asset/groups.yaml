  md: "\n## Computer Organization & Design\nThe Hardware/Software Interface\n\n施青松\
    \  \nhttp://10.214.26.103 Email: zjsqs@zju.edu.cn\n\n## Background\n\nIt is very\
    \ easy to design CPU **IP** Core!\n\nIt is not easy to design good CPU!\n\nTo\
    \ design successfully is far more\ndifficult than one!\n\n## 课程地位\n\n- 考研统考课程之一\n\
