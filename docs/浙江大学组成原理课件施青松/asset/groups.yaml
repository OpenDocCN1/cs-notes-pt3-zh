    \ programs on the same computer.\n  - Most importantly, MIPS can vary inversely\
    \ to performance!\n\n## Single Cycle Problems\n\n- what if we had a more complicated\
    \ instruction like floating point?\n  If so, the waste of time will be more serious.\n\
    - wasteful of area. The reason is the following:\n  - **Let’s see the instruction\
    \ ‘mult’. This instruction needs to use the ALU repeatedly.**\n  - **But, in the\
    \ single cycle implementation, one ALU can be used only once in one clock cycle.**\n\
    \  - **So, the instruction ‘mult’ will need many ALUs. The CPU will be very large.**\n\
    \n## One Solution for Single Cycle Problems\n\n- One Solution:\n  - Use a smaller\
    \ cycle time\n  - Let different instructions take different numbers of cycles\n\
    - a Multicycle datapath:\n\n![](img/273e5640629250d9497f523c984c99c0_309_0.png)\n\
    \n## Chapter Five\n\n## The processor : Datapath and control\n\n1. 5.1 Introduction\n\
    2. 5.2 Logic Design Conventions (skip)\n3. 5.3 Building a datapath\n4. 5.4 A Simple\
    \ Implementation Scheme\n5. 5.5 A Multicycle Implementation\n6. 5.5 Microprogramming\n\
    7. 5.6 Exception\n\n## Multicycle Approach\n\n- Break up the instructions into\
    \ steps, each step takes a cycle\n  - balance the amount of work to be done\n\
    \  - restrict each cycle to use only one major functional unit\n- At the end of\
    \ a cycle\n  - store values for use in later cycles\n  - introduce additional\
    \ internal registers\n\n## Analyse events: Five Execution Steps\n\n- **F:** Instruction\
    \ Fetch\n- **ID:** Instruction Decode and Register Fetch\n- **EX (BC):** Execution,\
    \ Memory Address Computation, or Branch Completion\n- **MEM (WB):** Memory Access\
    \ or R-type instruction completion\n- **WB:** Write-back step\n\n***INSTRUCTIONS\
    \ TAKE FROM 3 - 5 CYCLES!***\n\n## Step 1: Instruction Fetch\n\n- Use PC to get\
    \ instruction and put it in the Instruction Register.\n  - `IR = Memory[PC];`\n\
    - Increment the PC by 4 and put the result back in the PC.\n  - `PC = PC + 4;`\n\
    - Can be described simply using RTL \"Register-Transfer Language\"\n  - `IR =\
    \ Memory[PC];`\n  - `PC = PC + 4;`\n- Can we figure out the values of the control\
    \ signals?\n- What is the advantage of updating the PC now?\n\n## Step 2: Instruction\
    \ Decode and Register Fetch\n\n- Read registers rs and rt in case we need them\n\
    - Compute the branch address in case the instruction is a branch\n- RTL:\n\n```\n\
    A = Reg[IR[25–21]];\nB = Reg[IR[20–16]];\nALUOut = PC + (sign-extend(IR[15–01])\
    \ << 2);\n```\n\n- We aren't setting any control lines based on the instruction\
    \ type\n  (we are busy \"decoding\" it in our control logic)\n\n## Step 3 (instruction\
    \ dependent)\n\n- ALU is performing one of three functions, based on instruction\
    \ type\n- Memory Reference ( lw / sw ):\n  ALUOut = A + sign-extend(IR[15-0]);\n\
    - R-type:\n  ALUOut = A op B;\n- Branch:\n  if (A==B) PC = ALUOut;\n- jump:\n\
    \  pc = pc31-28 + IR25-0 << 2\n\n"
