    +   - The CPI with Two level of cache with 0.5% miss rate for main memory


    Total CPI = 1.0 + Primary stalls per instruction + Secondary stalls per instruction

    = 1 + 2% ×25 + 0.5% × 500

    = 1.0 + 0. 5 +2.5 = 4.0


    +   - The processor with secondary cache is faster by


    \(\frac{11.0}{4.0} = 2.8\)


