  - '[PAGE 429]


    # # Page faults


    +   - When the OS  creates a process, it usually creates the space on disk for
    all the pages of a process.


    +   - When a gage fault occurs, the OS will be given control through exception
    mechanism.


    +   - The OS will find the page in the disk by the page table.


    +   - Next, the OS will bring the requested page into main memory. If all the
    pages in main memory are in use, the OS will use LRU strategy to choose a page
    to replace


    ![](img/273e5640629250d9497f523c984c99c0_429_0.png)'
  - '[PAGE 430]


    # What about writes?


    +   - Because disk accesses are too slow, virtual memory systems can not use write-through
    strategy.

    +   - Instead, they must use write-back strategy. To do so, the machines need
    add a dirty bit to the entry of page table.

    +   - The dirty bit is set when a page is first written. If the dirty bit of a
    page is set, the page must be written back to disk before being replaced.'
