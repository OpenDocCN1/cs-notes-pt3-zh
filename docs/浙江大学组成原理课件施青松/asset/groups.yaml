    # # Truth Table for ALU decoder


    Describe it using a truth table (can turn into gates):


    | ALUOp1 | ALUOp0 | F5 | F4 | F3 | F2 | F1 | F0 | Operation 210 |

    |--------|--------|----|----|----|----|----|----|----------------|

    | 0      | 0      | X  | X  | X  | X  | X  | X  | 010            |

    | X      | 1      | X  | X  | X  | X  | X  | X  | 110            |

    | 1      | X      | X  | X  | 0  | 0  | 0  | 0  | 010            |

    | 1      | X      | X  | X  | 0  | 0  | 1  | 0  | 110            |

    | 1      | X      | X  | X  | 0  | 1  | 0  | 0  | 000            |

    | 1      | X      | X  | X  | 0  | 1  | 0  | 1  | 001            |

    | 1      | X      | X  | X  | 1  | 0  | 1  | 0  | 111            |


    Operation $_{2}$ = $ALU_{op0}$ + $ALU_{op1}(\overline{F_3}\overline{F_2}F_1\overline{F_0}
    + F_3\overline{F_2}F_1\overline{F_0})$


