  - '[PAGE 494]


    # # Performance analysis of Synchronous versus Asynchronous buses


    Assume: The synchronous bus has a clock cycle time of 50 ns, and each bus transmission
    takes 1 clock cycle . The asynchronous bus requires 40 ns per handshake. The data
    portion of both buses is 32 bits wide.


    Question: Find the bandwidth for each bus when reading one word from a 200-ns
    memory.


    Answer: synchronous bus: the bus cycles is 50 ns. The steps and times required
    for the synchronous bus are follows:


    +   1. Send the address to memory : 50ns 2. Read the memory : 200ns 3. Send the
    data to the device : 50ns


    Thus, the total time is 300 ns. So, the bandwidth = 4bytes/300ns = 4MB/0.3seconds
    = 13.3MB/second'
