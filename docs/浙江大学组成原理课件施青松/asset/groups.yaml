    ## Overhead of I/O Using DMA


    Suppose we have the same hard disk and processor we used in the former example.


    Assume that the initial setup of a DMA transfer takes 1000 clock cycles for the
    processor, and assume the handling of the interrupt at DMA completion requires
    500 clock cycles for the processor.


    The hard disk has a transfer rate of 4MB/sec and uses DMA. The average transfer
    from disk is 8 KB. Assume the disk is actively transferring 100% of the time.


    Please find what fraction of the processor time is consumed.


    ## Answer:


    Time for each 8KB transfer is:

    8KB/(4MB/second)=2×10⁻³seconds.

    It requires the following cycles per second:


    Fraction of processor time: 750/500 10/10 0.2%


    Unlike either polling or interrupt-driven I/O, DMA can be used to interface a
    hard disk without consuming all the processor cycles for a single I/O.


    ## 8.7 Designing an I/O system


    The general approaches to designing I/O system


    - Find the weakest link in the I/O system, which is the component in the I/O path
    that will constrain the design. Both the workload and configuration limits may
    dictate where the weakest link is located.

    - Configure this component to sustain the required bandwidth.

    - Determine the requirements for the rest of the system and configure them to
    support this bandwidth.


    ## I/O System Design


    ### Examples:


    Consider the following computer system:


    1. A CPU sustains 3 billion instructions per second and it takes average 100,000
    instructions in the operating system per I/O operation.

    2. A memory backplane bus is capable of sustaining a transfer rate of 1000 MB/sec.

    3. SCSI-Ultra320 controllers with a transfer rate of 320 MB/sec and accommodating
    up to 7 disks.

    4. Disk drives with a read/write bandwidth of 75 MB/sec and an average seek plus
    rotational latency of 6 ms.


    If the workload consists of 64-KB reads (assuming the data block is sequential
    on a track), and the user program need 200,000 instructions per I/O operation,
    please find the maximum sustainable I/O rate and the number of disks and SCSI
    controllers required.


    ## Answer:


    The two fixed component of the system are the memory bus and the CPU. Let’s first
    find the I/O rate that these two components can sustain and determine which of
    these is the bottleneck.


    Maximum I/O rate of CPU =


    Instruction execution rate


    Instruction per I/O


    =


    3 × 10^9


    (200+ 100)×10^3


    = 10000


    I/Os


    seconds


    Maximum I/O rate of bus =


    Bus bandwidth


    Bytes per I/O


    =


    1000×10^6


    64×10^3


    = 15625


    I/Os


    seconds


    The bus is the bottleneck, so we can now configure the rest of the system to perform
    at the level dictated by the bus, 15625 I/Os per second.


    Now, let’s determine how many disks we need to be able to Accommodate 15625 I/Os
    per second. To find the number of disks, we first find the time per I/O operation
    at the disk:


    Time per I/O at disk = Seek/rotational time + Transfer time


    = 6 ms + \(\frac{64KB}{75MB/sec}\) = 6.9 ms


    This means each disk can complete 1000ms/6.9ms, or 146 I/Os per second. To saturate
    the bus,the system need 10000/146≈69 disks.


    To compute the number of SCSI buses, we need to know the average transfer rate
    per disk, which is given by:


    $$\text{Transfer rate} = \frac{\text{Transfer size}}{\text{Transfer time}} = \frac{64KB}{6.9ms}
    \approx 9.56MB/sec$$


    Assuming the disk accesses are not clustered so that we can use all the bus bandwidth,
    we can place 7 disks per bus and controller. This means we will need 69/7, or
    10 SCSI buses and controllers.


    '
