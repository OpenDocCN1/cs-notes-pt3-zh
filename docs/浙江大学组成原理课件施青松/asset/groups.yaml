    \ and expression evaluation |\n| $a0-$a3 | 4-7 | Arguments |\n| $t0-$t7 | 8-15\
    \ | Temporaries |\n| $s0-$s7 | 16-23 | Saved |\n| $t8-$t9 | 24-25 | More temporaries\
    \ |\n| $gp | 28 | Global pointer |\n| $sp | 29 | Stack pointer |\n| $fp | 30 |\
    \ Frame pointer |\n| $ra | 31 | Return address |\n\n## 2.12 PowerPC and 80x86\
    \ Instructions\n\n### Instruction types for ALU & data transfer\n\n| Source/destination\
    \ operand type | Second source operand |\n| --- | --- |\n| Register | Register\
    \ |\n| Register | Immediate |\n| Register | Memory |\n| Memory | Register |\n\
    | Memory | Immediate |\n"
