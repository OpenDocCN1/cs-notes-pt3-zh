- pgno: 7
  md: '# # 课堂教学的作用


    +   - 教学是双方互动的，不能一边倒。大学应素质教育为主，要鼓励学生在教师指导下的自学与动手。


    +   - 课堂教学作用是：引出知识及相关知识点，引导学生猎取知识的方向，分析知识的难点，学会分析讨论解决问题的途径，节省课余时间，提高自学的效率。


    +   - 学会‘止于至善’，知道‘物极必反’

    +     - 大学之道，在明明德，在亲民，在止於至善。知止而後有定，定而後能静，静而後能安，安而後能虑，虑而後能得。物有本末，事有终始，知所先後，则近道矣。'
  merge: -1
  img_proc: true
