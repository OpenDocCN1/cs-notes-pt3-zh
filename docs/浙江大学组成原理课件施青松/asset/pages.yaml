- pgno: 387
  md: '# Q2: Block Identification


    +   - Every block has an **address tag** that stores the main memory address of
    the data stored in the block.

    +   - When checking the cache, the processor will **compare** the requested **memory
    address** to the **cache tag** -- if the two are equal, then there is a cache
    hit and the data is present in the cache.

    +   - Often, each cache block also has a **valid bit** that tells if the contents
    of the cache block are valid'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# # The Format of the Physical Address


    ![](img/273e5640629250d9497f523c984c99c0_388_0.png)


    +   - The Index field selects

    +     - The set, in case of a set-associative cache

    +     - The block, in case of a direct-mapped cache

    +     - Has as many bits as log2(#sets) for set-associative caches, or log2(#blocks)
    for direct-mapped caches


    +   - The Byte Offset field selects

    +     - The byte within the block

    +     - Has as many bits as log2(size of block)


    +   - The Tag is used to find the matching block within a set or in the cache

    +     - Has as many bits as Address_size - Index_size - Byte_Offset_Size'
  merge: -1
  img_proc: true
