- pgno: 323
  md: '# signals for datapath of Multicycle


    Defined 10+6 control (p. 324)


    | Signal name | Effect when deasserted (=0) | Effect when asserted (=1) |

    |---|---|---|

    | RegDst | Select register destination number from the rt(20:16) when WR. | Select
    register destination number from the rd(15:11) when WB. |

    | RegWrite | None | Register destination input is written with the value on the
    Write data input |

    | ALUSrcA | The first ALU operand is the PC | The first ALU operand come from
    the A register. |

    | MemRead | None | Memory contents at the location specified by the address input
    is put on the Memory data out. |

    | MemWrite | None | Memory contents at the location specified by the address input
    are replaced by value on the Write data input. |

    | MemtoReg | The value fed to register Write data input comes from the ALUOut
    | The value fed to the register Write data input comes from the MDA. |

    | IorD | The PC is used to supply the address to the memory unit. | ALUOut is
    used to supply the address to the memory unit. |

    | IRWrite | None | The output of memory is written into the IR. |

    | PCWrite | None | The is written; the source is controlled by PCSource. |

    | PCWriteCond | None | The PC is written if the zero output from the ALU is also
    active. |'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# # Control signals


    | Signal name | Value | Effect |

    |---|---|---|

    | **ALUOp** | **00** | The ALU performs an add operation. |

    |  | **01** | The ALU performs an subtract operation. |

    |  | **10** | The funct field of the instruction determines the ALUoperation |

    | **ALUSrcB** | **00** | The second input to the ALU comes from the B register.
    |

    |  | **01** | The second input to the ALU is the constant 4. |

    |  | **10** | The second input to the ALU is the sign-extended, lower 16 bits
    of the IR. |

    |  | **11** | The second input to the ALU is the sign-extended, lower 16 bits
    of the IR shift 2 bits. |

    | **PCSource** | **00** | Output of the ALU(PC+4) is sent to the PC for writing.
    |

    |  | **01** | The contents of ALUOut (the branch target address) are sent to the
    PC writing. |

    |  | **10** | The jump target address (IR[25:0]shifted left 2 bits and concatenated
    with PC+4[31:28]) is sent to the PC for writing. |'
  merge: -1
