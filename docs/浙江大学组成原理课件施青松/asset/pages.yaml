- pgno: 371
  md: '# Some important items


    **hit:** The CPU accesses the upper level and succeeds.


    **Miss:** The CPU accesses the upper level and fails.


    **Hit time:**


    The time to access the upper level of the memory hierarchy, which includes the
    time needed to determine whether the access is a hit or a miss.


    **miss penalty:**


    The time to replace a block in the upper level with the corresponding block from
    the lower level, plus the time to deliver this block to the processor.'
