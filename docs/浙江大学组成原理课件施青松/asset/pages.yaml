  md: '# Example 2.8 Translating assembly into machine instruction


    # C code:


    A[300] = h + A[300] ;

    ( Assume: h ---- $s2 base address of A ---- $t1 )


    # MIPS assembly code:


    lw $t0, 1200($t1) # temporary reg $t0 gets A[300]

    add $t0, $s2, $t0 # temporary reg $t0 gets h + A[300]

    sw $t0, 1200($t1) # stores h + A[300] back into A[300]


    # MIPS machine language code:


    # Decimal version


    |    | op   | rs   | rt   | rd   | address/

    shamt | funct   |

    |---|---|---|---|---|---|---|

    | lw | 35   | 9    | 8    |      | 1200    |    |

    | add | 0    | 18   | 8    | 8    | 0    | 32    |

    | sw | 43   | 9    | 8    |      | 1200    |    |'
