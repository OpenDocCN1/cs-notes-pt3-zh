- pgno: 222
  md: '# # Booth''s Algorithm


    Idea: If you have a sequence of ‘1’s


    +   - subtract at first ‘1’ in multiplier


    +   - shift for the sequence of ‘1’s


    +   - add where prior step had last ‘1’


    ![](img/273e5640629250d9497f523c984c99c0_222_0.png)


    Result:


    +   - Possibly less additions and more shifts


    +   - Faster, if shifts are faster than additions'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Example for Booth’s Algorithm


    +   ◆ Logic required identifying the run


    | straight | Booth |

    |---|---|

    | `0010 * 0110` | `0010 * 0110` |

    | `0000` shift | `0000` shift |

    | `0010` add | `0010` sub |

    | `0010` add | `0000` shift |

    | `0000` shift | `0010` add |

    | `00001100` | `00001100` |'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Booth''s Algorithm rule


    # Analysis of two consecutive bits


    | Current | last | Explanation | Example |

    |---|---|---|---|

    | 1 | 0 | Beginning | 000011110000 |

    | 1 | 1 | middle of ''1'' | 000011110000 |

    | 0 | 1 | End | 000011110000 |

    | 0 | 0 | Middle of ''0'' | 000011110000 |


    # Action


    +   10 subtract multiplicand from left

    +   11 no arithmetic operation

    +   01 add multiplicand to left half

    +   00 no arithmetic operation


    +   Bit₋₁ = ''0''


    +   Arithmetic shift right:

    +     - keeps the **leftmost bit constant**

    +     - no change of sign bit !'
  merge: -1
  img_proc: true
