- pgno: 420
  md: '# # Size of tags versus set associativity


    # ## Assume


    Cache size is 4K Block

    Block size is 4 words

    Physical address is 32bits


    # ## Question


    Find the total number of set and total number of tag bits for variety associativity


    # ## Answer


    Offset size (Byte) = 16= 2⁴

    Number of memory block = 2³²÷2⁴=2²⁸

    Number of cache block = 2¹²


    4 bits for address

    28 bits for Block address

    12 bits for Block address


    # ### For direct-mapped


    Bits of index = 12 bits

    bits of Tag = (28-12) ×4K=16×4K=64 Kbits'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# # For two-way associative


    Number of cache set = 2<sup>12</sup> ÷ 2= 2<sup>11</sup>

    Bits of index = 12-1=11 bits

    Bits of Tag = (28-11) ×2×2×2K=17×2×2K=68 Kbits


    # # For four-way associative


    Number of cache set = 2<sup>12</sup> ÷ 4= 2<sup>10</sup>

    Bits of index = 12-1=10 bits

    Bits of Tag = (28-10) ×4×1K=18×4×1K=72 Kbits


    # # For full associative


    Number of cache set = 2<sup>12</sup> ÷ 2<sup>12</sup> = 2<sup>0</sup>

    Bits of index = 12-12=0 bits

    Bits of Tag = (28-0) ×4K×1=128 Kbits


    |    | Direct | 2-way | 4-way | Fully |

    |---|---|---|---|---|

    | Index(bit) | 12 | 11 | 10 | 0 |

    | Tag(bit) | 16 | 17 | 18 | 28 |'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# # Choosing which block to replace


    +   - In an associative cache, we must decide which block to replace when a miss
    happens and the corresponding set is full.


    +   - The most commonly used scheme is least recently used (LRU), which we used
    in the previous example. In an LRU scheme, the block replaced is the one that
    has been unused for the longest time.


    +   - For a two-way set associative cache, the LRU can be implemented easily.
    We could keep a single bit in each set. We set the bit whenever a specific block
    in the set is referenced, and reset the bit whenever another block is referenced.


    +   - As associativity increases, implementing LRU gets harder.'
  merge: -1
  img_proc: true
