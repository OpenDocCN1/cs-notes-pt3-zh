    Two methods used to address the device


    +   - **memory-mapped I/O:**

    +     - portions of the memory address space are assigned to I/O devices, and
    lw and sw instructions can be used to access the I/O port.


    +   - **special I/O instructions**

    +     - exp: in al,port  out port,al


    +   - **command port, data port**

