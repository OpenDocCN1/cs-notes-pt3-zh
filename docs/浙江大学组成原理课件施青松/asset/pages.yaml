- pgno: 356
  md: '# # 5.6 Exception


    +   - Exception

    +     An Exception is a unexpected event from within processor.

    +   - We follow the MIPS convention, using the term exception to refer to any
    unexpected change in control flow.

    +   - Here we will discuss two types exceptions :

    +     - arithmetic overflow

    +     - undefined instruction'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# # How Exceptions Are Handled


    +   - When exceion happens, the processor must do something.

    +   - The predefined process routines are saved in memory when computer starts.

    +   - Problem: how can CPU goto relative routine when an exceion occurs.

    +   - CPU should know

    +     - the cause of exception

    +     - which instruction generate the exception'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# # How Exceptions Are Handled


    +   - Design

    +     - add a register: exception program counter(EPC)

    +       save the address of the offending instruction

    +     - add a status register: cause register( CauseReg)

    +       hold a field that indicates the reason for the exception.

    +       \(\text{bit0} = \begin{cases} \text{0 undefined instruction} \\ \text{1
    overflow} \end{cases}\)

    +     - Another method is to use vector interrupts


    | Exception type | vector address |

    |---|---|

    | undefine instr | c0 00 00 00<sub>H</sub> |

    | overflow | c0 00 00 20<sub>H</sub> |'
  merge: -1
