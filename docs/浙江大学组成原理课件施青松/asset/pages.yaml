- pgno: 488
  md: '# Communication with the Processor


    # I/O SYTEM DATA TRANSFER CONTROL MODE


    +   - **Polling:** The processor periodically checks status bit to see if it is
    time for the next I/O operation.

    +   - **Interrupt:** When an I/O device wants to notify processor that it has
    completed some operation or needs attentions, it causes processor to be interrupted.

    +   - **DMA (direct memory access):** the device controller transfer data directly
    to or from memory without involving processor.'
