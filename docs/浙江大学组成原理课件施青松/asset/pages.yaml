    \ if $s0 >= $s3 (i >= n)\n          beq  $t0, $zero, exit1 # go to exit1 if $s0\
    \ >= $s3 (i >= n)\n```\n```\n\n........................................................................\n\
    \n( **body of first for loop is second _for_ loop** )\n\n........................................................................\n\
    \n```\n```asm\nexit2:  addi  $s0, $s0, 1       # i = i + 1\n         j     for1tst\
    \           # jump to test of outer loop\nexit1:\n```\n```"
