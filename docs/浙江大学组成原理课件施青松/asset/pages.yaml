  md: "# # Nested Procedures\n\nExample 2.16 Compiling a recursive procedure\n( Assume:\
    \ n --- $a0 )\n\nC code for n!\n\n```\nint fact ( int n )\n{\n    if ( n < 1 )\
    \ return ( 1 );\n    else return ( n * fact ( n - 1 ) );\n}\n```\n\nMIPS assembly\
    \ code\n\n```\nfact: sub $sp, $sp, 8 # adjust stack for 2 items\n    sw $ra, 4($sp)\
    \ # save the return address\n    sw $a0, 0($sp) # save the argument n\n    slt\
    \ $t0, $a0, 1 # test for n < 1\n    beq $t0, $zero, L1 # if n >= 1, go to L1(else)\n\
    \    add $v0, $zero, 1 # return if n < 1\n    add $sp, $sp, 8 # Recover $sp (Why\
    \ not recover $ra and $a0 ?)\n    jr $ra # return to after jal\n```"
  merge: -1
  img_proc: true
- pgno: 103
  md: "```\nL1:  sub  $a0, $a0, 1        # n >= 1: argument gets ( n - 1 )\n     jal\
    \  fact                  # call fact with ( n - 1 )\n     lw   $a0, 0($sp)   \
    \        # return from jal: restore argument n\n     lw   $ra, 4($sp)        \
    \   # restore the return address\n     add  $sp, $sp, 8           # adjust stack\
    \ pointer to pop 2 items\n     mul  $v0, $a0, $v0         # return n*fact ( n\
    \ - 1 )\n     jr   $ra                    # return to the caller\n```\n\n+   -\
    \ **Why $a0 is saved? Why $ra is saved?**\n+   - **Preserved things across a procedure\
    \ call**\n+     - Saved registers( $s0 ~ $s7 ), stack pointer register( $sp ),\
    \ return address register( $ra ), stack **above** the stack pointer\n+   - **Not\
    \ preserved things across a procedure call**\n+     - Temporary registers( $t0\
    \ ~ $t9 ), argument registers( $a0 ~ $a3 ), return value registers( $v0 ~ $v1\
    \ ), stack **below** the stack pointer"
