- pgno: 477
  md: '# # Synchronous vs. Asynchronous


    +   - Synchronous bus use a clock and a synchronous protocol, fast and small but
    every device must operate at same rate and clock skew requires the bus to be short

    +   - Asynchronous bus don''t use a clock and instead use handshaking


    # # Handshaking protocol


    +   - Our example ,which illustrates how asynchronous buses use handshaking, assumes
    there are three control lines.

    +     - ReadReq: Used to indicate a read request for memory. The address is put
    on the data lines at the same time.

    +     - DataRdy: Used to indicate that data word is now ready on the data lines.

    +     - Ack: Used to acknowledge the ReadReq or the DataRdy signal of the other
    party.'
  merge: -1
  img_proc: true
- pgno: 478
  md: '❖ **Example:** The asynchronous handshaking consists of seven steps to read
    a word from memory and receive it in an I/O device.


    ![](img/273e5640629250d9497f523c984c99c0_478_0.png)


    +   1. When memory sees the ReadReq line, it reads the address from the data bus,
    begin the memory read operation,then raises Ack to tell the device that the ReadReq
    signal has been seen.

    +   2. I/O device sees the Ack line high and releases the ReadReq data lines.

    +   3. Memory sees that ReadReq is low and drops the Ack line.


    ReadReq


    1'
  merge: -1
  img_proc: true
- pgno: 479
  md: "❖ **Example:** The asynchronous handshaking consists of seven steps to read\
    \ a word from memory and receive it in an I/O device.\n\n![](img/273e5640629250d9497f523c984c99c0_479_0.png)\n\
    \n+   4. When the memory has the data ready, it places the data on the data lines\
    \ and raises **DataRdy**.\n+   \n+   5. The I/O device sees **DataRdy**, reads\
    \ the data from the bus, and signals that it has the data by raising **ACK**.\n\
    +   \n+   6. The memory sees **Ack** signals, drops **DataRdy**, and releases\
    \ the data lines.\n+   \n+   7. Finally, the I/O device, seeing **DataRdy** low,\
    \ drops the **ACK** line, which indicates that the transmission is completed."
  merge: -1
  img_proc: true
