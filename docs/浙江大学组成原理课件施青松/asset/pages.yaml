- pgno: 397
  md: '# Write misses


    +   - **Write misses**

    +     - *If a miss occurs on a write (the block is not present), there are two
    options.*

    +       - *Write allocate*

    +         - **The block is loaded into the cache on a miss before anything else
    occurs.**

    +       - *Write around (no write allocate)*

    +         - **The block is only written to main memory**

    +         - **It is not stored in the cache.**

    +     - *In general, write-back caches use write-allocate, and write-through caches
    use write-around.*'
