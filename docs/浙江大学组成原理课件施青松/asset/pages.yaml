- pgno: 30
  md: '# Some terms


    +   - **Machine language**

    +     - Computers only understands electrical signals

    +     - Easiest signals: *on* and *off*

    +     - Binary numbers express machine instructions ex. **1000110010100000** means
    to add two numbers

    +     - Very tedious to write


    +   - **Assembly language**

    +     - Symbolic notations ex. **add A, B**

    +     - The assembler translates them into machine instruction

    +     - Programmers have to think like the machine'
  merge: -1
  img_proc: true
- pgno: 31
  md: "# # High-level programming language\n\n+   - Notations more closer to the natural\
    \ language  \n+     ex. A + B\n\n+   - The compiler translates them into assembly\
    \ language statements\n\n+   - Subroutine library ---- reusing programs\n\n+ \
    \  - Advantages over assembly language\n\n+   - Programmers can think in a more\
    \ natural language\n\n+   - Improved programming productivity\n\n+   - Programs\
    \ can be independent of hardware"
