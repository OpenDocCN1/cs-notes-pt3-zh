- pgno: 33
  md: '# # From a High-Level Language to the Language of Hardware


    # ## The process of compiling and assembling


    High-level language program (in C)


    ```

    ```

    swap(int v[], int k)

    {

    int temp;

    temp = v[k];

    v[k] = v[k+1];

    v[k+1] = temp;

    }

    ```

    ```


    ![](img/273e5640629250d9497f523c984c99c0_33_0.png)


    Assembly language program (for MIPS)


    ```

    ```

    swap:

    muli $2, $5, 4

    add $2, $4, $2

    lw $15, 0($2)

    lw $16, 4($2)

    sw $16, 0($2)

    sw $15, 4($2)

    jr $31

    ```

    ```


    ![](img/273e5640629250d9497f523c984c99c0_33_1.png)


    Binary machine language program (for MIPS)


    ```

    ```

    00000000101000010000000000011000

    00000000100011100000110000000001

    10001100110001010000000000000000

    10001100111001010000000000000100

    10101100111100100000000000000000

    10101100111100100000000000000100

    00000011111000000000000000001000

    ```

    ```'
  merge: -1
  img_proc: true
