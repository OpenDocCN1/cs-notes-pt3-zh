- pgno: 272
  md: "# # Description: 32×32bits Register files\n\n```\n```verilog\nModule regs(clk,\
    \ rst,reg_Rd_addr_A, reg_Rt_addr_B, reg_Wt_addr, wdata, we, rdata_A,\nrdata_B);\n\
    \ninput clk, rst, we;\ninput [4:0] reg_Rd_addr_A, reg_Rt_addr_B, reg_Wt_addr;\n\
    input [31:0] wdata;\noutput [31:0] rdata_A, rdata_B;\nreg [31:0] register [1:31];\
    \          // r1 - r31\ninteger i;\n\nassign rdata_A = (reg_Rd_addr_A == 0)? 0\
    \ : register[reg_Rd_addr_A]; // read\nassign rdata_B = (reg_Rt_addr_B == 0)? 0\
    \ : register[reg_Rt_addr_B]; // read\nalways @(posedge clk or posedge rst)\nbegin\n\
    \    if (rst==1) begin                // reset\n        for (i=1; i<32; i=i+1)\n\
    \            register[i] <= 0;\n    end\n    else begin\n        if ((reg_Wt_addr\
    \ != 0) && (we == 1)) // write\n            register[reg_Wt_addr] <= wdata;\n\
    \    end\nend\nendmodule\n```\n```"
