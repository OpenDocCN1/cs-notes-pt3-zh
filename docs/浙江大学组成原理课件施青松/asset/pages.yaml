    | 1 | 1.c:10→Prod=Prod-Mcand

    2: shift right Product | 0010

    0010 | 1110 1101 0

    1111 0110 1 |

    | 2 | 1.b:01→Prod=Prod+Mcand

    2: shift right Product | 0010

    0010 | 0001 0110 1

    0000 1011 0 |

    | 3 | 1.c:10→Prod=Prod-Mcand

    2: shift right Product | 0010

    0010 | 1110 1011 0

    1111 0101 1 |

    | 4 | 1.d: 11 → no operation

    2: shift right Product | 0010

    0010 | 1111 0101 1

    **1111 1010** 1 |'
  merge: -1
