- pgno: 75
  md: '# # 2.4 Representing Instructions in the Computer ---Instruction Format


    +   - All information in computer consists of binary bits

    +   - Mapping registers into numbers

    +     - Map registers $s0 to $s7 onto registers 16 to 23

    +     - Map registers $t0 to $t7 onto registers 8 to 15

    +   - Example 2.7 Translating assembly into machine instruction

    +     - MIPS code

    +       ```

    +       add $t0, $s1, $s2

    +       ```

    +     - Decimal version of machine code

    +       ```

    +       | 0 | 17 | 18 | 8 | 0 | 32 |

    +       ```

    +     - Binary version of machine code

    +       ```

    +       | 000000 | 10001 | 10010 | 01000 | 00000 | 100000 |

    +       6 bits 5 bits 5 bits 5 bits 5 bits 6 bits

    +       ```'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# # MIPS fields (format)


    # ## R-type or R-format


    | op | rs | rt | rd | shamt | funct |

    |---|---|---|---|---|---|

    | 6 bits | 5 bits | 5 bits | 5 bits | 5 bits | 6 bits |


    # ## I-type or I-format


    | op | rs | rt | address |

    |---|---|---|---|

    | 6 bits | 5 bits | 5 bits | 16 bits |


    # # Must bear in mind !


    +   - op: basic operation of the instruction, traditionally called the opcode.

    +   - rs: the first register source operand.

    +   - rt: the second register source operand.

    +   - rd: the register destination operand.

    +   - shamt: shift amount.

    +   - funct: function,this field selects the specific variant of the operation
    in the op field.


    ![](img/273e5640629250d9497f523c984c99c0_76_0.png)'
  merge: -1
