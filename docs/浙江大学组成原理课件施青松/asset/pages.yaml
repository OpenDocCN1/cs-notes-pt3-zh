- pgno: 305
  md: 'CPI = \frac{CPU \text{ clock cycles for a program}}{\text{Instruction count}}


    CPU time = Instruction count × Clock cycle time × Cycles per instruction


    CPU time = \frac{\text{Instruction count × Clock cycle time}}{\text{Clock rate}}


    \frac{\text{Instructions}}{\text{Program}} × \frac{\text{Clock cycles}}{\text{Instruction}}
    × \frac{\text{Seconds}}{\text{Clock cycle}} = \frac{\text{Seconds}}{\text{Program}}
    = \text{CPU time}'
  merge: -1
  img_proc: true
- pgno: 306
  md: '+   - CPU performance is dependent upon three characteristics:

    +     - clock cycle (or rate)

    +     - clock cycles per instruction

    +     - and instruction count.

    +   - It is difficult to change one parameter in complete isolation from others
    because the basic technologies involved in changing each characteristic are interdependent:

    +     - Clock cycle time—Hardware technology and organization

    +     - Clock cycle time—Hardware technology and organization

    +     - Instruction count—Instruction set architecture and compiler technology'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# MIPS (*million instruction per second*)


    $$\mathrm{MIPS}=\frac{\mathrm{Instruction\ count}}{\mathrm{Execution\ time}\times
    10^6}=\frac{\mathrm{Clock\ rate}}{\mathrm{CPI}\times 10^6}$$


    $$\mathrm{Execution\ time}=\frac{\mathrm{Instruction\ count}}{\mathrm{MIPS}\times
    10^6}$$


    > ❌ **The bigger the MIPS, the faster the machine.**


    +   - **Three problems with MIPS:**

    +     - MIPS is dependent on the instruction set, making it difficult to compare
    MIPS of computers with different instruction sets.

    +     - MIPS varies between programs on the same computer.

    +     - Most importantly, MIPS can vary inversely to performance!'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Single Cycle Problems


    +   - what if we had a more complicated instruction like floating point?

    +     If so, the waste of time will be more serious.

    +   - wasteful of area. The reason is the following:

    +     - **Let’s see the instruction ‘mult’. This instruction needs to use the
    ALU repeatedly.**

    +     - **But, in the single cycle implementation, one ALU can be used only once
    in one clock cycle.**

    +     - **So, the instruction ‘mult’ will need many ALUs. The CPU will be very
    large.**'
  merge: -1
  img_proc: true
