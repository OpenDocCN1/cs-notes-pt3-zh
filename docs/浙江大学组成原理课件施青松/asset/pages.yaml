- pgno: 200
  md: '# # Carry look ahead adder (CLA)


    +   - Separation of

    +     - add operation

    +     - carry calculation

    +   - Factorisation

    +     - \( C_{i+1} = b_i c_i + a_i c_i + a_i b_i \)

    +       \( = a_i b_i + a_i + b_i c_i \)

    +     - Generate \( g_i = a_i b_i \)

    +     - Propagate \( p_i = a_i + b_i \)'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# # Carry look ahead adder


    +   C<sub>i+1</sub> = g<sub>i</sub> + p<sub>i</sub> c<sub>i</sub>


    +   Carry generate: g<sub>i</sub> = a<sub>i</sub> b<sub>i</sub>


    +   If a and b are ''1'' ->


    +   we always have a carryout independent of c<sub>i</sub>


    +   Carry propagate: p<sub>i</sub> = a<sub>i</sub>+ b<sub>i</sub>


    +   If only one of a and b is ''1'' ->


    +   the carry out depends on the carry in


    +   p<sub>i</sub> propagates the carry'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Four bit carry look ahead adder


    +   - c1 = g0 + (p0 * c0)

    +   - c2 = g1 + p1*c1 = g1 + (p1 * g0) + (p1 * p0 * c0)

    +   - c3 = g2 + p2*c2 = g2 + (p2 * g1) + (p2 * p1 * g0) + (p2 * p1 * p0 * c0)

    +   - c4 = g3 + p3*c3 = g3 + (p3 * g2) + (p3 * p2 * g1) + (p3 * p2 * p1 * g0)
    + (p3 * p2 * p1 * p0 * c0)


    **COMMENT:**


    This kind of adder will be faster than the ripple carry adder,and smaller than
    the adder with the tow-level logic.


    **PROBLEM:**


    If the number of the adder bits is very large,this kind of adder will be too large.So
    we must seek more efficient ways.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# # Four bit carry look ahead adder


    Let’s consider a 16-bit adder.

    Divide 16 bits into 4 groups.Each group has 4 bits.

    As we know:

    c4 = g3 + p3*g2 + p3*p2*g1 + p3*p2*p1*g0 + p3*p2*p1*p0*c0


    So,we can get the following:

    c8 = g7 + p7*g6 + p7*p6*g5 + p7*p6*p5*g4 + p7*p6*p5*p4*c4

    c12 = g11+p11*g10+p11*p10*g9+p11*p10*p9*g8+p11*p10*p9*p8*c8

    c16=g15+p15*g14+p15*p14*g13+p15*p14*p13*g12+p15*p14*p13*p12*c12


    Assume:

    G0= g3 + p3*g2 + p3*p2 *g1 +p3*p2*p1*g0

    G1= g7 + p7*g6 + p7*p6*g5 + p7*p6*p5*g4

    G2= g11+p11*g10+p11*p10*g9+p11*p10*p9*g8

    G3= g15+p15*g14+p15*p14*g13+p15*p14*p13*g12

    P0= p3 * p2 * p1 * p0

    P1= p7 * p6 * p5 * p4

    P2= p11 * p10 * p9 * p8

    P3= p15 * p14 * p13 * p12'
  merge: -1
  img_proc: true
- pgno: 204
