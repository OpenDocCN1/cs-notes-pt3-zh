  md: '# 8.7 Designing an I/O system


    The general approaches to designing I/O system


    +   - Find the **weakest** link in the I/O system, which is the component in the
    I/O path that will constrain the design. Both the workload and configuration limits
    may dictate where the weakest link is located.

    +   - Configure this component to sustain the required bandwidth.

    +   - Determine the requirements for the rest of the system and configure them
    to support this bandwidth.'
