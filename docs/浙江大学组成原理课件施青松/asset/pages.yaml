  md: "# Procedure *sort*\n\n# C code\n\n```\nsort ( int v[ ], int n )\n{\n      \
    \  int i, j;\n        for ( i = 0; i < n; i += 1 ) {\n                for ( j\
    \ = i - 1; j >= 0 && v[j] > v[j+1]; j -= 1 )\n                        swap ( v,\
    \ j );\n        }\n}\n```\n\n![](img/273e5640629250d9497f523c984c99c0_132_0.png)\n\
    \n# Register allocation for *sort*\n\nv ---- $a0    n ---- $a1    i ---- $s0 \
    \   j ---- $s1\n\n# Passing parameters in *sort*\n\n# Preserving registers in\
