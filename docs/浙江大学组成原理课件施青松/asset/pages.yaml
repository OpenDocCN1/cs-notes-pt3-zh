  md: '# Example 2.5　Compiling using **load and store**


    C code:


    ```

    A[12] = h + A[8];  // A is an array of 100 words

    (Assume: h ---- $s2   base address of A ---- $s3)

    ```


    MIPS code:


    ```

    lw    $t0, 32($s3)     # temporary reg $t0 gets A[8]

    add   $t0, $s2, $t0     # temporary reg $t0 gets h + A[8]

