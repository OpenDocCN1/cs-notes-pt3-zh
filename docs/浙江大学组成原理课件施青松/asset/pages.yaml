  md: "# Locality---- two important concepts\n\n1. temporal locality (locality in\
    \ time):\n   If an item is referenced, it will tend to be referenced again soon.\n\
    \n2. spatial locality (locality in space):\n   If an item is referenced, items\
    \ whose addresses are close by will tend to be referenced soon.\n\n+   - As we\
    \ know, these tow principles actually exists in most programs.\n+     - *Why does\
    \ code have locality?*\n\n+   - Our initial focus: two levels (upper, lower)\n\
    +     - `block`: minimum unit of data\n+     - `hit`: data requested is in the\
    \ upper level\n+     - `miss`: data requested is not in the upper level"
