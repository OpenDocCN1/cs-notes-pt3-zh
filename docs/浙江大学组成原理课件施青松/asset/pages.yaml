  md: '# sign extension **(I**[**ou**](https://example.com)** vs. lb)**


    +   - Expansion

    +     - e.g. 16 bit numbers to 32 bit numbers

    +   - Required for operations with registers(32 bits) and immediate operands (16
    bits)

    +   - Sign extension

