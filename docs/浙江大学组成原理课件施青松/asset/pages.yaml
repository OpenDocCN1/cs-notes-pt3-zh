  md: '# Example 2.2    Compiling a complex C statement


    # C code:


    ```

    f = ( g + h ) − ( i + j );

    ```


    # MIPS code:


    ```

    add t0, g, h        # temporary variable t0 contains g + h

    add t1, i, j        # temporary variable t1 contains i + j

    sub f, t0, t1       # f gets t0 − t1

    ```


