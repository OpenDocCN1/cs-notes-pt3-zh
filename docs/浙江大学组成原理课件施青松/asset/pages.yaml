- pgno: 137
  md: "# ## 2.15 Arrays versus Pointers\n\n# ### Two C procedures\n\n# #### Array\
    \ version\n\n```\n```c\nclear1 ( int  array[], int size )\n{\n    int  i;\n  \
    \  for ( i = 0 ; i < size ; i = i + 1 )\n        array[i] = 0;\n}\n```\n```\n\n\
    # #### Pointer version\n\n```\n```c\nclear2 ( int *array, int size )\n{\n    int\
    \  *p;\n    for ( p = &array[0]; p < &array[size]; p = p + 1 )\n        *p = 0;\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 138
  md: '# # Assembly code for clear-1 procedure (array version)


    ```

    move $t0,$zero # i = 0

    loop1: sll $t1,$t0,2 # $t1 = i * 4

    add $t2,$a0,$t1 # $t2 = address of array[ i ]

    sw $zero,0($t2) # array[ i ] = 0

    addi $t0,$t0,1 # i = i + 1

    slt $t3,$t0,$a1 # test if i < size

    bne $t3,$zero,loop1 # if ( i < size ) go to loop1

    jr $ra

    ```


    This code works as long as **_size_** is greater than 0.

    (In this case,the loop will be executed once even though

    the value of the size parameter is invalid. Actually,size

    >0 must be checked at first)'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# # Assembly code for clear-2 procedure (pointer version)


    ```

    move $t0, $a0 # p = the start address of the array[]

    sll $t1, $t1, 2 # $t1 = size * 4

    add $t2, $a0, $t1 # $t2 = &array[size](address of array[size] )

    loop2: sw $zero, 0($t0) # Memory[ p ] = 0

    addi $t0, $t0, 4 # p = p + 4

    slt $t3, $t0, $t2 # $t3 = (p < &array[size] )

    bne $t3, $zero, loop2 # if ( p < &array[size] ) go to loop2

    jr $ra

    ```


    This code works as long as **size** is greater than 0.


    # ## Compare the two versions


    +   - Array version has the “multiply” and add inside loop


    +   - Pointer version reduces instructions/iteration from **6** to **4**


    +   - For modern compliers,both ways are the same.'
  merge: -1
  img_proc: true
