    \n```\n```asm\nmove $s2, $a0      # $s2 ← $a0 ($a0: base address)\nmove $s3, $a1\
    \      # $s3 ← $a1 ($a1: array size)\n```\n```\n\n# **Outer loop**\n\n```\n```asm\n\
