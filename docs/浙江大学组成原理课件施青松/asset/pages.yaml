- pgno: 81
  md: '# MIPS operands, assembly and machine language


    | Name | Example | Comments |

    |---|---|---|

    | **32 register** | `$s0,$s1……,$s7`<br>`$t0, $t1……,$t7` | Fast locations for data.
    In MIPS, data must be in registers to perform arithmetic. Registers `$s0-$s7`
    map to 16-23 and `$t0-$t7` map to 8-15. |

    | **²30 memory words** | `Memory[0],`<br>`Memory[4], … ,`<br>`Memory[4294967292]`
    | Accessed only by data transfer instructions in MIPS. MIPS uses byte addr., so
    sequential word addr. Differ by 4. Memory holds data structures, arrays, and spilled
    registers. |


    | Category | Instruction | Example | Meaning | Comments |

    |---|---|---|---|---|

    | **Arithmetic** | add | `add $s1,$s2,$s3` | `$s1=$s2 + $s3` | Three register
    operands |

    |  | subtract | `sub $s1,$s2,$s3` | `$s1=$s2 - $s3` | Three register operands
    |

    |  | Add immediate | `addi $s1,$s2,100` | `$s1=$s2+100` | Used to add constants
    |

    | **Data transfer** | load word | `lw $1, 100($s2)` | `$s1=Memory[$s2+100]` |
    Data from memory to register |

    |  | store word | `sw $s1, 100($s2)` | `Memory[$s2+100]=$s1` | Data from register
    to memory |


    | Name | Format | Example | Comment |

    |---|---|---|---|

    | add | R | `0 18 19 17 0 32` | `add $s1, $s2, $s3` |

    | sub | R | `0 18 19 17 0 34` | `sub $s1, $s2, $s3` |

    | addi | I | `8 18 17 100` | `addi $s1,$s2,100` |

    | lw | I | `35 18 17 100` | `lw $s1, 100($s2)` |

    | sw | I | `43 18 17 100` | `sw $s1, 100($s2)` |


    | Field size | 6bits | 5bits | 5bits | 5bits | 5bits | 6bits | All MIPS instruction
    32 bits |

    |---|---|---|---|---|---|---|---|

    | **R-format** | **R** | **op** | **rs** | **rt** | **rd** | **shamt** | **funct**
    | Arithmetic instruction format |

    | **I-format** | **I** | **op** | **rs** | **rt** |  | **address** | Data transfer
    ,branch format |'
  merge: -1
