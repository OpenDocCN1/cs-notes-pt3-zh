- pgno: 492
  md: '# A DMA transfer need three steps:


    +   - The processor **sets up** the DMA by supplying some information, including
    the *identity of the device*, the *operation*, the *memory address that is the
    source or destination of the data to be transferred*, and the *number of bytes
    to transfer*.

    +   - The DMA **starts** the **operation** on the device and arbitrates for the
    **bus**. If the request requires more than one transfer on the bus, the DMA unit
    generates the next memory address and initiates the next transfer.

    +   - Once the DMA transfer is complete, the controller **interrupts** the processor,
    which then examines whether errors occur.'
  merge: -1
