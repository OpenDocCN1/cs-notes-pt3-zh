  md: '# # 如何学好这门课？---耕耘与收获


    +   ### 孟子曰：

    +   舜发于畎亩之中，傅说举于版筑之间，胶鬻举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。


    +   故天将降大任于斯人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。


    +   人恒过，然后能改。困于心，衡于虑，而后作。征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒忘。


    +   然后知生于忧患，而死于安乐也。'
