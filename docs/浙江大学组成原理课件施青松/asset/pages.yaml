- pgno: 195
  md: '# # ALU Hardware Code


    ```

    module alu(A, B, ALU_operation, res, zero, overflow );

    input [31:0] A, B;

    input [2:0] ALU_operation;

    output [31:0] res;

    output zero, overflow ;

    wire [31:0] res_and,res_or,res_add,res_sub,res_nor,res_slt;

    reg [31:0] res;

    parameter one = 32''h00000001, zero_0 = 32''h00000000;

    assign res_and = A&B;

    assign res_or = A|B;

    assign res_add = A+B;

    assign res_sub = A-B;

    assign res_slt =(A < B) ? one : zero_0;

    always @ (A or B or ALU_operation)

    case (ALU_operation)

    3''b000: res=res_and;

    3''b001: res=res_or;

    3''b010: res=res_add;

    3''b110: res=res_sub;

    3''b100: res=~(A | B);

    3''b111: res=res_slt;

    default: res=32''hx;

    endcase

    assign zero = (res==0)? 1: 0;

    endmodule

    ```


    # # How do you write with overflow code ?


    # # What is the difference The codes in the Synthesize?


    ```

    always @ (A or B or ALU_operation)

    case (ALU_operation)

    3''b000: res=A&B;

    3''b001: res=A|B;

    3''b010: res=A+B;

    3''b110: res=A-B;

    3''b100: res=~(A | B);

    3''b111: res=(A < B) ? one :

    zero_0;

    default: res=32''hx;

    endcase

    ```'
  merge: -1
  img_proc: true
