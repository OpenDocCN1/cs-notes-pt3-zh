- pgno: 313
  md: "# Step 1: Instruction Fetch\n\n+   - Use PC to get instruction and put it in\
    \ the Instruction Register.\n+     - `IR = Memory[PC];`\n+   - Increment the PC\
    \ by 4 and put the result back in the PC.\n+     - `PC = PC + 4;`\n+   - Can be\
    \ described simply using RTL \"Register-Transfer Language\"\n+   \n+     `IR =\
    \ Memory[PC];`\n+   \n+     `PC = PC + 4;`\n+   - Can we figure out the values\
    \ of the control signals?\n+   - What is the advantage of updating the PC now?"
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Step 2: Instruction Decode and Register Fetch


    +   - Read registers rs and rt in case we need them

    +   - Compute the branch address in case the instruction is a branch

    +   - RTL:


    ```

    A = Reg[IR[25–21]];

    B = Reg[IR[20–16]];

    ALUOut = PC + (sign-extend(IR[15–01]) << 2);

    ```


    +   - We aren''t setting any control lines based on the instruction type

    +     (we are busy "decoding" it in our control logic)'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# # Step 3 (instruction dependent)


    +   - ALU is performing one of three functions, based on instruction type

    +   - Memory Reference ( lw / sw ):

    +     ALUOut = A + sign-extend(IR[15-0]);

    +   - R-type:

    +     ALUOut = A op B;

    +   - Branch:

    +     if (A==B) PC = ALUOut;

    +   - jump:

    +     pc = pc31-28 + IR25-0 << 2'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# # Step 4 (R-type or memory-access)


    +   - Loads and stores access memory

    +     `MDR = Memory[ALUOut]; # for lw`

    +     `or`

    +     `Memory[ALUOut] = B; # for sw`

    +   - R-type instructions finish

    +     `Reg[rd]=Reg[ IR[15-11] ] = ALUOut;`


    _The write actually takes place at the end of the cycle on the edge_'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Write-back step (step 5)


    +   - 1w

    +     - `Reg[rt]=Reg[IR[20-16]]=MDR;`


    *What about all the other instructions?*'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Summary:


    | Step name | Action for R-type instructions | Action for memory-reference instructions
    | Action for branches | Action for jumps |

    |---|---|---|---|---|

    | Instruction fetch |  | IR = Memory[PC]<br>PC = PC + 4 |  |  |

    | Instruction decode/register fetch |  | A = Reg[IR[25-21]]<br>B = Reg[IR[20-16]]<br>ALUOut
    = PC + (sign-extend (IR[15-0]) << 2) |  |  |

    | Execution, address computation, branch/jump completion | ALUOut = A op B | ALUOut
    = A + sign-extend (IR[15-0]) | if (A == B) then<br>PC = ALUOut | PC = PC[31-28]
    || (IR[25-0] << 2) |

    | Memory access or R-type completion | Reg[IR[15-11]] = ALUOut | Load: MDR = Memory[ALUOut]<br>or<br>Store:
    Memory[ALUOut] = B |  |  |

    | Memory read completion |  | Load: Reg[IR[20-16]] = MDR |  |  |'
  merge: -1
