  md: "# # 2.13 A C Sort Example to Put it All Together\n\n+   Three general steps\
    \ for translating C procedures\n+   \n+   - Allocate registers to program variables\n\
    +   - Produce code for the body of the procedures\n+   - Preserve registers across\
    \ the procedures invocation\n\n# ## Procedure swap\n\n+   - C code\n\n```\n```c\n\
    swap( int v[], int k )\n{\n    int temp;\n    temp = v[k];\n    v[k] = v[k + 1];\n\
    \    v[k + 1] = temp;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 131
  md: '# # Register allocation for swap


    v ---- $a0  k ---- $a1   temp ---- $t0


    # # swap is a leaf procedure, nothing to preserve


    # # MIPS code for the procedure swap


    # ## Procedure body


    swap: sll $t1, $a1, 2 # $t1 = k * 4


    add $t1, $a0, $t1 # $t1 = v + ( k * 4 )


    # $t1 has the address of v[ k ]


    lw $t0, 0($t1) # $t0 ← v[ k ]


    lw $t2, 4($t1) # $t2 ← v[ k + 1 ]


    sw $t2, 0($t1) # v[k+1]) → v[ k ]


    sw $t0, 4($t1) # v[k] → v[ k + 1 ]


    # ## Procedure return


    jr $ra # return to calling routine'
  merge: -1
  img_proc: true
