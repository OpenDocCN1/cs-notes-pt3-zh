  md: '# Two''s Biased notation


    ❖ Negating Biased notation number:


    invert all bits and add 1 with end


    **Defining:** Assume: `X = ±xₙ₋₁xₙ₋₂xₙ₋₃xₙ₋₄···x₀`


    `[X]ᵦ = 2ⁿ + X`,   `−2ⁿ ≤ X ≤ 2ⁿ`

    `[0]ᵦ = 100000... (2ⁿ)`


    `X = +1011`   `[X]ᵦ = 11011`               sign bit “1” Positive

    `X = −1011`   `[X]ᵦ = 00101`               sign bit “0” Negative


    2''s Biased notation VS 2''s complement


    +   - ◉ Only reverse sign bit

    +   - e.g.


    `X = +1011`   `[X]c = 01011`   `[X]b = 11011`

    `X = −1011`   `[X]c = 10101`   `[X]b = 00101`


    **IEEE 754:** `[X]ᵦ = (2ⁿ−1) + X`


    base'
