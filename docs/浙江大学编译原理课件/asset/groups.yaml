  - '[PAGE 443]


    # 6.3 The symbol table


    +   - **Semantic checks** refer to properties of identifiers in the program --
    their scope or type

    +   - Need an environment to store the information about identifiers = **symbol
    table**

    +   - Each entry in the symbol table contains

    +     - the name of an identifier

    +     - additional information: its kind, its type, if it is constant, ...


    | NAME | KIND | TYPE | ATTRIBUTES |

    |---|---|---|---|

    | `foo` | fun | `int x int → bool` | extern |

    | `m` | arg | int | |

    | `n` | arg | int | const |

    | `tmp` | var | bool | const |'
  - '[PAGE 444]


    # 6.3.1 The structure of the symbol table


    +   1. linear list:

    +      provide easy and direct implementations of the three basic operations;

    +      *insert* operation is performed in constant time

    +      *lookup* and *delete* operation are linear time in the size of the list;

    +      good for a compiler implementation in which speed is not a major concern

    +      - a prototype

    +      - experimental compiler

    +      - an interpreter for a very small programs.


    ![](img/1db31d392048feae2d803578b3d5a4b9_444_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_444_1.png)'
  - '[PAGE 445]


    # 6.3.1 The structure of the symbol table


    +   2. various search tree structures

    +   (binary search trees, AVL trees, B trees)

    +   don''t provide best case efficiency;

    +   the delete operation is very complexity;

    +   less useful


    +   3. hash tables

    +   all three operation can be performed in almost

    +   constant time;

    +   most frequently in practice, best choice'
  - '[PAGE 446]


    # 6.3.1 The structure of the symbol table


    # the hash table


    +   - a **hash function** turns the search key( the identifier name, consisting
    of a string of characters) into an integer hash value in the index range

    +   - indexed by an integer range from 0 to the table size minus one

    +   - the item corresponding to the search key is stored in the bucket at this
    index.


    ![](img/1db31d392048feae2d803578b3d5a4b9_446_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_446_1.png)'
  - '[PAGE 447]


    # 6.3.1 The structure of the symbol table


    the hash table


    +   - **Main problem:**

    +     - collision: two keys are mapped to the same index by the hash function.


    ![](img/1db31d392048feae2d803578b3d5a4b9_447_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_447_1.png)'
  - '[PAGE 448]


    # 6.3.1 The structure of the symbol table


    # Collision resolution


    +   1. **open addressing:**

    +      - inserting the collided new items in successive buckets.

    +      - cause a significant degradation in performance and make delete operation
    difficult.

    +   2. **separate chaining**

    +      - each bucket is a linear list, collisions are resolved by inserting the
    new item into the bucket list.

    +      - it is the best scheme for compiler construction.


    ![](img/1db31d392048feae2d803578b3d5a4b9_448_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_448_1.png)'
