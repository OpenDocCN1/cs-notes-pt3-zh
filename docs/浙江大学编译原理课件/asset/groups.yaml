    # 4.3.3 Constructing LL(1) Parsing Tables


    The table-constructing rules:


    +   ➢ If \(A\to\alpha\) is a production choice, and there is a derivation \(\alpha\Rightarrow^*a\beta\),
    where \(a\) is a token, then add \(A\to\alpha\) to the table entry \(M[A,a]\);


    +   ➢ If \(A\to\alpha\) is a production choice, and there are derivations \(\alpha\Rightarrow^*\varepsilon\)
    and \(S\Rightarrow^*\beta Aa\gamma\), where \(S\) is the start symbol and \(a\)
    is a token (or \($\)), then add \(A\to\alpha\) to the table entry \(M[A,a]\);


