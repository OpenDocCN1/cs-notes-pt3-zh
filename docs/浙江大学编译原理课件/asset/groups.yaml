    \ is a derivation of at least one step that begins and ends with same non-terminal:\
    \ A=> α=>* A;\n- (2) Programming language grammars do have ε-productions, but\
    \ usually in very restricted forms.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_226_0.png)\n\
    ![](img/1db31d392048feae2d803578b3d5a4b9_226_1.png)\n\n- Algorithm for general\
    \ left recursion removal:\n  For i:=1 to m do\n    For j:=1 to i-1 do\n      Replace\
    \ each grammar rule choice of the form\n      Ai→ Ajβ by the rule\n      \n  \
    \    Ai→α1β|α2β| ... |αkβ,\n      \n      where Aj→α1|α2| ... |αk is the current\
    \ rule for Aj.\n      remove, if necessary, immediate left recursion\n      involving\
    \ Ai\n\nEXAMPLE: consider the following grammar,\nA→Ba| Aa| c\nB→Bb| Ab| d\nWhere,\
    \ A1=A, A2=B and n=2\n\n(1) When i=1, the inner loop does not execute,\nSo only\
    \ to remove the immediate left recursion of A\nA→BaA’| c A’\nA’→aA’| ε\nB→Bb|\
    \ Ab| d\n\n![](img/1db31d392048feae2d803578b3d5a4b9_229_0.png)\n![](img/1db31d392048feae2d803578b3d5a4b9_229_1.png)\n\
    \n(2) when i=2, the inner loop execute once, with j=1.\n\nTo eliminate the rule\
