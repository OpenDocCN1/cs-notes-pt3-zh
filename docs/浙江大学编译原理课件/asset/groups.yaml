    \ types and may also create aliases for existing named types. Type names are used\
    \ in conjunction with a type equivalence algorithm (perform type checking of a\
    \ program)\n\n```\ntype table = array [1..SIZE] of Entry  (pascal)\nstruct Entry\
    \        (C)\n{\nchar * name;\n int count;\n struct Entry *next ;\n};\ntypedef\
