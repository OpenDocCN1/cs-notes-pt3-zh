    \n(2) when i=2, the inner loop execute once, with j=1.\n\nTo eliminate the rule\
    \ B→Ab by replacing A with its choices\n\n- A→BaA'| c A'\n- A'→aA'| ε\n- B→Bb|\
    \ BaA'b|cA'b| d\n\n- A→BaA'| c A'\n- A'→aA'| ε\n- B→Bb| Ab| d\n\n(3) remove the\
    \ immediate left recursion of B to obtain\n\n- A→BaA'| c A'\n- A'→aA'| ε\n- B→cA'bB'|\
    \ dB'\n- B'→bB' |aA'bB'|ε\n\nNow, the grammar has no left recursion.\n\n- Left\
    \ recursion removal does not change the language, but changes the grammar and\
    \ the parse tree.\n- This change causes a complication for the parser.\n\nExample:\
    \ Simple arithmetic expression grammar\nAfter removal of the left recursion.\n\
    \nexp → term exp’\nexp’→ addop term exp’ | ε\naddop → + | -\nterm → factor term’\n\
    term’ → mulop factor term’ | ε\nmulop → *\nfactor →(expr) | number\n\nThe parse\
    \ tree for the expression 3-4-5, which does not express the left associativity\
    \ of subtraction. Nevertheless, a parse should still construct the appropriate\
    \ left associative syntax tree. ( p161 )\n\n![](img/1db31d392048feae2d803578b3d5a4b9_232_0.png)\n\
    \nThe grammar with its left recursion removed would give rise to the procedures\
    \ exp and exp’ as follows:\n\nexp → term exp’\nexp’→ addop term exp’ | ε\naddop\
    \ → + | -\nterm → factor term’\nterm’ → mulop factor term’ | ε\nmulop → *\nfactor\
    \ →(expr) | number\n\nexp → term exp’\nProcedure exp\nBegin\nTerm;\nExp’;\nEnd\
    \ exp;\n\nexp’→ addop term exp’ | ε\nProcedure exp’\nBegin\nCase token of\n+:\
    \ match(+);\nterm;\nexp’;\n-: match(-);\nterm;\nexp’;\nend case;\nend exp’\n\n\
    To compute the value of the expression, we can rewrite them as follows:\n\n```\n\
    function exp:integer;\n    var temp:integer;\n    Begin\n        Temp:=Term;\n\
    \        Return Exp’(temp);\n    End exp;\n```\n\n```\nfunction exp’(valsofar:integer):integer;\n\
    \    Begin\n        If token=+ or token=- then\n            Case token of\n  \
    \              +: match(+);\n                    valsofar:=valsofar+term;\n  \
    \              -: match(-);\n                    valsofar:=valsofar-term;\n  \
    \          end case;\n            return exp’(valsofar);\n        else return\
    \ valsofar;\n    end exp’;\n```\n\nNote: the exp’ needs a parameter from the exp\
    \ procedure.\n\nThe LL(1) parsing table for the new expression is given as follows:\n\
    \n| M[N,T] | ( | number | ) | + | - | * | $ |\n|---|---|---|---|---|---|---|---|\n\
    | exp | exp → term exp′ | exp → term exp′ |  |  |  |  |  |\n| exp′ |  |  | exp′\
    \ → ε | exp′ → addop term exp′ | exp′ → addop term exp′ |  | exp′ → ε |\n| addop\
    \ |  |  |  | addop → + | addop → - |  |  |\n| term | term → factor term′ | term\
    \ → factor term′ |  |  |  |  |  |\n| term′ |  |  | term′ → ε | term′ → ε | term′\
    \ → ε | term′ → mulop factor term′ | term′ → ε |\n| mulop |  |  |  |  |  | mulop\
    \ → * |  |\n| factor | factor → ( exp ) | factor → number |  |  |  |  |  |\n\n\
    ![](img/1db31d392048feae2d803578b3d5a4b9_235_0.png)\n![](img/1db31d392048feae2d803578b3d5a4b9_235_1.png)\n"
