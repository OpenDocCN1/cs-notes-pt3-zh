    \ of Recursive-Descent\n\nfactor → (expr) | number\n\n```\nProcedure factor\n\
    BEGIN\ncase token of\n( : match( );\nexpr;\nmatch( ));\nnumber:\nmatch(number);\n\
    else error;\nend case;\nEND factor\n```\n\n## 4.1.2 Repetition and Choice: Using\
    \ EBNF\n\n- The second example\n  - `If-stmt → if ( exp ) statement`\n  - `| if\
    \ ( exp ) statement else statement`\n\nThe EBNF of the if-statement is as follows:\n\
    \n`If-stmt → if ( exp ) statement [ else statement]`\n\n![](img/1db31d392048feae2d803578b3d5a4b9_199_0.png)\n\
