    +              | if ( exp ) statement else statement

    +     exp → 0 | 1

    +     ```


    +   - Examples of strings in this language are

    +     ```

    +     if (0) other

    +     if (1) other

    +     if (0) other else other

    +     if (1)     other else other

    +     if (0)     if (0) other

    +     if (0)     if (1) other else other

    +     if (1)     other else if (0) other else other

    +     ```'
