    \ presence of errors:\n  - the primary issues are when to generate an error message.\n\
    \  - how to continue to check types in the presence of errors.\n\n## 6.4.5 Additional\
    \ topics in type checking\n\n- **Overloading:** the same operator name is used\
    \ for two different operations.\n  - `procedure max(x,y: integer):integer;`\n\
    \  - `procedure max(x,y: real):real;`\n  - In C and Pascal: illegal (redeclaration)\n\
    \  - In Ada and C++: legal\n\n- **type conversion and coercion**\n  - allow arithmetic\
    \ expressions of mixed type.\n  - There are two approaches a language can take\
    \ to such conversions.\n  - Require the programmer supply a conversion function\
    \ (Modula-2)\n  - The type checker supply the conversion automatically (coercion)\n\
    \n# Chapter 7\nRuntime Environments\n\n## outline\n\n- Runtime Environment:\n\
    - Three kinds of runtime environments:\n  - (1) Fully static environment; FORTRAN77\n\
    \  - (2) stack-based environment; C C++\n  - (3) fully dynamic environment; LISP\n\
    \n## 7.1 Memory Organization During Program Execution\n\n- **The memory of a typical\
    \ computer:**\n  - A register area;\n  - Addressable Random access memory(RAM):\n\
    \    - A code area\n    - A data area\n\nThe general organization of runtime storage\n\
    \n## 7.1 Memory Organization During Program Execution\n\n### Procedure activation\
    \ record\n\n| Space for arguments (parameters) |\n| Space for bookkeeping information,\
    \ including return address |\n| Space for local data |\n| Space for local temporaries\
    \ |\n\n### Procedure activation record\n\n- Depending on the language, activation\
    \ records may be allocated in different areas:\n  - Fortran77 in the static area;\n\
    \  - C and Pascal in the stack area; referred to as stack frames\n  - LISP in\
    \ the heap area.\n\n"
