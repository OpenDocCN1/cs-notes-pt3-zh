    # 7.3.1 Stack-Based Environments Without

    Local Procedures


    *Dealing with variable-length data*


    +   - C compiler typically deal with this by pushing the arguments to a call in
    reverse order onto the runtime stack. The first parameter is always located at
    a fixed offset from the fp in the implementation described above.

    +   - Another option is to use a processor mechanism such as ap(argument pointer)
    in VAX architecture.


