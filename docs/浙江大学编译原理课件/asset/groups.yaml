  - '[PAGE 55]


    # 2.3.2 Lookahead, backtracking and nondeterministic automata


    • **Definition:** An **NFA** (nondeterministic finite automaton) *M* consists
    of an alphabet Σ, a set of states S,


    +   ➢ a transition function \(T: S \times (\Sigma \cup \{\varepsilon\}) \to \mathcal{P}(S)\),


    +   ➢ a start state \(s_0\) from S, and a set of accepting states A from S.


    +   ➢ The language accepted by *M*, written \(L(M)\), is defined to be the set
    of strings of characters \(c_1c_2\cdots c_n\) with each \(c_i\) from \(\Sigma
    \cup \{\varepsilon\}\) such that there exist states \(s_1\) in \(T(s_0,c_1)\),
    \(s_2\) in \(T(s_1,c_2)\), ..., \(s_n\) in \(T(s_{n-1},c_n)\), with \(s_n\) an
    element of A.


    ![](img/1db31d392048feae2d803578b3d5a4b9_55_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_55_1.png)'
