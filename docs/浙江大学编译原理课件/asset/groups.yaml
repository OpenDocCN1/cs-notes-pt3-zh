  md: "\n## Chapter 4 Top-Down Parsing\n\n### 4.3.1 First Sets\n\n**Definition:**\n\
    \nLet X be a grammar symbol (a terminal or non-terminal) or ε. Then First(X) is\
    \ a set of terminals or ε, which is defined as follows:\n\n1. If X is a terminal\
    \ or ε, then First(X) = {X};\n2. If X is a non-terminal, then for each production\
    \ choice X → X₁ X₂ … Xₙ, First(X) contains First(X₁) − {ε}.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_248_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_248_1.png)\n\nLet α = X₁X₂...Xₙ be\
    \ a string of terminals and non-terminals. First(α) is defined as follows:\n\n\
    1. First(α) contains First(X₁) − {ε};\n2. For each i = 2,...,n, if for all k =\
    \ 1,...,i−1, First(Xₖ) contains ε, then First(α) contains First(Xᵢ) − {ε}.\n3.\
    \ If all the sets First(X₁),...,First(Xₙ) contain ε, then First(α) contains ε.\n\
    \n**Algorithm for computing First(A) for all non-terminal A:**\n\n```\nFor all\
    \ non-terminal A do First(A) := {};\nWhile there are changes to any First(A) do\n\
    \    For each production choice A → X₁X₂...Xₙ do\n        k := 1; Continue :=\
    \ true;\n        While Continue = true and k <= n do\n            Add First(Xₖ)\
    \ − {ε} to First(A);\n            If ε is not in First(Xₖ) then Continue := false;\n\
    \            k := k + 1;\n        If Continue = true then add ε to First(A);\n\
    ```\n\n**Simplified algorithm in the absence of ε-production.**\n\n```\nFor all\
    \ non-terminal A do First(A) := {};\nWhile there are changes to any First(A) do\n\
    \    For each production choice A → X₁X₂...Xₙ do\n        Add First(X₁) to First(A);\n\
    ```\n\n![](img/1db31d392048feae2d803578b3d5a4b9_251_0.png)\n\n- **Definition:**\
    \ A non-terminal A is **nullable** if there exists a derivation A ⇒* ε.\n\n- **Theorem:**\
    \ A non-terminal A is **nullable** if and only if First(A) contains ε.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_252_0.png)\n\
    \n- Grammar for statement sequences:\n\n```\nstmt-sequence → stmt stmt-seq'\n\
    stmt-seq' → ; stmt-sequence | ε\nstmt → s\n```\n\n- List the production choices\
    \ individually:\n\n```\nstmt-sequence → stmt stmt-seq'\nstmt-seq' → ; stmt-sequence\n\
    stmt-seq' → ε\nstmt → s\n```\n\n- The First sets are as follows:\n\n```\nFirst(stmt-sequence)\
    \ = {s}\nFirst(stmt-seq') = {;, ε}\nFirst(stmt) = {s}\n```\n\n![](img/1db31d392048feae2d803578b3d5a4b9_253_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_253_1.png)\n\n### 4.3.2 Follow Sets\n\
    \n- **Definition:**\n\nGiven a non-terminal A, the set Follow(A) is defined as\
    \ follows.\n\n1. If A is the start symbol, then $ is in Follow(A).\n2. If there\
    \ is a production B → α Aγ, then First(γ) − {ε} is in Follow(A).\n3. If there\
    \ is a production B → α Aγ, such that ε is in First(γ), then Follow(A) contains\
    \ Follow(B).\n\n![](img/1db31d392048feae2d803578b3d5a4b9_254_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_254_1.png)\n\
    \n- **Note:**\n\n1. The symbol `$` is used to mark the end of the input.\n2. The\
    \ empty “pseudotoken” `ε` is never an element of a follow set.\n3. Follow sets\
    \ are defined only for non-terminals.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_255_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_255_1.png)\n\n- Follow sets work “on\
