    \  }\n    ...\n    B:{char *a;\n            int k;\n            ...\n        }\n\
    \    ...\n}\n```\n\n![](img/1db31d392048feae2d803578b3d5a4b9_566_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_566_1.png)"
  md: "\n### (a) Runtime environment of the above program during the second call to\
    \ g\n\n|  |  |\n|---|---|\n| x:2<br>x(from f):1 | Global/static area |\n|  | Activation\
    \ record of main |\n| m:2<br>Control link<br>Return address<br>y:1 | Activation\
    \ record of call to g |\n| n:1<br>Control link<br>Return address<br>m:1 | Activation\
    \ record of call to f |\n| Control link<br>Return address<br>y:0 | Activation\
    \ record of call to g |\n| Free space |  |\n| fp<br>sp |  |\n\n### (b) Runtime\
    \ environment of the above program during the third call to g\n\n|  |  |\n|---|---|\n\
    | x:1<br>x(from f):0 | Global/static area |\n|  | Activation record of main |\n\
    | m:2<br>Control link<br>Return address<br>y:1 | Activation record of call to\
    \ g |\n| m:1<br>Control link<br>Return address<br>y:0 | Activation record of call\
    \ to g |\n| Free space |  |\n| fp<br>sp |  |\n\n![](img/1db31d392048feae2d803578b3d5a4b9_555_0.png)\n\
    \n## 7.3.1 Stack-Based Environments Without Local Procedures\n\n**Activation tree**:\
    \ a useful tool for the analysis of complex calling structures. Each activation\
    \ record (or call) becomes a node in this tree.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_556_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_556_1.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_556_2.png)\n\
    \n### Access to Names\n\n- Parameters and local variables must be found by offset\
    \ from the current frame pointer.\n- In most languages, the offset can be statically\
    \ computable by the compiler.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_557_0.png)\n\
    \n### Example 7.4\n\nC procedure:\n\n```c\nvoid f(int x, char c)\n{\n    int a[10];\n\
    \    double y;\n    ...\n}\n```\n\n![](img/1db31d392048feae2d803578b3d5a4b9_559_0.png)\n\
    \n| Name | Offset |\n|------|--------|\n| x | +5 |\n| c | +4 |\n| a | -24 |\n\
    | y | -32 |\n\n### The calling sequence\n\n- 1. Compute the arguments and store\
    \ them in their correct positions in the new activation record of the procedure.\n\
    - 2. Store the fp as the control link in the new activation record;\n- 3. Change\
    \ the fp so that it points to the beginning of the new activation record;\n- 4.\
    \ Store the return address in the new activation record;\n- 5. Perform a jump\
    \ to the code of the procedure to be called.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_561_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_561_1.png)\n\n### When a procedure\
    \ exits\n\n- (1) Copy the fp to the sp.\n- (2) Load the control link into the\
    \ fp.\n- (3) Perform a jump to the return address.\n- (4) Change the sp to pop\
    \ the arguments.\n\n### Dealing with variable-length data\n\n- C compilers typically\
    \ deal with this by pushing the arguments to a call in reverse order onto the\
    \ runtime stack. The first parameter is always located at a fixed offset from\
    \ the fp in the implementation described above.\n- Another option is to use a\
    \ processor mechanism such as AP (argument pointer) in VAX architecture.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_564_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_564_1.png)\n\n### Local Temporaries\
    \ and Nested Declarations\n\n- Local temporaries are partial results of computations\
    \ that must be saved across procedure calls, for example:\n\n  `x[i] = (i + j)\
    \ * (i/k + f(j))`\n\n- The three partial results need to be saved across the call\
    \ to f:\n    - The address of x[i];\n    - The sum i+j;\n    - The quotient i/k;\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_565_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_565_1.png)\n\
    \n- **Nested declarations present a similar problem.**\n\n```c\nvoid p(int x,\
    \ double y)\n{\n    char a;\n    int i;\n    ...\n    A: {\n        double x;\n\
    \        int j;\n        ...\n    }\n    ...\n    B: {\n        char *a;\n   \
    \     int k;\n        ...\n    }\n    ...\n}\n```\n\n![](img/1db31d392048feae2d803578b3d5a4b9_566_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_566_1.png)\n"
