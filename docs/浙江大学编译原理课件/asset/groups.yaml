    \n**Algorithm for the computation of follow sets:**\n\n```\nFollow(start-symbol)\
    \ := {$};\nFor all non-terminals A ≠ start-symbol do\n    Follow(A) := {};\nWhile\
    \ there are changes to any follow sets do\n    For each production A → X₁X₂...Xₙ\
    \ do\n        For each Xᵢ that is a non-terminal do\n            Add First(Xᵢ₊₁Xᵢ₊₂...Xₙ)\
    \ − {ε} to Follow(Xᵢ);\n            If ε is in First(Xᵢ₊₁Xᵢ₊₂...Xₙ) then\n   \
