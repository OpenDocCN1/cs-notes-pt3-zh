  - "[PAGE 21]\n\n# # 1.3 The translation process\n\n# ## 5. The code generator\n\n\
    Input : intermediate code or IR  \nOutput: machine code, code for the target machine\n\
    \n```\nMOV R0, index    ; ; value of index → R0\nMUL R0, 2        ; ; double value\
    \ in R0\nMOV R1, &a       ; ; address of a → R1\nADD R1,R0        ; ; add R0 to\
    \ R1\nMOV *R1, 6       ; ; constant 6 → address in R1\n```\n\n> The machine performs\
    \ byte addressing and that integers occupy two bytes of memory."
  - '[PAGE 22]


    # 1.3 The translation process


    # 6. The target code optimizer


    +   - Improve the target code generated by the code generator

    +   - choosing addressing modes to improve performance

    +   - replacing slow instructions by faster ones

    +   - eliminating redundant or unnecessary operations


    ```

    MOV R0, index   ; ; value of index → R0

    MUL R0, 2       ; ; double value in R0

    MOV R1, &a      ; ; address of a → R1

    ADD R1, R0      ; ; add R0 to R1

    MOV *R1, 6      ; ; constant 6 → address in R1

    ```


    ![](img/1db31d392048feae2d803578b3d5a4b9_22_0.png)


    ```

    MOV R0, index   ; ; value of index → R0

    SHL R0          ; ; double value in R0

    MOV &a[R0], 6   ; ; constant 6 → address a + R0

    ```


