    \n![](img/1db31d392048feae2d803578b3d5a4b9_335_0.png)\n\n## 5.4.2 The LR(1) Parsing\
    \ Algorithm\n\n### The General LR(1) parsing algorithm:\n\nLet s be the current\
    \ state (a the top of the parsing stack). Then actions are defined as follows:\n\
    \n1. If state s: any LR(1) item of the form [A→α·Xβ,a], X is a terminal, and X\
    \ is the next token in the input string  \n2. If state s: the complete LR(1) item\
    \ [A→ α ·,a], the next token in the input string is a  \n3. If the next input\
    \ token is such that neither of the above two cases applies, an error is declared.\n\
    \n## 5.4.2 The LR(1) Parsing Algorithm\n\n- A grammar is an LR(1) grammar:  \n\
    \  if the application of the above general LR(1) parsing rules results in no ambiguity.\n\
    \n- a grammar is LR(1) if and only if, for any state s, the following two conditions\
    \ are satisfied.  \n\n  1. For any item [A→α⋅Xβ,a] in s with X a terminal, there\
    \ is no item in s of the form [B→γ⋅,X] (otherwise there is a shift-reduce conflict).\
    \  \n  2. There are no two items in s of the form [A→α⋅,a] and [B→β⋅,a] (otherwise,\
    \ there is a reduce-reduce conflict).\n\n![](img/1db31d392048feae2d803578b3d5a4b9_337_0.png)\n\
    \n## 5.4.2 The LR(1) Parsing Algorithm\n\n- Example 5.16  \n- S → id | V := E\
    \  \n- V→ id  \n- E → V | n  \n\nS'→• S, $  \nS→• id, $  \nS→• V := E, $  \nV→•\
    \ id, :=  \n\nS→ V• := E, $  \n\nS→ V := E •, $  \n\nE→ V•,$  \n\nS'→S• , $  \n\
    \nS→id• , $  \nV→ id•, :=  \n\nS→ V := • E, $  \nE→• V,$  \nE→• n,$  \nV→• id,\
    \ $  \n\nE→n• , $  \n\nV→ id• , $  \n\n![](img/1db31d392048feae2d803578b3d5a4b9_339_0.png)\n\
    \n## 5.4.3 LALR(1) Parsing\n\n- The LALR(1) parsing algorithm: it makes sense\
    \ to identify all such states and combine their lookaheads.  \n- LALR(1) parsing\
