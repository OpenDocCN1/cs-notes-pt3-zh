  md: "\n\n## 1.2 Programs related to compilers\n\n- **Profilers**\n  - Collect statistics\
    \ on the behavior of an object program during execution.\n- **project managers**\n\
    \  - coordinate the files being worked on by different people.\n  - sccs (source\
    \ code control system )\n  - rcs(revision control system)\n  - project manager\
    \ programs on Unix systems.\n\n## 1.3 The translation process\n\n### 1. The scanner\n\
    \nLexical analysis: input a stream of characters, output tokens\n\nExample: a\
    \ [index] = 4+2\n\nOutput:\n\n- a identifier\n- [ left bracket\n- index identifier\n\
    - ] right bracket\n- = assignment\n- 4 number\n- + plus sign\n- 2 number\n\nother\
    \ operations: enter identifiers into the symbol table enter literals into the\
    \ literal table\n\n### 2. The parser\n\n- Determine the structure of the program\n\
    - Input : the forms of tokens\n- Output : a parse tree or a syntax tree\n\nsyntax\
    \ tree ( abstract syntax tree): a condensation of the information contained in\
    \ the parse tree.\n\n### 3. The semantic analyzer\n\n- Static semantics: including\
    \ declarations and type checking\n- Dynamic semantics\n- attribute: computed by\
    \ the semantic analyzer\n\n### 4. The source code optimizer\n\nintermediate code:\
    \ Three–address code or P-code\n\nt =4+2\na [index] = t\n\nt =6\na [index] = t\n\
    \na [index] = 6\n\nintermediate code or IR: a form of code representation intermediate\
    \ between source code and object code.\nsyntax tree\nthree address code\np-code\n\
    \n### 5. The code generator\n\nInput : intermediate code or IR  \nOutput: machine\
    \ code, code for the target machine\n\n```\nMOV R0, index    ; ; value of index\
    \ → R0\nMUL R0, 2        ; ; double value in R0\nMOV R1, &a       ; ; address\
    \ of a → R1\nADD R1,R0        ; ; add R0 to R1\nMOV *R1, 6       ; ; constant\
    \ 6 → address in R1\n```\n\n> The machine performs byte addressing and that integers\
    \ occupy two bytes of memory.\n\n### 6. The target code optimizer\n\n- Improve\
    \ the target code generated by the code generator\n- choosing addressing modes\
    \ to improve performance\n- replacing slow instructions by faster ones\n- eliminating\
    \ redundant or unnecessary operations\n\n```\nMOV R0, index   ; ; value of index\
    \ → R0\nMUL R0, 2       ; ; double value in R0\nMOV R1, &a      ; ; address of\
    \ a → R1\nADD R1, R0      ; ; add R0 to R1\nMOV *R1, 6      ; ; constant 6 → address\
    \ in R1\n```\n\n```\nMOV R0, index   ; ; value of index → R0\nSHL R0         \
    \ ; ; double value in R0\nMOV &a[R0], 6   ; ; constant 6 → address a + R0\n```\n\
    \n## 1.4 Major data structures in a compiler\n\n1. **Tokens**\n   a value of an\
    \ enumerated data type    the sets of tokens\n\n2. **the syntax tree**\n   each\
    \ node is a record whose fields represent the information collected\n   by the\
    \ parser and semantic analyzer\n\n3. **the symbol table**\n   information associated\
    \ with identifiers: functions, variables,\n   constants, and data types.\n\n4.\
    \ **the literal table**\n   store constants and strings\n\n5. **intermediate code**\n\
    \   this code kept as an array of text strings, a temporary text file   or as\
    \ a\n   linked list of structures.\n\n6. **temporary files**\n   using temporary\
    \ files to hold   the products of intermediate steps\n\n## 1.5 other issues in\
    \ compiler structure\n\n- **passes**\n  - process the entire source program several\
    \ times\n  - a pass consist of several phases\n- **language definition and compilers**\n\
    \  - relation between the language definition and compiler\n- **compiler options\
    \ and interfaces**\n  - interfaces with the operating system\n  - provide options\
    \ to the user for various purposes\n- **error handling: static error, execution\
    \ error**\n\n"
