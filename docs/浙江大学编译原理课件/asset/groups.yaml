  - '[PAGE 477]


    # # 6.4 Data types and type checking


    +   - Type checking = set of rules that ensure the type consistency of different
    constructs in the program

    +   - Examples:

    +     - The type of a variable must match the type from its declaration

    +     - The operands of arithmetic expressions (+, *, -, /) must have integer
    types; the result has integer type

    +     - The operands of comparison expressions (==, !=) must have integer or string
    types; the result has boolean type'
  - '[PAGE 478]


    # # 6.4 Data types and type checking


    +   - More examples:

    +     - For each assignment statement, the type of the updated variable must match
    the type of the expression being assigned

    +     - For each call statement foo(v1, ..., vn), the type of each actual argument
    vi must match the type of the corresponding formal argument fi from the declaration
    of function foo

    +     - The type of the return value must match the return type from the declaration
    of the function'
  - '[PAGE 479]


    # 6.4.1 Type expressions and type constructors


    +   - **data type forms:**

    +     - a set of values with certain operations on those values.

    +   - **type information can be explicit and implicit.**

    +     - For instance var x: array[1..10] of real (explicit)

    +     - const greeting = “Hello” (implicitly array [1..6] of char)

    +   - **a data type is a set of values, or more precisely, a set of values with
    certain operations on those values.**

    +   - **These sets are usually described by a type expression.**


