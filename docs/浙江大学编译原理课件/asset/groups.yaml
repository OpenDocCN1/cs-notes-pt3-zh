  md: "\n## 6.3.4 Interaction of same-level declarations\n\n- **sequential declaration:**\n\
    \    - each declaration is added to the symbol table as it is processed.\n- **collateral\
    \ declaration:**\n    - declarations are not added immediately to the existing\
    \ symbol table\n    - accumulated in a new table (or temporary structure)\n  \
    \  - then added to the existing table after all declarations have been processed.\n\
    - **recursive declaration:**\n    - declarations may refer to themselves or to\
    \ each other.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_469_0.png)\n![](img/1db31d392048feae2d803578b3d5a4b9_469_1.png)\n\
    \n```\nint gcd ( int n, int m)\n{ if (m == 0) return n;\n  else return gcd (m,\
    \ n%m);\n}\n```\n\n```\nvoid g(void); /* function prototype declaration\n*/\n\
    void f (void)\n{ .....g( ) .....}\n```\n\n## 6.3.5 An extended example of an attribute\
    \ grammar using a symbol table\n\n```\nS → exp\nexp → (exp) | exp + exp | id |\
    \ num | let dec-list in exp\ndec-list → dec-list, decl | decl\ndecl → id = exp\n\
    ```\n\n- The declarations inside a let expression represent a kind of constant\
    \ declaration. Such as `let x = 2+1, y=3+4 in x+y`.\n- The let expressions represent\
    \ the blocks of this language.\n- The grammar allows arbitrary nesting of let\
    \ expressions inside each other.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_471_0.png)\n\
    \n### Semantic Rules\n\n| Grammar Rule | Semantic Rules |\n| --- | --- |\n| `S\
    \ → exp` | `exp.symtab = emptytable`<br>`exp.nestlevel = 0`<br>`S.err = exp.err`\
    \ |\n| `exp1 → exp2 + exp3` | `exp2.symtab = exp1.symtab`<br>`exp3.symtab = exp1.symtab`<br>`exp2.nestlevel\
    \ = exp1.nestlevel`<br>`exp3.nestlevel = exp1.nestlevel`<br>`exp1.err = exp2.err\
    \ or exp3.err` |\n| `exp1 → (exp2)` | `exp2.symtab = exp1.symtab`<br>`exp2.nestlevel\
    \ = exp1.nestlevel`<br>`exp1.err = exp2.err` |\n| `exp → id` | `exp.err = not\
    \ isin(exp.symtab, id.name)` |\n| `exp → num` | `exp.err = false` |\n\n![](img/1db31d392048feae2d803578b3d5a4b9_473_0.png)\n\
    ![](img/1db31d392048feae2d803578b3d5a4b9_473_1.png)\n\n## 6.4 Data types and type\
    \ checking\n\n- Type inference and type checking are the principal tasks of a\
    \ compiler.\n- Type checking = set of rules that ensure the type consistency of\
    \ different constructs in the program\n- Examples:\n    - The type of a variable\
    \ must match the type from its declaration\n    - The operands of arithmetic expressions\
    \ `(+, *, -, /)` must have integer types; the result has integer type\n    - The\
    \ operands of comparison expressions `(==, !=)` must have integer or string types;\
    \ the result has boolean type\n- More examples:\n    - For each assignment statement,\
    \ the type of the updated variable must match the type of the expression being\
    \ assigned\n    - For each call statement `foo(v1, ..., vn)`, the type of each\
    \ actual argument `vi` must match the type of the corresponding formal argument\
    \ `fi` from the declaration of function `foo`\n    - The type of the return value\
    \ must match the return type from the declaration of the function\n\n### 6.4.1\
    \ Type expressions and type constructors\n\n- **data type forms:**\n    - a set\
    \ of values with certain operations on those values.\n- **type information can\
    \ be explicit and implicit.**\n    - For instance `var x: array[1..10] of real`\
    \ (explicit)\n    - `const greeting = \"Hello\"` (implicitly `array [1..6] of\
    \ char`)\n- **a data type is a set of values, or more precisely, a set of values\
    \ with certain operations on those values.**\n- **These sets are usually described\
    \ by a type expression.**\n\n![](img/1db31d392048feae2d803578b3d5a4b9_479_0.png)\n\
    ![](img/1db31d392048feae2d803578b3d5a4b9_479_1.png)\n\n### Structured type\n\n\
    - New data types can be created using type constructors.\n- Such constructors\
    \ can be viewed as functions: they take existing types as parameters and return\
    \ new types with a structure that depends on the constructor.\n- Array: type parameter:\
    \ index type, component type.\n"
