  - '[PAGE 248]


    # 4.3.1 First Sets


    • Definition:


    Let X be a grammar symbol (a terminal or non-terminal) or ε. Then First(X) is
    a set of terminals or ε, which is defined as follows:


    +   1. If X is a terminal or ε, then First(X) = {X};

    +   2. If X is a non-terminal, then for each production choice X → X₁ X₂ … Xₙ,
    First(X) contains First(X₁) − {ε}.


    ![](img/1db31d392048feae2d803578b3d5a4b9_248_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_248_1.png)'
  - '[PAGE 249]


    # 4.3.1 First Sets


    Let α= X<sub>1</sub>X<sub>2</sub>...X<sub>n</sub> be a string of terminals and
    non-terminals,. First(α) is defined as follows:


    +   1.First(α) contains First(X<sub>1</sub>)-{ε};


    +   2.For each i=2,...,n, if for all k=1,...,i-1, First(X<sub>k</sub>) contains
    ε, then First(α) constains First(X<sub>k</sub>)-{ε}.


    +   3. If all the set First(X<sub>1</sub>)..First(X<sub>n</sub>) contain ε, the
    First(α) contains ε.'
  - '[PAGE 250]


    # 4.3.1 First Sets


    # Algorithm for computing First(A) for all non-terminal A:


    For all non-terminal A do First(A):={ };

    While there are changes to any First(A) do

    For each production choice A→X₁X₂...Xₙ do

    k:=1; Continue:=true;

    While Continue= true and k<=n do

    Add First(Xₖ)-{ε} to First(A);

    If ε is not in First(Xₖ) then Continue:= false;

    k:=k+1;

    If Continue = true then addεto First(A);'
