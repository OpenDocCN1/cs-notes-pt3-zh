    \n![](img/1db31d392048feae2d803578b3d5a4b9_603_1.png)\n"
  mdcn: "\n## 7.4.3 Heap Management\n\n```c\nvoid free(void *ap)\n{\n    header *bp,\
    \ *p, *prev;\n        bp = (header *)ap - 1;\n        for (prev=memptr, p=memptr->s.next;\n\
    \        (p!=bp) && (p!=memptr); prev=p, p=p->s.next);\n        if (p!=bp) return;\n\
    \              /* corrupted list, do nothing */\n        prev->s.freesize += p->s.usedsize\
    \ + p->s.freesize;\n        prev->s.next = p->s.next;\n            memptr = prev;\n\
    }\n```\n\n## Chapter 7 Runtime Environments\n\n![](img/1db31d392048feae2d803578b3d5a4b9_593_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_593_1.png)\n\n### outline\n\n- Runtime\
    \ Environment:\n- Three kinds of runtime environments:\n  - (1) Fully static environment;\
    \ FORTRAN 77\n  - (2) stack-based environment; C, C++\n  - (3) fully dynamic environment;\
    \ LISP\n\n## 7.4.4 Automatic Management of the heap\n\n- **manual method**\n\n\
    \  the use of malloc and free to perform dynamic allocation and de-allocation\
    \ of pointer.\n\n- **garbage collection**\n\n  the process of reclamation of allocated\
    \ but no longer used storage without an explicit call to free.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_595_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_595_1.png)\n\n- **mark and sweep garbage\
    \ collection**\n\n  no memory is freed until a call to malloc fails, which does\
    \ this in two passes.\n\n  1. Follows all pointers recursively, starting with\
    \ all currently accessible pointer values and marks each block of storage reached.\n\
    \  2. Sweeps linearly through memory.\n\n  - **returning unmarked blocks to free\
    \ memory.**\n  - **perform memory compaction to leave only one large block of\
    \ contiguous free space at the other end.**\n\n![](img/1db31d392048feae2d803578b3d5a4b9_596_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_596_1.png)\n\n- The Mark and Sweep\
    \ garbage collection has several drawbacks:\n  1. Requires extra storage;\n  2.\
    \ The double pass through memory cause a significant delay in processing\n\n![](img/1db31d392048feae2d803578b3d5a4b9_597_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_597_1.png)\n\n- Generational garbage\
    \ collection\n\n  Allocated objects that survive long enough are simply copied\
    \ into permanent space and are never deallocated during subsequent storage reclamations.\n\
    \n## 7.5 Parameter Passing Mechanisms\n\n- The common parameter passing mechanisms\n\
    \  - pass by value\n  - pass by reference\n  - pass by value-result\n  - pass\
    \ by name\n\n![](img/1db31d392048feae2d803578b3d5a4b9_600_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_600_1.png)\n\
    \n### 7.5.1 Pass by Value\n\n- The arguments are expressions that are evaluated\
    \ at the time of the call.\n- their values becomes the values of the parameter\
    \ during the execution of the procedure.\n\n- The only parameter passing mechanism\
    \ available in C;\n- The default in Pascal and Ada.\n\n### 7.5.2 Pass by Reference\n\
    \n- pass by reference passes the location of the variable.\n- the parameter becomes\
    \ an alias for the argument.\n\n- The only parameter passing mechanism in Fortran\
    \ 77\n- In Pascal, pass by reference achieved with the use of var keyword\n- In\
    \ C++, by the use of special symbol & in the parameter declaration\n\n![](img/1db31d392048feae2d803578b3d5a4b9_602_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_602_1.png)\n\n### 7.5.3 Pass by Value-Result\n\
    \n- The mechanism achieves a similar result to pass by reference, except that\
    \ no actual alias is established.\n- Known as copy-in, copy-out, or copy-restore.\n\
    - The value of the argument is copied and used in the procedure.\n- The final\
    \ value of the parameter is copied back out to the location of the argument.\n\
    \n**This is the mechanism of Ada in out parameter.**\n\n![](img/1db31d392048feae2d803578b3d5a4b9_603_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_603_1.png)\n"
