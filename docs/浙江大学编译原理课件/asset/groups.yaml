    \ a state may be constructed many times.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_84_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_84_1.png)\n\n## 2.4.4 Minimizing the\
    \ number of states in a DFA\n\nan important result from automata theory states:\n\
    \n- given any DFA, there is an equivalent DFA containing a minimum number of states,\
    \ and that this minimum state DFA is unique (except for renaming of states).\n\
    - It is also possible to directly obtain this minimum state DFA from any given\
    \ DFA.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_85_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_85_1.png)\n\
    \n- the resulting DFA may be more complex than necessary. (deriving a DFA algorithmically\
    \ from a regular expression)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_86_0.png)\n\
    \n## 2.4.4 Minimizing the number of states in a DFA\n\n### Given the algorithm\
    \ as follow:\n\n- 1、It begins with the most optimistic assumption possible: it\
    \ creates two sets\n  one consisting of all the accepting states\n  the other\
    \ consisting of all the nonaccepting states.\n\n2、Given this partition of the\
    \ states of the original DFA, consider the transitions on each character *a* of\
    \ the alphabet.\n\nIf all accepting states have transitions on *a* to accepting\
    \ states,\n\ndefines an *a*-transition from the new accepting state (the set of\
    \ all the old accepting states) to itself.\n\nIf all accepting states have transitions\
    \ on *a* to nonaccepting states,\n\ndefines an *a*-transition from the new accepting\
    \ state to the new nonaccepting state (the set of all the old nonaccepting states).\n\
    \nIf there are two accepting states *s* and *t* that have transitions on *a* that\
    \ land in different sets,\n\nno a transition can be defined for this grouping\
    \ of the states. We say that *a* distinguishes the states *s* and *t*.\n\nIf there\
    \ are accepting states $s$ and $t$ such that $s$ has an $a$-transition to another\
    \ accepting state, while $t$ has no $a$-transition at all (i.e., an error transition),\n\
    then $a$ distinguishes $s$ and $t$.\nIf any further sets are split, we must return\
    \ and repeat the process from the beginning.\n\nThis process continues until\n\
    \n- (1) all sets contain only one element (in which case, we have shown the original\
    \ DFA to be minimal)\n- (2) until no further splitting of sets occurs.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_89_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_89_1.png)\n\n"
