  md: "\n\n## 7.3.2 Stack-Based Environment with local Procedures\n\n- Consider the\
    \ non-local and non-global references\n  - Example: Pascal program showing nonlocal,nonglobal\
    \ reference\n\n- To solve the above problem about variable access, we add an extra\
    \ piece of bookkeeping information called the access link to each activation record.\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_568_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_568_1.png)\n\
    \n```pascal\nprogram nonlocalRef;\n\nprocedure p;\nvar n: integer;\n\n    procedure\
    \ q;\n    begin\n        (* a reference to n is\n           now non-local and\n\
    \           non-global *)\n    end; (* q *)\n\n    procedure r(n:integer);\n \
    \   begin\n        q;\n    end; (* r *)\n\nbegin  (* p *)\n    n :=1;\n    r(2);\n\
    end;  (*p*)\n\nbegin (* main*)\n    p;\nend.\n```\n\n![](img/1db31d392048feae2d803578b3d5a4b9_569_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_569_1.png)\n\nActivation record of\
    \ main program\n\nActivation record of Call to p\n\nActivation record of Call\
    \ to r\n\nActivation record of Call to q\n\n![](img/1db31d392048feae2d803578b3d5a4b9_570_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_570_1.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_570_2.png)\n\
    \n- Access link represents the defining environment of the procedure; access link\
    \ is sometimes also called the static link.\n- Control link represents the calling\
    \ environment of the procedure.\n\nActivation record of main program\n\nActivation\
    \ record of Call to p\n\nActivation record of Call to r\n\nActivation record of\
    \ Call to q\n\nfp\nsp\n\n- The calling sequence:\n  1. The access link must be\
    \ pushed onto the runtime stack just before the fp during a call\n  2. The sp\
    \ must be adjusted by an extra amount to remove the access link after an exit.\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_573_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_573_1.png)\n\
    \n- How to find the access link of a procedure during a call.\n  1. Using the\
    \ (compile-time) nesting level information attached to the declaration of the\
    \ procedure;\n  2. Generate an access chain as if to access a variable at the\
    \ same nesting level;\n\n![](img/1db31d392048feae2d803578b3d5a4b9_574_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_574_1.png)\n\n## 7.3.3 Stack-Based\
    \ Environment with Procedure Parameters\n\nExample 7.7 Consider the standard pascal\
    \ program of Figure 7.14, which has a procedure p, with a parameter a that is\
    \ also a procedure.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_575_0.png)\n\n\
    ![](img/1db31d392048feae2d803578b3d5a4b9_575_1.png)\n\n## 7.4 DYNAMIC MEMORY\n\
    \n- A stack-based environment will result in a dangling reference if a local variable\
    \ in a procedure can be returned to the caller when the procedure is exited.\n\
    - The simplest example:\n  ```c\n  Int * dangle(void)\n  { int x;\n    return\
    \ &x;}\n  ```\n- An assignment `addr = dangle( )` now cause addr to point to an\
    \ unsafe location in the activation stack.\n\n## 7.4.1 Fully Dynamic Runtime Environments\n\
    \n- A more complex instance of a dangling reference occurs if a local function\
    \ can be returned by a call.\n\n```c\ntypedef int(* proc)(void);\nproc g(int x)\n\
    {\n    int f(void) /*illegal local function*/\n    {\n        return x;\n    }\n\
    \    return f;\n}\nmain()\n{\n    proc c;\n    c = g(2);\n    printf(\"%d\\n\"\
    , c());/* should print 2*/\n    return 0;\n}\n```\n\n- C language avoids the above\
    \ problem by prohibiting local procedure.\n- Other languages, like Modula-2, have\
    \ local procedures as well as procedure variables, parameters, and returned values.\n\
    \  - Must state a special rule that makes such program erroneous.\n  - In Modula-2\
    \ the rule is that only global procedures can be arguments or returned values.\n\
    \n"
