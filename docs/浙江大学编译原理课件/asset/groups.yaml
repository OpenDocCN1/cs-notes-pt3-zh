  - '[PAGE 121]


    # 3.2.3 Derivations and the language defined by a grammar


    +   - **the start symbol:** the most general structure is listed first in the
    grammar rules.

    +   - **nonterminals:** structure names are also called nonterminals, since they
    always must be replaced further on in a derivation.

    +   - **terminals:** symbols in the alphabet are called terminals, since they
    terminate a derivation. Terminals are usually tokens in compiler applications.


