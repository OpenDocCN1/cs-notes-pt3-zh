  - '[PAGE 216]


    # 4.2.2 The LL(1) Parsing Table and Algorithm


    +   - Definition of **LL(1)** Grammar:

    +     - A grammar is an **LL(1)** grammar if the associated **LL(1)** parsing
    table has at most one production in each table entry.

    +     - An **LL(1)** grammar cannot be ambiguous.


    ![](img/1db31d392048feae2d803578b3d5a4b9_216_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_216_1.png)'
  - "[PAGE 217]\n\n# 4.2.2 The LL(1) Parsing Table and Algorithm\n\n• A Parsing Algorithm\
    \ Using the LL(1) Parsing Table:\n\n```\npush the start symbol onto the top the\
    \ parsing stack;\nwhile the top of the parsing stack ≠ $ and the next\n    input\
    \ token ≠ $ do\n    if the top of the parsing stack is terminal a\n        and\
    \ the next input token = a\n    then (* match *)\n        pop the parsing stack;\n\
    \        advance the input;\n    else if the top of the parsing stack is non-terminal\
    \ A\n        and the next input token is terminal a\n        and parsing table\
    \ entry M[A,a] contains production\nA→X1X2....Xn\n```"
