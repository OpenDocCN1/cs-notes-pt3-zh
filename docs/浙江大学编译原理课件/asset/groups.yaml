  - '[PAGE 405]


    # # 6.2.2 Synthesized and inherited attributes


    # ## Synthesized attributes


    +   - An attribute is synthesized

    +     - if all its dependencies point from child to parent in the parse tree.

    +     - given a grammar rule A→X₁X₂... Xₙ, the only associated attribute equation
    with an a on the left-hand side is of the form:

    +       - A.a = f(X₁.a₁,...,X₁.aₖ,...,Xₙ.a₁,... Xₙ.aₖ)


    +   - S-attributed grammar:

    +     An attribute grammar in which all the attributes are synthesized


    ![](img/1db31d392048feae2d803578b3d5a4b9_405_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_405_1.png)'
  - "[PAGE 406]\n\n# 6.2.2 Synthesized and inherited attributes\n\n# Synthesized attributes\n\
    \n+   - The attribute values of an S-attributed grammar can be computed by a single\
    \ bottom-up, or post-order, traversal of the parse or syntax tree.\n\n```\nProcedure\
    \ PostEval (T : treenode);\nBegin\n    For each child C of T do\n        PostEval(C);\n\
    \        Compute all synthesized attributes of T;\nEnd\n```\n\n![](img/1db31d392048feae2d803578b3d5a4b9_406_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_406_1.png)"
