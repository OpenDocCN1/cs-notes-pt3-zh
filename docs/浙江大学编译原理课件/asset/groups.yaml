    \ BaA'b|cA'b| d\n\n- A→BaA'| c A'\n- A'→aA'| ε\n- B→Bb| Ab| d\n\n(3) remove the\
    \ immediate left recursion of B to obtain\n\n- A→BaA'| c A'\n- A'→aA'| ε\n- B→cA'bB'|\
    \ dB'\n- B'→bB' |aA'bB'|ε\n\nNow, the grammar has no left recursion.\n\n- Left\
    \ recursion removal does not change the language, but changes the grammar and\
    \ the parse tree.\n- This change causes a complication for the parser.\n\nExample:\
    \ Simple arithmetic expression grammar\nAfter removal of the left recursion.\n\
    \nexp → term exp’\nexp’→ addop term exp’ | ε\naddop → + | -\nterm → factor term’\n\
