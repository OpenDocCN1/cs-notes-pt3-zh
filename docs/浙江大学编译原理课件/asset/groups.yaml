  - '[PAGE 452]


    # 6.3.1 The structure of the symbol table


    # The algorithm of the hash function


    3. one good solution : repeatedly use a constant number α as a multiplying factor
    when adding in the value of the next character.


    $h_{i+1}=αh_i+c_i \quad h_0=0$


    final hash value $h=h_n \bmod size$


    n is the number of characters in the name being hashed.


    $h=(α^{n-1}c_1+α^{n-2}c_2+…..+αc_{n-1}+c_n) \bmod size$


    The choice of α has a significant effect on the outcome.


    A reasonable choice for α is a power of 2, such as 16 or 128, so that the multiplication
    can be performed as a shift.


    ![](img/1db31d392048feae2d803578b3d5a4b9_452_0.png)


