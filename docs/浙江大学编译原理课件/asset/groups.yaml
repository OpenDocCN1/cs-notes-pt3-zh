  - '[PAGE 325]


    # 5.3.1 The SLR(1) Parsing Algorithm


    +   - Note how the stack continues to grow until the final reductions.

    +   - This is characteristic of bottom-up parsers in the presence of right-recursive
    rules such as S → (S)S.

    +   - Right recursion can cause **stack overflow**, and so is to be avoided if
    possible.


    ![](img/1db31d392048feae2d803578b3d5a4b9_325_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_325_1.png)'
  - '[PAGE 326]


    # 5.3.2 Disambiguating Rules for Parsing Conflicts


    +   - two kinds of parsing conflicts in SLR(1) parsing

    +     - shift-reduce conflicts

    +     - reduce-reduce conflicts.

    +   - In the case of shift-reduce conflicts, **there is a natural disambiguating
    rule**

    +     - always prefer the shift over the reduce.

    +   - The case of reduce-reduce conflicts is more difficult

    +     - such conflicts often (but not always) indicate an error in the design
    of the grammar.


    ![](img/1db31d392048feae2d803578b3d5a4b9_326_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_326_1.png)'
