  - '[PAGE 223]


    # 4.2.3 left Recursion Removal and Left Factoring


    +   - Two standard techniques for Repetition and Choice problems:

    +     1. left Recursion removal


    *Immediate left recursion:* the left recursion occurs only within the production
    of a single non-terminal.


    `exp → exp + term | exp - term | term`


    *Indirect left recursion:*


    A → Bb | …

    B → Aa | …


    ![](img/1db31d392048feae2d803578b3d5a4b9_223_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_223_1.png)'
  - '[PAGE 224]


    # 4.2.3 left Recursion Removal and Left Factoring


    +   • CASE 1: Simple immediate left recursion


    A → A α | β


    We rewrite this grammar rule into two rules:


    A → βA′

    A′ → α A′ | ε


    +   • EXAMPLE:


    exp → exp addop term | term

    exp → term exp′

    exp′ → addop term exp′ | ε


    ![](img/1db31d392048feae2d803578b3d5a4b9_224_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_224_1.png)'
  - '[PAGE 225]


    # 4.2.3 left Recursion Removal and Left Factoring


    +   • CASE2: General immediate left recursion


    A → A α₁ | A α₂ | … | A αₙ | β₁|β₂|…|βₘ


    Where none of β₁,…, βₘ begin with A.


    The solution is similar to the simple case:


    A → β₁A′|β₂A′|…|βₘA′

    A′ → α₁A′| α₂A′|…| αₙA′| ε


    +   • EXAMPLE:


    exp → exp + term | exp - term | term


    remove the left recursion as follows:


    exp → term exp′

    exp′ → + term exp′ | - term exp′ | ε


    ![](img/1db31d392048feae2d803578b3d5a4b9_225_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_225_1.png)'
