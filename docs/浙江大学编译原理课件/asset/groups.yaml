  md: "\n\n# Chapter 6\n## Semantic Analysis\n\n## 6.2 Algorithms for attribute computation\n\
    \n### Purpose:\n\n- study the ways an attribute grammar can be used as basis for\
    \ a compiler to compute and use the attributes defined by the equations of the\
    \ attribute grammar.\n- $X_i.a_j = f_{ij}(X_0.a_1,\\dots,X_0.a_k, X_1.a_l, \\\
    dots, X_1.a_k, \\dots, X_n.a_1, \\dots, X_n.a_k)$ is viewed as an assignment of\
    \ the value of the functional expression on the right-hand side to the attribute\
    \ $X_i.a_j$.\n\n## 6.2.1 dependency graphs and evaluation order\n\ndecl → type\
    \ var-list  \ntype → int|float  \nvar-list → id,var-list|id\n\nbased-num → num\
    \ basechar  \nnum → num digit  \nnum → digit  \ndigit → 9  \n......\n\nExample\
    \ 6.9 the dependency of Fig 6.6(DAG)\n\nAnother topological sort is given by the\
    \ order\n\n12 6 9 1 2 11 3 8 4 5 7 10 13 14\n\nhow attribute values are found\
    \ at the roots of the graph\n\n- **Parse tree method:** construction of the dependency\
    \ graph is based on the specific parse tree at compile time., add complexity,\
    \ and need circularity detective.\n- **Rule based method:** fix an order for attribute\
    \ evaluation at compiler construction time. It depends on an analysis of the attribute\
    \ equations, or semantic rules.\n\n## 6.2.2 Synthesized and inherited attributes\n\
    \nClassification of the attributes:\n\n1. synthesized attributes\n2. inherited\
    \ attributes\n\n### Synthesized attributes\n\n- An attribute is synthesized\n\
    \  - if all its dependencies point from child to parent in the parse tree.\n \
    \ - given a grammar rule $A \\to X_1 X_2 \\dots X_n$, the only associated attribute\
    \ equation with an $a$ on the left-hand side is of the form:\n    - $A.a = f(X_1.a_1,\\\
    dots,X_1.a_k,\\dots,X_n.a_1,\\dots,X_n.a_k)$\n\n- S-attributed grammar:\n  An\
    \ attribute grammar in which all the attributes are synthesized\n\nThe attribute\
    \ values of an S-attributed grammar can be computed by a single bottom-up, or\
    \ post-order, traversal of the parse or syntax tree.\n\n```\nProcedure PostEval\
    \ (T : treenode);\nBegin\n    For each child C of T do\n        PostEval(C);\n\
    \        Compute all synthesized attributes of T;\nEnd\n```\n\n### inherited attributes\n\
    \n- An attribute that is not synthesized is called an inherited attribute.\n-\
    \ Such as dtype in example 6.3 and base in example 6.4.\n\ninherited attributes:\
    \ computed by a preorder traversal, or combined preorder/inorder traversal of\
