    # # 3.6.1 A formal definition of context-free language


    +   - Let G be a grammar as defined above, G = (T, N, P, S).

    +   - A derivation step over G is of the form a A γ => a β γ,

    +     where a and γ are elements of (T ∪ N)* and A → β is in P.


    +   - **the set of symbols**: The union T ∪ N of the sets of terminals and nonterminals

    +   - **a sentential form**: a string a in (T ∪ N)*.'
  - "[PAGE 186]\n\n# 3.6.1 A formal definition of context-free language\n\n+   - **α\
    \ ⇒* β** if and only if there is a sequence of 0 or more derivation steps (n >=\
    \ 0)  \n+     α₁ ⇒ α₂ ⇒ ... ⇒ αₙ₋₁ ⇒ αₙ such that α = α₁, and β = αₙ  \n+    \
    \ (If n = 0, then α = β)\n\n+   - **A derivation over the grammar G is of the\
    \ form S ⇒* w, where w ∈ T***  \n+     w is a string of terminals only, called\
    \ a **sentence**.  \n+     S is the start symbol of G.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_186_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_186_1.png)"
  - '[PAGE 187]


    # 3.6.1 A formal definition of context-free language


    • The **language generated by G**, written *L(G)*, is defined:


    L(G) = {w ∈ T* | there exists a derivation S =>* w of G}.


    • A **leftmost derivation** S =>*ₗₘ w is a derivation each derivation step a A
    γ => a β γ, is such that a ∈ T*; that is, a consists only of terminals.


    • A **rightmost derivation** is one each derivation step a A γ => a β γ has the
    property that γ ∈ T*.


    ![](img/1db31d392048feae2d803578b3d5a4b9_187_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_187_1.png)'
  - '[PAGE 188]


    # 3.6.1 A formal definition of context-free language


    # •A parse tree over the grammar G is a rooted labeled tree with the following
    properties:


    +   1. Each node is labeled with a terminal or a nonterminal or ε.


    +   2. The root node is labeled with the start symbol S.


    +   3. Each leaf node is labeled with a terminal or with ε.


    +   4. Each nonleaf node is labeled with a nonterminal.


    +   5. If a node with label A ∈ N has n children with labels X₁, X₂,..., Xₙ (which
    may be terminals or nonterminals), then A → X₁X₂ ... Xₙ ∈ P (a production of the
    grammar).'
  - '[PAGE 189]


    # # 3.6.1 A formal definition of context-free language


    +   - Each derivation gives rise to a parse tree.

    +   - In general, many derivations may give rise to the same parse tree.

    +   - Each parse tree, however, has a unique leftmost and right-most derivation
    that give rise to it.

    +   - The leftmost derivation corresponds to a preorder traversal of the parse
    tree,.

    +   - The rightmost derivation corresponds to the reverse of a postorder traversal
    of the parse tree'
