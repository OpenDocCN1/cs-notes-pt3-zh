    \ → if-stmt | other\nif-stmt → if (exp) statement else-part\nelse-part → else\
    \ statement | ε\nexp → 0 | 1\n```\n\n| M[N,T] | if | other | else | 0 | 1 | $\
    \ |\n|---|---|---|---|---|---|---|\n| statement | statement → if-stmt | statement\
    \ → other | | | | |\n| if-stmt | if-stmt → if (exp) statement else-part | | |\
    \ | | |\n| else-part | | | else-part → else statement \\| else-part → ε | | |\
    \ else-part → ε |\n| exp | | | | exp → 0 | exp → 1 | |\n\nThe parsing actions\
    \ for the string `if (0) if (1) other else other` (for conciseness, `statement\
    \ = S`, `if-stmt = I`, `else-part = L`, `exp = E`, `if = i`, `else = e`, `other\
    \ = o`):\n\n| Step | Stack | Input | Action |\n|---|---|---|---|\n| 1 | `$S` |\
    \ `i(0)i(1)oeo$` | `S → I` |\n| 2 | `$I` | `i(0)i(1)oeo$` | `I → i ( E ) S L`\
    \ |\n| 3 | `$LS)E(i` | `i(0)i(1)oeo$` | `match` |\n| 4 | `$LS)E(` | `(0)i(1)oeo$`\
    \ | `match` |\n| 5 | `$LS)E` | `0)i(1)oeo$` | `E → 0` |\n| 6 | `$LS)0` | `0)i(1)oeo$`\
    \ | `match` |\n| 7 | `$LS)` | `)i(1)oeo$` | `match` |\n| 8 | `$LS` | `i(1)oeo$`\
    \ | `S → I` |\n| 9 | `$LI` | `i(1)oeo$` | `I → i ( E ) S L` |\n| 10 | `$LLS)E(i`\
    \ | `i(1)oeo$` | `match` |\n| 11 | `$LLS)E(` | `(1)oeo$` | `match` |\n| 12 | `$LLS)E`\
    \ | `1)oeo$` | `E → 1` |\n| 13 | `$LLS)1` | `1)oeo$` | `match` |\n| 14 | `$LLS)`\
    \ | `)oeo$` | `match` |\n| 15 | `$LLS` | `oeo$` | `S → o` |\n| 16 | `$LLo` | `oeo$`\
    \ | `match` |\n| 17 | `$LL` | `eo$` | `L → e S` |\n| 18 | `$LSe` | `eo$` | `match`\
    \ |\n| 19 | `$LS` | `o$` | `S → o` |\n| 20 | `$Lo` | `o$` | `match` |\n| 21 |\
    \ `$L` | `$` | `L → ε` |\n| 22 | `$` | `$` | `accept` |\n\n![](img/1db31d392048feae2d803578b3d5a4b9_222_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_222_1.png)\n\n## 4.2.3 Left Recursion\
    \ Removal and Left Factoring\n\n- Two standard techniques for Repetition and Choice\
    \ problems:\n  1. Left Recursion Removal\n\n*Immediate left recursion:* the left\
    \ recursion occurs only within the production of a single non-terminal.\n\n```\n\
    exp → exp + term | exp - term | term\n```\n\n*Indirect left recursion:*\n\n```\n\
    A → Bb | …\nB → Aa | …\n```\n\n![](img/1db31d392048feae2d803578b3d5a4b9_223_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_223_1.png)\n\n### CASE 1: Simple immediate\
    \ left recursion\n\n```\nA → A α | β\n```\n\nWe rewrite this grammar rule into\
    \ two rules:\n\n```\nA → βA′\nA′ → α A′ | ε\n```\n\n- **EXAMPLE:**\n\n```\nexp\
    \ → exp addop term | term\nexp → term exp′\nexp′ → addop term exp′ | ε\n```\n\n\
    ![](img/1db31d392048feae2d803578b3d5a4b9_224_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_224_1.png)\n\
    \n### CASE 2: General immediate left recursion\n\n```\nA → A α₁ | A α₂ | … | A\
    \ αₙ | β₁ | β₂ | … | βₘ\n```\n\nwhere none of β₁, …, βₘ begin with A.\n\nThe solution\
    \ is similar to the simple case:\n\n```\nA → β₁A′ | β₂A′ | … | βₘA′\nA′ → α₁A′\
    \ | α₂A′ | … | αₙA′ | ε\n```\n\n- **EXAMPLE:**\n\n```\nexp → exp + term | exp\
    \ - term | term\n```\n\nremove the left recursion as follows:\n\n```\nexp → term\
    \ exp′\nexp′ → + term exp′ | - term exp′ | ε\n```\n\n![](img/1db31d392048feae2d803578b3d5a4b9_225_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_225_1.png)\n"
  mdcn: "\n## 4.2.2 The LL(1) Parsing Table and Algorithm\n\n- Definition of **LL(1)**\
    \ Grammar:\n  - A grammar is an **LL(1)** grammar if the associated **LL(1)**\
    \ parsing table has at most one production in each table entry.\n  - An **LL(1)**\
    \ grammar cannot be ambiguous.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_216_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_216_1.png)\n\n- A Parsing Algorithm\
    \ Using the LL(1) Parsing Table:\n\n```\npush the start symbol onto the top of\
    \ the parsing stack;\nwhile the top of the parsing stack ≠ $ and the next\n  \
