  mdcn: "\n## 3.2.3 Derivations and the language defined by a grammar\n\n- **Derivation:**\
    \ Grammar rules determine the legal strings of token symbols by means of derivations.\n\
    - **A derivation** is a sequence of replacements of structure names by choices\
    \ on the right-hand sides of grammar rules.\n- **A derivation** begins with a\
    \ single structure name and ends with a string of token symbols.\n- At each step\
    \ in a derivation, a single replacement is made using one choice from a grammar\
    \ rule.\n\nfigure 3.1 : a derivation\n\n```\n• exp → exp op exp | (exp) | number\n\
    • op → + | − | *\n```\n\n- (1) exp => exp op exp\n- (2) => exp op number\n- (3)\
    \ => exp * number\n- (4) => ( exp ) * number\n- (5) => { exp op exp ) * number\n\
    - (6) => (exp op number) * number\n- (7) => (exp - number) * number\n- (8) =>\
    \ (number - number) * number\n\n```\n[exp → exp op exp]\n[exp → number]\n[op →\
    \ *]\n[exp → ( exp )]\n[exp → exp op exp]\n[exp → number]\n[op → −]\n[exp → number]\n\
    ```\n\n- 1、*G* represents the expression grammar\n- 2、*s* represents an arbitrary\
    \ string of token symbols (sometimes called a **sentence**)\n- 3、the symbols =>*\
    \ stand for a derivation consisting of a sequence of replacements as described\
    \ earlier.\n- 4、Grammar rules are sometimes called productions because they \"\
    produce\" the strings in *L(G)* via derivations.\n\n- **the start symbol:** the\
    \ most general structure is listed first in the grammar rules.\n- **nonterminals:**\
    \ structure names are also called nonterminals, since they always must be replaced\
    \ further on in a derivation.\n- **terminals:** symbols in the alphabet are called\
    \ terminals, since they terminate a derivation. Terminals are usually tokens in\
    \ compiler applications.\n\n- The grammar for a programming language often defines\
    \ a structure called **program**,\n- the language of this structure is the set\
    \ of all syntactically legal programs of the programming language.\n- For example\
