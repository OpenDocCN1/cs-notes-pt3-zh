    \n+   - inherited attributes: computed by a preorder traversal, or combined preorder/inorder\
    \ traversal of the parse or syntax tree, represented by the following pseudocode:\n\
    \n```\nProcedure PreEval(T: treenode);\nBegin\n    For each child C of T do\n\
