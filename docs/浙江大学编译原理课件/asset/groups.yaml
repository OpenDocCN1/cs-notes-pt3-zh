  - '[PAGE 79]


    # 2.4.2 from an NFA to a DFA


    # 2、the *Subset Construction*:


    +   1) compute the ε-closure of the start state of *M*; this becomes the start
    state.


    +   2) Given a set S of states and a character *a* in the alphabet, compute the
    set S′ₐ = {t | for some s in S there is a transition from s to t on *a*}. Then,
    compute the ε-closure of S′ₐ.


    +   3) Continue with this process until no new states or transitions are created.


    Mark as accepting those states constructed in this manner that contain an accepting
    state of M.


    ![](img/1db31d392048feae2d803578b3d5a4b9_79_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_79_1.png)'
