  - "[PAGE 565]\n\n# 7.3.1 Stack-Based Environments Without Local Procedures\n\n#\
    \ Local Temporaries and Nested Declarations\n\n+   - Local temporaries are partial\
    \ results of computations that must be saved across procedure calls, for example:\n\
    +   \n+     `x[i] = (i + j) * (i/k + f(j))`\n\n+   - The three partial results\
    \ need to be saved across the call to f:\n+   \n+     The address of x[i];\n+\
    \   \n+     The sum i+j;\n+   \n+     The quotient i/k;\n\n![](img/1db31d392048feae2d803578b3d5a4b9_565_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_565_1.png)"
