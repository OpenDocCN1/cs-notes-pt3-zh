    # 6.3.5 An extended example of an attribute grammar using a symbol table


    # Semantic Rules


    | Grammar Rule | Semantic Rules |

    |---|---|

    | `S→exp` | `exp.symtab = emptytable`<br>`exp.nestlevel = 0`<br>`S.err = exp.err`
    |

    | `exp1→exp2+exp3` | `exp2.symtab=exp1.symtab`<br>`exp3.symtab=exp1.symtab`<br>`exp2.nestlevel=exp1.nestlevel`<br>`exp3.nestlevel=exp1.nestlevel`<br>`exp1.err
    = exp2.err or exp3.err` |

    | `exp1→(exp2)` | `exp2.symtab =exp1.symtab`<br>`exp2.nestlevel = exp1.nestlevel`<br>`exp1.err
    = exp2.err` |

    | `exp→ id` | `exp.err = not isin(exp.symtab, id.name)` |

    | `exp→num` | `exp.err = false` |


