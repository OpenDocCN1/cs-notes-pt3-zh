  mdcn: "\n## 6.2.3 Attributes as parameters and returned values.\n\n- Many attributes\
    \ are the same or are only used temporarily to compute other attribute values,\
    \ needn't be stored as fields in a syntax tree record structure.\n- Inherited\
    \ attributes: computed in preorder, often treated as parameters of the call.\n\
    - Synthesized attributes: computed in postorder, often treated as returned values\
    \ of the call.\n\n### Example 6.15\n\n- The recursive procedure `EvalWithBase`\
    \ of Example 6.13.\n- Turn `base` into a parameter and `val` into a returned value.\n\
    \n```\nbased-num → num basechar\nbasechar → o | d\nnum → num digit | digit\n```\n\
    \n```\nNum:\n    temp := EvalWithBase(left child of T, base);\n    if right child\
    \ of T is not nil then\n        temp2 := EvalWithBase(right child of T, base);\n\
    \        if temp != error and temp2 != error then\n            return base*temp\
    \ + temp2\n        else return error;\n    else return temp;\nBasechar:\n    if\
    \ child of T = 'o' then return 8\n    else return 10;\nDigit:\n    if base = 8\
    \ and child of T = 8 or 9 then return error;\n    else return numval(child of\
    \ T);\nend case;\nend EvalWithBase;\n```\n\n![](img/1db31d392048feae2d803578b3d5a4b9_423_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_423_1.png)\n\n```pascal\nfunction EvalBasedNum(T:\
    \ treenode) : integer;\n(* only called on root node *)\nbegin\n    return EvalNum(left\
    \ child of T, EvalBase(right child of T));\nend;\n\nfunction EvalBase(T: treenode)\
    \ : integer;\n(* only called on basechar node *)\nbegin\n    if child of T = 'o'\
    \ then return 8\n    else return 10;\nend\n```\n\n```pascal\nfunction EvalNum(T:\
    \ treenode; base: integer) : integer;\nvar temp, temp2: integer;\nbegin\n  case\
    \ nodekind of T of\n    Num:\n      temp := EvalNum(left child of T, base);\n\
    \      if right child of T is not nil then\n        temp2 := EvalNum(right child\
    \ of T, base);\n        if temp != error and temp2 != error then\n          return\
    \ base*temp + temp2\n        else return error;\n      else return temp;\n   \
    \ Digit:\n      if base = 8 and child of T = 8 or 9 then return error;\n     \
    \ else return numval(child of T);\n  end case;\nend.\n```\n\n![](img/1db31d392048feae2d803578b3d5a4b9_425_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_425_1.png)\n\n## 6.2.4 The use of external\
    \ data structures to store attributes values.\n\n**Applicability:**\n\n- Not suitable\
    \ to the method of parameters and returned values.\n- Particularly when the attribute\
    \ values have significant structure and may be needed at arbitrary points during\
    \ translation.\n- Not reasonable to be stored in the syntax tree nodes.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_426_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_426_1.png)\n\n**Ways:**\n\n- External\
    \ data structures: tables, graphs and other data structures. One of the prime\
    \ examples is the symbol table.\n- Replace attribute evaluations by calls to procedures\
    \ responsible for maintaining appropriate data structures on the ... the attribute\
    \ ...\n\n![](img/1db31d392048feae2d803578b3d5a4b9_427_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_427_1.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_427_2.png)\n\n## 6.2.5 The computation\
    \ of attributes during parsing.\n\n### Computing synthesized attributes during\
    \ LR parsing\n\nValue stack: store synthesized attributes, be manipulated in parallel\
    \ with the parsing stack.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_431_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_431_1.png)\n\n| Stack | Input | Action\
    \ | State | Attribute computation |\n|---|---|---|---|---|\n| `$` | `3*4+5$` |\
    \ Shift | `$` | |\n| `$n` | `*4+5$` | Reduce E→n | `$n` | `E.val = n.val` |\n\
