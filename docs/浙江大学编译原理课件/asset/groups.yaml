  - '[PAGE 84]


    # 2.4.3 Simulating an NFA using the subset construction


    +   - One way of simulating an NFA is to use the subset construction.

    +     - instead of constructing all the states of the associated DFA,

    +     - construct only the state at each point that is indicated by the next input
    character.

    +   - **The advantage:** not need to construct the entire DFA.

    +   - **The disadvantage:** if the path contains loops, a state may be constructed
    many times,.


    ![](img/1db31d392048feae2d803578b3d5a4b9_84_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_84_1.png)'
  - '[PAGE 85]


    # 2.4.4 Minimizing the number of states in a DFA


    an important result from automata theory states:


    +   - given any DFA, there is an equivalent DFA containing a minimum number of
    states, and that this minimum state DFA is unique (except for renaming of states).

    +   - It is also possible to directly obtain this minimum state DFA from any given
    DFA.


    ![](img/1db31d392048feae2d803578b3d5a4b9_85_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_85_1.png)'
