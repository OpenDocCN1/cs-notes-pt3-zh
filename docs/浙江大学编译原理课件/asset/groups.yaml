    \ block contained in that block\n\n```\nint i, j ;\nint f(int size)\n{ char i,\
    \ temp;\n  …\n  {double j;\n   …\n  }\n  {char * j;\n   …\n  }\n}\n```\n\nafter\
    \ processing the declarations of the body of f\n\nafter processing the declarations\
