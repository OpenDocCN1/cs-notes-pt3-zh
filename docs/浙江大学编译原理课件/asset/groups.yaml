  md: "\n\n# Compile Principle and Technology\n\n## Chapter 1 introduction\n\n###\
    \ Outline\n\n- Course Organization\n  - General course information\n  - Homework\n\
    - Introduction to Compilers\n  - Why do we need compilers?\n  - What are compilers?\n\
    \  - General compiler structure\n\n### Reference book\n\n- Compilers -- Principles,\
    \ Techniques and Tools,(Dragon Book), by Aho, Sethi and Ullman (1986)\n- Modern\
    \ Compiler Implementation in Java(C,ML), by Andrew Appel (2002)\n- 程序设计语言编译原理（第3版），国防工业出版社,陈火旺等\n\
    - Compiler Design in C. Prentice Hall, Allen I. Holub\n- 编译原理与技术,浙江大学出版社,冯雁等编著\n\
    \n### Work Distribution\n\n- Homeworks = 15%\n- Class Quizzes = 20%\n- Final Exams\
    \ = 65%\n\n## Chapter 1 introduction\n\n### Why Take This Course?\n\n#### understand\
    \ compilers/languages:\n\n- Understand the code structure\n- Understand the language\
    \ semantics\n- Understand the relation between source code and generated machine\
    \ code\n- Become a better programmer\n\n### Why Take This Course? (ctd.)\n\nnice\
    \ balance of theory and practice:\n\n#### Theory:\n\n- Lots of mathematical models:\
    \ regular expressions,\n- automata, grammars, graphs, lattices\n- Lots of algorithms\
    \ that use these models\n\n#### Practice:\n\n- Apply theoretical notions to build\
    \ a real compiler\n- Better understand why “theory and practice are the same in\
    \ theory; in practice they are different”\n\n### Why Take This Course? (ctd.)\n\
    \n#### Programming experience\n\n- Write a large program that manipulates complex\
    \ data structures\n- Learn how to be a better programmer in groups\n- Learn more\
    \ about c/c++ and Intel x86 architecture and assembly language\n\n## 1.1 A brief\
    \ history of compiler\n\n- in the late 1940s, programs were written in machine\
    \ language , c7 06 0000 0002\n- assembly language : numeric codes were replaced\
    \ symbolic forms. Mov x, 2\n- assembler : translate the symbolic codes and memory\
    \ location of assembly language into the corresponding numeric codes.\n- Defects\
    \ of the assembly language : difficult to read , write and understanding , dependent\
    \ on the particular machine\n\n## 1.1 A brief history of compiler\n\n- FORTRAN\
    \ language and its compiler: between 1954 and 1957 , developed by the team at\
    \ IBM , John Backus.\n  - The structure of natural language studied by Noam Chomsky,\n\
    \  - The classification of languages according to the complexity of their grammars\
    \ and the power of the algorithms needed to recognize them.\n  - Four levels of\
    \ grammars: type 0 、 type 1、 type2 and type3 grammars\n\n## 1.2 Programs related\
    \ to compilers\n\n- Interpreters\n  - A language translator. It executes the source\
    \ program immediately.\n- Assemblers\n  - A translator translates assembly language\
    \ into object code\n- Linkers\n  - Collects code separately compiled or assembled\
    \ in different object files into a file.\n  - Connects the code for standard library\
    \ functions.\n  - Connects resources supplied by the operating system of the computer.\n\
    \n## 1.2 Programs related to compilers\n\n- Loaders\n  - Loaders resolve all relocatable\
    \ address relative to the starting address.\n- Preprocessors\n  - delete comments,\
    \ include other files, perform macro substitutions.\n- Editors\n  - Produce a\
    \ standard file ( structure based editors)\n- Debuggers\n  - Determine execution\
    \ errors in a compiled program.\n\n"
