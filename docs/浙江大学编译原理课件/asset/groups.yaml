  - "[PAGE 278]\n\n# # 4.5 Error Recovery in Top-Down Parsers\n\n+   - **Note: checkinput\
    \ is called twice in each procedure**\n+   \n+     (1) once to verify that a token\
    \ in the First set in the next token in the input;\n+   \n+     (2) a second time\
    \ to verify that a token in the Follow set is the next token on exit.\n+   \n\
    +   - **This form of panic mode will generate reasonable errors.**\n\nFor example,\
    \ (2+-3)*4+-5 will generate exactly two error messages,\n\n(1) one at the first\
    \ minus sign, and\n\n(2) one at the second plus sign.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_278_0.png)\n\
