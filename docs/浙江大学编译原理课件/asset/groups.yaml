  - '[PAGE 434]


    # # 6.2.5 The computation of attributes during parsing.


    inheriting a previously computed synthesized attributes during LR parsing


    +   • The question can be settled through a ε-production as follows


    | Grammar Rule | Semantic Rules |

    |---|---|

    | A→BDC | |

    | B→... | {computer B.s} |

    | D→ε | saved_i=f(valstack[top]) |

    | C→... | {now saved_i is available} |


    +   • In Yacc this process is made easier. The action of storing the computed
    attribute is simply written at the place in the rule where it is to be scheduled:

    +   A: B { saved_i=f($1);} C;'
