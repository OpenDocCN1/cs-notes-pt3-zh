  - '[PAGE 160]


    # ## 3.4.1 Ambiguity grammars


    To remove the given ambiguity in our simple expression grammar:


    +   - state a disambiguating rule that establishes the relative precedences of
    the three operations represented.


    +   - the associativity of each of the operations of addition, subtraction, and
    multiplication.


    ![](img/1db31d392048feae2d803578b3d5a4b9_160_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_160_1.png)'
  - '[PAGE 161]


    # 3.4.1 Ambiguity grammars


    specify that an operation is nonassociative, in that a sequence of more than one
    operator in an expression is not allowed.


    ```

    exp → factor op factor | factor

    factor → ( exp ) | number

    op → + | - | *

    ```


    ![](img/1db31d392048feae2d803578b3d5a4b9_161_0.png)'
  - "[PAGE 162]\n\n# 3.4.2 Precedence and associativity\n\n+   • group the operators\
    \ into groups of equal precedence, and for each precedence we must write a different\
    \ rule.\n+   \n+   • For example, the precedence of multiplication over addition\
    \ and subtraction can be added to our simple expression grammar as follows:\n\n\
    ```\nexp    → exp addop exp | term\naddop  → + | -\nterm   → term mulop term |\
    \ factor\nmulop  → *\nfactor → ( exp ) | number\n```"
  - '[PAGE 163]


    # ## 3.4.2 Precedence and associativity


    +   - **addition** and **subtraction** will appear "higher" (that is, closer to
    the root) in the parse and syntax trees, and thus receive lower precedence.


    +   - a precedence cascade: a grouping of operators into different precedence
    levels is a standard method in syntactic specification using **BNF**.


    ![](img/1db31d392048feae2d803578b3d5a4b9_163_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_163_1.png)'
  - '[PAGE 164]


    # 3.4.2 Precedence and associativity


    +   - a left recursive rule makes its operators associate on the left

    +   - a right recursive rule makes them associate on the right.


    *exp* → *exp addop exp* | *term*


    replacing the rule by


