    \ data types,\n\n- integer a, b[100];  (C declaration)\n\n- integer a, b(100)\
    \   (FORTRAN declaration)\n\n- Variable declarations may also bind other attributes\
    \ implicitly: _the scope of a declaration_.\n\n- an attribute of variables related\
    \ to scope that is also implicitly or explicitly bound is _the allocation of memory\
    \ for the declared variable_ and _the duration during execution of the allocation_\
    \ (lifetime or extent of the declaration)\n\n### procedure/function declarations\n\
    \n- include explicit and implicit declarations\n\ndeclarations are attached to\
    \ executable instructions without explicit mention.\n\n## 6.3.3 Scope rules and\
    \ block structure\n\n- two rules:\n  - declaration before use\n  - the most closely\
    \ nested rule for block structure\n\n### declaration before use\n\n- used in C\
    \ and Pascal, that requires a name be declared prior to any references to the\
    \ name.\n\n- Declaration before use permits\n\n- the symbol table to be built\
    \ as parsing proceeds.\n\n- lookups to be performed as soon as a name reference\
    \ is encountered in the code.\n\n- If the lookup fails\n\n- a violation of declaration\
    \ before use has occurred,\n\n- the compiler will issue an appropriate error message.\n\
