    \ FORTRAN77\n  - (2) stack-based environment; C C++\n  - (3) fully dynamic environment;\
    \ LISP\n\n## 7.1 Memory Organization During Program Execution\n\n- **The memory\
    \ of a typical computer:**\n  - A register area;\n  - Addressable Random access\
    \ memory(RAM):\n    - A code area\n    - A data area\n\n![](img/1db31d392048feae2d803578b3d5a4b9_532_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_532_1.png)\n\nThe general organization\
    \ of runtime storage\n\n![](img/1db31d392048feae2d803578b3d5a4b9_533_0.png)\n\n\
    ## Procedure activation record\n\n| Space for arguments (parameters) |\n| Space\
    \ for bookkeeping information, including return address |\n| Space for local data\
    \ |\n| Space for local temporaries |\n\nDepending on the language, activation\
    \ records may be allocated in different areas:\n- Fortran77 in the static area;\n\
    - C and Pascal in the stack area; referred to as stack frames\n- LISP in the heap\
    \ area.\n\n## Processor registers\n\nProcessor registers are also part of the\
    \ structure of the runtime environment.\n\nSpecial-purpose registers to keep track\
    \ of execution\n\n- PC program counter;\n- SP stack pointer;\n- FP frame pointer;\n\
    - AP argument pointer\n\n![](img/1db31d392048feae2d803578b3d5a4b9_536_0.png)\n\
    \n## calling sequence\n\n- The allocation of memory for the activation record;\n\
    - The computation and storing of the arguments;\n- The storing and setting of\
    \ necessary registers to affect the call\n\nreturning sequence\n\n- The placing\
    \ of the return value where it can be accessed by the caller;\n- The readjustment\
    \ of registers;\n- The possible releasing for activation record memory.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_538_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_538_1.png)\n\n## 7.2 Fully Static Runtime\
    \ Environments\n\nThe entire program memory\n\n| Memory section | Contents |\n\
    |---|---|\n| Code area | Code for main procedure<br>Code for procedure 1<br>…<br>Code\
    \ for procedure n |\n| | Global data area |\n| Data area | Activation record of\
    \ main procedure<br>Activation record of procedure 1<br>…<br>Activation record\
    \ of procedure n |\n\n![](img/1db31d392048feae2d803578b3d5a4b9_540_0.png)\n\n\
    ![](img/1db31d392048feae2d803578b3d5a4b9_540_1.png)\n\n# The entire program memory\n\
    \n- The global variables and all variables are allocated statically.\n- Each procedure\
    \ has only a single activation record.\n- All variables ( local or global) can\
    \ be accessed directly via fixed address.\n- No extra information about the environment\
    \ needs to be kept in an activation record.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_541_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_541_1.png)\n\n"
