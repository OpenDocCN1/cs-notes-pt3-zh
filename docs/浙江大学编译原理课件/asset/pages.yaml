- pgno: 213
  md: '# # 4.2.2 The LL(1) Parsing Table and Algorithm


    +   - The general LL(1) Parsing table definition:

    +     - The table is a two-dimensional array indexed by non-terminals and terminals

    +     - The table contains production choices to use at the appropriate parsing
    step, which called M[N,T].

    +   - N is the set of non-terminals of the grammar;

    +   - T is the set of terminals or tokens (including $);

    +   - Any entrances remaining empty represent potential errors.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# 4.2.2 The LL(1) Parsing Table and Algorithm


    • The table-constructing rule:


    +   (1) If $A\to\alpha$ is a production choice, and there is a derivation $\alpha\Rightarrow^*
    a\beta$, where $a$ is a token, then add $A\to\alpha$ to the table entry $M[A,a]$;


    +   (2) If $A\to\alpha$ is a production choice, and there are derivations $\alpha\Rightarrow^*\varepsilon$
    and $S\Rightarrow^*\beta A a\gamma$, where $S$ is the start symbol and $a$ is
    a token (or $\$$), then add $A\to\alpha$ to the table entry $M[A,a]$;


