- pgno: 320
  md: '# 5.3 SLR(1) Parsing


    •Definition:


    The SLR(1) parsing algorithm.


    +   1. If state s contains any item of form A → α·Xβ, then the action is to shift
    the current input token onto the stack, and the new state to be pushed on the
    stack is the state containing the item A → αX·β.


    +   2. If state s contains the complete item A → γ·, and the next token in the
    input string is in Follow(A), then the action is to reduce by the rule A → γ.


    ![](img/1db31d392048feae2d803578b3d5a4b9_320_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_320_1.png)'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# 5.3.1 The SLR(1) Parsing Algorithm


    +   - A reduction by the rule S'' → S, where S'' is the start state, this will
    happen only if the next input token is $.

    +   - Remove the string γ and all of its corresponding states from the parsing
    stack.

    +   - Back up in the DFA to the state from which the construction of γ began.

    +   - This state must contain an item of the form B → α·Aβ. Push A onto the stack,
    and push the state containing the item B → αA·β.


    3. If the next input token is such that neither of the above two cases applies,
    an error is declared.


    ![](img/1db31d392048feae2d803578b3d5a4b9_321_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_321_1.png)'
