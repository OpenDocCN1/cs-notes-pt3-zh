- pgno: 282
  md: "# 4.5.2 Error Recovery in LL(1) Parsers\n\n+   • Given a non-terminal A at\
    \ the top of the stack and an input token that is not in First(A) (or Follow(A),\
    \ if ε is in First(A)), there are three possible alternative:\n+   \n+   1. Pop\
    \ A from the stack.\n+   2. Successively pop tokens from the input until a token\
    \ is seen for which we can restart the parse.\n+   3. Push a new non-terminal\
    \ onto the stack\n\n![](img/1db31d392048feae2d803578b3d5a4b9_282_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_282_1.png)"
