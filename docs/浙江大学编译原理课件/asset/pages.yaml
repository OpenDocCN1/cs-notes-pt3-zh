  md: '# 2.3.2 Lookahead, backtracking and nondeterministic automata


    ε-transitions are useful in two ways.


    **First:** they can express a choice of alternatives in a way that does not involve
    combining states. *Advantage:* keeping the original automata intact and only adding
    a new start state to connect them.


    **Second:** they can explicitly describe a match of the empty string.


