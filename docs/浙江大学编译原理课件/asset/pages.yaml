- pgno: 504
  md: '# 6.4.3 Type equivalence


    # Declaration equivalence


    +   - weaker version of name equivalence

    +     `t2 = t1;` are interpreted as establishing type aliases, rather than new
    types.

    +   - Every type name is equivalent to some base type name, which is either a
    predefined type or is given by a type expression resulting from the application
    of a type constructor.


    ```

    t1 = array [10] of int;

    t2 = array [10] of int;

    t3 = t1;

    ```


    type names t1 and t3 are equivalent under declaration equivalence, but neither
    is equivalent to t2.


    ![](img/1db31d392048feae2d803578b3d5a4b9_504_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_504_1.png)'
