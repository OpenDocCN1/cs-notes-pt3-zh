- pgno: 549
  md: "# 7.3.1 Stack-Based Environments Without Local Procedures\n\nIn a language\
    \ where **all procedures are global** (such as C language), the stack-based environment\
    \ requires two things\n\n+   1. Frame pointer or fp, a pointer to the current\
    \ activation record to allow access to local variable.\n+   \n+      *control\
    \ link or dynamic link*, a point to a record of the immediately preceding activation.\n\
    +   \n+   2. Stack pointer or sp, a point to the last location allocated on the\
    \ call stack.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_549_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_549_1.png)"
  merge: -1
  img_proc: true
- pgno: 550
  md: "# 7.3.1 Stack-Based Environments Without Local Procedures\n\n# Example\n\n\
    ```\n```c\n#include <stdio.h>\nint x,y;\nint gcd(int u,int v)\n{ if (v==0) return\
    \ u;\n        else return gcd(v, u%v);\n}\n\nmain()\n{scanf(\"%d%d\",&x,&y);\n\
    printf(\"%d\\n\",gcd(x,y));\nreturn 0;\n}\n```\n```\n\n![](img/1db31d392048feae2d803578b3d5a4b9_550_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_550_1.png)"
