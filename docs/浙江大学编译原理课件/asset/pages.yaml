- pgno: 525
  md: "# # Example: A FORTRAN77 sample program\n\n```\nSUBROUTINE   QUADMEAN(A, SIZE,QMEAN)\n\
    COMMON   MAXSIZE\nINTEGER   MAXSIZE,SIZE\nREAL A(SIZE),QMEAN,TEMP\nINTEGER K\n\
    TEMP=0.0\nIF ((SIZE .GT. MAXSIZE) .OR. (SIZE .LT. 1) GOTO 99\nDO 10 K=1,SIZE\n\
    \   TEMP=TEMP+A(K)*A(K)\n10   CONTINUE\n99   QMEAN = SQRT(TEMP/SIZE)\nRETURN\n\
    END\n```"
