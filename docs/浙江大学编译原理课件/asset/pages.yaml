  md: '# ## 2.4.4 Minimizing the number of states in a DFA


    # ### Given the algorithm as follow:


    +   1、 It begins with the most optimistic assumption possible: it creates two
    sets

    +   one consisting of all the accepting states

    +   the other consisting of all the nonaccepting states.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# 2.4.4 Minimizing the number of states in a DFA


    2、Given this partition of the states of the original DFA, consider the transitions
    on each character *a* of the alphabet.


    If all accepting states have transitions on *a* to accepting states,


    defines an *a*-transition from the new accepting state (the set of all the old
    accepting states) to itself.


    If all accepting states have transitions on *a* to nonaccepting states,


    defines an *a*-transition from the new accepting state to the new nonaccepting
    state (the set of all the old nonaccepting states).


    If there are two accepting states *s* and *t* that have transitions on *a* that
    land in different sets,


    no a transition can be defined for this grouping of the states. We say that *a*
    distinguishes the states *s* and *t*.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "# 2.4.4 Minimizing the number of states in a DFA\n\nIf there are accepting\
    \ states $s$ and $t$ such that $s$ has an $a$-transition to another accepting\
    \ state, while $t$ has no $a$-transition at all (i.e., an error transition),\n\
    then $a$ distinguishes $s$ and $t$.\nIf any further sets are split, we must return\
    \ and repeat the process from the beginning.\n\nThis process continues until\n\
    \n+   (1) all sets contain only one element (in which case, we have shown the\
    \ original DFA to be minimal)\n+   \n+   (2) until no further splitting of sets\
    \ occurs.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_89_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_89_1.png)"
