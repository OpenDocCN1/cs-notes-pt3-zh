  md: '# 4.2.2 The LL(1) Parsing Table and Algorithm


    +   - Definition of **LL(1)** Grammar:

    +     - A grammar is an **LL(1)** grammar if the associated **LL(1)** parsing
    table has at most one production in each table entry.

    +     - An **LL(1)** grammar cannot be ambiguous.


