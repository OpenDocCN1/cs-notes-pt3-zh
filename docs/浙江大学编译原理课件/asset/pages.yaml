- pgno: 376
  md: '# 6.1.1 Attribute grammars


    +   X.a : the value of a associated to X

    +   X is a grammar symbol and a is an attribute associated to X.


    +   syntax-directed semantics: attributes are associated directly with the grammar
    symbols of the language.


    +   Given attributes a₁, a₂, ... , aₖ, for each grammar rule X₀→X₁ X₂ ... Xₙ (
    X₀ is a nonterminal ), the values of the attributes Xᵢ.aⱼ of each grammar symbol
    Xᵢ are related to the values of the attributes of the other symbols in the rule.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# 6.1.1 Attribute grammars


    +   • An attribute grammar for attributes a₁, a₂, ... , aₖ is the collection of
    all attribute equations or semantic rules of the following form, for all the grammar
    rules of the language.

    +   Xᵢ.aⱼ=fᵢⱼ(X₀.a₁,...,X₀.aₖ, X₁.a₁, ..., X₁.aₖ,...Xₙ.a₁, ...Xₙ.aₖ)

    +   fᵢⱼ is a mathematical function of its arguments'
