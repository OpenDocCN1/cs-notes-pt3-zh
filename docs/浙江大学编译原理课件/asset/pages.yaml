- pgno: 231
  md: '# # 4.2.3 left Recursion Removal and Left Factoring


    +   - Left recursion removal not changes the language, but Change the grammar
    and the parse tree.

    +   - This change causes a complication for the parser.


    +   - Example: Simple arithmetic expression grammar

    +     After removal of the left recursion.

    +     exp → term exp’

    +     exp’→ addop term exp’ | ε

    +     addop → + |-|

    +     term → factor term’

    +     term’ → mulop factor term’ | ε

    +     mulop → *

    +     factor →(expr) | number'
