- pgno: 139
  md: '# ### 3.3.1 Parse trees


    it is possible to distinguish particular derivations that are uniquely associated
    with the parse tree.


    +   - **A left-most derivation**: a derivation in which the leftmost nonterminal
    is replaced at each step in the derivation.

    +     - Corresponds to the preorder numbering of the internal nodes of its associated
    parse tree.


    +   - **A rightmost derivation**: a derivation in which the rightmost nonterminal
    is replaced at each step in the derivation.

    +     - Corresponds to the postorder numbering of the internal nodes of its associated
    parse tree.'
