- pgno: 351
  md: '# # 5.7 ERROR RECOVERY IN BOTTOM-UP PARSERS


    +   - A good error recovery in bottom-up parsers: removing symbol from either
    the parsing stack or the input or both.


    +   - There are three possible alternative actions:


    +   1. Pop a state from the stack.


    +   2. Successively pop tokens from the input until a token is seen for which
    we can restart the parse.


    +   3. push a new state onto the stack.'
  merge: -1
  img_proc: true
- pgno: 352
  md: "# 5.7 ERROR RECOVERY IN BOTTOM-UP PARSERS\n\n+   1. **Pop** states from the\
    \ parsing stack until a state is found with nonempty Goto entries.\n+   \n+  \
    \ 2. If there is a legal action on the current input token from one of the Goto\
    \ states, **push** that state onto the stack and restart the parse.\n+   \n+ \
    \  3. If there is no legal action on the current input token from one of the Goto\
    \ states, **advance** the input.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_352_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_352_1.png)"
