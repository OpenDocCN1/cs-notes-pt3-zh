  md: '# 3.4.1 Ambiguity grammars


    +   - **an ambiguous grammar**: a grammar that generates a string with two distinct
    parse trees is called an ambiguous grammar.


    +   - Such a grammar represents a serious problem for a parser.


    +   - it does not specify precisely the syntactic structure of a program.


    ![](img/1db31d392048feae2d803578b3d5a4b9_157_0.png)


