  md: '# 4.3.2 Follow Sets


    +   - Follow sets work “on the right” in production

    +   - First sets work “on the left” in the production.

    +   - Given a grammar rule A → α B, Follow(B) will contain Follow(A), the opposite
    of the situation for first sets, if A → B α, First(A) contains First(B), except
    possibly for ε.


