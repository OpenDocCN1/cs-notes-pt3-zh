  md: '# 5.7 ERROR RECOVERY IN BOTTOM-UP PARSERS


    +   - An LR(1) parser can, for example, detect errors earlier than an LALR(1)
    or SLR(1) parser, and these latter can detect errors earlier than an LR(0) parser.


