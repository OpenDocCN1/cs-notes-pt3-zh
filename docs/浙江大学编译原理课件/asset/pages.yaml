- pgno: 217
  md: "# 4.2.2 The LL(1) Parsing Table and Algorithm\n\n• A Parsing Algorithm Using\
    \ the LL(1) Parsing Table:\n\n```\npush the start symbol onto the top the parsing\
    \ stack;\nwhile the top of the parsing stack ≠ $ and the next\n    input token\
    \ ≠ $ do\n    if the top of the parsing stack is terminal a\n        and the next\
    \ input token = a\n    then (* match *)\n        pop the parsing stack;\n    \
    \    advance the input;\n    else if the top of the parsing stack is non-terminal\
    \ A\n        and the next input token is terminal a\n        and parsing table\
    \ entry M[A,a] contains production\nA→X1X2....Xn\n```"
