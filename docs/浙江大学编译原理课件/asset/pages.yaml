- pgno: 497
  md: "# 6.4.3 Type equivalence\n\n# Structural equivalence\n\n+   - two types are\
    \ the same if and only if they have the same structure.\n+   - two types are the\
    \ same if and only if they have syntax trees that are identical in structure.\n\
    \n```\nfunction typeEqual (t1,t2:TypeExp): Boolean:\nvar temp: Boolean;\n    p1,\
    \ p2: TypeExp;\nBegin\n        If t1 and t2 are of simple type then return t1=t2;\n\
    \        Else if t1.kind = array and t2.kind = array then\n                  \
    \  return t1.size = t2.size and TypeEqual(t1.child1, t2.child1)\n        Else\
    \ if t1.kind = record and t2.kind = record\n                or t1.kind = union\
    \ and t2.kind = union then\n            begin\n            p1 :=t1.child1;\n \
    \           p2 :=t2.child1;\n            temp :=true;\n```\n\n![](img/1db31d392048feae2d803578b3d5a4b9_497_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_497_1.png)"
  merge: -1
  img_proc: true
- pgno: 498
  md: "# 6.4.3 Type equivalence\n\n# Structural equivalence\n\n```\nwhile temp and\
    \ p1 != nil and p2!=nil do\n    If p1.name !=p2.name then\n        temp := false\n\
    \    else if not typeEqual(p1.child1, p2.child1)\n    then temp := false\n   \
    \ else begin\n        p1 := p1.sibling;\n        p2 := p2.sibling;\n    end;\n\
    \    return temp and p1 = nil and p2 = nil;\nend\nelse if t1.kind = pointer and\
    \ t2.kind = pointer then\n    return typeEqual(t1.child1, t2.child1)\n```\n\n\
    ![](img/1db31d392048feae2d803578b3d5a4b9_498_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_498_1.png)"
