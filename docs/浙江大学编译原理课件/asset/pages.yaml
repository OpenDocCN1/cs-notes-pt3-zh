    +     1. Such trees represent abstractions of the actual source code token sequences,\
    \ and *the token sequences cannot be recovered from them (unlike parse trees).*\
    \ \n+     2. a parse tree is a representation for the structure of ordinary called\
    \ **concrete syntax** when comparing it to **abstract syntax**.\n+     3. **abstract\
    \ syntax** can be given a formal definition using a BNF-like notation, just like\
    \ concrete syntax.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_144_0.png)\n\n\
