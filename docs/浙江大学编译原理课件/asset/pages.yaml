- pgno: 370
  md: '# # 6.1 Attributes and attribute grammars


    +   - Attributes: any property of a programming language construct such as

    +     - The data type of a variable

    +     - The value of an expression

    +     - The location of a variable in memory

    +     - The object code of a procedure

    +     - The number of significant digits in a number

    +   - Attributes may be fixed prior to the compilation process.

    +   - Attributes may be only determinable during program execution.'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# # 6.1 Attributes and attribute grammars


    +   - **Binding** of the attribute: the process of computing an attribute and
    associating its computed value with the language construct in question.

    +   - **Binding time**: the time during the compilation/execution process when
    the binding of an attribute occurs.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# 6.1 Attributes and attribute grammars


    +   - Binding times of different attributes vary, and even the same attributes
    that can have quite different binding times from language to language.


    +   - **Static attributes/Dynamic attributes:** Based on the difference of the
    binding time

    +     - be bound prior to execution

    +     - be bound during execution


