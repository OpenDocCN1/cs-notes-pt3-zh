  md: '# 4.5.2 Error Recovery in LL(1) Parsers


    +   - Panic mode error recovery can be implemented in LL(1) parsers

    +     - A new stack is required to keep the synchset parameters;

    +     - A call to checkpoint must be scheduled by the algorithm before each generate
    action of the algorithm;


    +   - The primary error situation occurs

    +     - the current input token is not in First(A) (or Follow(A), if ε is in First(A)),
    A is the non-terminal at the top of the stack.


