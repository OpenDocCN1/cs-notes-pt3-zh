- pgno: 230
  md: '# # 4.2.3 left Recursion Removal and Left Factoring


    (2) when i=2, the inner loop execute once, with j=1.


    To eliminate the rule B→Ab by replacing A with it choices


    +   A→BaA''| c A''

    +   A''→aA''| ε

    +   B→Bb| BaA''b|cA''b| d


    +   A→BaA''| c A''

    +   A''→aA''| ε

    +   B→Bb| Ab| d


    (3) remove the immediate left recursion of B to obtain


    +   A→BaA''| c A''

    +   A''→aA''| ε

    +   B→cA''bB''| dB''

    +   B''→bB'' |aA''bB''|ε


    Now, the grammar has no left recursion.'
