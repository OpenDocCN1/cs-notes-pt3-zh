- pgno: 263
  md: '# # 4.3.3 Constructing LL(1) Parsing Tables


    the following algorithmic construction of the LL(1) parsing table:


    Repeat the following two steps for each non-terminal A and production choice A→
    α.


    +   1. For each token a in First(α), add A→α to the entry M[A,a].


    +   2. If ε is in First(α), for each element a of Follow(A) ( a token or $), add
    A→α to M[A,a].


