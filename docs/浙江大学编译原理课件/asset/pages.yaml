- pgno: 47
  md: "# 2.3.2 Lookahead, backtracking and nondeterministic automata\n\n# A typical\
    \ action\n\n+   1. **making a transition:** move the character from the input\
    \ string to a string (the token string value or lexeme of the token)\n+   \n+\
    \   2. **reaching an accepting state:** return the token just recognized, along\
    \ with any associated attributes.\n+   \n+   3. **reaching an error state:** either\
    \ back up in the input (backtracking) or to generate an error token.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_47_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_47_1.png)"
