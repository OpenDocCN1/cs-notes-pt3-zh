- pgno: 41
  md: '# 2.3.1 Definite of Deterministic finite automation(DFA)


    +   - **DFA:** automata where the next state is uniquely given by the current
    state and the current input character.


    +   - **Definition of a DFA:**


    A DFA (deterministic finite automation) M consist of an alphabet Σ, a set of states
    S, a transition function T: S × Σ → S, a start state s₀ ∈ S, and a set of accepting
    states A ⊆ S. The language accepted by M, written L(M), is defined to be the set
    of strings of characters c₁c₂c₃…cₙ with each cᵢ ∈ Σ such that there exist states
    s₁ = t(s₀, c₁), s₂ = t(s₁, c₂), …, sₙ = T(sₙ₋₁, cₙ), with sₙ an element of A.


    ![](img/1db31d392048feae2d803578b3d5a4b9_41_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_41_1.png)'
  merge: -1
  img_proc: true
- pgno: 42
  md: "# ## 2.3.1 Definite of Deterministic finite automation(DFA)\n\n+   - Accepting\
    \ state sn means the diagram:\n+     → S0 → S1 → S2 → ..........Sn-1 → Sn\n\n\
    +   - **some difference:**\n+     1) the definition does not restrict the set\
    \ of states to numbers\n+   \n+     2) we have not labeled the transitions with\
    \ characters but with names representing a set of characters\n+   \n+     3) definitions\
    \ T: S ×Σ → S , T(s, c) must have a value for every s and c.\n+   \n+     In the\
    \ diagram, T (start,c) defined only if c is a letter, T(in_id, c) is defined only\
    \ if c is a letter or a digit.\n+   \n+     Error transitions are not drawn in\
    \ the diagram"
  merge: -1
