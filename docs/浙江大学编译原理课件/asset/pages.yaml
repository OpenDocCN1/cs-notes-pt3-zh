  md: '# 4.2.2 The LL(1) Parsing Table and Algorithm


    +   - **Purpose of the LL(1) Parsing Table:**

    +     - To express the possible rule choices for a non-terminal A: A is at the
    top of parsing stack, based on the current input token (the look-ahead).


    +   - **The LL(1) Parsing table for the following simple grammar:**


    $S \rightarrow (S)S \mid \varepsilon$


    | M[N,T] | ( | ) | $ |

    |---|---|---|---|

    | S | S→(S)S | S→ε | S→ε |


    ![](img/1db31d392048feae2d803578b3d5a4b9_212_0.png)


