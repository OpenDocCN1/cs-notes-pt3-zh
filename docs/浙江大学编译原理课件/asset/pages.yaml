- pgno: 158
  md: "# 3.4.1 Ambiguity grammars\n\nTwo basic methods:\n\n+   1. a rule: that specifies\
    \ in each ambiguous case which of the parse trees (or syntax trees) is the correct\
    \ one.\n+   \n+      Such a rule is called a **disambiguating rule**.\n\n+   ➢\
    \ **The advantage:** it corrects the ambiguity without changing (and possibly\
    \ complicating) the grammar.\n\n+   ➢ **The disadvantage:** the syntactic structure\
    \ of the language is no longer given by the grammar alone.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_158_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_158_1.png)"
