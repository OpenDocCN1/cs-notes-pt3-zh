- pgno: 184
  md: '# 3.6 Formal properties of context-free language


    **definition**: A context-free grammar consists of the following:


    +   1. A set T of **terminals**.

    +   2. A set N of **nonterminals** (disjoint from T).

    +   3. A set P of **productions**, or **grammar rules**, of the form A → a, where
    A is an element of N and a is an element of (T ∪ N)* (a possibly empty sequence
    of terminals and nonterminals).

    +   4. A **start symbol** S from the set N.


    ![](img/1db31d392048feae2d803578b3d5a4b9_184_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_184_1.png)'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# # 3.6.1 A formal definition of context-free language


    +   - Let G be a grammar as defined above, G = (T, N, P, S).

    +   - A derivation step over G is of the form a A γ => a β γ,

    +     where a and γ are elements of (T ∪ N)* and A → β is in P.


    +   - **the set of symbols**: The union T ∪ N of the sets of terminals and nonterminals

    +   - **a sentential form**: a string a in (T ∪ N)*.'
  merge: -1
  img_proc: true
- pgno: 186
  md: "# 3.6.1 A formal definition of context-free language\n\n+   - **α ⇒* β** if\
    \ and only if there is a sequence of 0 or more derivation steps (n >= 0)  \n+\
    \     α₁ ⇒ α₂ ⇒ ... ⇒ αₙ₋₁ ⇒ αₙ such that α = α₁, and β = αₙ  \n+     (If n =\
    \ 0, then α = β)\n\n+   - **A derivation over the grammar G is of the form S ⇒*\
    \ w, where w ∈ T***  \n+     w is a string of terminals only, called a **sentence**.\
    \  \n+     S is the start symbol of G.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_186_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_186_1.png)"
  merge: -1
  img_proc: true
- pgno: 187
  md: '# 3.6.1 A formal definition of context-free language


    • The **language generated by G**, written *L(G)*, is defined:


    L(G) = {w ∈ T* | there exists a derivation S =>* w of G}.


    • A **leftmost derivation** S =>*ₗₘ w is a derivation each derivation step a A
    γ => a β γ, is such that a ∈ T*; that is, a consists only of terminals.


    • A **rightmost derivation** is one each derivation step a A γ => a β γ has the
    property that γ ∈ T*.


    ![](img/1db31d392048feae2d803578b3d5a4b9_187_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_187_1.png)'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 3.6.1 A formal definition of context-free language


    # •A parse tree over the grammar G is a rooted labeled tree with the following
    properties:


    +   1. Each node is labeled with a terminal or a nonterminal or ε.


    +   2. The root node is labeled with the start symbol S.


    +   3. Each leaf node is labeled with a terminal or with ε.


    +   4. Each nonleaf node is labeled with a nonterminal.


    +   5. If a node with label A ∈ N has n children with labels X₁, X₂,..., Xₙ (which
    may be terminals or nonterminals), then A → X₁X₂ ... Xₙ ∈ P (a production of the
    grammar).'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# # 3.6.1 A formal definition of context-free language


    +   - Each derivation gives rise to a parse tree.

    +   - In general, many derivations may give rise to the same parse tree.

    +   - Each parse tree, however, has a unique leftmost and right-most derivation
    that give rise to it.

    +   - The leftmost derivation corresponds to a preorder traversal of the parse
    tree,.

    +   - The rightmost derivation corresponds to the reverse of a postorder traversal
    of the parse tree'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# # 3.6.1 A formal definition of context-free language


    +   • A grammar G is **ambiguous** if there exists a string w ∈ L(G) such *that*
    w has two distinct parse trees (or leftmost or rightmost derivations).


    +   • A set of strings L is said to be a **context-free language** if there is
    context-free grammar G such that L = L (G).'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# 3.7 Syntax of the TINY language


    # figure 3.6: Grammar of the TINY language in BNF


    program → stmt-sequence


    stmt-sequence→ stmt-sequence; statement | statement


    statement → if-stmt | repeat-stmt | assign-stmt | read-stmt | write-stmt


    if-stmt→ if exp then stmt-sequence end


    | if exp then stmt-sequence else stmt-sequence end


    repeat-stmt→ repeat stmt-sequence until exp


    assign-stmt→ identifier := exp


    read-stmt → read identifier


    write-stmt → write exp


    exp → simple-exp comparison-op simple-exp | simple-exp


    comparison-op → < | =


    simple-exp → simple-exp addop term | term


    addop → +|-


    term → term mulop factor factor | factor


    mulop → */l


    factor → (exp) |number |identifier


