  md: '# 6.1 Attributes and attribute grammars


    +   - A type checker: is an important part of semantic analysis ( in a language
    like C or Pascal)


    +   - A type checker is a analyzer


    +   ➤ computes the data type attribute of all language entities for which data
    types are defined


    +   ➤ verifies that these types conform to the type rules of the language.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# # 6.1 Attributes and attribute grammars


    +   - Type checking = set of rules that ensure the type consistency of different
    constructs in the program


    +   - Examples:


    +   - The type of a variable must match the type from its declaration


    +   - The operands of arithmetic expressions (+, *, -, /) must have integer types;
    the result has integer type


    +   - The operands of comparison expressions (==, !=) must have integer or string
    types; the result has boolean type


    ![](img/1db31d392048feae2d803578b3d5a4b9_374_0.png)'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# # 6.1 Attributes and attribute grammars


    # ## More examples:


    +   > For each assignment statement, the type of the updated variable must match
    the type of the expression being assigned


    +   > For each call statement foo(v1, ..., vn), the type of each actual argument
    vi must match the type of the corresponding formal argument fi from the declaration
    of function foo


    +   > The type of the return value must match the return type from the declaration
    of the function


