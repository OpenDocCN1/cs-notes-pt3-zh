  md: "# # 4.5 Error Recovery in Top-Down Parsers\n\n+   - **Check-input procedure:\
    \ performs the early look-ahead checking**\n+   \n+   Procedure **Checkinput**(Firstset,\
    \ Followset)\n+   Begin\n+       If not (token in firstset) then\n+          \
    \ Error;\n+           Scanto(firstset ∪ followset)\n+       End if;\n+   end\n\
    \n+   - **Scanto procedure:**\n+   \n+   Procedure **scanto**(synchset)\n+   Begin\n\
    +       While not (token in synchset ∪ {$}) do\n+           gettoken;\n+   End\
    \ scanto"
