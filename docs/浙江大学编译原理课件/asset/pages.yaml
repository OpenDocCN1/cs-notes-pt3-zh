  md: "# 3.4.2 Precedence and associativity\n\n+   • group the operators into groups\
    \ of equal precedence, and for each precedence we must write a different rule.\n\
    +   \n+   • For example, the precedence of multiplication over addition and subtraction\
    \ can be added to our simple expression grammar as follows:\n\n```\nexp    → exp\
    \ addop exp | term\naddop  → + | -\nterm   → term mulop term | factor\nmulop \
    \ → *\nfactor → ( exp ) | number\n```"
