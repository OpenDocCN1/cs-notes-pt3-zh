  md: '# # 5.7 ERROR RECOVERY IN BOTTOM-UP PARSERS


    +   - A bottom-up parser will detect an error when a blank (or error) entry is
    detected in the parsing table.


    +   - that errors should be detected as soon as possible.


    +   - This goal conflicts with an equally important one: reducing the size of
    the parsing table.'
