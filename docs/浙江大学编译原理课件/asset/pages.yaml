- pgno: 270
  md: '# 4.5 Error Recovery in Top-Down Parsers


    +   - **different levels of response to errors.**

    +     1. Give a meaningful error message; determine as closely as possible the
    location where that error has occurred.

    +     2. Some form of error correction; (error repair) the parser attempts to
    infer a correct program from the incorrect one given.


    +   - **Most of the techniques for error recovery are ad hoc, and general principles
    are hard to come by.**


    ![](img/1db31d392048feae2d803578b3d5a4b9_270_0.png)'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# # 4.5 Error Recovery in Top-Down Parsers


    # ## Some important considerations that apply are the following:


    +   (1) To determine that an error has occurred as soon as possible.


    +   (2) After an error has occurred pick a likely place to resume the parse try
    to parse as much of the code as possible


    +   (3) To avoid the error cascade problem.


    +   (4) To avoid infinite loops on error.'
  merge: -1
