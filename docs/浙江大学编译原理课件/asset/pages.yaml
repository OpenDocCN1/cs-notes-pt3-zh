- pgno: 310
  md: '# 5.2.3 The LR(0) Parsing Algorithm


    • Definition (*The LR (0) parsing algorithm*)


    Let **s** be the current state (at the top of the parsing stack). Then actions
    are defined as follows:


    +   1. If state **s** contains any item of the form **A → α·Xβ** (X is a terminal).
    Then the action is to **shift** the current input token on to the stack.


    ![](img/1db31d392048feae2d803578b3d5a4b9_310_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_310_1.png)'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# 5.2.3 The LR(0) Parsing Algorithm


    2. If state s contains any complete item (an item of the form A → γ·), then the
    action is to reduce by the rule A → γ.


    +   - A reduction by the rule S′ → S, where S′ is the start state,

    +   - Acceptance if the input is empty

    +   - Error if the input is not empty.


    ![](img/1db31d392048feae2d803578b3d5a4b9_311_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_311_1.png)'
