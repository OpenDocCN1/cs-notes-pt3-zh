- pgno: 242
  md: '# # 4.2.4 Syntax Tree Construction in LL(1) Parsing


    +   - It is more difficult for LL(1) to adapt to syntax tree construction.


    +   - (1) The structure of the syntax tree can be obscured by left factoring and
    left recursion removal;

    +   - (2) The parsing stack represents only predicated structure, not structure
    that have been actually seen.


    # ## The solution:


    +   - (1) An extra stack is used to keep track of syntax tree nodes, and

    +   - (2) “action” markers are placed in the parsing stack to indicate when and
    what actions on the tree stack should occur.


    ![](img/1db31d392048feae2d803578b3d5a4b9_242_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_242_1.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: "# 4.2.4 Syntax Tree Construction in LL(1) Parsing\n\n+   • How to compute the\
    \ arithmetic value of the expression.\n+   \n+   (1) Use a separate stack to store\
    \ the intermediate values of the computation, called the value stack;\n+   (2)\
    \ Schedule two operations on that stack:\n+     A push of a number;\n+     The\
    \ addition of two numbers.\n+   (3) PUSH can be performed by the match procedure,\
    \ and\n+   (4) ADDITION should be scheduled on the stack, by pushing a special\
    \ symbol (such as #) on the parsing stack."
  merge: -1
