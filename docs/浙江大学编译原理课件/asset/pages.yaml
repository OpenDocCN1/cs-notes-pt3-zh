- pgno: 227
  md: "# # 4.2.3 left Recursion Removal and Left Factoring\n\n+   - Algorithm for\
    \ general left recursion removal:\n+     For i:=1 to m do\n+       For j:=1 to\
    \ i-1 do\n+         Replace each grammar rule choice of the form\n+         Ai→\
    \ Ajβ by the rule\n+         \n+         Ai→α1β|α2β| ... |αkβ,\n+         \n+\
    \         where Aj→α1|α2| ... |αk is the current rule for Aj.\n+         remove,\
    \ if necessary, immediate left recursion\n+         involving Ai"
