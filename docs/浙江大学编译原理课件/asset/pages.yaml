- pgno: 117
  md: '# 3.2.3 Derivations and the language defined by a grammar


    +   - **Derivation:** Grammar rules determine the legal strings of token symbols
    by means of derivations.

    +   - **A derivation** is a sequence of replacements of structure names by choices
    on the right-hand sides of grammar rules.

    +   - **A derivation** begins with a single structure name and ends with a string
    of token symbols.

    +   - At each step in a derivation, a single replacement is made using one choice
    from a grammar rule.


    ![](img/1db31d392048feae2d803578b3d5a4b9_117_0.png)


    ![](img/1db31d392048feae2d803578b3d5a4b9_117_1.png)'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# 3.2.3 Derivations and the language defined by a grammar


    figure 3.1 : a derivation


    ```

    • exp → exp op exp | (exp) | **number**

    • op → + | − | *

    ```


    +   (1) exp => exp op exp

    +   (2) => exp op **number**

    +   (3) => exp * **number**

    +   (4) => ( exp ) * **number**

    +   (5) => { exp op exp ) * **number**

    +   (6) => (exp op number) * **number**

    +   (7) => (exp - number) * **number**

    +   (8) => (number - number) * **number**


    ```

    [exp → exp op exp]

    [exp → number]

    [op → *]

    [exp → ( exp )]

    [exp → exp op exp]

    [exp → number]

    [op → −]

    [exp → number]

    ```


