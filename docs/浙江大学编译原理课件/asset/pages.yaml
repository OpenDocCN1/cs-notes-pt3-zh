    # ## declaration before use


    +   - used in C and Pascal, that requires a name be declared prior to any references
    to the name.


    +   - Declaration before use permits


    +   - the symbol table to be built as parsing proceeds.


    +   - lookups to be performed as soon as a name reference is encountered in the
