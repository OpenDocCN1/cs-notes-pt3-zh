- pgno: 291
  md: '# # 5.1 OVERVIEW OF BOTTOM-UP PARSING


    +   1. **Shift** : Shift a terminal from the front of the input to the top of
    the stack.


    +   2. **Reduce:** Reduce a string α at the top of the stack to a nonterminal
    A, given the BNF choice A→α.


    **A bottom-up parser : a shift-reduce parser.**


    One further feature of bottom-up parsers: grammars are always augmented with a
    **new start symbol**.


    if S is the start symbol, a new start symbol S’ is added to the grammar : S’ →
    S'
