- pgno: 469
  md: "# 6.3.4 Interaction of same-level declarations\n\n+   - **sequential declaration:**\
    \  \n+     each declaration is added to the symbol table as it is processed.\n\
    +   - **collateral declaration:**\n+     - declarations not be added immediately\
    \ to the existing symbol table\n+     - accumulated in a new table(or temporary\
    \ structure)\n+     - then added to the existing table after all declarations\
    \ have been processed.\n+   - **recursive declaration:**  \n+     declaration\
    \ may refer to themselves or each other.\n\n![](img/1db31d392048feae2d803578b3d5a4b9_469_0.png)\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_469_1.png)"
