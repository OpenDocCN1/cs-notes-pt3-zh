- pgno: 596
  md: "# 7.4.4 Automatic Management of the heap\n\n+   - **mark and sweep garbage\
    \ collection**\n+   \n+     no memory is freed until a call to malloc fails, which\
    \ does this in two passes.\n+   \n+     (1) Follows all pointers recursively,starting\
    \ with all currently accessible pointer values and marks each block of storage\
    \ reached.\n+   \n+     (2) Sweeps linearly through memory.\n+   \n+     ➢ **returning\
    \ unmarked blocks to free memory.**\n+   \n+     ➢ **perform memory compaction\
    \ to leave only one large block of contiguous free space at the other end.**\n\
    \n![](img/1db31d392048feae2d803578b3d5a4b9_596_0.png)\n\n![](img/1db31d392048feae2d803578b3d5a4b9_596_1.png)"
