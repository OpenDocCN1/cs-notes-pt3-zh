  md: '# 2.3 Finite Automata


    +   - **Transition:** record a change from one state to another upon a match of
    the character or characters by which they are labeled.

    +   - **start state:** the recognition process begins drawing an unlabeled arrowed
    line to it coming “from nowhere”

    +   - **accepting states:** represent the end of the recognition process. drawing
    a double-line border around the state in the diagram


